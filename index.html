function startTimer() {
  clearInterval(S.timerInt);
  if (!S.shift) return;
  const startMs = Number(S.shift.start_time);
  if (!startMs) return;
  const tick = () => {
    const now = Date.now();
    const r = _liveShiftPay(S.shift, S.autoEndTime, now);
    const e = $("tbig");
    if (e) e.textContent = fmtMs(r.netMs);
    const wt = $("wt");
    if (wt) wt.textContent = fmtDur(r.netMs);
    const cap = $("tcap");
    if (cap) cap.textContent = _timerCaption(S.shift, S.autoEndTime, now, r);
  };
  tick();
  S.timerInt = setInterval(tick, 1e3);
}

let _shiftLock = false;

function _finalizeShift(billingStartMs, rawEndMs, autoEndTimeStr, breakMinutes, hourlyRate, anchorDateMs) {
  let billingEndMs = rawEndMs;
  if (autoEndTimeStr) {
    const [ceh, cem] = String(autoEndTimeStr).split(":").map(Number);
    if (!isNaN(ceh) && !isNaN(cem)) {
      const configuredEnd = new Date(anchorDateMs);
      configuredEnd.setHours(ceh, cem, 0, 0);
      // "00:00" means midnight at the end of the anchor day, not its
      // start — setHours(0,0) always lands at the very beginning of the
      // day, which would be earlier than the shift's own start time and
      // silently disable the auto-end cutoff entirely. Roll it forward
      // one day so it correctly lands at the day/night boundary.
      if (ceh === 0 && cem === 0) configuredEnd.setDate(configuredEnd.getDate() + 1);
      const configuredEndMs = configuredEnd.getTime();
      if (rawEndMs > configuredEndMs && configuredEndMs > billingStartMs) {
        billingEndMs = configuredEndMs;
      }
    }
  }
  const billedMs = Math.max(0, billingEndMs - billingStartMs);
  // The break can never bring a shift of 6 hours or more below 6 paid hours,
  // so working a little longer can never pay less.
  const MIN_PAID_WITH_BREAK_MS = 6 * 36e5;
  const breakMs = (parseFloat(breakMinutes) || 0) * 6e4;
  const netMs = billedMs <= MIN_PAID_WITH_BREAK_MS ? billedMs : Math.max(MIN_PAID_WITH_BREAK_MS, billedMs - breakMs);
  const netWorkHours = netMs / 36e5;
  const earnings = netWorkHours * (parseFloat(hourlyRate) || 0);
  return {
    billingEndMs: billingEndMs,
    netMs: netMs,
    netWorkHours: netWorkHours,
    earnings: earnings
  };
}

// What a running shift has earned so far: the same calculation as ending it
// right now, so the live figures and the final one always agree.
function _liveShiftPay(s, autoEnd, now = Date.now()) {
  const startMs = Number(s.start_time);
  return _finalizeShift(Number(s.billing_start_time) || startMs, now, autoEnd, s.break_minutes, s.hourly_rate, startMs || now);
}

function _timerCaption(s, autoEnd, now, r) {
  const N = NX();
  const billingStart = Number(s.billing_start_time) || Number(s.start_time);
  if (now < billingStart) return N.timerStartsAt(fmtTime(billingStart));
  if (r.billingEndMs < now) return N.timerEndedAt(fmtTime(r.billingEndMs));
  const billed = now - billingStart;
  if (billed > 6 * 36e5 && r.netMs < billed && r.netMs === 6 * 36e5) return N.timerOnBreak;
  return N.timerPaid;
}

async function reconcileStaleShifts() {
  const today = todayStr();
  const stale = await sql("SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts WHERE status='working' AND date<$1", [ today ]);
  if (!stale.length) return;
  const [locs, cfg] = await Promise.all([ dbListLocationsCached(), dbGetConfig() ]);
  await Promise.all(stale.map(async shift => {
    try {
      const loc = shift.location_id ? locs.find(l => l.id === shift.location_id) : null;
      const cutoffStr = loc && loc.end_time || cfg.auto_end_time;
      if (!cutoffStr) {
        await dbSetShift(shift.id, {
          status: "needs_review"
        });
        return;
      }
      const [ch, cm] = cutoffStr.split(":").map(Number);
      if (isNaN(ch) || isNaN(cm)) {
        await dbSetShift(shift.id, {
          status: "needs_review"
        });
        return;
      }
      const [sy, sm, sd] = (shift.date || "").split("-").map(Number);
      if (!sy || !sm || !sd) {
        await dbSetShift(shift.id, {
          status: "needs_review"
        });
        return;
      }
      const dayAnchor = new Date(sy, sm - 1, sd, 12, 0, 0, 0).getTime();
      // Same "00:00 means end of this day, not its start" correction as
      // _finalizeShift — otherwise a midnight cutoff would land before
      // the shift even started, on the wrong side of billingStartMs.
      const cutoffDay = ch === 0 && cm === 0 ? sd + 1 : sd;
      const cutoff = new Date(sy, sm - 1, cutoffDay, ch, cm, 0, 0).getTime();
      const billingStartMs = Number(shift.billing_start_time) || Number(shift.start_time);
      const r = _finalizeShift(billingStartMs, cutoff, null, shift.break_minutes, shift.hourly_rate, dayAnchor);
      await dbSetShift(shift.id, {
        end_time: r.billingEndMs,
        work_hours: r.netWorkHours,
        earnings: r.earnings,
        status: "completed"
      });
    } catch (e) {}
  }));
  _liveCache = null;
}

  }

  if (btn) {
    btn.style.opacity = "0.5";
    btn.textContent = "…";
  }
  try {
    if (!navigator.onLine) {
      await _wActOffline(action);
      return;

    if (_isNetworkError(err)) {
      try {
        await _wActOffline(action);

async function _wActOnline(action) {
  const now = Date.now();
  const username = S.user.username;
  const todayShifts = await dbListMyShiftsToday(username);
  const activeShift = todayShifts.find(x => x.status === "working");
  const completedToday = todayShifts.find(x => x.status === "completed");
  if (action === "start") {
    if (activeShift) {
      toast(" " + T.already, "warning");
      await renderWorkerScreen();
      return;
    }
    if (completedToday) {
      const freshUser = await dbGetUser(username);
      if (!_restartValid(freshUser)) {
        const alreadyDoneMsg = lang === "ar" ? " لقد أنهيت وردية اليوم بالفعل. إذا كانت هناك مشكلة تواصل مع المدير." : " Hai già completato un turno oggi. Se c'è un problema contatta il manager.";
        toast(alreadyDoneMsg, "warning");
        await renderWorkerScreen();
        return;
      }
      await dbSetUser(username, {
        can_restart: false,
        can_restart_date: null
      });
      S.user.can_restart = false;
      S.user.can_restart_date = null;
    }
    const nowD = new Date(now);
    const siteStartTime = S.nearestLocation?.start_time || null;
    const DEFAULT_START = "07:00";
    const EARLY_WINDOW_MINS = 60;
    const effectiveStartTime = siteStartTime || DEFAULT_START;
    const [esh, esm] = effectiveStartTime.split(":").map(Number);
    const officialStartMins = esh * 60 + esm;
    const earliestAllowedMins = officialStartMins - EARLY_WINDOW_MINS;
    const nowMinsForStart = nowD.getHours() * 60 + nowD.getMinutes();
    if (nowMinsForStart < earliestAllowedMins) {
      const minsUntil = earliestAllowedMins - nowMinsForStart;
      const allowedFromH = String(Math.floor(earliestAllowedMins / 60)).padStart(2, "0");
      const allowedFromM = String(earliestAllowedMins % 60).padStart(2, "0");
      const allowedFromStr = allowedFromH + ":" + allowedFromM;
      const siteName = S.nearestLocation?.name || "";
      toast(T.siteOpensAt(siteName, allowedFromStr, minsUntil), "error");
      await renderWorkerScreen();
      return;
    }
    if (S.autoEndTime) {
      const [eh, em] = S.autoEndTime.split(":").map(Number);
      const nowMins = nowD.getHours() * 60 + nowD.getMinutes();
      // "00:00" means midnight at the END of today, not its start — treat
      // it as minute 1440 so it never falsely looks like it already
      // passed at, say, 3pm (nowMins=900 >= 0 would otherwise always be
      // true, blocking every shift start at a midnight-cutoff site).
      const endMins = eh === 0 && em === 0 ? 24 * 60 : eh * 60 + em;
      if (nowMins >= endMins) {
        toast(lang === "ar" ? ` انتهت ورديات اليوم في ${S.autoEndTime}. إلى اللقاء غداً!` : ` I turni di oggi sono terminati alle ${S.autoEndTime}. A domani!`, "error");
        await renderWorkerScreen();
        return;
      }
    }
    const locationName = S.nearestLocation?.name || "—";
    const id = "s" + now + "_" + username.slice(0, 6);
    let billingStartMs = now;
    const billingBase = new Date(now);
    billingBase.setHours(esh, esm, 0, 0);
    const billingBaseMs = billingBase.getTime();
    if (now < billingBaseMs) {
      billingStartMs = billingBaseMs;
    }
    const locBreakMins = S.nearestLocation ? parseFloat(S.nearestLocation.break_minutes || 0) || 0 : S.bypassBreakMins || 0;
    await dbSetShift(id, {
      worker: username,
      date: todayStr(),
      start_time: now,
      billing_start_time: billingStartMs,
      break_minutes: locBreakMins,
      end_time: null,
      work_hours: null,
      earnings: null,
      hourly_rate: parseFloat(S.user.hourly_rate) || 0,
      location_name: locationName,
      location_id: S.nearestLocation?.id || null,
      status: "working"
    });
    S.shift = {
      id: id,
      worker: username,
      date: todayStr(),
      start_time: now,
      billing_start_time: billingStartMs,
      break_minutes: locBreakMins,
      status: "working",
      location_name: locationName,
      location_id: S.nearestLocation?.id || null,
      hourly_rate: parseFloat(S.user.hourly_rate) || 0
    };
    const noSite = _noSiteStartAlert(now);
    if (noSite) _notifyManagerLoginIssue(noSite.name, noSite.phone, noSite.issue, true);
    toast(` ${T.shiftStarted}`, "success");
    await renderWorkerScreen();
  } else if (action === "end") {
    window._confirmEnd = null;
    if (!activeShift) {
      toast(" " + T.noActive, "warning");
      await renderWorkerScreen();
      return;
    }
    if (activeShift.worker !== username) {
      toast(" Shift mismatch error.", "error");
      return;
    }
    const startMs = Number(activeShift.start_time);
    if (!startMs || startMs <= 0 || startMs > now) {
      toast(" Invalid shift start time.", "error");
      return;
    }
    const wMs = Math.max(0, now - startMs);
    const billingStartMs2 = Number(activeShift.billing_start_time) || Number(activeShift.start_time);
    const r = _finalizeShift(billingStartMs2, now, S.autoEndTime, activeShift.break_minutes, activeShift.hourly_rate, now);
    await dbSetShift(activeShift.id, {
      end_time: now,
      work_hours: r.netWorkHours,
      earnings: r.earnings,
      status: "completed"
    });
    S.shift = null;
    clearInterval(S.timerInt);
    S._completedTodayFlag = todayStr();
    toast(` ${T.endMsg ? T.endMsg(fmtDur(r.netMs), r.earnings.toFixed(2)) : "Done!"}`, "success");
    await renderWorkerScreen();
  }
}

const OFFLINE_QUEUE_KEY = "wf_offline_queue";

function _isNetworkError(e) {
  return e instanceof TypeError || /fetch|network/i.test(e?.message || "");
}

function _loadOfflineQueue() {
  try {
    return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || "[]");
  } catch (_) {
    return [];
  }
}

function _saveOfflineQueue(q) {
  localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
}

function _queueOfflineAction(item) {
  const q = _loadOfflineQueue();
  q.push({
    kind: "shift",
    ...item,
    queuedAt: Date.now()
  });
  _saveOfflineQueue(q);
  _updateOfflineBanner();
}

function _queueOfflineUserUpdate(username, fields) {
  const q = _loadOfflineQueue();
  q.push({
    kind: "user",
    username: username,
    fields: fields,
    queuedAt: Date.now()
  });
  _saveOfflineQueue(q);
  _updateOfflineBanner();
}

function _pendingShiftFromQueue(username) {
  const mine = _loadOfflineQueue().filter(x => x.kind === "shift" && x.username === username);
  if (!mine.length) return undefined;
  const last = mine[mine.length - 1];
  if (last.fields.status === "completed") return null;
  return {
    id: last.id,
    worker: username,
    date: last.fields.date || todayStr(),
    start_time: last.fields.start_time,
    billing_start_time: last.fields.billing_start_time,
    break_minutes: last.fields.break_minutes,
    status: "working",
    location_name: last.fields.location_name,
    location_id: last.fields.location_id,
    hourly_rate: last.fields.hourly_rate
  };
}

let _syncingOffline = false;

async function _trySyncOfflineQueue() {
  if (_syncingOffline || !navigator.onLine) return;
  const q0 = _loadOfflineQueue();
  if (!q0.length) return;
  _syncingOffline = true;
  try {
    while (true) {
      const q = _loadOfflineQueue();
      if (!q.length) break;
      const item = q[0];
      try {
        if (item.kind === "user") {
          await dbSetUser(item.username, item.fields);
        } else {
          await dbSetShift(item.id, item.fields);
          if (item.alert) _notifyManagerLoginIssue(item.alert.name, item.alert.phone, item.alert.issue, true);
        }
        q.shift();
        _saveOfflineQueue(q);
      } catch (e) {
        if (_isNetworkError(e)) break;
        console.error("[offline-sync] could not sync queued action, dropping it to avoid blocking the queue:", item, e);
        q.shift();
        _saveOfflineQueue(q);
      }
    }
  } finally {
    _syncingOffline = false;
    _updateOfflineBanner();
    if (S.screen === "worker") await renderWorkerScreen();
  }
}

function _updateOfflineBanner() {
  const el = $("offline-banner");
  if (!el) return;
  const q = _loadOfflineQueue();
  if (!navigator.onLine) {
    el.style.display = "flex";
    el.className = "offline-banner offline";
    el.textContent = lang === "ar" ? "📡 غير متصل — سيتم حفظ أي إجراء ومزامنته تلقائيًا عند عودة الاتصال" : "📡 Offline — le azioni verranno salvate e sincronizzate automaticamente alla riconnessione";
  } else if (q.length) {
    el.style.display = "flex";
    el.className = "offline-banner syncing";
    el.textContent = lang === "ar" ? `⏳ مزامنة ${q.length} إجراء معلّق…` : `⏳ Sincronizzazione di ${q.length} azione/i in sospeso…`;
  } else {
    el.style.display = "none";
  }
}

window.addEventListener("online", _trySyncOfflineQueue);

window.addEventListener("offline", _updateOfflineBanner);

setInterval(_trySyncOfflineQueue, 3e4);

function wireManagerTab(tab) {
  const panel = $("mpanel");
  if (!panel) return;

    const t = panel.querySelector("table");

  if (tab === "live" || tab === "addworker" || tab === "upcoming" || tab === "archived" || tab === "absent") {
    if (panel.querySelectorAll("[data-search]").length) injectListSearch(panel);

}

function injectListSearch(panel) {
  if (panel.querySelector(".tbl-toolbar")) return;
  const L = mgrNav();
  const items = [ ...panel.querySelectorAll("[data-search]") ];
  const total = items.length;
  const bar = document.createElement("div");
  bar.className = "tbl-toolbar";
  bar.innerHTML = `<div class="tbl-search"><input type="text" placeholder="${L.search}" aria-label="search"></div><span class="tbl-count"></span>`;
  panel.insertBefore(bar, panel.firstChild);
  const input = bar.querySelector("input");
  const count = bar.querySelector(".tbl-count");
  const apply = () => {
    const q = cleanName(input.value).toLowerCase();
    let shown = 0;
    items.forEach(el => {
      const hay = (el.getAttribute("data-search") || el.textContent || "").toLowerCase();
      const match = !q || hay.includes(q);
      el.style.display = match ? "" : "none";
      if (match) shown++;
    });
    count.textContent = L.showing(shown, total);
  };
  input.addEventListener("input", apply);
  apply();
}

function enhanceTable(table) {
  if (table.dataset.enhanced) return;
  const tbody = table.tBodies[0];
  if (!tbody) return;
  let rows = [ ...tbody.rows ].filter(r => !r.querySelector("td[colspan]"));
  if (rows.length <= 1) {
    return;
  }
  table.dataset.enhanced = "1";
  const L = mgrNav();
  const wrap = table.closest(".table-wrap") || table;
  const bar = document.createElement("div");
  bar.className = "tbl-toolbar";
  bar.innerHTML = `<div class="tbl-search"><input type="text" placeholder="${L.search}"></div>\n    <span class="tbl-count"></span><span class="spacer" style="flex:1"></span>\n    <select class="btn-dark" style="width:auto;padding:6px 8px;font-family:var(--font);font-size:11px" aria-label="rows per page">\n      <option value="10">10 ${L.rows}</option><option value="25" selected>25 ${L.rows}</option><option value="50">50 ${L.rows}</option><option value="100000">${mgrNav().showing ? "All" : "All"}</option>\n    </select>`;
  wrap.parentNode.insertBefore(bar, wrap);
  const pager = document.createElement("div");
  pager.className = "pager";
  pager.innerHTML = `<button data-act="prev">‹ ${L.prev}</button><span class="pg-info"></span><button data-act="next">${L.next} ›</button>`;
  wrap.parentNode.insertBefore(pager, wrap.nextSibling);
  const input = bar.querySelector("input");
  const count = bar.querySelector(".tbl-count");
  const sizeSel = bar.querySelector("select");
  const info = pager.querySelector(".pg-info");
  const prevBtn = pager.querySelector('[data-act="prev"]');
  const nextBtn = pager.querySelector('[data-act="next"]');
  let query = "", sortCol = -1, sortDir = 1, page = 0, pageSize = parseInt(sizeSel.value) || 25;
  const ths = [ ...table.tHead.rows[0].cells ];
  ths.forEach((th, idx) => {
    th.classList.add("sortable");
    if (!th.querySelector(".arr")) {
      const a = document.createElement("span");
      a.className = "arr";
      a.textContent = " ⇅";
      th.appendChild(a);
    }
    th.addEventListener("click", () => {
      if (sortCol === idx) sortDir *= -1; else {
        sortCol = idx;
        sortDir = 1;
      }
      ths.forEach((o, i) => {
        o.classList.toggle("sorted", i === sortCol);
        const ar = o.querySelector(".arr");
        if (ar) ar.textContent = i === sortCol ? sortDir > 0 ? " ↑" : " ↓" : " ⇅";
      });
      page = 0;
      render();
    });
  });
  ths.forEach((th, idx) => {
    const vals = rows.map(r => r.cells[idx] ? (r.cells[idx].textContent || "").trim() : "");
    const nonEmpty = vals.filter(v => v !== "");
    const numeric = nonEmpty.length > 0 && nonEmpty.every(v => /^[-+]?[\u20AC$\u00A3]?\s?[\d.,\s]+\s?(%|h|min|\u20AC)?$/i.test(v));
    if (numeric) {
      th.classList.add("num");
      rows.forEach(r => {
        if (r.cells[idx]) r.cells[idx].classList.add("num");
      });
    }
  });
  const cellVal = (row, col) => {
    const c = row.cells[col];
    if (!c) return "";
    return (c.textContent || "").trim();
  };
  const numVal = t => {
    const n = parseFloat(String(t).replace(/[^0-9.\-]/g, ""));
    return n;
  };
  function render() {
    const q = cleanName(query).toLowerCase();
    let filtered = rows.filter(r => {
      const hay = (r.getAttribute("data-search") || r.textContent || "").toLowerCase();
      return !q || hay.includes(q);
    });
    if (sortCol >= 0) {
      filtered = filtered.slice().sort((a, a2) => {
        const va = cellVal(a, sortCol), vb = cellVal(a2, sortCol);
        const na = numVal(va), nb = numVal(vb);
        let cmp;
        if (isFinite(na) && isFinite(nb) && va.replace(/[€h\s,.\-]/g, "") !== "" && vb.replace(/[€h\s,.\-]/g, "") !== "") cmp = na - nb; else cmp = cleanName(va).localeCompare(cleanName(vb), undefined, {
          sensitivity: "base",
          numeric: true
        });
        return cmp * sortDir;
      });
    }
    const totalRows = filtered.length;
    const pages = Math.max(1, Math.ceil(totalRows / pageSize));
    if (page >= pages) page = pages - 1;
    if (page < 0) page = 0;
    rows.forEach(r => r.style.display = "none");
    const start = page * pageSize;
    const slice = filtered.slice(start, start + pageSize);
    slice.forEach(r => {
      r.style.display = "";
      tbody.appendChild(r);
    });
    count.textContent = L.showing(slice.length, totalRows);
    info.textContent = `${L.page} ${page + 1} / ${pages}`;
    prevBtn.disabled = page <= 0;
    nextBtn.disabled = page >= pages - 1;
    pager.style.display = totalRows > pageSize ? "" : "none";
  }
  input.addEventListener("input", e => {
    query = e.target.value;
    page = 0;
    render();
  });
  sizeSel.addEventListener("change", e => {
    pageSize = parseInt(e.target.value) || 25;
    page = 0;
    render();
  });
  prevBtn.addEventListener("click", () => {
    page--;
    render();
  });
  nextBtn.addEventListener("click", () => {
    page++;
    render();
  });
  render();
}

function fmtMoney(n) {
  n = Number(n) || 0;
  const loc = lang === "ar" ? "ar-EG" : lang === "it" ? "it-IT" : "en-GB";
  try {
    return new Intl.NumberFormat(loc, {
      style: "currency",
      currency: "EUR",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(n);
  } catch (e) {
    return "€" + n.toFixed(2);
  }
}

function fmtNum(n, d = 0) {
  n = Number(n) || 0;
  const loc = lang === "ar" ? "ar-EG" : lang === "it" ? "it-IT" : "en-GB";
  try {
    return new Intl.NumberFormat(loc, {
      minimumFractionDigits: d,
      maximumFractionDigits: d
    }).format(n);
  } catch (e) {
    return n.toFixed(d);
  }
}

function inP(s, per) {
  const ts = Number(s.start_time);
  const d = ts ? new Date(ts) : new Date(s.date);
  const n = new Date;
  if (per === "today") return s.date === todayStr();
  if (per === "week") {
    const w = new Date(n);
    w.setDate(n.getDate() - n.getDay());
    w.setHours(0, 0, 0, 0);
    return d >= w;
  }
  if (per === "month") return inCycle(s.date || d);
  return true;
}

    ts.filter(s => s.worker === w.username).forEach(s => {
      if (s.status === "completed") {
        h += parseFloat(s.work_hours) || 0;
        e += parseFloat(s.earnings) || 0;
      } else if (s.status === "working") {
        const r = _liveShiftPay(s, _liveEnd(s), now);
        h += r.netWorkHours;
        e += r.earnings;
      }
    });
    const stColor = st === "working" ? "#e8801c" : st === "ended" ? "#f59a44" : "var(--red)";
    const stIcon = st === "working" ? "" : st === "ended" ? "" : "";
    const shiftForEdit = active || latestDone;
    const wStatus = freshW.worker_status === "paused" ? "paused" : "confirmed";
    const statusBadgeHtml = wStatus === "paused" ? `<span class="badge" style="background:var(--orange-soft);color:var(--orange);border:1px solid rgba(212,160,23,.4)">⏸ ${T.paused}</span>` : `<span class="badge" style="background:var(--green-soft);color:var(--green);border:1px solid rgba(46,160,67,.35)">✓ ${T.confirmed}</span>`;
    return `<div data-search="${disp(w.label || w.username)} ${esc(w.phone || "")}" style="background:var(--bg1);border:1px solid var(--border2);border-left:4px solid ${stColor};border-radius:4px;padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;transition:border-color .2s">\n      <div style="flex-shrink:0;cursor:pointer" onclick="openWorkerProfile('${esc(w.username)}')" title="${T.viewProfile}">\n        ${_photoMap[w.username] ? `<img src="${esc(_photoMap[w.username])}" style="width:46px;height:46px;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--bg1);box-shadow:0 2px 6px rgba(0,0,0,.15)"/>` : _avatarHtml(w.label || w.username, 46)}\n      </div>\n      <div style="display:flex;flex-direction:column;min-width:180px;flex:2">\n        <div data-worker-link="${esc(w.username)}" onclick="openWorkerProfile('${esc(w.username)}')" title="${T.viewProfile}" style="font-family:var(--font);font-size:16px;font-weight:800;letter-spacing:1px;color:var(--text);cursor:pointer">${disp(w.label || w.username)}</div>\n        <div style="font-family:var(--font);font-size:11px;color:var(--muted);margin-top:2px">${esc(w.phone || "—")} · <span style="color:var(--brand-ink)">€${w.hourly_rate || 0}/hr</span></div>\n        <div style="margin-top:5px">${statusBadgeHtml}</div>\n        ${active?.location_name || latestDone?.location_name ? `<div style="font-family:var(--font);font-size:10px;color:#f59a44;margin-top:4px"> ${disp(active?.location_name || latestDone?.location_name)}</div>` : ""}\n      </div>\n      <div style="display:flex;flex-direction:column;align-items:center;min-width:90px">\n        <div style="font-size:18px">${stIcon}</div>\n        <div style="font-family:var(--font);font-size:9px;letter-spacing:2px;color:${stColor};text-transform:uppercase;margin-top:2px">${st === "working" ? T.wking : st === "ended" ? "DONE" : T.absent}</div>\n      </div>\n      <div style="display:flex;gap:20px;flex-wrap:wrap;flex:3">\n        <div style="display:flex;flex-direction:column">\n          <div style="font-family:var(--font);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase">${T.startedAt}</div>\n          <div style="font-family:var(--font);font-size:14px;color:var(--text);font-weight:700;margin-top:3px">${active ? fmtTime(active.start_time) : latestDone ? fmtTime(latestDone.start_time) : "—"}</div>\n        </div>\n        <div style="display:flex;flex-direction:column">\n          <div style="font-family:var(--font);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase">${T.end || "End"}</div>\n          <div style="font-family:var(--font);font-size:14px;color:var(--text);font-weight:700;margin-top:3px">${active ? "—" : latestDone ? fmtTime(latestDone.end_time) : "—"}</div>\n        </div>\n        <div style="display:flex;flex-direction:column">\n          <div style="font-family:var(--font);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase">${T.hrsToday}</div>\n          <div style="font-family:var(--font);font-size:15px;color:var(--brand-ink);font-weight:700;margin-top:3px">${h.toFixed(2)}h</div>\n        </div>\n        <div style="display:flex;flex-direction:column">\n          <div style="font-family:var(--font);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase">${T.earnToday}</div>\n          <div style="font-family:var(--font);font-size:15px;color:var(--brand-ink);font-weight:700;margin-top:3px">€${e.toFixed(2)}</div>\n        </div>\n        ${done.length > 0 ? `<div style="display:flex;flex-direction:column"><div style="font-family:var(--font);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase">${T.shifts}</div><div style="font-family:var(--font);font-size:14px;color:var(--text);margin-top:3px">${done.length}</div></div>` : ""}\n      </div>\n      <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:flex-end">\n        ${shiftForEdit ? `<button class="btn-sm" style="background:rgba(47,115,184,.12);border:1px solid rgba(47,115,184,.35);color:#f59a44;font-size:11px;white-space:nowrap" onclick="openAttendanceEdit('${esc(shiftForEdit.id)}','${disp(w.label || w.username)}')">${T.editTimesBtn}</button>` : ""}\n        ${active ? `<button class="btn-sm btn-red" style="font-size:11px;white-space:nowrap" onclick="mgrEndShift('${esc(active.id)}','${disp(w.label || w.username)}')">${T.endShiftBtn}</button>` : ""}\n        ${!active && latestDone && !alreadyUnlocked ? `<button class="btn-sm" style="background:rgba(210,120,0,.12);border:1px solid rgba(210,120,0,.35);color:var(--orange);font-size:11px;white-space:nowrap" onclick="allowRestart('${esc(w.username)}','${disp(w.label || w.username)}')">${T.allowNewShift}</button>` : ""}\n        ${!active && latestDone && alreadyUnlocked ? `<button class="btn-sm" style="background:rgba(232,128,28,.1);border:1px solid rgba(232,128,28,.25);color:var(--red);font-size:11px;white-space:nowrap" onclick="revokeRestart('${esc(w.username)}','${disp(w.label || w.username)}')">${T.revokeRestart}</button>` : ""}\n        ${alreadyUnlocked ? `<span style="font-family:var(--font);font-size:9px;color:var(--brand-ink)"> ${T.restartPending}</span>` : ""}\n      </div>\n    </div>`;
  }).join("")}</div>`;
  return _liveCache;
}

window.allowRestart = async (username, displayName) => {
  if (!confirm(T.confirmAllow(displayName))) return;
  try {
    await dbSetUser(username, {
      can_restart: true,
      can_restart_date: todayStr()
    });
    await _clientAudit("restart_granted", username, {});
    _liveCache = null;
    toast(T.canNowStart(displayName), "success");
    await mTab("live");
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

window.revokeRestart = async (username, displayName) => {
  if (!confirm(T.confirmRevoke(displayName))) return;
  try {
    await dbSetUser(username, {
      can_restart: false,
      can_restart_date: null
    });
    await _clientAudit("restart_revoked", username, {});
    _liveCache = null;
    toast(T.restartRevoked(displayName), "warning");
    await mTab("live");
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

window.mgrEndShift = async (shiftId, workerName) => {
  if (!confirm(T.confirmEndShift(workerName))) return;
  try {
    const allShifts = await dbListShiftsToday();
    const shift = allShifts.find(s => s.id === shiftId && s.status === "working");
    if (!shift) {
      toast(T.shiftNotFound, "warning");
      return;
    }
    const now = Date.now();
    const [locs, cfg] = await Promise.all([ dbListLocationsCached(), dbGetConfig() ]);
    const loc = shift.location_id ? locs.find(l => l.id === shift.location_id) : null;
    const autoEndTimeStr = loc && loc.end_time || cfg.auto_end_time || null;
    const billingStartMs = Number(shift.billing_start_time) || Number(shift.start_time);
    const r = _finalizeShift(billingStartMs, now, autoEndTimeStr, shift.break_minutes, shift.hourly_rate, now);
    const workHours = r.netWorkHours, earnings = r.earnings, wMs = r.netMs;
    await dbSetShift(shiftId, {
      end_time: now,
      work_hours: workHours,
      earnings: earnings,
      status: "completed"
    });
    _liveCache = null;
    toast(T.shiftEndedFor(workerName, fmtDur(wMs)), "success");
    await mTab("live");
    loadSummary();
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

  return `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">\n    ${btn("active", L.employees, employeesCount)}\n    ${btn("upcoming", P.upcomingWorkers, upcomingCount)}\n    ${btn("archived", NX().archiveTab, archivedCount)}\n  </div>`;

  // onboarding flag off on first assignment, at which point they show up
  // here automatically.
  const phones = allPhones.filter(p => {
    const linkedUser = users.find(u => u.role === "worker" && normPhone(u.phone || "") === p.norm);
    return !(linkedUser && (linkedUser.onboarding || _isArchived(linkedUser)));
  });
  const upcomingCount = users.filter(u => u.role === "worker" && u.onboarding && !_isArchived(u)).length;
  const archivedCount = users.filter(u => u.role === "worker" && _isArchived(u)).length;

="${T.viewProfile}" style="cursor:pointer">${disp(u.label || u.username)}</span>`).join("")}\n            ${workerUser ? hasDevice ? `<span class="badge bg" style="font-size:9px">${T.lockedDevice}</span>` : `<span class="badge bgr" style="font-size:9px">${T.anyDevice}</span>` : ""}\n          </div>\n        </div>\n        <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;align-items:center">\n          ${workerUser ? `<button class="btn-sm" style="background:rgba(232,128,28,.1);border:1px solid rgba(232,128,28,.3);color:var(--brand-ink);font-size:11px" onclick="openWorkerProfile('${esc(workerUser.username)}')">${T.profile}</button>` : ""}\n          ${workerUser ? (() => {
      const bypassed = workerUser.gps_bypass === true || workerUser.gps_bypass === "true";
      return `<button class="btn-sm" title="GPS Bypass" style="background:${bypassed ? "rgba(232,128,28,.15)" : "rgba(58,96,128,.15)"};border:1px solid ${bypassed ? "rgba(232,128,28,.4)" : "var(--border2)"};color:${bypassed ? "#f59a44" : "#6f6257"};font-size:11px;letter-spacing:1px" onclick="toggleGpsBypass('${esc(workerUser.username)}','${disp(p.label || p.phone)}',${bypassed})">\n               GPS ${bypassed ? "OFF" : "ON"}\n            </button>`;

// "Upcoming Workers" — a holding pool for workers pre-registered ahead of
// their first day (onboarding=true on wf_users). They get a full profile
// (info form, training checkboxes, document upload — all of buildWorkerProfile
// already works as soon as the account row exists) but are deliberately kept
// out of the normal Employees list until they're actually assigned to a
// site for the first time, at which point dbSetAssignment() flips the flag
// automatically and they show up in the normal list like everyone else. A
// manual "activate now" escape hatch also exists for workers who won't get
// a site assignment right away (e.g. office roles).
async function buildUpcomingWorkers() {
  const P = PL();
  const [users, allPhones] = await Promise.all([ dbListUsersCached(), dbListPhonesCached() ]);
  const upcoming = users.filter(u => u.role === "worker" && u.onboarding && !_isArchived(u)).sort(byName);
  const archivedCount = users.filter(u => u.role === "worker" && _isArchived(u)).length;
  const employeesCount = allPhones.filter(p => {
    const linkedUser = users.find(u => u.role === "worker" && normPhone(u.phone || "") === p.norm);
    return !(linkedUser && (linkedUser.onboarding || _isArchived(linkedUser)));
  }).length;
  const _photoMap = await _photoMapFor(upcoming);
  const rows = upcoming.length ? upcoming.map(u => {
    const photoUrl = _photoMap[u.username];
    const myCourses = _parseCourses(u.courses);
    return `<div class="phone-row" style="flex-direction:column;gap:10px" data-search="${disp(u.label || u.username)} ${esc(u.phone || "")}">\n      <div style="display:flex;align-items:flex-start;gap:10px;width:100%;flex-wrap:wrap">\n        <div style="flex:1;min-width:200px">\n          <div onclick="openWorkerProfile('${esc(u.username)}')" title="${T.viewProfile}" style="cursor:pointer;display:flex;align-items:center;gap:12px">\n            ${photoUrl ? `<img src="${esc(photoUrl)}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--bg1);box-shadow:0 2px 6px rgba(0,0,0,.15)"/>` : _avatarHtml(u.label || u.username, 50)}\n            <div style="min-width:0">\n              <div style="font-family:var(--font);font-size:20px;font-weight:800;letter-spacing:.3px;color:var(--text)">${disp(u.label || u.username)}</div>\n              ${u.phone ? `<div style="font-family:var(--font);font-size:12px;color:var(--muted);margin-top:3px">${esc(u.phone)}</div>` : ""}\n            </div>\n          </div>\n          <div class="pmbadges" style="margin-top:8px">\n            <span class="badge" style="background:var(--orange-soft);color:var(--orange);border:1px solid rgba(212,160,23,.4)">◷ ${P.pendingBadge}</span>\n            ${myCourses.length ? `<span class="badge bg">${myCourses.length} ${lang === "ar" ? "دورات" : "corsi"}</span>` : ""}\n          </div>\n        </div>\n        <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;align-items:center">\n          <button class="btn-sm" style="background:rgba(232,128,28,.1);border:1px solid rgba(232,128,28,.3);color:var(--brand-ink);font-size:11px" onclick="openWorkerProfile('${esc(u.username)}')">${T.profile}</button>\n          <button class="btn-sm" style="background:rgba(46,160,67,.12);border:1px solid rgba(46,160,67,.35);color:var(--green);font-size:11px" onclick="activateUpcomingWorker('${esc(u.username)}')">${P.activateNow}</button>\n        </div>\n      </div>\n    </div>`;
  }).join("") : `<div class="empty">${P.noUpcomingWorkers}</div>`;
  return _empSubTabBar("upcoming", employeesCount, upcoming.length, archivedCount) + `<div class="panel-card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">\n    <div class="pc-title" style="margin:0">${P.upcomingWorkers} <span style="color:var(--muted);font-weight:400">(${upcoming.length})</span></div>\n    <button class="btn btn-gold" style="width:auto;padding:9px 16px" onclick="openOnboardWorker()">+ ${P.addUpcomingWorker}</button>\n  </div>\n  <div class="info-box" style="margin-bottom:14px">${P.upcomingHint}</div>\n  <div class="sc">\n    <div id="plist">${rows}</div>\n  </div>`;
}

function _loadCss(href) {
  return new Promise(res => {
    if (document.querySelector('link[data-href="' + href + '"]')) return res();
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = href;
    l.setAttribute("data-href", href);
    l.onload = () => res();
    l.onerror = () => res();
    document.head.appendChild(l);
  });
}

function _loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector('script[data-src="' + src + '"]')) return res();
    const s = document.createElement("script");
    s.src = src;
    s.setAttribute("data-src", src);
    s.onload = () => res();
    s.onerror = () => rej(new Error("load fail " + src));
    document.head.appendChild(s);
  });
}

function _ensureLeaflet() {
  if (window.L && window.L.markerClusterGroup) return Promise.resolve();
  if (_leafletReady) return _leafletReady;
  _leafletReady = Promise.race([ (async () => {
    await Promise.all(_LEAFLET_CSS.map(_loadCss));
    await _loadScript(_LEAFLET_JS[0]);
    await _loadScript(_LEAFLET_JS[1]);
    if (!(window.L && window.L.markerClusterGroup)) throw new Error("Leaflet unavailable");
  })(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12e3)) ]).catch(e => {
    _leafletReady = null;
    throw e;
  });
  return _leafletReady;
}

function _locPin(status) {
  return L.divIcon({
    className: "loc-pin",
    html: '<div class="pin ' + status + '"></div>',
    iconSize: [ 20, 20 ],
    iconAnchor: [ 10, 20 ],
    popupAnchor: [ 0, -18 ]
  });
}

function _locPopup(l, open, workers) {
  const LL = _locLabels();
  const coords = parseFloat(l.lat).toFixed(6) + ", " + parseFloat(l.lng).toFixed(6);
  const created = l.added_at ? new Date(Number(l.added_at)).toLocaleDateString() : "—";
  const rows = [];
  rows.push([ " " + LL.coords, coords ]);
  rows.push([ LL.status, '<span class="loc-badge ' + (open ? "open" : "closed") + '">' + (open ? LL.open : LL.closed) + "</span>" ]);
  if (l.start_time) rows.push([ "▶ " + LL.start, esc(l.start_time) ]);
  if (l.end_time) rows.push([ "⏹ " + LL.end, esc(l.end_time) ]);
  if (parseInt(l.break_minutes || 0) > 0) rows.push([ " " + LL.brk, parseInt(l.break_minutes) + " min" ]);
  rows.push([ " " + LL.workers, workers.length ? workers.map(esc).join(", ") : "—" ]);
  rows.push([ " " + LL.created, esc(created) ]);
  const link = l.map_link ? '<a href="' + esc(l.map_link) + '" target="_blank" class="loc-pop-link">↗ ' + LL.openMaps + "</a>" : "";
  return '<div class="loc-popup"><h4> ' + disp(l.name || "—") + "</h4>" + rows.map(r => '<div class="loc-pop-row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + "</span></div>").join("") + link + "</div>";
}

async function initLocationMap() {
  const el = document.getElementById("loc-map");
  if (!el) return;
  const LL = _locLabels();
  let data = window.__locData;
  if (!data) {
    // Was 3 sequential awaits (one full round-trip after another) — running
    // them together cuts the wait to the slowest single query instead of
    // the sum of all three. Also switched to the cached wrappers, same as
    // everywhere else this data is read manager-side.
    const [locs, assignments, users] = await Promise.all([ dbListLocationsCached(), dbListAssignmentsCached(), dbListUsersCached() ]);
    data = {
      locs,
      assignments,
      users
    };
  }
  const valid = data.locs.filter(l => isFinite(parseFloat(l.lat)) && isFinite(parseFloat(l.lng)));
  el.innerHTML = '<div class="loc-map-fallback"> ' + LL.notReady + "</div>";
  try {
    await _ensureLeaflet();
  } catch (e) {
    el.innerHTML = '<div class="loc-map-fallback"> ' + LL.offline + "</div>";
    return;
  }
  if (_locMap) {
    try {
      _locMap.remove();
    } catch (_) {}
    _locMap = null;
  }
  el.innerHTML = "";
  const center = valid.length ? [ parseFloat(valid[0].lat), parseFloat(valid[0].lng) ] : [ 45.4642, 9.19 ];
  _locMap = L.map(el, {
    scrollWheelZoom: true
  }).setView(center, 11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }).addTo(_locMap);
  const userByName = {};
  data.users.forEach(u => userByName[u.username] = u);
  const workersByLoc = {};
  data.assignments.forEach(a => {
    (workersByLoc[a.loc_id] = workersByLoc[a.loc_id] || []).push(cleanName(userByName[a.worker_username]?.label || userByName[a.worker_username]?.username || a.worker_username));
  });
  _locMarkers = valid.map(l => {
    const open = l.is_open !== false && l.is_open !== "false";
    const m = L.marker([ parseFloat(l.lat), parseFloat(l.lng) ], {
      icon: _locPin(open ? "open" : "closed")
    });
    m._loc = l;
    m._open = open;
    m._name = cleanName(l.name || "");
    m.bindPopup(_locPopup(l, open, workersByLoc[l.id] || []), {
      maxWidth: 300
    });
    return m;
  });
  _locFilter = "all";
  _locQuery = "";
  setTimeout(() => {
    if (_locMap) {
      _locMap.invalidateSize();
      _locRefreshMarkers(true);
    }
  }, 60);
}

function _locRefreshMarkers(fit) {
  if (!_locMap) return;
  if (_locClusterLayer) {
    try {
      _locMap.removeLayer(_locClusterLayer);
    } catch (_) {}
    _locClusterLayer = null;
  }
  const layer = L.markerClusterGroup ? L.markerClusterGroup({
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true
  }) : L.layerGroup();
  const q = cleanName(_locQuery).toLowerCase();
  const shown = _locMarkers.filter(m => {
    if (_locFilter === "open" && !m._open) return false;
    if (_locFilter === "closed" && m._open) return false;
    if (q && m._name.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  shown.forEach(m => layer.addLayer(m));
  _locClusterLayer = layer;
  _locMap.addLayer(layer);
  if (fit && shown.length) {
    try {
      const g = L.featureGroup(shown);
      _locMap.fitBounds(g.getBounds().pad(.2), {
        maxZoom: 15
      });
    } catch (_) {}
  }
}

window.locMapSearch = () => {
  const i = document.getElementById("loc-map-search");
  _locQuery = i ? i.value : "";
  _locRefreshMarkers(true);
};

window.locMapFilter = f => {
  _locFilter = f;
  document.querySelectorAll(".loc-chip").forEach(c => c.classList.toggle("active", c.getAttribute("data-f") === f));
  _locRefreshMarkers(true);
};

window.flyToLoc = id => {
  const LL = _locLabels();
  const m = _locMarkers.find(x => x._loc.id === id);
  if (!m || !_locMap) {
    toast(LL.notReady, "warning");
    return;
  }
  _locFilter = "all";
  _locQuery = "";
  const s = document.getElementById("loc-map-search");
  if (s) s.value = "";
  document.querySelectorAll(".loc-chip").forEach(c => c.classList.toggle("active", c.getAttribute("data-f") === "all"));
  _locRefreshMarkers(false);
  document.getElementById("loc-map")?.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
  _locMap.flyTo(m.getLatLng(), 16, {
    duration: .8
  });
  setTimeout(() => {
    if (_locClusterLayer && _locClusterLayer.zoomToShowLayer) {
      _locClusterLayer.zoomToShowLayer(m, () => m.openPopup());
    } else {
      m.openPopup();
    }
  }, 850);
};

window.onLocLinkChange = () => {
  const url = val("loc-ml").trim();
  const st = $("loc-ml-status");
  if (!st) return;
  if (!url) {
    st.textContent = "";
    return;
  }
  const c = extractCoordsFromMapsLink(url);
  if (c) {
    st.textContent = T.linkReady;
    st.style.color = "#e8801c";
  } else if (/goo\.gl|maps\.app/.test(url)) {
    st.innerHTML = T.shortUrl;
    st.style.color = "#e8801c";
  } else {
    st.textContent = T.pasteGmap;
    st.style.color = "var(--red)";
  }
};

window.extractLocCoords = () => {
  const url = val("loc-ml").trim();
  const c = extractCoordsFromMapsLink(url);
  if (c) {
    $("loc-lat").value = c.lat.toFixed(6);
    $("loc-lng").value = c.lng.toFixed(6);
    const st = $("loc-ml-status");
    if (st) {
      st.textContent = `✓ ${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`;
      st.style.color = "#e8801c";
    }
    toast(T.coordsExtracted, "success");
  } else toast(T.noCoordsInLink, "error");
};

window.addLocation = async () => {
  const name = val("loc-name").trim();
  const lat = parseFloat($("loc-lat")?.value);
  const lng = parseFloat($("loc-lng")?.value);
  const ml = val("loc-ml").trim();
  const st = val("loc-start").trim();
  const et = val("loc-end").trim();
  const brk = parseInt(val("loc-break")) || 0;
  if (!name) {
    toast(T.enterSiteName, "error");
    return;
  }
  if (isNaN(lat) || isNaN(lng)) {
    toast(T.enterValidCoords, "error");
    return;
  }
  const id = "loc_" + Date.now();
  await dbSetLocation(id, {
    name: name,
    lat: lat,
    lng: lng,
    map_link: ml || null,
    start_time: st || null,
    end_time: et || null,
    break_minutes: brk,
    added_at: Date.now()
  });
  closeWFModal();
  toast(T.locAdded(name, et), "success");
  mTab("locations");
};

window.delLocation = async id => {
  if (!confirm(T.removeLoc)) return;
  try {
    const activeShifts = await dbListShiftsToday();
    const loc = await sql("SELECT name FROM wf_locations WHERE id=$1 LIMIT 1", [ id ]);
    const locName = loc[0]?.name || "";
    const activeHere = activeShifts.filter(s => s.status === "working" && s.location_id === id);
    if (activeHere.length > 0) {
      const names = activeHere.map(s => s.worker).join(", ");
      if (!confirm(` ${activeHere.length} worker(s) are currently clocked in at "${locName}":\n${names}\n\nThey will keep their active shift but won't be able to log in here again. Continue?`)) return;
    }
    await sql("DELETE FROM wf_assignments WHERE loc_id=$1", [ id ]);
    await sql("DELETE FROM wf_locations WHERE id=$1", [ id ]);
    _clearLocsCache();
    _clearAssignCache();
    _liveCache = null;
    toast(T.locRemoved, "warning");
    mTab("locations");
    loadSummary();
  } catch (e) {
    toast(" Failed to remove location: " + e.message, "error");
  }
};

async function buildAssign() {
  const [phones, locs, assignments, allUsers] = await Promise.all([ dbListPhonesCached(), dbListLocationsCached(), dbListAssignmentsCached(), dbListUsersCached() ]);
  const workers = allUsers.filter(u => u.role === "worker" && !_isArchived(u));
  const phoneMap = {};
  phones.forEach(p => phoneMap[p.norm] = p);
  const workerEntries = workers.map(u => {
    const norm = normPhone(u.phone || "");
    return phoneMap[norm] || {
      norm: u.username,
      phone: u.phone || u.username,
      label: u.label || u.username
    };
  });
  const seen = new Set;
  const uniqueWorkers = workerEntries.filter(w => {
    if (seen.has(w.norm)) return false;
    seen.add(w.norm);
    return true;
  }).sort(byName);
  const assignedMap = {};
  assignments.forEach(a => {
    if (!assignedMap[a.worker_username]) assignedMap[a.worker_username] = new Set;
    assignedMap[a.worker_username].add(a.loc_id);
  });
  const unassigned = uniqueWorkers.filter(p => !assignedMap[p.norm] || assignedMap[p.norm].size === 0);
  function workerChip(p, locId) {
    const removeBtn = locId ? `<span class="chip-remove" title="${T.cancel}" onclick="removeAssignment('${esc(p.norm)}','${esc(locId)}')">&#x2715;</span>` : "";
    const otherLocs = locs.filter(l => l.id !== locId && _isAssignableLoc(l)).slice().sort(byName);
    const quickAssign = otherLocs.length ? `<div style="margin-top:5px"><select data-ss style="width:100%;padding:3px 5px;font-size:10px;border-radius:3px;border:1px solid var(--border2);background:var(--bg);color:var(--muted);font-family:var(--font)" onchange="quickAssignWorker('${esc(p.norm)}',this.value,this)"><option value="">assign to...</option>${otherLocs.map(l => `<option value="${esc(l.id)}">${disp(l.name)}</option>`).join("")}</select></div>` : "";
    return `<div class="assign-worker-chip" draggable="true" data-worker="${esc(p.norm)}" data-from="${esc(locId || "__unassigned__")}" style="flex-direction:column;align-items:stretch;gap:2px"><div style="display:flex;align-items:center;gap:8px"><div style="display:flex;flex-direction:column;flex:1;min-width:0"><span class="chip-name">${disp(p.label || p.phone)}</span><span class="chip-phone">${esc(p.phone)}</span></div>${removeBtn}</div>${quickAssign}</div>`;
  }
  const unassignedChips = unassigned.length ? unassigned.map(p => workerChip(p, null)).join("") : `<div class="assign-empty-drop">${T.allAssigned}</div>`;
  const activeLocs = locs.filter(_isAssignableLoc);
  const locCols = !activeLocs.length ? `<div style="color:var(--muted);font-family:var(--font);font-size:11px;padding:20px">${T.noLocations}</div>` : activeLocs.map(l => {
    const isOpen = l.is_open !== false && l.is_open !== "false";
    const assignedPhones = uniqueWorkers.filter(p => assignedMap[p.norm]?.has(l.id));
    const chips = assignedPhones.length ? assignedPhones.map(p => workerChip(p, l.id)).join("") : `<div class="assign-empty-drop">${T.dropHere}</div>`;
    return `<div class="assign-col" data-locid="${esc(l.id)}">\n          <div class="assign-col-head">\n            <div>\n              <div class="assign-col-title"> ${disp(l.name)}</div>\n              <div style="font-family:var(--font);font-size:10px;color:var(--muted);margin-top:2px">${T.workerCount(assignedPhones.length)}</div>\n            </div>\n            <button class="loc-toggle" onclick="toggleLocOpen('${esc(l.id)}',${!isOpen})">\n              ${T.archiveSite}\n            </button>\n          </div>\n          <div class="assign-col-body" data-locid="${esc(l.id)}">${chips}</div>\n        </div>`;
  }).join("");
  return `<div class="assign-info-bar">${T.assignInfoBar}</div>\n  <div class="assign-board">\n    <div class="assign-col unassigned" data-locid="__unassigned__">\n      <div class="assign-col-head">\n        <div>\n          <div class="assign-col-title" style="color:var(--muted)">${T.unassigned}</div>\n          <div style="font-family:var(--font);font-size:10px;color:var(--muted);margin-top:2px">${T.workerCount(unassigned.length)}</div>\n        </div>\n      </div>\n      <div class="assign-col-body" data-locid="__unassigned__">${unassignedChips}</div>\n    </div>\n    ${locCols}\n  </div>`;
}

function initAssignBoard() {
  let dragWorker = null, dragFrom = null, dragEl = null;
  document.querySelectorAll(".assign-worker-chip").forEach(chip => {
    chip.addEventListener("dragstart", e => {
      dragWorker = chip.dataset.worker;
      dragFrom = chip.dataset.from;
      dragEl = chip;
      setTimeout(() => chip.classList.add("dragging"), 0);
    });
    chip.addEventListener("dragend", () => {
      chip.classList.remove("dragging");
      document.querySelectorAll(".assign-col-body").forEach(z => z.classList.remove("drag-over"));
    });
  });
  document.querySelectorAll(".assign-col-body").forEach(zone => {
    zone.addEventListener("dragover", e => {
      e.preventDefault();
      document.querySelectorAll(".assign-col-body").forEach(z => z.classList.remove("drag-over"));
      zone.classList.add("drag-over");
    });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
    zone.addEventListener("drop", async e => {
      e.preventDefault();
      zone.classList.remove("drag-over");
      const toLocId = zone.dataset.locid;
      if (!dragWorker || toLocId === dragFrom) return;
      if (toLocId === "__unassigned__") {
        if (dragFrom && dragFrom !== "__unassigned__") await dbDelAssignment(dragWorker, dragFrom);
      } else {
        await dbSetAssignment(dragWorker, toLocId);
      }
      dragWorker = null;
      dragFrom = null;
      dragEl = null;
      const panel = $("mpanel");
      if (panel) {
        panel.innerHTML = await buildAssign();
        initAssignBoard();
      }
    });
  });
}

function _workerNorm(u) {
  return normPhone(u.phone || "") || u.username;
}

// Closed (is_open=false) and finished/archived locations shouldn't show up
// as options when assigning a worker — they're not active sites, so
// offering them just invites mis-assignment. Used everywhere a location
// picker is built (worker profile page, the assign board's quick-assign
// dropdown, and the board's own columns).
function _isAssignableLoc(l) {
  const closed = l.is_open === false || l.is_open === "false";
  const finished = l.finished === true || l.finished === "true";
  return !closed && !finished;
}

ge="stageNewWorkerPhoto(this)"/>` : `\n        <button onclick="document.getElementById('wp-photo-input').click()" title="${P.changePhoto || "Change photo"}" style="position:absolute;bottom:-2px;right:-2px;width:30px;height:30px;border-radius:50%;background:var(--copper);border:2px solid var(--bg1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)">\n          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>\n        </button>\n        <input id="wp-photo-input" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="onWorkerPhotoPicked('${esc(username)}',this)"/>`}\n      </div>\n      <div>\n        <div style="font-family:var(--font);font-size:22px;font-weight:900;letter-spacing:.3px;color:var(--text)">${isCreate ? P.newWorker : disp(u.label || u.username)}</div>\n        <div style="font-family:var(--font);font-size:12px;color:var(--muted);margin-top:3px">${isCreate ? "" : esc(u.job_title || "") + (siteVal ? (u.job_title ? " · " : "") + siteVal : "") || T.profile}</div>\n      </div>\n    </div>\n    ${isCreate ? "" : `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${u.onboarding ? `<span class="badge" style="background:var(--orange-soft);color:var(--orange);border:1px solid rgba(212,160,23,.4);font-size:11px">◷ ${P.pendingBadge}</span><button class="btn-sm" style="background:rgba(46,160,67,.12);border:1px solid rgba(46,160,67,.35);color:var(--green)" onclick="activateUpcomingWorker('${esc(username)}')">${P.activateNow}</button>` : ""}${statusBadgeHtml}${toggleBtn}${editing ? "" : `<button class="btn-sm" style="display:inline-flex;align-items:center;gap:7px;background:var(--bg1);border:1px solid var(--border2);color:var(--text);padding:9px 16px;font-weight:800" onclick="openWorkerProfile('${esc(username)}',true)">${ic("tool", 15)} ${P.editDetails}</button>`}${_isArchived(u) ? `<span class="badge" style="background:var(--red-soft);color:var(--red);border:1px solid rgba(231,76,60,.35);font-size:11px">${NX().archived}</span><button class="btn-sm" style="background:rgba(46,160,67,.12);border:1px solid rgba(46,160,67,.35);color:var(--green);padding:9px 16px;font-weight:800" onclick="restoreWorker('${esc(username)}')">${NX().restore}</button>` : `<button class="btn-sm" style="background:var(--bg1);border:1px solid var(--border2);color:var(--text);padding:9px 16px;font-weight:800" onclick="archiveWorker('${esc(username)}')">${NX().archive}</button>`}<button class="btn-sm btn-red" style="padding:9px 16px;font-weight:800" onclick="deleteWorkerFromProfile('${esc(username)}')">${P.deleteWorker}</button></div>`}\n  </div>\n\n  <div class="panel-card" style="padding:0;overflow:hidden">\n    <div style="display:flex;gap:2px;padding:6px 8px 8px;border-bottom:1px solid var(--border2);overflow-x:auto">\n      ${tabBtn("info", P.tabInfo, "user", false)}\n      ${tabBtn("location", P.tabLocation, "pin", dis)}\n      ${tabBtn("pay", P.tabPay, "euro", dis)}\n      ${tabBtn("hours", P.tabHours, "clock", dis)}\n      ${tabBtn("payslips", P.tabPayslips, "card", dis)}\n      ${tabBtn("docs", P.tabDocs, "file", dis)}\n    </div>\n  </div>\n\n  <div id="pf-info" class="pf-pane">${infoPane}${isCreate ? "" : _notesCard(username, workerNotes)}</div>\n\n  <div id="pf-pay" class="pf-pane" style="display:none">\n    <div class="panel-card"><div class="pc-title">${T.profPay}</div>\n      <div class="table-wrap"><table><thead><tr><th>${T.monthCol}</th><th class="num">${T.hoursCol}</th><th class="num">${T.earningsColP}</th><th class="num">${T.shifts}</th></tr></thead><tbody>${payRows}</tbody></table></div>\n    </div>\n  </div>\n\n  <div id="pf-hours" class="pf-pane" style="display:none">\n    ${isCreate ? saveNote : `<div class="panel-card"><div class="pc-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px"><span>${P.tabHours} <span style="color:var(--muted);font-weight:400">(${allMine.length} ${P.totalShifts.toLowerCase()})</span></span><select id="hours-month-sel" onchange="reHoursMonth('${esc(username)}','${esc(oreWorkerName)}')" style="max-width:190px">${hoursMonthOpts}</select></div>\n      <div id="pf-hours-tablewrap">${oreTableHtml}</div></div>`}\n  </div>\n\n  <div id="pf-payslips" class="pf-pane" style="display:none">\n    <div class="panel-card">${_cardHead(P.tabPayslips)}${payslipPane()}</div>\n  </div>\n\n  <div id="pf-docs" class="pf-pane" style="display:none">\n    <div class="panel-card">${_cardHead(P.docSlots)}${docSlotsPane()}</div>\n    <div class="panel-card">${_cardHead(P.otherDocsTitle)}${docPane("other", P.addDoc, P.noDocs)}</div>\n    ${coursesPane()}\n  </div>\n\n\n  <div id="pf-location" class="pf-pane" style="display:none">${locationPane}</div>`;

// Renders just the Hours ("Ore") tab's table for one worker, filtered to a
// single calendar month (or "all"), with a totals row summed over whatever
// is currently shown. Split out from buildWorkerProfile so the month
// <select> can re-render only this table (window.reHoursMonth) instead of
// re-fetching/rebuilding the whole profile on every change.
window._renderHoursTable = (username, monthKey, workerDisplayName) => {
  const P = PL();
  const list = (window._hoursDataCache && window._hoursDataCache[username]) || [];
  const filtered = monthKey === "all" ? list.slice() : list.filter(s => (s.date || "").slice(0, 7) === monthKey);
  const oreWorkerName = workerDisplayName || username;
  const rows = filtered.length ? filtered.map(s => {
    const pending = s.status === "needs_review";
    const hoursCell = pending ? "—" : (parseFloat(s.work_hours) || 0).toFixed(2);
    const earnCell = pending ? "—" : "€" + (parseFloat(s.earnings) || 0).toFixed(2);
    return `<tr${pending ? ' style="background:rgba(210,120,0,.06)"' : ""}><td>${esc(s.date || "—")}</td><td>${disp(s.location_name || "—")}</td><td class="num">${fmtTime(s.start_time)}</td><td class="num">${s.end_time ? fmtTime(s.end_time) : "—"}</td><td class="num">${hoursCell}</td><td class="num" style="color:var(--brand-ink);font-weight:700">${earnCell}</td><td>${statusBadge(s.status)}</td><td><button class="btn-sm" style="background:rgba(47,115,184,.12);border:1px solid rgba(47,115,184,.35);color:#f59a44;font-size:11px;white-space:nowrap;padding:5px 10px" onclick="openAttendanceEdit('${esc(s.id)}','${esc(oreWorkerName)}')">${T.editTimesBtn}</button></td></tr>`;
  }).join("") : `<tr><td colspan="8"><div class="empty" style="padding:18px">${P.noShifts}</div></td></tr>`;
  let totalsRow = "";
  if (filtered.length) {
    const totH = filtered.reduce((a, s) => a + (s.status === "needs_review" ? 0 : (parseFloat(s.work_hours) || 0)), 0);
    const totE = filtered.reduce((a, s) => a + (s.status === "needs_review" ? 0 : (parseFloat(s.earnings) || 0)), 0);
    totalsRow = `<tr style="font-weight:800;background:var(--bg2);border-top:2px solid var(--border2)"><td colspan="4">${P.payslipTotal}</td><td class="num">${totH.toFixed(2)}</td><td class="num" style="color:var(--brand-ink)">€${totE.toFixed(2)}</td><td colspan="2"></td></tr>`;
  }
  return `<div class="table-wrap"><table><thead><tr><th>${P.colDate}</th><th>${P.colSite}</th><th class="num">${P.colIn}</th><th class="num">${P.colOut}</th><th class="num">${P.colHours}</th><th class="num">${P.colEarn}</th><th>${P.colStatus}</th><th></th></tr></thead><tbody>${rows}${totalsRow}</tbody></table></div>`;
};

window.reHoursMonth = (username, workerDisplayName) => {
  const mk = val("hours-month-sel") || todayStr().slice(0, 7);
  const wrap = $("pf-hours-tablewrap");
  if (wrap) wrap.innerHTML = window._renderHoursTable(username, mk, workerDisplayName);
};

window.profileTab = key => {
  // Shared between the worker-profile tabs (info/location/pay/hours/
  // payslips/docs) and the site-detail tabs (sdov/sdwk/sdset) — the two
  // screens use disjoint key sets, so a simple prefix check is enough to
  // remember each screen's active tab separately instead of one clobbering
  // the other when a manager bounces between a worker profile and a site
  // detail page.
  if (key === "sdov" || key === "sdwk" || key === "sdset") S._siteActiveTab = key; else S._profileActiveTab = key;
  document.querySelectorAll(".pf-pane").forEach(p => p.style.display = "none");
  const pane = document.getElementById("pf-" + key);
  if (pane) pane.style.display = "";
  document.querySelectorAll(".pf-tab").forEach(t => {
    const on = t.dataset.pf === key;
    const inner = t.querySelector(".pf-tab-inner") || t;
    inner.style.background = on ? "var(--copper)" : "transparent";
    inner.style.color = on ? "#fff" : "var(--muted)";
  });
};

};

    await openWorkerProfile(username);
  } catch (e) {

  }
};

window.uploadWorkerDoc = (username, docType, input) => {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    toast(T.docTooBig, "error");
    input.value = "";
    return;
  }
  const reader = new FileReader;
  reader.onload = async () => {
    try {
      const id = "doc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
      await dbSetDocument(id, username, docType, reader.result, Date.now());
      toast(T.docUploaded, "success");
      await openWorkerProfile(username);
    } catch (e) {
      toast("Error: " + e.message, "error");
    }
  };
  reader.onerror = () => toast("Error reading file", "error");
  reader.readAsDataURL(file);
};

window.deleteWorkerDoc = async (username, docType) => {
  if (!confirm(T.careerDelConfirm)) return;
  try {
    await dbDelDocument(username, docType);
    toast(T.docDeleted, "warning");
    await openWorkerProfile(username);
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

// Rebuilds ONLY the #pf-location pane (site timeline + assigned-sites chips
// + assign dropdown) instead of reloading the whole profile. Used after
// assign/remove so a manager can add or drop several sites in a row without
// the view jumping back to Info and without re-fetching data that hasn't
// changed. Locations/users come from the same in-memory caches the initial
// profile load used; assignments are re-read (dbSetAssignment/dbDelAssignment
// already invalidated that one cache, so this is exactly one small SQL
// query) — and the shift history for the timeline is reused from
// window._hoursDataCache, populated once by buildWorkerProfile, instead of
// re-querying wf_shifts on every single click.
window._renderProfileLocationPane = async username => {
  const pane = document.getElementById("pf-location");
  if (!pane) return;
  const P = PL();
  const [allUsers, locs, assignments] = await Promise.all([ dbListUsersCached(), dbListLocationsCached(), dbListAssignmentsCached() ]);
  const u = allUsers.find(x => x.username === username);
  if (!u) return;
  const norm = _workerNorm(u);
  const locMap = {};
  locs.forEach(l => locMap[l.id] = l);
  const myAssigns = assignments.filter(a => a.worker_username === norm).map(a => a.loc_id).filter(id => locMap[id]);
  const assignedChips = myAssigns.length ? myAssigns.map(id => `<span class="badge bb" style="display:inline-flex;align-items:center;gap:6px;padding:5px 9px">${disp(locMap[id].name)} <span style="cursor:pointer;color:var(--red);font-weight:900" title="${T.removeFromSite}" onclick="profileRemoveSite('${esc(norm)}','${esc(id)}','${esc(username)}')">&#x2715;</span></span>`).join(" ") : `<span style="font-family:var(--font);font-size:12px;color:var(--muted)">${T.notAssigned}</span>`;
  const unassignedLocs = locs.filter(l => !myAssigns.includes(l.id) && _isAssignableLoc(l)).sort(byName);
  const assignDropdown = unassignedLocs.length ? `<select data-ss onchange="profileAssignSite('${esc(norm)}',this.value,'${esc(username)}',this)" style="max-width:280px;margin-top:8px"><option value="">${P.assignSite}</option>${unassignedLocs.map(l => `<option value="${esc(l.id)}">${disp(l.name)}</option>`).join("")}</select>` : "";
  const allMine = (window._hoursDataCache && window._hoursDataCache[username]) || [];
  const byLoc = {};
  allMine.forEach(s => {
    const key = s.location_id || s.location_name || "?";
    if (!byLoc[key]) byLoc[key] = {
      name: s.location_name || locMap[s.location_id]?.name || "—",
      first: s.date || "",
      last: s.date || "",
      hours: 0,
      count: 0
    };
    const b = byLoc[key];
    if (s.date) {
      if (!b.first || s.date < b.first) b.first = s.date;
      if (!b.last || s.date > b.last) b.last = s.date;
    }
    b.hours += parseFloat(s.work_hours) || 0;
    b.count++;
  });
  const timelineArr = Object.values(byLoc).sort((a, b) => (b.last || "").localeCompare(a.last || ""));
  const timelineHtml = timelineArr.length ? `<div style="position:relative;padding-${lang === "ar" ? "right" : "left"}:18px">\n        ${timelineArr.map((t, i) => `\n          <div style="position:relative;padding-bottom:${i < timelineArr.length - 1 ? "18px" : "0"}">\n            <div style="position:absolute;${lang === "ar" ? "right" : "left"}:-18px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--copper);border:2px solid var(--bg1)"></div>\n            ${i < timelineArr.length - 1 ? `<div style="position:absolute;${lang === "ar" ? "right" : "left"}:-13px;top:14px;bottom:0;width:2px;background:var(--border2)"></div>` : ""}\n            <div style="font-family:var(--font);font-size:13px;font-weight:800;color:var(--text)">${disp(t.name)}</div>\n            <div style="font-family:var(--font);font-size:11px;color:var(--muted);margin-top:2px">${P.firstDay}: ${esc(t.first || "—")} · ${P.lastDay}: ${esc(t.last || "—")}</div>\n            <div style="font-family:var(--font);font-size:11px;color:var(--brand-ink);font-weight:700;margin-top:2px">${t.hours.toFixed(2)} h · ${t.count} ${P.totalShifts.toLowerCase()}</div>\n          </div>`).join("")}\n      </div>` : `<div class="empty" style="padding:18px">${P.noSiteHistory}</div>`;
  pane.innerHTML = `\n    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px">\n      <div class="panel-card">\n        <div class="pc-title">${P.siteTimeline}</div>\n        <div style="margin-top:10px">${timelineHtml}</div>\n      </div>\n      <div class="panel-card">\n        <div class="pc-title">${T.assignedSites}</div>\n        <div style="margin-top:8px">${assignedChips}</div>\n        ${assignDropdown}\n      </div>\n    </div>`;
};

window.openSiteDetail = async locId => {
  const panel = $("mpanel");
  if (!panel) return;
  // Same logic as openWorkerProfile: only reset to the Overview tab when
  // actually switching to a different site. Reloading the same site's
  // detail page after a small save (leader, worker, times, coords…) keeps
  // the manager on whichever tab they were already working in.
  const sameSite = S._siteLocId === locId;
  if (!sameSite) S._siteActiveTab = "sdov";
  S._siteLocId = locId;

  panel.innerHTML = _sklPanel();

  if (titleEl) titleEl.innerHTML = `${T.siteDetail}<small>${T.locations}</small>`;

    panel.innerHTML = await buildSiteDetail(locId);
    if (window.profileTab) profileTab(S._siteActiveTab || "sdov");

    panel.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
};

async function buildSiteDetail(locId) {
  const [locs, assignments, allUsers, phones, allShifts] = await Promise.all([ dbListLocationsCached(), dbListAssignmentsCached(), dbListUsersCached(), dbListPhonesCached(), dbListShiftsByLocation(locId) ]);
  const loc = locs.find(l => l.id === locId);
  if (!loc) {
    return `<div class="empty">${T.noLocationsYet}</div>`;
  }
  // Cached (not re-fetched) so window._renderSiteWorkersPane can rebuild
  // just the Workers tab after an add/remove without re-querying shifts
  // for this site on every click.
  window._siteShiftsCache = window._siteShiftsCache || {};
  window._siteShiftsCache[locId] = allShifts;
  const isOpen = loc.is_open !== false && loc.is_open !== "false";
  const workers = allUsers.filter(u => u.role === "worker" && !_isArchived(u));
  const phoneMap = {};
  phones.forEach(p => phoneMap[p.norm] = p);
  const byNorm = {};
  workers.forEach(u => {
    byNorm[_workerNorm(u)] = u;
  });
  const completedHere = allShifts.filter(s => s.location_id === locId && s.status === "completed");
  const totalByWorker = {}, monthByWorker = {};
  const monthKey = todayStr().slice(0, 7);
  completedHere.forEach(s => {
    totalByWorker[s.worker] = (totalByWorker[s.worker] || 0) + (parseFloat(s.work_hours) || 0);
    if ((s.date || "").slice(0, 7) === monthKey) monthByWorker[s.worker] = (monthByWorker[s.worker] || 0) + (parseFloat(s.work_hours) || 0);
  });
  let topUser = null, topHours = 0;
  Object.entries(totalByWorker).forEach(([u, h]) => {
    if (h > topHours) {
      topHours = h;
      topUser = u;
    }
  });
  const _siteSpent = completedHere.reduce((a, s) => a + (parseFloat(s.earnings) || 0), 0);
  const topName = topUser ? disp(allUsers.find(x => x.username === topUser)?.label || topUser) : null;
  const topWorkerHtml = topUser ? `<div style="display:flex;align-items:center;gap:12px"><div style="width:42px;height:42px;border-radius:50%;background:rgba(232,128,28,.12);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px">${esc(String(topName || "?").slice(0, 1).toUpperCase())}</div><div><div style="font-family:var(--font);font-size:16px;font-weight:800;color:var(--text)">${topName}</div><div style="font-family:var(--font);font-size:12px;color:#f59a44;font-weight:700">${topHours.toFixed(2)} h ${lang === "ar" ? "إجمالي" : lang === "it" ? "totali" : "total"}</div></div></div>` : `<div class="empty" style="padding:14px">${T.noTopWorker}</div>`;
  const assignedNorms = assignments.filter(a => a.loc_id === locId).map(a => a.worker_username);
  const assignedList = assignedNorms.map(n => {
    const u = byNorm[n];
    const username = u ? u.username : null;

tyle="padding:0;overflow:hidden">\n    <div id="sd-tabbar" style="display:flex;gap:2px;padding:6px 8px 8px;border-bottom:1px solid var(--border2);overflow-x:auto">\n      ${sdTab("sdov", PL().sdOverview, "building")}\n      ${sdTab("sdwk", PL().sdWorkers, "user")}\n      ${sdTab("sdset", PL().sdSettings, "tool")}\n    </div>\n  </div>\n\n  <div id="pf-sdov" class="pf-pane">\n    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">\n      <div class="panel-card">\n        <div class="pc-title"> ${T.teamLeader}</div>\n        <div style="font-family:var(--font);font-size:18px;font-weight:900;color:var(--brand-ink);margin:4px 0 12px">${leaderName || `<span style="color:var(--muted);font-weight:400;font-size:13px">${T.noLeader}</span>`}</div>\n        ${leaderSelect}\n      </div>\n      <div class="panel-card">\n        <div class="pc-title"> ${T.topWorker}</div>\n        <div style="margin-top:8px">${topWorkerHtml}</div>\n      </div>\n      <div class="panel-card">\n        <div class="pc-title"> ${PL().moneySpent}</div>\n        <div style="font-family:var(--font);font-size:24px;font-weight:900;color:var(--brand-ink);margin-top:8px">€${_siteSpent.toFixed(2)}</div>\n      </div>\n    </div>\n  </div>\n\n  <div id="pf-sdwk" class="pf-pane" style="display:none">\n    <div class="panel-card">\n      <div class="pc-title"> ${T.assignedWorkers} <span style="color:var(--muted);font-weight:400">(${assignedList.length})</span></div>\n      <div style="margin:6px 0 14px">${addDropdown}</div>\n      ${assignedRows}\n    </div>\n  </div>\n\n  <div id="pf-sdset" class="pf-pane" style="display:none">\n    <div class="panel-card">\n      <div class="pc-title">${PL().status}</div>\n      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">\n        <button class="btn-sm" style="background:${isOpen ? "rgba(232,128,28,.12)" : "var(--green-soft)"};border:1px solid ${isOpen ? "rgba(232,128,28,.3)" : "rgba(46,160,67,.35)"};color:${isOp ;color:#c07800;text-transform:uppercase;display:block;margin-bottom:6px">${T.breakLbl || "BREAK"}</label>\n      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">\n        <select id="sd-brk" style="max-width:220px">${buildBreakOptions(loc.break_minutes || "0")}</select>\n        <button class="btn-sm" style="background:rgba(180,100,0,.12);border:1px solid rgba(180,100,0,.3);color:#c07800" onclick="siteSaveBreak('${esc(locId)}')">${T.save}</button>\n      </div>\n    </div>\n    <div class="panel-card">\n      <div class="pc-title">${T.coordinates}</div>\n      <div style="margin-bottom:10px">\n        <label class="lbl" style="color:var(--muted)">${T.pasteMapLink}</label>\n        <div style="display:flex;gap:8px;align-items:flex-start;margin-top:6px">\n          <input id="sd-ml" placeholder="https://maps.google.com/maps?q=45.46,9.19" style="flex:1" value="${esc(loc.map_link || "")}" oninput="onSiteLinkChange()"/>\n          <button class="btn btn-dark" style="width:auto;padding:8px 14px;font-size:11px;flex-shrink:0;border-color:var(--brand-ink)55;color:var(--brand-ink)" onclick="extractSiteCoords()">${T.getCoords}</button>\n        </div>\n        <div id="sd-ml-status" class="hint" style="margin-top:5px"></div>\n      </div>\n      <div style="display:flex;align-items:center;gap:10px;margin:8px 0">\n        <div style="flex:1;height:1px;background:var(--border2)"></div><span style="font-family:var(--font);font-size:10px;color:var(--muted)">${T.orManual}</span><div style="flex:1;height:1px;background:var(--border2)"></div>\n      </div>\n      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">\n        <div><label class="lbl" style="color:var(--muted)">${T.latitude}</label><input type="number" id="sd-lat" step="0.000001" value="${loc.lat != null ? esc(String(loc.lat)) : ""}"/></div>\n        <div><label class="lbl" style="color:var(--muted)">${T.longitude}</label><input type="number" id="sd-lng" step="0.000001" value="${loc.lng != null ? esc(String(loc.lng)) : ""}"/></div>\n      </div>\n      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">\n        <button class="btn-sm" style="background:var(--bg2);border:1px solid var(--border2);color:var(--text)" onclick="useMyLocForSiteDetail()">${T.useMyLoc}</button>\n        <button class="btn-sm" style="background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.3);color:var(--brand-ink)" onclick="siteSaveCoords('${esc(locId)}')">${T.save}</button>\n      </div>\n    </div>\n  </div>`;

// Rebuilds ONLY the #pf-sdwk pane (assigned-workers list + add dropdown) —
// the site-detail mirror of window._renderProfileLocationPane. Lets a
// manager add several workers to a new site in a row without bouncing back
// to Overview or re-fetching shift history on every click.
window._renderSiteWorkersPane = async locId => {
  const pane = document.getElementById("pf-sdwk");
  if (!pane) return;
  const [assignments, allUsers, phones] = await Promise.all([ dbListAssignmentsCached(), dbListUsersCached(), dbListPhonesCached() ]);
  const workers = allUsers.filter(u => u.role === "worker" && !_isArchived(u));
  const phoneMap = {};
  phones.forEach(p => phoneMap[p.norm] = p);
  const byNorm = {};
  workers.forEach(u => {
    byNorm[_workerNorm(u)] = u;
  });
  const allShifts = (window._siteShiftsCache && window._siteShiftsCache[locId]) || [];
  const completedHere = allShifts.filter(s => s.location_id === locId && s.status === "completed");
  const monthByWorker = {};
  const monthKey = todayStr().slice(0, 7);
  completedHere.forEach(s => {
    if ((s.date || "").slice(0, 7) === monthKey) monthByWorker[s.worker] = (monthByWorker[s.worker] || 0) + (parseFloat(s.work_hours) || 0);
  });
  const assignedNorms = assignments.filter(a => a.loc_id === locId).map(a => a.worker_username);
  const assignedList = assignedNorms.map(n => {
    const u = byNorm[n];
    const username = u ? u.username : null;
    const name = u ? disp(u.label || u.username) : disp(phoneMap[n]?.label || phoneMap[n]?.phone || n);
    const phone = u ? u.phone || "" : phoneMap[n]?.phone || "";
    const mh = username ? monthByWorker[username] || 0 : 0;
    return {
      norm: n,
      username: username,
      name: name,
      phone: phone,
      monthHours: mh
    };
  }).sort((a, b) => a.name.localeCompare(b.name));
  const assignedRows = assignedList.length ? assignedList.map(w => `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border2);flex-wrap:wrap">\n        <div style="flex:1;min-width:160px">\n          <div style="font-family:var(--font);font-size:14px;font-weight:800;color:var(--text);${w.username ? "cursor:pointer" : ""}" ${w.username ? `onclick="openWorkerProfile('${esc(w.username)}')" title="${T.viewProfile}"` : ""}>${w.name}</div>\n          <div style="font-family:var(--font);font-size:11px;color:var(--muted);margin-top:2px">${esc(w.phone || "—")}</div>\n        </div>\n        <div style="display:flex;flex-direction:column;align-items:flex-end;min-width:110px">\n          <div style="font-family:var(--font);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase">${T.hoursThisMonth}</div>\n          <div style="font-family:var(--font);font-size:15px;color:var(--brand-ink);font-weight:700">${w.monthHours.toFixed(2)} h</div>\n        </div>\n        <button class="btn-sm btn-red" style="flex-shrink:0" onclick="siteRemoveWorker('${esc(w.norm)}','${esc(locId)}')">${T.removeFromSite}</button>\n      </div>`).join("") : `<div class="empty" style="padding:18px">${T.noWorkersAssigned}</div>`;
  const assignedSet = new Set(assignedNorms);
  const addable = workers.map(u => ({
    norm: _workerNorm(u),
    label: u.label || u.username,
    phone: u.phone || ""
  })).filter(w => !assignedSet.has(w.norm)).sort((a, b) => cleanName(a.label).localeCompare(cleanName(b.label)));
  const addDropdown = addable.length ? `<select data-ss onchange="siteAddWorker(this.value,'${esc(locId)}',this)" style="max-width:260px"><option value="">${T.addWorkerToSite}</option>${addable.map(w => `<option value="${esc(w.norm)}">${disp(w.label)} ${w.phone ? "· " + esc(w.phone) : ""}</option>`).join("")}</select>` : `<span style="font-family:var(--font);font-size:11px;color:var(--muted)">${T.allAssigned || "—"}</span>`;
  pane.innerHTML = `\n    <div class="panel-card">\n      <div class="pc-title"> ${T.assignedWorkers} <span style="color:var(--muted);font-weight:400">(${assignedList.length})</span></div>\n      <div style="margin:6px 0 14px">${addDropdown}</div>\n      ${assignedRows}\n    </div>`;
};

window.siteAddWorker = async (norm, locId, sel) => {
  if (!norm) return;
  try {
    await dbSetAssignment(norm, locId);
    toast(T.workerAssigned, "success");
    await window._renderSiteWorkersPane(locId);
  } catch (e) {
    toast("Error: " + e.message, "error");
    if (sel) sel.value = "";
  }
};

window.siteRemoveWorker = async (norm, locId) => {
  try {
    await dbDelAssignment(norm, locId);
    toast(T.workerRemoved, "warning");
    await window._renderSiteWorkersPane(locId);
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
