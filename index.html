<body>

<!-- Edit Worker Modal -->

<script>
// ═══════════════════════════════════════════════════════════
//  DB credentials are stored securely as Netlify environment
//  variables and accessed via /.netlify/functions/sql
//  Nothing sensitive is stored here.
// ═══════════════════════════════════════════════════════════

const GPS_RADIUS       = 500;  // metres
const MGR_DEFAULT_PASS = 'mohamed123321';
const DB_READY = true;

// ── Neon Serverless API (CORS-safe, works in any browser) ──
// Uses the official Neon REST API:  POST /v2/projects/{project}/branches/{branch}/query
// Docs: https://api-docs.neon.tech/reference/executesqlquery
async function sql(query, params = []) {
  const res = await fetch("/api/sql", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, params })
  });

  const data = await res.json().catch(() => null);
  if (!data || !data.ok) {
    throw new Error(data?.error || `SQL failed (${res.status})`);
  }
  return data.rows || [];
}


// ── DB helpers ──
async function dbGetUser(u) {
  const r = await sql('SELECT * FROM wf_users WHERE username=$1 LIMIT 1', [u]);
  return r[0] || null;
}
async function dbSetUser(u, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_users(username,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(username) DO UPDATE SET ${setCols}`,
    [u, ...vals]
  );
}
async function dbListUsers() { return sql('SELECT * FROM wf_users'); }

async function dbGetPhone(norm) {
  const r = await sql('SELECT * FROM wf_phones WHERE norm=$1 LIMIT 1', [norm]);
  return r[0] || null;
}
async function dbSetPhone(norm, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_phones(norm,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(norm) DO UPDATE SET ${setCols}`,
    [norm, ...vals]
  );
}
async function dbListPhones() { return sql('SELECT * FROM wf_phones ORDER BY added_at DESC'); }
async function dbDelPhone(norm) { await sql('DELETE FROM wf_phones WHERE norm=$1', [norm]); }

async function dbGetConfig() {
  const r = await sql('SELECT * FROM wf_config WHERE id=1 LIMIT 1');
  return r[0] || { std_hours:8, ot_rate:1.5, auto_end_time:null };
}
async function dbSetConfig(d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+1}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+1}`).join(',');
  await sql(
    `INSERT INTO wf_config(id,${cols}) VALUES(1,${placeholders})
     ON CONFLICT(id) DO UPDATE SET ${setCols}`,
    [...vals]
  );
}

async function dbListShifts() { return sql('SELECT * FROM wf_shifts ORDER BY start_time DESC'); }
async function dbSetShift(id, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_shifts(id,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(id) DO UPDATE SET ${setCols}`,
    [id, ...vals]
  );
}
async function dbDelAllShifts() { await sql('DELETE FROM wf_shifts'); }
async function dbDelUser(username) { await sql('DELETE FROM wf_users WHERE username=$1', [username]); }
async function dbDelAllWorkers() { await sql("DELETE FROM wf_users WHERE role='worker'"); }

async function dbListAlerts() { return sql('SELECT * FROM wf_alerts ORDER BY ts DESC'); }
async function dbSetAlert(id, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_alerts(id,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(id) DO UPDATE SET ${setCols}`,
    [id, ...vals]
  );
}

async function dbListLocations() { return sql('SELECT * FROM wf_locations ORDER BY added_at ASC'); }
async function dbSetLocation(id, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_locations(id,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(id) DO UPDATE SET ${setCols}`,
    [id, ...vals]
  );
}
async function dbDelLocation(id) { await sql('DELETE FROM wf_locations WHERE id=$1', [id]); }

// ── Create tables + seed default manager ──
async function initDB() {
  await sql(`CREATE TABLE IF NOT EXISTS wf_users(
    username TEXT PRIMARY KEY, password TEXT, role TEXT,
    phone TEXT, hourly_rate NUMERIC,
    device_id TEXT
  )`);
  await sql(`CREATE TABLE IF NOT EXISTS wf_phones(
    norm TEXT PRIMARY KEY, phone TEXT, label TEXT,
    rate NUMERIC, used BOOLEAN DEFAULT false, added_at BIGINT
  )`);
  await sql(`CREATE TABLE IF NOT EXISTS wf_shifts(
    id TEXT PRIMARY KEY, worker TEXT, date TEXT,
    start_time BIGINT, end_time BIGINT, work_hours NUMERIC,
    earnings NUMERIC, hourly_rate NUMERIC,
    location_name TEXT,
    status TEXT
  )`);
  await sql(`CREATE TABLE IF NOT EXISTS wf_config(
    id INTEGER PRIMARY KEY DEFAULT 1,
    std_hours NUMERIC DEFAULT 8, ot_rate NUMERIC DEFAULT 1.5, auto_end_time TEXT DEFAULT NULL
  )`);
  await sql(`CREATE TABLE IF NOT EXISTS wf_locations(

// ── Extract coordinates from Google Maps URL ──
// Handles all known Google Maps URL formats including short links
function extractCoordsFromMapsLink(url) {
  if (!url) return null;
  const u = url.trim();
  // Short URL — cannot extract coords without resolving redirect
  if (/goo\.gl|maps\.app\.goo\.gl/.test(u)) return null; // needs server-side resolve
  if (!u.includes('google') && !u.includes('maps.google')) return null;
  const COORD = '(-?\\d{1,3}\\.\\d{4,})'; // require ≥4 decimal places for accuracy
  const patterns = [
    new RegExp(`[?&]q=${COORD},${COORD}`),         // ?q=lat,lng
    new RegExp(`[?&]ll=${COORD},${COORD}`),         // ?ll=lat,lng
    new RegExp(`/@${COORD},${COORD}`),              // /@lat,lng,zoom
    new RegExp(`/place/${COORD},${COORD}`),         // /place/lat,lng
    new RegExp(`[?&]daddr=${COORD},${COORD}`),      // daddr=lat,lng
    new RegExp(`[?&]destination=${COORD},${COORD}`),
    new RegExp(`[?&]center=${COORD},${COORD}`),
    new RegExp(`[?&]saddr=${COORD},${COORD}`),
    new RegExp(`!3d${COORD}!4d${COORD}`),           // /data=!3d{lat}!4d{lng}
    new RegExp(`${COORD}\\+${COORD}`),            // lat+lng URL-encoded
  ];
  for (const p of patterns) {
    const m = u.match(p);
    if (m) {
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) return { lat, lng };
    }
  }
  return null;
}
// Async version — tries instant parse first, then warns about short URLs
async function extractCoordsAsync(url) {
  if (!url) return null;
  const instant = extractCoordsFromMapsLink(url);
  if (instant) return instant;
  if (/goo\.gl|maps\.app\.goo\.gl/.test(url)) {
    return { _shortUrl: true }; // signal to caller
  }
  return null;
}

function haversine(la1,lo1,la2,lo2) {
  const R=6371000,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
const geoPos = (timeout=12000) => new Promise((res,rej) =>
  navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout,maximumAge:0})
    : rej(new Error('gps_unavailable'))
);

  if(match){
    st.innerHTML=`✓ ${esc(match.label||'Worker')} — authorized`;
    st.style.cssText='display:block;background:#0a0a0a;border:1px solid rgba(46,204,113,.3);border-radius:4px;padding:10px;margin-top:8px;font-family:monospace;font-size:12px;color:#2ecc71;line-height:1.7';
  } else {
    st.innerHTML='⛔ Phone not authorized. Contact your manager.';
    st.style.cssText='display:block;background:#0a0a0a;border:1px solid rgba(231,76,60,.3);border-radius:4px;padding:10px;margin-top:8px;font-family:monospace;font-size:12px;color:#e74c3c;line-height:1.7';
  }
};

window.doPhoneLogin=async()=>{
  if(!rateLimit('phone_login',1500))return;
  const ph=val('wph').trim();
  const errEl=$('wph-err'); errEl.style.display='none';
  const showErr=msg=>{errEl.textContent=msg;errEl.style.display='block';};
  const btn=$('wph-btn');
  if(btn){btn.disabled=true;btn.textContent='Checking…';}
  try {
    if(!ph){showErr(T.badPhone);return;}
    const norm=normPhone(ph);
    if(norm.length<6){showErr(T.badPhoneNum);return;}
    const match=await dbGetPhone(norm);
    if(!match){showErr(T.phoneNoAuth);return;}

    // Find or auto-create worker account
    const users=await dbListUsers();
    let workerUser=users.find(x=>x.role==='worker'&&normPhone(x.phone||'')===norm);
    if(!workerUser){
      // Auto-create account — username = label or norm, password = norm
      const uname=(match.label||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')||'w'+norm.slice(-6);
      const finalName=users.find(x=>x.username===uname)?uname+'_'+norm.slice(-4):uname;
      await dbSetUser(finalName,{
        password:norm,role:'worker',phone:ph,
        hourly_rate:match.rate||15,
        device_id:DEVICE_ID
      });
      await dbSetPhone(norm,{used:true});
      workerUser=await dbGetUser(finalName);
    }

    // Device lock
    if(!workerUser.device_id){
      await dbSetUser(workerUser.username,{device_id:DEVICE_ID});
      workerUser.device_id=DEVICE_ID;
    } else if(workerUser.device_id!==DEVICE_ID){
      await dbSetAlert('blk_'+Date.now()+'_'+workerUser.username,{type:'device_blocked',worker:workerUser.username,phone:ph,blocked_device:DEVICE_ID,ts:Date.now(),resolved:false});
      showErr(T.deviceBlocked);return;
    }

    // GPS check against any registered location
    const locations=await dbListLocations();
    if(locations.length>0){
      if(!navigator.geolocation){showErr(T.gpsRequired);return;}
      if(btn)btn.textContent='📍 Getting location…';
      try {
        const pos=await geoPos(15000);
        const uLat=pos.coords.latitude, uLng=pos.coords.longitude;
        const nearest=locations.map(l=>({...l,dist:Math.round(haversine(uLat,uLng,parseFloat(l.lat),parseFloat(l.lng)))})).sort((a,b)=>a.dist-b.dist)[0];
        S.gpsDist=nearest.dist;
        S.nearestLocation=nearest;
        if(nearest.dist>GPS_RADIUS){
          showErr(`⛔ You are ${nearest.dist}m away from the nearest site (${nearest.name}). Must be within ${GPS_RADIUS}m.`);return;
        }
        S.gps='ok';
      } catch(gpsErr){
        const code=gpsErr.code;
        if(code===1)showErr('📍 Location permission denied. Please allow location access.');
        else if(code===3)showErr('📍 Location timed out. Try again.');
        else showErr(T.gpsLoginErr);
        return;
      }
    }

    S.user=workerUser;
    renderWorkerScreen();
  } finally {
    if(btn){btn.disabled=false;btn.textContent=T.signIn+' →';}
  }
};

function startTimer(){
  clearInterval(S.timerInt);
  if(!S.shift) return;
  const startMs=Number(S.shift.start_time);
  if(!startMs) return;
  S.timerInt=setInterval(async()=>{
    const now=Date.now();
    const wMs=Math.max(0,now-startMs);
    const e=$('tbig');if(e)e.textContent=fmtMs(wMs);
    const wt=$('wt');if(wt)wt.textContent=fmtDur(wMs);

    // ── Auto-end check ──
    if(S.autoEndTime&&!S._autoEndFired){
      const [ah,am]=S.autoEndTime.split(':').map(Number);
      const d=new Date();
      // Fire when clock matches configured auto-end time (within the current minute)
      if(d.getHours()===ah&&d.getMinutes()===am){
        S._autoEndFired=true; // prevent repeat trigger
        clearInterval(S.timerInt);
        try{
          const allShifts=await dbListShifts();
          const active=allShifts.find(x=>x.worker===S.user.username&&x.date===todayStr()&&x.status==='working');
          if(active){
            const endMs=now;
            const wMs2=Math.max(0,endMs-Number(active.start_time));
            const workHours=wMs2/3600000;
            const earnings=workHours*(parseFloat(active.hourly_rate)||0);
            await dbSetShift(active.id,{end_time:endMs,work_hours:workHours,earnings,status:'completed'});
            S.shift=null;
            toast('⏰ Shift auto-ended at '+S.autoEndTime,'info');
            await renderWorkerScreen();
          }
        }catch(e){console.error('Auto-end failed:',e);}
      }
    }
  },1000);
}

// ════════════════════════ SHIFT ACTIONS — HARDENED ════════════════════════
// Security model:
//  1. Always re-fetch state from DB — never trust client state
//  2. Separate rate limits per action
//  3. GPS validated fresh on every start (not cached from login)
//  4. One shift per worker per day — enforced server-side via DB query
//  5. Cannot end a shift that doesn't exist or isn't yours
//  6. Buttons show state via style not disabled attr (avoids stale DOM)

let _shiftLock=false; // in-flight guard to prevent double-tap race condition

window.wAct=async action=>{
  if(_shiftLock){toast('Please wait…','warning');return;}
  if(!rateLimit('shift_'+action,1200))return;
  if(!S.user){toast('Not logged in','error');return;}

  _shiftLock=true;
  const btn=$(action==='start'?'bst':'ben');
  if(btn){btn.style.opacity='0.5';btn.textContent='…';}

  try{
    const now=Date.now();
    const username=S.user.username;

    // ── Always re-fetch shifts from DB ──
    const allShifts=await dbListShifts();
    const todayShifts=allShifts.filter(x=>x.worker===username&&x.date===todayStr());
    const activeShift=todayShifts.find(x=>x.status==='working');
    const completedToday=todayShifts.find(x=>x.status==='completed');

    if(action==='start'){
      // Guard: already working
      if(activeShift){toast('⚠ Shift already in progress!','warning');await renderWorkerScreen();return;}
      // Guard: already completed today (one shift per day)
      if(completedToday){toast('⚠ You already completed a shift today.','warning');await renderWorkerScreen();return;}

      // Use location already verified at login — no re-check at start
      const locationName = S.nearestLocation?.name || '—';

      // Write shift to DB
      const id='s'+now+'_'+username.slice(0,6);
      await dbSetShift(id,{
        worker:username,
        date:todayStr(),
        start_time:now,
        end_time:null,
        work_hours:null,
        earnings:null,
        hourly_rate:parseFloat(S.user.hourly_rate)||0,
        location_name:locationName,
        status:'working'
      });

      // Verify it was written (sanity check against DB manipulation)
      const verify=await dbListShifts();
      const written=verify.find(x=>x.id===id);
      if(!written){toast('⛔ Shift failed to save. Try again.','error');return;}

      S.shift=written;
      toast(`✅ Shift started at ${locationName}`,'success');
      await renderWorkerScreen();

    }else if(action==='end'){
      // Guard: no active shift
      if(!activeShift){toast('⚠ No active shift to end.','warning');await renderWorkerScreen();return;}
      // Guard: shift must belong to this user (already filtered, but double-check)
      if(activeShift.worker!==username){toast('⛔ Shift mismatch error.','error');return;}
      // Guard: shift must have a valid start_time
      const startMs=Number(activeShift.start_time);
      if(!startMs||startMs>now){toast('⛔ Invalid shift start time.','error');return;}

      const wMs=Math.max(0,now-startMs);
      // Guard: minimum 1 minute to prevent accidental instant end
      if(wMs<60000){
        toast(`⚠ Shift is only ${Math.round(wMs/1000)}s old. End anyway? Tap again to confirm.`,'warning');
        // Allow second tap within 5s
        _shiftLock=false;
        const origLock=()=>{};
        let confirmed=false;
        const confirmEnd=async()=>{
          if(confirmed)return;confirmed=true;
          const wMs2=Math.max(0,Date.now()-startMs);
          const workHours=wMs2/3600000;
          const earnings=workHours*(parseFloat(activeShift.hourly_rate)||0);
          await dbSetShift(activeShift.id,{end_time:Date.now(),work_hours:workHours,earnings,status:'completed'});
          S.shift=null;clearInterval(S.timerInt);
          toast(`✅ Done! ${fmtDur(wMs2)} worked.`,'success');
          await renderWorkerScreen();
        };
        const oldEnd=window.wAct;
        window._confirmEnd=confirmEnd;
        setTimeout(()=>{window._confirmEnd=null;},5000);
        // Override end button temporarily
        const endBtn=$('ben');
        if(endBtn){
          endBtn.textContent='⚠ Tap again to confirm';
          endBtn.style.borderColor='#f39c12';endBtn.style.color='#f39c12';
          endBtn.onclick=()=>{if(window._confirmEnd)window._confirmEnd();window._confirmEnd=null;endBtn.onclick=()=>wAct('end');};
        }
        return;
      }

      const workHours=wMs/3600000;
      const earnings=workHours*(parseFloat(activeShift.hourly_rate)||0);
      await dbSetShift(activeShift.id,{end_time:now,work_hours:workHours,earnings,status:'completed'});
      S.shift=null;clearInterval(S.timerInt);
      toast(`✅ Done! ${fmtDur(wMs)} worked.`,'success');
      await renderWorkerScreen();
    }
  }catch(err){
    toast('Error: '+err.message,'error');
    console.error('wAct error:',err);
    await renderWorkerScreen();
  }finally{
    _shiftLock=false;
  }
};

function inP(s,per){
  const ts=Number(s.start_time);
  const d=ts?new Date(ts):new Date(s.date);
  const n=new Date();
  if(per==='today')return s.date===todayStr();
  if(per==='week'){const w=new Date(n);w.setDate(n.getDate()-n.getDay());w.setHours(0,0,0,0);return d>=w;}
  if(per==='month')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
  return true;
}

window.handleDrop=e=>{e.preventDefault();const f=e.dataTransfer?.files[0]||e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>procFile(ev.target.result);r.readAsText(f);if(e.target.value!==undefined)e.target.value='';};
async function procFile(text){
  const defR=parseFloat(val('nr'))||15;
  const lines=text.split(/[\r\n]+/).map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0;
  for(const line of lines){
    if(/^(phone|number|name|label|rate|#)/i.test(line)){skipped++;continue;}
    const parts=line.split(/[\t,;|]+/).map(p=>p.trim()).filter(Boolean);
    let phone='',label='',rate=defR;
    parts.forEach(p=>{const d=p.replace(/[\s\-\+\(\)\.]/g,'');if(/^\d{6,15}$/.test(d)&&!phone)phone=p;else if(/^\d+(\.\d+)?$/.test(p)&&phone)rate=parseFloat(p);else if(p&&!label)label=p;});
    if(!phone){const r=line.replace(/[\s\-\+\(\)\.]/g,'');if(/^\d{6,15}$/.test(r))phone=line.trim();}
    if(!phone){skipped++;continue;}
    const norm=normPhone(phone);const ex=await dbGetPhone(norm);if(ex){skipped++;continue;}
    await dbSetPhone(norm,{phone:phone.trim(),label:label.trim(),rate,used:false,added_at:Date.now()});
    added++;
  }
  toast(T.fileAdded(added,skipped),'success');mTab('addworker');loadSummary();
}

  const workers=users.filter(u=>u.role==='worker');
  const fmtExcel=ts=>{
    if(!ts)return'—';const d=new Date(Number(ts));if(isNaN(d.getTime()))return'—';
    const pad=n=>String(n).padStart(2,'0');
    return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  // Sheet 1: All Shifts
  const s1=[['Worker','Phone','Rate ($/hr)','Site / Location','Date','Start Time','End Time','Work Hours','Earnings ($)','Status']];
  shifts.sort((a,b)=>Number(b.start_time)-Number(a.start_time)).forEach(s=>{
    const u=um[s.worker];
    s1.push([
      u?.label||s.worker,
      u?.phone||'',
      parseFloat(u?.hourly_rate||s.hourly_rate||0),
      s.location_name||'—',
      s.date,
      fmtExcel(s.start_time),
      fmtExcel(s.end_time),
      parseFloat((parseFloat(s.work_hours)||0).toFixed(4)),
      parseFloat((parseFloat(s.earnings)||0).toFixed(2)),
      s.status
    ]);
  });

  // Sheet 2: Monthly Salary with per-location breakdown
  const now=new Date();
  const monthLabel=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const locNames=[...new Set(shifts.map(s=>s.location_name).filter(Boolean))].sort();
  const s2Header=['Worker','Phone','Rate ($/hr)',...locNames.map(l=>`Hrs @ ${l}`),'Total Hours','Total Salary ($)','Shifts','Month'];
  const s2=[s2Header];
  workers.forEach(w=>{
    const ws=shifts.filter(s=>s.worker===w.username&&s.status==='completed').filter(s=>{
      const ts=Number(s.start_time);if(!ts)return false;
      const d=new Date(ts);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    });
    const th=ws.reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);
    const workerRate=parseFloat(w.hourly_rate)||0;
    const total=th*workerRate;
    const locHrs=locNames.map(ln=>parseFloat(ws.filter(s=>s.location_name===ln).reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0).toFixed(4)));
    s2.push([
      w.label||w.username, w.phone||'', workerRate,
      ...locHrs,
      parseFloat(th.toFixed(4)),
      parseFloat(total.toFixed(2)),
      ws.length,
      monthLabel
    ]);
  });

  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload=()=>{
    const wb=XLSX.utils.book_new();
    const ws1=XLSX.utils.aoa_to_sheet(s1),ws2=XLSX.utils.aoa_to_sheet(s2);
    ws1['!cols']=[14,14,10,16,10,18,18,12,12,10].map(w=>({wch:w}));
    ws2['!cols']=[14,14,10,...locNames.map(()=>14),12,12,10,13,10,14,7,10].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws1,'Shifts');
    XLSX.utils.book_append_sheet(wb,ws2,'Monthly Salary');
    XLSX.writeFile(wb,`workforce_${todayStr()}.xlsx`);
    toast('✓ Excel exported (2 sheets)','success');
  };
  script.onerror=()=>{
    const csv=s1.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`workforce_${todayStr()}.csv`;a.click();
    toast('Exported as CSV','warning');
  };
  document.head.appendChild(script);
};

// ── Boot ──
init();
</script>
</body>
</html>
