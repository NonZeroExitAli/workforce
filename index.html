<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>New Idra — Plumbing Crew</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/NonZeroExitAli/us/main/image%20(1).png"/>

<style>
:root{
  /* Surfaces — warm neutrals, kept in the copper family so the brand feels native */
  --bg:#f4f3f1;
  --bg1:#ffffff;
  --bg2:#f7f4f0;
  --bg3:#efe7db;
  --border:#eae4dc;
  --border2:#d9cfc2;

  /* Brand: copper. Identity + primary actions ONLY — never status. */
  --copper:#e8801c;
  --copper2:#cc6e12;
  --copper3:#f59a44;

  /* Status: reserved for meaning, so a glance is enough.
     (These were previously all orange/black, which destroyed the signal.) */
  --green:#157f3b;   --green-soft:rgba(21,127,59,.10);
  --red:#c0392b;     --red-soft:rgba(192,57,43,.10);
  --orange:#b7791f;  --orange-soft:rgba(183,121,31,.12);
  --steel:#46647f;   --steel2:#46647f; --steel-soft:rgba(70,100,127,.10);

  --text:#1b1a18;
  --muted:#6f6257;
  --dim:#f7f4f0;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  position:relative;
  transition:background .3s,color .3s;
}
body.rtl{direction:rtl}

body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    radial-gradient(circle at 20% 50%,rgba(232,128,28,.05) 0%,transparent 60%),
    radial-gradient(circle at 80% 20%,rgba(232,128,28,.04) 0%,transparent 50%);
  background-size:100% 100%,100% 100%;
  pointer-events:none;z-index:0;
}

body::after{
  content:'';
  position:fixed;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,#cc6e12,#f5a44a,transparent);
  z-index:999;
}

#grid{display:none}
#root{position:relative;z-index:1;min-height:100vh}

.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}

.brand-title{
  font-family:var(--font);
  font-size:clamp(52px,14vw,96px);
  font-weight:900;
  color:var(--text);
  letter-spacing:2px;
  line-height:.9;
  text-transform:uppercase;
  text-align:center;
}
.brand-title span{color:var(--copper2)}
.brand-sub{
  font-family:var(--font);
  font-size:10px;
  color:var(--muted);
  letter-spacing:4px;
  text-transform:uppercase;
  margin-top:10px;
  text-align:center;
}

.brand-icon{width:64px;height:64px;margin:0 auto 16px;position:relative;}
.brand-icon svg{width:100%;height:100%}

.auth-wrap{width:100%;max-width:480px}
.lang-bar{display:flex;gap:6px;margin-bottom:20px;justify-content:center;flex-wrap:wrap}
.lang-btn{
  padding:5px 14px;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--muted);
  font-size:11px;cursor:pointer;
  border-radius:2px;
  font-family:var(--font);
  letter-spacing:1px;
  transition:all .2s;
}
.lang-btn.active{background:var(--copper);color:#000;border-color:var(--brand-ink);font-weight:700}
.lang-btn:hover:not(.active){border-color:var(--brand-ink);color:var(--brand-ink)}

.tabs{display:flex;border:1px solid var(--border2);border-radius:4px 4px 0 0;overflow:hidden}
.tab{flex:1;padding:12px;background:var(--bg2);color:var(--muted);border:none;font-family:var(--font);font-size:13px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:all .2s;font-weight:700}
.tab.active{background:var(--copper);color:#000;font-weight:800}

.card-body{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-top:none;
  border-radius:0 0 4px 4px;
  padding:28px;
  position:relative;
  overflow:hidden;
}
.card-body::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--copper),transparent);
}

.card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;
  padding:28px;
  width:100%;max-width:500px;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--copper),transparent);
}

.fg{display:flex;flex-direction:column;gap:14px}

label.lbl{
  display:block;
  font-family:var(--font);
  font-size:9px;letter-spacing:3px;
  color:var(--muted);text-transform:uppercase;margin-bottom:6px;
}

input,select{
  width:100%;padding:11px 14px;
  background:var(--bg);
  border:1px solid var(--border2);
  border-radius:3px;
  color:var(--text);
  font-family:var(--font);
  font-size:13px;outline:none;
  transition:border-color .2s;
}
input:focus,select:focus{border-color:var(--brand-ink);box-shadow:0 0 0 2px rgba(232,128,28,.15)}
input:disabled{background:var(--bg2);border-color:var(--border);color:var(--muted);cursor:not-allowed}

.btn{
  width:100%;padding:13px;border:none;
  border-radius:3px;
  font-family:var(--font);
  font-size:15px;letter-spacing:2px;
  cursor:pointer;font-weight:800;
  text-transform:uppercase;
  transition:all .2s;
}
.btn-gold{
  background:linear-gradient(135deg,var(--copper),var(--copper2));
  color:#000;
  box-shadow:0 4px 16px rgba(232,128,28,.3);
}
.btn-gold:hover{background:linear-gradient(135deg,var(--copper2),var(--copper3));transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,128,28,.4)}
.btn-red{background:#2b2b2b;color:#fff}
.btn-red:hover{background:var(--red)}
.btn-green{background:linear-gradient(135deg,#e8801c,#f59a44);color:#000;box-shadow:0 4px 16px rgba(232,128,28,.2)}
.btn-blue{background:#cc6e12;color:#fff}
.btn-dark{background:var(--bg2);color:var(--muted);border:1px solid var(--border2)}
.btn-dark:hover{border-color:var(--brand-ink);color:var(--brand-ink)}
.btn-sm{padding:7px 14px;border:none;border-radius:3px;font-family:var(--font);font-size:12px;letter-spacing:1px;cursor:pointer;font-weight:700;text-transform:uppercase}

.err-box{color:#a8500a;font-family:var(--font);font-size:11px;padding:10px 14px;background:rgba(232,128,28,.08);border:1px solid rgba(232,128,28,.30);border-radius:3px;line-height:1.6;border-left:3px solid var(--copper)}
.info-box{color:var(--steel2);font-family:var(--font);font-size:11px;padding:10px 14px;background:rgba(232,128,28,.07);border:1px solid rgba(232,128,28,.2);border-radius:3px;line-height:1.7}
.warn-box{color:#ffb347;font-family:var(--font);font-size:11px;padding:10px 14px;background:rgba(210,120,0,.07);border:1px solid rgba(210,120,0,.2);border-radius:3px;line-height:1.7;border-left:3px solid var(--orange)}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;min-height:58px;
  background:var(--bg1);
  border-bottom:1px solid var(--border2);
  position:sticky;top:0;z-index:100;
  flex-wrap:wrap;gap:8px;
}
.topbar::after{
  content:'';
  position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,#cc6e12,#f5a44a,transparent);
  pointer-events:none;
}

.top-brand{
  font-family:var(--font);
  font-weight:900;font-size:22px;
  color:var(--text);letter-spacing:3px;
  text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.top-brand span{color:var(--copper2)}
.top-brand .pipe-dot{width:8px;height:8px;border-radius:50%;background:var(--copper);box-shadow:0 0 8px var(--copper);}

.ni-topbar-logo{display:flex;align-items:center;gap:10px;}
.ni-topbar-logo .ni-name{
  font-family:var(--font);
  font-size:18px;font-weight:900;
  letter-spacing:2px;
  background:linear-gradient(90deg,#5fa0e0,#ffffff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-transform:uppercase;
}
.ni-topbar-logo .ni-srls{
  font-family:var(--font);
  font-size:9px;letter-spacing:3px;color:var(--muted);
}

.top-right{display:flex;align-items:center;gap:8px;font-family:var(--font);font-size:11px;color:var(--muted);flex-wrap:wrap}
.role-pill{padding:3px 10px;border-radius:2px;font-size:9px;font-weight:700;font-family:var(--font);letter-spacing:2px;text-transform:uppercase}
.pill-mgr{background:var(--copper);color:#000}
.pill-wkr{background:rgba(232,128,28,.15);color:var(--green);border:1px solid rgba(232,128,28,.3)}
.logout-btn{
  padding:5px 12px;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--muted);
  font-family:var(--font);
  font-size:10px;cursor:pointer;
  border-radius:2px;
  letter-spacing:1px;
  transition:all .2s;
}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
.clock{font-family:var(--font);font-size:14px;color:var(--copper2);letter-spacing:2px}

.body{padding:24px;max-width:1200px;margin:0 auto}
.sec-title{
  font-family:var(--font);
  font-weight:900;font-size:32px;
  letter-spacing:4px;color:var(--text);
  text-transform:uppercase;margin-bottom:20px;
}
.sec-title span{color:var(--copper2)}

.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.info-card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;padding:16px;
  position:relative;overflow:hidden;
  transition:border-color .2s;
}
.info-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--border2)}
.info-card:hover{border-color:var(--brand-ink)}
.info-card:hover::before{background:var(--copper)}
.info-card .il{font-family:var(--font);font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.info-card .iv{font-family:var(--font);font-size:24px;font-weight:800;letter-spacing:1px}

.nav-tabs{
  display:flex;
  border-bottom:2px solid var(--border2);
  margin-bottom:24px;overflow-x:auto;
  gap:0;
}
.nav-tab{
  padding:12px 18px;
  background:none;border:none;
  border-bottom:3px solid transparent;
  color:var(--muted);
  font-family:var(--font);
  font-size:12px;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  white-space:nowrap;margin-bottom:-2px;
  transition:all .2s;font-weight:700;
}
.nav-tab:hover{color:var(--steel)}
.nav-tab.active{border-bottom-color:var(--brand-ink);color:var(--brand-ink)}

.stat-card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:6px;padding:28px;
  margin-bottom:20px;
  border-left:4px solid var(--border2);
  position:relative;overflow:hidden;
  transition:border-left-color .3s;
}
.stat-card::after{
  content:'';position:absolute;
  top:0;right:0;width:120px;height:120px;
  background:radial-gradient(circle,rgba(232,128,28,.04) 0%,transparent 70%);
  pointer-events:none;
}
.stat-card.working{border-left-color:var(--green)}
body.rtl .stat-card{border-left:none;border-right:4px solid var(--border2)}
body.rtl .stat-card.working{border-right-color:var(--green)}

.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--border2)}
.dot.working{background:var(--green);box-shadow:0 0 10px var(--green),0 0 20px rgba(232,128,28,.3);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 10px var(--green),0 0 20px rgba(232,128,28,.3)}50%{box-shadow:0 0 16px var(--green),0 0 32px rgba(232,128,28,.4)}}

.status-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.status-lbl{font-family:var(--font);font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}

.timer-big{
  font-family:var(--font);
  font-size:clamp(42px,10vw,72px);
  font-weight:400;
  color:var(--copper2);
  letter-spacing:4px;margin:12px 0;
  text-shadow:0 0 30px rgba(232,128,28,.3);
  position:relative;
}
.stat-card.working .timer-big{
  color:var(--green);
  text-shadow:0 0 30px rgba(232,128,28,.25);
}

.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.act-btn{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:26px 10px;
  border-radius:4px;
  background:var(--bg);
  font-family:var(--font);
  font-size:13px;letter-spacing:3px;
  cursor:pointer;font-weight:800;
  text-transform:uppercase;
  transition:all .25s;border:2px solid;
}
.act-btn:disabled{opacity:.25;cursor:not-allowed}
.act-btn:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.15)}
.act-btn .ico{font-size:32px;line-height:1}

.table-wrap{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;overflow:hidden;
  margin-bottom:20px;overflow-x:auto;
}
.table-head{
  padding:12px 18px;
  border-bottom:1px solid var(--border2);
  font-family:var(--font);
  font-size:12px;letter-spacing:3px;
  color:var(--brand-ink);text-transform:uppercase;font-weight:700;
}
table{width:100%;border-collapse:collapse;font-family:var(--font);font-size:13px;min-width:400px}
th{
  padding:10px 14px;text-align:left;
  font-family:var(--font);
  font-size:9px;letter-spacing:2px;
  color:var(--muted);text-transform:uppercase;
  border-bottom:1px solid var(--border2);
  background:var(--bg);
}
body.rtl th{text-align:right}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:rgba(232,128,28,.03)}

.badge{padding:3px 8px;border-radius:2px;font-size:9px;font-family:var(--font);font-weight:700;display:inline-block;letter-spacing:1px}
.bg{background:rgba(232,128,28,.1);color:var(--green);border:1px solid rgba(232,128,28,.25)}
.br{background:rgba(232,128,28,.1);color:var(--red);border:1px solid rgba(232,128,28,.25)}
.by{background:rgba(210,120,0,.1);color:var(--orange);border:1px solid rgba(210,120,0,.25)}
.bb{background:rgba(232,128,28,.1);color:var(--steel);border:1px solid rgba(232,128,28,.25)}
.bgr{background:rgba(58,96,128,.15);color:var(--muted);border:1px solid var(--border)}

/* =====================================================
   FIX #2 — Worker name overflow: smaller font, word-break
   ===================================================== */
.worker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:20px}
.wcard{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;padding:18px;
  border-left:3px solid var(--border2);
  transition:border-left-color .3s,transform .2s;
  overflow:hidden;min-width:0;
}
.wcard:hover{transform:translateY(-1px)}
.wcard.working{border-left-color:var(--green)}
.wcard.ended{border-left-color:var(--steel)}
body.rtl .wcard{border-left:none;border-right:3px solid var(--border2)}
body.rtl .wcard.working{border-right-color:var(--green)}
.wname{
  font-family:var(--font);
  font-weight:800;
  font-size:14px;
  letter-spacing:.3px;
  margin-bottom:2px;
  color:var(--text);
  text-transform:uppercase;
  overflow-wrap:break-word;
  word-break:break-word;
  line-height:1.2;
  max-width:100%;
}
.wphone{font-family:var(--font);font-size:10px;color:var(--muted);margin-bottom:10px}
.wbadges{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wsl{font-family:var(--font);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.wsv{font-family:var(--font);font-size:16px;font-weight:800;letter-spacing:1px}

.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sc{background:var(--bg1);border:1px solid var(--border2);border-radius:4px;padding:22px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--copper),transparent)}
.st{
  font-family:var(--font);
  font-size:11px;letter-spacing:3px;
  color:var(--brand-ink);text-transform:uppercase;
  margin-bottom:18px;padding-bottom:10px;
  border-bottom:1px solid var(--border2);
  font-weight:800;
}
.sf{margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--muted);font-family:var(--font);font-size:12px;line-height:2}

.phone-row{display:flex;align-items:flex-start;gap:10px;padding:14px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;margin-bottom:8px;transition:border-color .2s}
.phone-row:hover{border-color:var(--brand-ink)}
.phone-meta{display:flex;align-items:center;gap:7px;margin:6px 0;flex-wrap:wrap}
.pmbadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.drop-zone{
  border:2px dashed var(--border2);
  border-radius:4px;padding:28px;
  text-align:center;cursor:pointer;
  font-family:var(--font);
  font-size:11px;color:var(--muted);line-height:2;
  transition:all .2s;
}
.drop-zone:hover{border-color:var(--brand-ink);color:var(--brand-ink);background:rgba(232,128,28,.04)}
.rh{background:rgba(232,128,28,.05);border:1px solid rgba(232,128,28,.2);border-radius:4px;padding:14px}
.gh{background:rgba(232,128,28,.05);border:1px solid rgba(232,128,28,.2);border-radius:4px;padding:14px}
.hint{font-family:var(--font);font-size:10px;color:var(--muted);margin-top:5px}

.gps-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:4px;font-family:var(--font);font-size:11px;margin-bottom:16px;flex-wrap:wrap;letter-spacing:1px}
.gps-bar.ok{background:rgba(232,128,28,.07);border:1px solid rgba(232,128,28,.2);color:var(--green)}
.gps-bar.far{background:rgba(232,128,28,.07);border:1px solid rgba(232,128,28,.2);color:var(--red)}
.gps-bar.checking{background:rgba(210,120,0,.07);border:1px solid rgba(210,120,0,.2);color:var(--orange)}
.gps-bar.idle,.gps-bar.noset{background:rgba(58,96,128,.1);border:1px solid var(--border2);color:var(--muted)}
.gps-bar.error{background:rgba(232,128,28,.07);border:1px solid rgba(232,128,28,.2);color:var(--red)}


.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:var(--bg1);
  border:1px solid var(--border2);
  padding:12px 18px;border-radius:4px;
  font-family:var(--font);font-size:13px;
  color:var(--text);max-width:320px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  line-height:1.5;display:none;
  border-left:3px solid var(--copper);
}
body.rtl .toast{right:auto;left:24px}
.toast.show{display:block;animation:slideIn .25s ease}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.warning{border-left-color:var(--orange)}
.toast.info{border-left-color:var(--steel)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal-title{
  font-family:var(--font);
  font-weight:900;font-size:22px;
  color:var(--copper2);letter-spacing:3px;
  margin-bottom:20px;text-transform:uppercase;
}
.modal-btns{display:flex;gap:10px;margin-top:8px}

@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--brand-ink);border-radius:50%;animation:spin .7s linear infinite}

.assign-board{display:flex;gap:14px;overflow-x:auto;overflow-y:auto;padding-bottom:14px;align-items:flex-start;max-height:calc(100vh - 200px)}
.assign-col{flex:0 0 220px;background:var(--bg1);border:1px solid var(--border2);border-radius:6px;min-height:5200px;display:flex;flex-direction:column;transition:border-color .2s}
.assign-col.unassigned{border-color:var(--border);flex:0 0 220px;min-height:5200px}
.assign-col-head{padding:12px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ══════════════════════════════════════════════════════════════
   NEW IDRA — DESIGN SYSTEM v2.2
   Field-operations software: read at a glance, in daylight, on site.
   Copper is identity. Status colours are reserved for meaning.
   ══════════════════════════════════════════════════════════════ */
:root{
  --r-card:12px; --r-ctl:9px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(27,26,24,.05);
  --sh-2:0 2px 8px rgba(27,26,24,.07), 0 1px 2px rgba(27,26,24,.04);

/* Money, hours and dates must align in columns — payroll depends on it. */

/* ── Buttons: solid, calm, no gradients or hover-jumps ──────────
   Sentence case, because Arabic has no uppercase: ALL-CAPS silently
   did nothing in AR and made the two languages look inconsistent. */
.btn{
  width:100%; padding:12px 18px; border:1px solid transparent;
  border-radius:var(--r-ctl);
  font-size:14px; font-weight:700; letter-spacing:0; text-transform:none;
  line-height:1.2; cursor:pointer;

.btn-gold:hover{ background:var(--copper2); transform:none; box-shadow:var(--sh-1); }
.btn-gold:active{ background:#b3540a; }
.btn-dark{ background:var(--bg1); color:var(--text); border-color:var(--border2); }
.btn-dark:hover{ background:var(--bg2); border-color:var(--muted); color:var(--text); }
.btn-red{ background:var(--red); color:#fff; }         /* destructive now READS destructive */
.btn-red:hover{ background:#a93226; }
.btn-green{ background:var(--green); color:#fff; box-shadow:var(--sh-1); }
.btn-green:hover{ background:#116632; }
.btn-blue{ background:var(--steel); color:#fff; }
.btn-sm{
  padding:8px 13px; border-radius:var(--r-ctl); border:1px solid transparent;
  font-size:12.5px; font-weight:700; letter-spacing:0; text-transform:none;
  line-height:1.2; cursor:pointer; transition:background var(--ease), border-color var(--ease), color var(--ease);

.btn-sm.btn-red{ background:var(--red-soft); color:var(--red); border-color:rgba(192,57,43,.28); }

/* ── Focus: always visible, never only on :hover ── */
:where(button,a,input,select,textarea,[tabindex]):focus-visible{
  outline:none; box-shadow:var(--focus); border-radius:var(--r-ctl);
}

/* ── Inputs: one height, one radius, obvious focus ── */
input,select,textarea{
  border-radius:var(--r-ctl); border:1px solid var(--border2);
  background:var(--bg1); color:var(--text);
  font-size:14px; padding:11px 12px; min-height:42px;
  transition:border-color var(--ease), box-shadow var(--ease);
}

/* ── Cards: hairline + one soft shadow. No competing borders. ── */
.panel-card,.sc{
  background:var(--bg1); border:1px solid var(--border);
  border-radius:var(--r-card); box-shadow:var(--sh-1);
  padding:20px;
}
.pc-title,.st{
  font-size:11px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase;

/* ── Badges: pills, legible size (9px was unreadable on site) ── */
.badge{
  padding:4px 10px; border-radius:var(--r-pill);

  display:inline-flex; align-items:center; gap:5px; line-height:1.4;

table{ font-size:13.5px; }

  position:sticky; top:0; z-index:1; background:var(--bg2);

}
td{ padding:12px 14px; border-bottom:1px solid var(--border); }
tbody tr{ transition:background var(--ease); }
tbody tr:hover{ background:var(--bg2); }
.table-wrap{ border:1px solid var(--border); border-radius:var(--r-card); overflow:auto; background:var(--bg1); }

/* ── Sidebar: the copper spine is the one identity device ──

.side-nav{ background:var(--bg1); border-right:1px solid var(--border); }
.side-nav-list .nav-tab{
  border-radius:var(--r-ctl); padding:11px 13px;
  font-size:13.5px; font-weight:600; letter-spacing:0; text-transform:none;
  color:var(--muted); min-height:44px;      /* touch target */

.side-nav-list .nav-tab:hover{ background:var(--bg2); color:var(--text); }

.side-section-label{ font-size:9.5px; letter-spacing:2px; color:#a3968a; padding:18px 20px 6px; }
.side-foot{ font-size:10px; letter-spacing:.3px; line-height:1.7; }

.warn-box{ background:var(--orange-soft); border:1px solid rgba(183,121,31,.28); color:#8a5a12; border-radius:var(--r-ctl); font-size:12.5px; padding:11px 14px; line-height:1.6; }
.err-box{ background:var(--red-soft); border:1px solid rgba(192,57,43,.28); color:#8e2b21; border-left:3px solid var(--red); border-radius:var(--r-ctl); font-size:12.5px; padding:11px 14px; line-height:1.6; }

/* ── Toast: now actually colour-coded by outcome ── */
.toast{ border-radius:var(--r-card); box-shadow:var(--sh-pop); border-left-width:4px; font-size:13.5px; }
.toast.success{ border-left-color:var(--green); }
.toast.error{ border-left-color:var(--red); }
.toast.warning{ border-left-color:var(--orange); }
.toast.info{ border-left-color:var(--steel); }

/* ── KPI + quick tiles ── */
.kpi-grid{ gap:14px; }
.kpi-card{ border-radius:var(--r-card); box-shadow:var(--sh-1); border:1px solid var(--border); }
.quick-tile{
  border-radius:var(--r-card); border:1px solid var(--border); background:var(--bg1);
  box-shadow:var(--sh-1); transition:border-color var(--ease), box-shadow var(--ease);
  cursor:pointer; min-height:44px;
}
.quick-tile:hover{ border-color:var(--copper); box-shadow:var(--sh-2); }

/* ── Empty states: an invitation, not a dead end ── */
.empty{ padding:44px 24px; font-size:13.5px; line-height:1.7; color:var(--muted); }

/* ── Modal ── */
.modal-bg{ background:rgba(27,26,24,.55); backdrop-filter:blur(3px); }
.modal-bg .card{ border-radius:var(--r-card); box-shadow:var(--sh-pop); }

/* ── Quality floor ── */
@media (max-width:768px){
  .btn,.btn-sm{ min-height:44px; }           /* thumb-sized on site */
  .panel-card,.sc{ padding:16px; }
  table{ font-size:13px; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}


/* ── Remaining surfaces: login, worker mobile screens, pills ──
   Workers use these outdoors in sun — favour size and contrast over polish. */
.tab{
  border-radius:var(--r-ctl) var(--r-ctl) 0 0;
  font-size:14px; font-weight:700; letter-spacing:0; text-transform:none;
  min-height:46px; transition:background var(--ease), color var(--ease);
}
.tab.active{ background:var(--bg1); color:var(--brand-ink); }
.role-pill{
  padding:4px 11px; border-radius:var(--r-pill);
  font-size:11px; font-weight:700; letter-spacing:.2px; text-transform:none;
}
.wcard{
  border-radius:var(--r-card); border:1px solid var(--border);
  box-shadow:var(--sh-1); transition:border-color var(--ease), box-shadow var(--ease);
}
.wcard:hover{ transform:none; border-color:var(--copper); box-shadow:var(--sh-2); }
.admin-switch{
  border-radius:var(--r-ctl); min-height:44px;
  transition:background var(--ease), border-color var(--ease);
}
.admin-switch:hover{ transform:none; background:var(--copper2); border-color:var(--copper2); }
.lang-btn{ border-radius:var(--r-ctl); min-width:44px; min-height:36px; font-weight:700; }
.lang-btn.active{ background:var(--copper); color:#fff; border-color:var(--copper); }

/* The clock-in timer is the one thing a worker reads at arm's length. */
#tbig{ font-variant-numeric:tabular-nums; letter-spacing:-.5px; }

/* Normalise the last stray corners so nothing reads as unfinished. */

<script>
// ════════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════════
const GPS_RADIUS       = 500;
const MGR_DEFAULT_PASS = 'mohamed123321';

const SCHEMA_VERSION = '16';          // internal DB schema (migrations only) — bumped to force one clean re-run past any browser stuck on the old broken flag
const APP_VERSION    = '2.2';         // public app version shown in the UI

// ════════════════════════════════════════════════════════
// SQL LAYER
// ════════════════════════════════════════════════════════
// OPT-6 (SERVER-SIDE — apply in /api/sql.js, not here):
// Replace raw pg client with the Neon WebSocket driver for persistent
// connections and lower CU-hours. Example /api/sql.js:
//
//   import { neon } from '@neondatabase/serverless';
//   const sql = neon(process.env.NEON_DATABASE_URL);
//   export default async function handler(req, res) {
//     const { query, params } = req.body;
//     try {
//       const rows = await sql(query, params);
//       res.json({ ok: true, rows });
//     } catch(e) {
//       res.json({ ok: false, error: e.message });
//     }
//   }
//
// Install: npm install @neondatabase/serverless
// This keeps a warm WebSocket connection and cuts cold-start CU overhead by ~10x.
async function sql(query, params = []) {
  const res = await fetch("/api/sql", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, params })
  });
  const data = await res.json().catch(() => null);
  if (!data || !data.ok) throw new Error(data?.error || `SQL failed (${res.status})`);
  return data.rows || [];
}

// ════════════════════════════════════════════════════════
// DB HELPERS
// ════════════════════════════════════════════════════════
async function dbGetUser(u) {
  const r = await sql('SELECT username,password,role,phone,hourly_rate,device_id,label,can_restart,gps_bypass,worker_status,dob,email,tax_code,residence_permit,doc_expiry,iban,address,start_date,job_title,contract_type,contract_date,contract_expiry,permit_expiry,idoneita_expiry,patente_expiry,courses FROM wf_users WHERE username=$1 LIMIT 1', [u]);
  return r[0] || null;
}
async function dbSetUser(u, d) {
  _clearUsersCache();
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');

async function dbListShiftsMonth(year, month) {
  // Monthly cycle runs from the 20th of one month to the 19th of the next.
  // Callers pass the current calendar (year, month); resolve the cycle that
  // currently contains "today" (or the cycle anchored on that month otherwise).
  const today = new Date();
  const sameMonth = (today.getFullYear() === year && (today.getMonth()+1) === month);

  const ref = new Date(year, month - 1, refDay);
  const { startStr, endStr } = cycleBounds(ref);
  return sql('SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts WHERE date >= $1 AND date <= $2 ORDER BY start_time DESC', [startStr, endStr]);

// Document storage budget: reserve headroom under Neon's 500 MB project cap.
const DOC_STORAGE_LIMIT = 500*1024*1024;   // Neon Free per-project cap
const DOC_STORAGE_SOFT  = 450*1024*1024;   // block new uploads beyond this (leave room for other tables)

// ════════════════════════════════════════════════════════
// FILE STORAGE — PLUGGABLE PROVIDER
// ════════════════════════════════════════════════════════
// The wf_documents.file_url column just holds a STRING. That string can be
// either the file itself (a data: URL, stored in Postgres) or a REFERENCE to a
// file kept in object storage ("obj:<key>"). Switching provider therefore needs
// no schema change and no data migration — old and new rows coexist happily.
//
//   'db'  → file lives in Postgres as base64.       Zero setup. Counts against the 500 MB cap.
//   'obj' → file lives in object storage (R2/S3).   Needs /api/upload + /api/file. Effectively unlimited.
//
// Switch by setting STORAGE_PROVIDER = 'obj' once your endpoints are deployed.
const STORAGE_PROVIDER = 'obj';

// Save a file, return the string to persist in file_url.
async function storagePut(blobOrDataUrl, meta){
  if(STORAGE_PROVIDER === 'obj'){
    const blob = (typeof blobOrDataUrl === 'string') ? _dataUrlToBlob(blobOrDataUrl) : blobOrDataUrl;
    // 1. ask our backend for a temporary permission slip
    const r = await fetch('/api/upload-url', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contentType: blob.type || 'image/jpeg', owner: (meta && meta.owner) || 'misc' })
    });
    if(!r.ok) throw new Error('Upload not authorised ('+r.status+')');
    const { key, url } = await r.json();
    if(!key || !url) throw new Error('Upload not authorised');
    // 2. send the file straight to storage — it never touches our server
    const put = await fetch(url, { method:'PUT', headers:{'Content-Type': blob.type || 'image/jpeg'}, body: blob });
    if(!put.ok) throw new Error('Upload failed ('+put.status+')');
    return 'obj:' + key;                      // a few dozen bytes in the DB instead of megabytes
  }
  // default: keep the file in Postgres
  return (typeof blobOrDataUrl === 'string') ? blobOrDataUrl : await _fileToDataURL(blobOrDataUrl);
}

// Turn a stored file_url into something the browser can open.
async function storageUrl(ref){
  if(typeof ref === 'string' && ref.indexOf('obj:') === 0){
    // Ask the backend for a short-lived signed URL — files stay private (GDPR).
    const res = await fetch('/api/file?key=' + encodeURIComponent(ref.slice(4)));
    if(!res.ok) throw new Error('Could not fetch file ('+res.status+')');
    const j = await res.json();
    if(!j || !j.url) throw new Error('No URL returned');
    return { url: j.url, revoke: false };
  }
  return { url: URL.createObjectURL(_dataUrlToBlob(ref)), revoke: true };
}

// How much of the DB budget the stored files use (0 once you move to 'obj').
async function dbDocsStorageBytesDB(){
  const r = await sql("SELECT COALESCE(SUM(length(file_url)),0) AS bytes FROM wf_documents WHERE file_url NOT LIKE 'obj:%'");
  return Number((r[0] && r[0].bytes) || 0);
}
function _fmtMB(bytes){ return (bytes/1048576).toFixed(bytes<10485760?1:0); }
function _fileToDataURL(file){
  return new Promise((res, rej)=>{
    let settled=false;
    const t=setTimeout(()=>{ if(!settled){ settled=true; rej(new Error('file read timed out')); } }, 20000);
    const r=new FileReader();
    r.onload=()=>{
      if(settled) return; settled=true; clearTimeout(t);
      const v=r.result;
      if(typeof v!=='string' || v.indexOf('data:')!==0) return rej(new Error('unreadable file'));
      res(v);
    };
    r.onerror=()=>{ if(settled) return; settled=true; clearTimeout(t); rej(new Error('file read failed')); };
    r.onabort=()=>{ if(settled) return; settled=true; clearTimeout(t); rej(new Error('file read aborted')); };
    try{ r.readAsDataURL(file); }
    catch(e){ if(!settled){ settled=true; clearTimeout(t); rej(e); } }
  });
}
// Downscale + re-encode images to JPEG to slash stored size (often ~10x smaller).
function _compressImage(file, maxDim, quality){
  return new Promise((res, rej)=>{
    let settled=false, objUrl=null;
    const done=(v)=>{ if(settled) return; settled=true; if(objUrl) URL.revokeObjectURL(objUrl); res(v); };
    const failed=(e)=>{ if(settled) return; settled=true; if(objUrl) URL.revokeObjectURL(objUrl); rej(e instanceof Error?e:new Error(String(e))); };
    // Hard timeout: the promise MUST settle, otherwise the upload would hang silently.
    const t=setTimeout(()=>failed(new Error('image decode timed out')), 15000);
    const finish=(v)=>{ clearTimeout(t); done(v); };
    const bail=(e)=>{ clearTimeout(t); failed(e); };
    try{
      objUrl = URL.createObjectURL(file);        // safer + smaller than a data: URL
      if(!objUrl) return bail(new Error('cannot create object url'));
      const img=new Image();
      img.onload=()=>{
        try{
          const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
          if(!iw || !ih) return bail(new Error('image has no dimensions'));
          let w=iw, h=ih;
          if(w>maxDim || h>maxDim){ const sc=Math.min(maxDim/w, maxDim/h); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc)); }
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          const ctx=c.getContext('2d');
          if(!ctx) return bail(new Error('no canvas context'));
          ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          let out;
          try{ out=c.toDataURL('image/jpeg', quality); }   // can throw on tainted canvas
          catch(e){ return bail(e); }
          if(!out || out.length<32) return bail(new Error('encode produced empty output'));
          finish(out);
        }catch(e){ bail(e); }
      };
      img.onerror=()=>bail(new Error('image decode failed'));
      img.src=objUrl;
    }catch(e){ bail(e); }
  });
}
// Storage meter bar (used vs 500 MB), green/amber/red.
function _storageMeterHtml(bytes){
  const P=PL();
  const pct=Math.min(100, Math.round(bytes/DOC_STORAGE_LIMIT*100));
  const color = pct>=90?'var(--red)' : pct>=70?'var(--orange)' : 'var(--green)';
  return `<div style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
      <span style="font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase">${P.docStorage}</span>
      <span style="font-family:var(--font);font-size:12px;font-weight:800;color:${color}">${_fmtMB(bytes)} MB <span style="color:var(--muted);font-weight:400">${P.ofLimit}</span></span>
    </div>
    <div style="height:8px;border-radius:5px;background:var(--bg2);overflow:hidden"><div style="height:100%;width:${pct}%;background:${color};transition:width .3s ease"></div></div>
  </div>`;
}

// Next rent due date from a day-of-month (1–31); returns 'YYYY-MM-DD' or null.
function _nextRentDue(day){
  const d = parseInt(day,10);
  if(!(d>=1 && d<=31)) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const mk = (y,m)=>{ const last=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(d,last)); };
  let due = mk(now.getFullYear(), now.getMonth());
  if(due < now) due = mk(now.getFullYear(), now.getMonth()+1);  // already passed → next month
  const p=n=>String(n).padStart(2,'0');
  return `${due.getFullYear()}-${p(due.getMonth()+1)}-${p(due.getDate())}`;
}

// Runs each statement in a migration block as its own independent call instead
// of one big multi-statement string. Postgres treats a multi-statement string
// sent in a single call as ONE implicit transaction — if any single statement
// fails (e.g. an old/irrelevant one), the whole batch rolls back, silently
// undoing every other ALTER/CREATE in it too. Isolating each statement means
// one bad line can only skip itself, never take down the rest of the schema.
async function _runMigrationBatch(block){
  const stmts = block.split(';').map(s => s.trim()).filter(Boolean);
  let failures = 0;
  for (const stmt of stmts) {
    try { await sql(stmt); }
    catch (e) { failures++; console.warn('[migration] statement failed (continuing):', stmt.slice(0, 90), '—', e.message); }
  }
  return failures;
}

// ════════════════════════════════════════════════════════
// MONTHLY CYCLE (calendar month — 1st to last day of the month)
// ════════════════════════════════════════════════════════
const CYCLE_START_DAY = 1;
function cycleBounds(ref = new Date()){
  const y = ref.getFullYear(), m = ref.getMonth(), day = ref.getDate();
  let sy = y, sm = m;                 // month that holds the cycle's 20th
  if(day < CYCLE_START_DAY){ sm = m - 1; if(sm < 0){ sm = 11; sy = y - 1; } }
  const start = new Date(sy, sm, CYCLE_START_DAY);
  const end   = new Date(sy, sm + 1, CYCLE_START_DAY - 1); // 19th of the following month
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return { start, end, startStr: fmt(start), endStr: fmt(end), startYear: sy, startMonth: sm };
}
function inCycle(dateLike, ref = new Date()){
  const { startStr, endStr } = cycleBounds(ref);
  let ds;
  if(typeof dateLike === 'string' && /^\d{4}-\d{2}-\d{2}/.test(dateLike)){
    ds = dateLike.slice(0,10);
  } else {
    const d = (dateLike instanceof Date) ? dateLike : new Date(Number(dateLike));
    if(isNaN(d.getTime())) return false;
    ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return ds >= startStr && ds <= endStr;
}
function cycleLabel(ref = new Date()){
  const { start } = cycleBounds(ref);
  return start.toLocaleString('default',{month:'long',year:'numeric'});
}

function extractCoordsFromMapsLink(url) {
  if (!url) return null;
  const u = url.trim();
  if (/goo\.gl|maps\.app\.goo\.gl/.test(u)) return null;
  if (!u.includes('google') && !u.includes('maps.google')) return null;
  const COORD = '(-?\\d{1,3}\\.\\d{4,})';
  const patterns = [
    new RegExp(`[?&]q=${COORD},${COORD}`),
    new RegExp(`[?&]ll=${COORD},${COORD}`),
    new RegExp(`/@${COORD},${COORD}`),
    new RegExp(`/place/${COORD},${COORD}`),
    new RegExp(`[?&]daddr=${COORD},${COORD}`),
    new RegExp(`[?&]destination=${COORD},${COORD}`),
    new RegExp(`[?&]center=${COORD},${COORD}`),
    new RegExp(`[?&]saddr=${COORD},${COORD}`),
    new RegExp(`!3d${COORD}!4d${COORD}`),
    new RegExp(`${COORD}\\+${COORD}`),
  ];
  for (const p of patterns) {
    const m = u.match(p);
    if (m) {
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) return { lat, lng };
    }
  }
  return null;
}

function haversine(la1,lo1,la2,lo2) {
  const R=6371000,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

  navigator.geolocation

let T = TR[lang];

function setLang(l){
  if(l!=='it'&&l!=='ar') l='it';
  lang=l;T=TR[l];
  localStorage.setItem('wf_lang',l);
  document.documentElement.lang=l;
  document.documentElement.dir=T.dir;
  document.body.classList.toggle('rtl',T.dir==='rtl');
  updateModalLang();
}
setLang(lang);
window.switchLang=l=>{setLang(l);render();};

function updateModalLang(){
  const em=$('em-title');if(em)em.textContent=T.editWorkerTitle;
  const en=$('em-lbl-name');if(en)en.textContent=T.editName;
  const ep=$('em-lbl-phone');if(ep)ep.textContent=T.editPhone;
  const er=$('em-lbl-rate');if(er)er.textContent=' '+T.editRate;
  const ec=$('em-btn-cancel');if(ec)ec.textContent=T.cancel;
  const es=$('em-btn-save');if(es)es.textContent=T.save;
  const pt=$('pwd-title');if(pt)pt.textContent=T.pwdTitle;
  const pc=$('pwd-lbl-cur');if(pc)pc.textContent=T.pwdCurrent;
  const pn=$('pwd-lbl-new');if(pn)pn.textContent=T.pwdNew;
  const pf=$('pwd-lbl-cfm');if(pf)pf.textContent=T.pwdConfirm;
  const ps=$('pwd-btn-save');if(ps)ps.textContent=T.pwdSave;
  const pca=$('pwd-btn-cancel');if(pca)pca.textContent=T.cancel;
  // Attendance modal
  const at=$('att-title');if(at)at.textContent=T.editAttendanceTitle;
  const als=$('att-lbl-start');if(als)als.childNodes[0].textContent=T.editCheckinLabel+' ';
  const ale=$('att-lbl-end');if(ale)ale.childNodes[0].textContent=T.editCheckoutLabel+' ';
  const aleh=$('att-lbl-end-hint');if(aleh)aleh.textContent='('+T.editCheckoutHint+')';
  const arw=$('att-recalc-warn');if(arw)arw.textContent=' '+T.editRecalcWarn;
  const abc=$('att-btn-cancel');if(abc)abc.textContent=T.cancel;
  const abs=$('att-btn-save');if(abs)abs.textContent=' '+T.save;
}

// SLEEP DETECTION & AUTO-LOGOUT
// ════════════════════════════════════════════════════════
const IDLE_MS = 60000;
let _sleepTimer=null, _inactiveTimer=null;

function _resetInactiveTimer() {
  clearTimeout(_inactiveTimer);
  if (!S.user || document.hidden) return;
  _inactiveTimer = setTimeout(() => { if (S.user) doLogout(); }, IDLE_MS);
}

['click','touchstart','keydown','scroll','mousemove'].forEach(ev =>
  document.addEventListener(ev, _resetInactiveTimer, {passive:true})
);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(_inactiveTimer);
    _sleepTimer = setTimeout(() => { if (S.user) doLogout(); }, IDLE_MS);
  } else {
    clearTimeout(_sleepTimer); _sleepTimer=null;
    _resetInactiveTimer();
  }
});

function buildTimeOptions(selected=''){
  const opts=[`<option value="">— ${T.noAutoEnd||'No auto-end (manual)'} —</option>`];
  for(let h=7;h<=23;h++){
    for(const m of [0,30]){
      if(h===23&&m===30)continue;
      const v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      const label=(h>12?h-12:h)+':'+(m===0?'00':'30')+' '+(h>=12?'PM':'AM');
      opts.push(`<option value="${v}"${selected===v?' selected':''}>${label} (${v})</option>`);
    }
  }
  return opts.join('');
}

function buildStartTimeOptions(selected=''){
  const opts=[`<option value="">— ${T.noAutoStart||'No auto-start (manual)'} —</option>`];
  for(let h=5;h<=12;h++){
    for(const m of [0,15,30,45]){
      if(h===12&&m>0)continue;
      const v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      const ampm=(h>=12?'PM':'AM');
      const hd=h>12?h-12:h;
      const label=hd+':'+(String(m).padStart(2,'0'))+' '+ampm;
      opts.push(`<option value="${v}"${selected===v?' selected':''}>${label} (${v})</option>`);
    }
  }
  return opts.join('');
}

function buildBreakOptions(selected=''){
  const sel=parseInt(selected)||0;
  const opts=[`<option value="0"${sel===0?' selected':''}>— ${T.breakNone||'No break'} —</option>`];
  for(const m of [15,20,30,45,60,90]){
    opts.push(`<option value="${m}"${sel===m?' selected':''}>${T.breakMin?T.breakMin(m):m+' min'}</option>`);
  }
  return opts.join('');
}

async function init() {
  S.screen='auth'; render();
  S.clockInt=setInterval(()=>{const el=$('clock');if(el)el.textContent=new Date().toLocaleTimeString('en-US',{hour12:false});},1000);
  try {
    await initDB();
    reconcileStaleShifts().catch(()=>{}); // best-effort, never block boot on this
  } catch(e) {
    $('root').innerHTML=`<div class="center"><div style="max-width:520px;text-align:center;padding:40px">
      <div style="font-size:36px;margin-bottom:16px"></div>
      <div style="font-family:var(--font);font-size:15px;color:#2b2b2b;font-weight:700;margin-bottom:12px">Database Connection Failed</div>
      <div style="font-family:var(--font);font-size:12px;color:#aaa;line-height:2;margin-bottom:16px">${esc(e.message)}</div>
      <div style="background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:18px;text-align:left;font-family:var(--font);font-size:12px;color:#888;line-height:2">
        <div style="color:var(--brand-ink);font-weight:700;margin-bottom:8px">How to fix:</div>
        1. Set NEON_DATABASE_URL environment variable in Vercel/Netlify<br>
        2. Make sure /api/sql.js is deployed<br>
        3. Check browser console for more details
      </div>
    </div></div>`;
  }
}

function render(){
  if(S.screen==='auth'){$('root').innerHTML=renderAuth();return;}
  if(S.screen==='worker'){renderWorkerScreen();return;}
  if(S.screen==='manager'){renderManagerScreen();return;}
  $('root').innerHTML=`<div class="center"><div class="spin" style="width:32px;height:32px;border-width:3px"></div></div>`;
}

window.doPhoneLogin=async()=>{
  if(!rateLimit('phone_login',1500))return;
  const ph=val('wph').trim();
  const errEl=$('wph-err'); errEl.style.display='none';
  const showErr=msg=>{errEl.textContent=msg;errEl.style.display='block';};
  const btn=$('wph-btn');
  if(btn){btn.disabled=true;btn.textContent=T.loading||'Checking…';}
  try {
    if(!ph){showErr(T.badPhone);return;}
    const norm=normPhone(ph);
    if(!norm){showErr(T.badPhoneNum);return;}
    const [match,users]=await Promise.all([dbGetPhone(norm),dbListUsers()]);
    if(!match){showErr(T.phoneNoAuth);return;}
    let workerUser=users.find(x=>x.role==='worker'&&normPhone(x.phone||'')===norm);
    if(!workerUser){
      const uname=(match.label||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')||'w'+norm.slice(-6);
      const finalName=users.find(x=>x.username===uname)?uname+'_'+norm.slice(-4):uname;
      await dbSetUser(finalName,{
        password:norm,role:'worker',phone:ph,
        hourly_rate:match.rate||15,
        device_id:DEVICE_ID,
        can_restart:false
      });
      await dbSetPhone(norm,{used:true});
      workerUser=await dbGetUser(finalName);
    }

    if(!workerUser.device_id){
      await dbSetUser(workerUser.username,{device_id:DEVICE_ID});
      workerUser.device_id=DEVICE_ID;
    } else if(workerUser.device_id!==DEVICE_ID){
      showErr(T.deviceBlocked);return;
    }

    const locations=await dbListLocations();
    if(workerUser.gps_bypass===true||workerUser.gps_bypass==='true'){
      S.gps='ok'; S.gpsDist=null; S.nearestLocation=null;
      S.user=workerUser; _resetInactiveTimer(); renderWorkerScreen(); return;
    }

    if(locations.length>0){
      if(!navigator.geolocation){showErr(T.gpsRequired);return;}
      if(btn)btn.textContent=' '+(T.gpsCheck||'Getting location…');
      try {
        const pos=await geoPos(15000);
        const uLat=pos.coords.latitude, uLng=pos.coords.longitude;
        const locsWithDist=locations.map(l=>({
          ...l,
          dist:Math.round(haversine(uLat,uLng,parseFloat(l.lat),parseFloat(l.lng)))
        }));
        const allAssignments=await dbListAssignments();
        const myAssignments=allAssignments.filter(a=>a.worker_username===norm||a.worker_username===workerUser.username);
        if(myAssignments.length===0){
          showErr(lang==='ar'?' لم يتم تعيينك في أي موقع. تواصل مع المدير.':' Non sei assegnato ad alcun cantiere. Contatta il tuo manager.');return;
        }
        const candidateLocs=locsWithDist.filter(l=>myAssignments.some(a=>a.loc_id===l.id));
        const nearbyCandidate = candidateLocs
          .filter(l=>l.dist<=GPS_RADIUS)
          .sort((a,b)=>a.dist-b.dist)[0];
        if(!nearbyCandidate){
          showErr(lang==='ar'?' أنت بعيد عن موقع عملك. يرجى التوجه إلى موقعك المعيّن لتسجيل الدخول.':' Sei lontano dal tuo cantiere. Recati nella tua sede assegnata per accedere.');
          return;
        }
        const isOpen = nearbyCandidate.is_open !== false && nearbyCandidate.is_open !== 'false';
        if(!isOpen){
          showErr(lang==='ar'?` ${nearbyCandidate.name} مغلق حالياً. تواصل مع المدير.`:` ${nearbyCandidate.name} è attualmente chiuso. Contatta il tuo manager.`);return;
        }
        S.gps='ok';
        S.gpsDist=nearbyCandidate.dist;
        S.nearestLocation=nearbyCandidate;
      } catch(gpsErr){
        const code=gpsErr.code;
        if(code===1){
          const isAr=lang==='ar';
          const msg=isAr
            ?' تم رفض إذن الموقع. كيفية الإصلاح: افتح إعدادات الهاتف ← ابحث عن المتصفح (Chrome/Safari) ← الموقع ← اسمح دائمًا ← ثم أعد تحميل الصفحة وحاول مجددًا.'
            :' Permesso posizione negato. Come risolvere: Apri Impostazioni ← Trova il browser (Chrome/Safari) ← Posizione → Sempre ← Ricarica e riprova.';
          showErr(msg);
        }
        else if(code===3) showErr(lang==='ar'?' انتهت مهلة الموقع. تأكد من تفعيل GPS وحاول مجددًا.':' Timeout posizione. Assicurati che il GPS sia attivo e riprova.');
        else showErr(T.gpsLoginErr);
        return;
      }
    }

    S.user=workerUser;
    _resetInactiveTimer();
    renderWorkerScreen();
  } finally {
    if(btn){btn.disabled=false;btn.textContent=T.signIn+' →';}
  }
};

// ════════════════════════════════════════════════════════
// SHIFT ACTIONS
// ════════════════════════════════════════════════════════
let _shiftLock=false;

// Single source of truth for "how many hours does a shift pay out".
// Used by: normal worker clock-out, the manager's force-end button, the
// attendance editor, and the automatic stale-shift closer — so all four
// paths always agree.
//   billingStartMs : the snapped/official start (never the early clock-in)
//   rawEndMs       : the real end moment (actual clock-out click, or a
//                    synthetic cutoff when auto-closing a forgotten shift)
//   autoEndTimeStr : 'HH:MM' cap to apply if rawEndMs is past it, or falsy for none
//   anchorDateMs   : which calendar day autoEndTimeStr should be resolved against
//                    (today for a live end; the shift's own start date when
//                    reconciling an old forgotten shift)
function _finalizeShift(billingStartMs, rawEndMs, autoEndTimeStr, breakMinutes, hourlyRate, anchorDateMs){
  let billingEndMs = rawEndMs;
  if(autoEndTimeStr){
    const [ceh,cem]=String(autoEndTimeStr).split(':').map(Number);
    if(!isNaN(ceh)&&!isNaN(cem)){
      const configuredEnd=new Date(anchorDateMs); configuredEnd.setHours(ceh,cem,0,0);
      const configuredEndMs=configuredEnd.getTime();
      if(rawEndMs>configuredEndMs && configuredEndMs>billingStartMs){
        billingEndMs=configuredEndMs;
      }
    }
  }
  const billedMs=Math.max(0, billingEndMs-billingStartMs);
  // Half-day rule: under 5 hours billed, the site's break is not deducted.
  // 5 hours or more (a full day), the configured break is deducted as usual.
  const HALF_DAY_THRESHOLD_MS=5*3600000;
  const breakMs = billedMs<HALF_DAY_THRESHOLD_MS ? 0 : (parseFloat(breakMinutes)||0)*60000;
  const netMs=Math.max(0, billedMs-breakMs);
  const netWorkHours=netMs/3600000;
  const earnings=netWorkHours*(parseFloat(hourlyRate)||0);
  return {billingEndMs, netMs, netWorkHours, earnings};
}

// Closes out shifts left open ("working") from a PREVIOUS day — i.e. a worker
// forgot to clock out. There is no server-side scheduler in this app, so this
// runs as a best-effort check every time anyone (worker or manager) opens the
// app, rather than at an exact midnight instant. This never blocks the worker
// from starting a new shift the next day either way — the start-shift check
// only looks at today's shifts, not old ones.
//
// The site's configured end_time is a deliberate, known cutoff a manager set
// on purpose, so when one exists we trust it and auto-close + calculate pay
// through the normal _finalizeShift() path, same as any other clock-out.
//
// When the site has NO end_time configured, there is nothing reliable to
// calculate from — guessing (an earlier version of this function fell back to
// 23:59) turned out to badly overpay anyone who simply forgot to clock out, by
// assuming they worked all the way to midnight. So in that case we don't guess
// at all: the shift is marked 'needs_review' with no end_time/hours/earnings
// set, and shows up (highlighted) in the worker's Ore/hours history for a
// manager to open via "Edit Times" and enter the real end time.
async function reconcileStaleShifts(){
  const today = todayStr();
  const stale = await sql("SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts WHERE status='working' AND date<$1", [today]);
  if(!stale.length) return;
  const locs = await dbListLocationsCached();
  for(const shift of stale){
    try{
      const loc = shift.location_id ? locs.find(l=>l.id===shift.location_id) : null;
      const cutoffStr = loc && loc.end_time;
      if(!cutoffStr){
        await dbSetShift(shift.id, {status:'needs_review'});
        continue;
      }
      const [ch,cm] = cutoffStr.split(':').map(Number);
      if(isNaN(ch) || isNaN(cm)){
        await dbSetShift(shift.id, {status:'needs_review'});
        continue;
      }
      const [sy,sm,sd] = (shift.date||'').split('-').map(Number);
      if(!sy||!sm||!sd){
        await dbSetShift(shift.id, {status:'needs_review'});
        continue;
      }
      const dayAnchor = new Date(sy, sm-1, sd, 12, 0, 0, 0).getTime(); // noon of that day, safe anchor
      const cutoff = new Date(sy, sm-1, sd, ch, cm, 0, 0).getTime();
      const billingStartMs = Number(shift.billing_start_time) || Number(shift.start_time);
      // There's no real click-time to cap against — the site's end time itself IS the end.
      const r = _finalizeShift(billingStartMs, cutoff, null, shift.break_minutes, shift.hourly_rate, dayAnchor);
      await dbSetShift(shift.id, {end_time:r.billingEndMs, work_hours:r.netWorkHours, earnings:r.earnings, status:'completed'});
    }catch(e){ /* best-effort: skip this one, don't block the rest */ }
  }
  _liveCache=null;
}

window.wAct=async action=>{
  if(_shiftLock){toast(T.loading||'Please wait…','warning');return;}
  if(!rateLimit('shift_'+action,1200))return;
  if(!S.user){toast('Not logged in','error');return;}

  _shiftLock=true;
  const btn=$(action==='start'?'bst':'ben');
  if(btn){btn.style.opacity='0.5';btn.textContent='…';}

  try{
    const now=Date.now();
    const username=S.user.username;

    const allShifts=await dbListShiftsToday();
    const todayShifts=allShifts.filter(x=>x.worker===username);
    const activeShift=todayShifts.find(x=>x.status==='working');
    const completedToday=todayShifts.find(x=>x.status==='completed');

    if(action==='start'){
      if(activeShift){toast(' '+T.already,'warning');await renderWorkerScreen();return;}

      if(completedToday){
        const freshUser = await dbGetUser(username);
        if(!freshUser?.can_restart){
          const alreadyDoneMsg = lang==='ar'
            ? ' لقد أنهيت وردية اليوم بالفعل. إذا كانت هناك مشكلة تواصل مع المدير.'
            : " Hai già completato un turno oggi. Se c'è un problema contatta il manager.";
          toast(alreadyDoneMsg,'warning');
          await renderWorkerScreen();return;
        }
        await dbSetUser(username,{can_restart:false});
        S.user.can_restart=false;
      }

      const nowD=new Date(now);

      // Per-site start time check — workers can clock in up to 60 min early,
      // but pay is always billed from the official start time (not the early clock-in).
      // If no start_time is set on the site, 07:00 is used as the default.
      const siteStartTime = S.nearestLocation?.start_time || null;
      const DEFAULT_START = '07:00';
      const EARLY_WINDOW_MINS = 60;
      const effectiveStartTime = siteStartTime || DEFAULT_START;
      const [esh, esm] = effectiveStartTime.split(':').map(Number);
      const officialStartMins = esh * 60 + esm;
      const earliestAllowedMins = officialStartMins - EARLY_WINDOW_MINS;
      const nowMinsForStart = nowD.getHours() * 60 + nowD.getMinutes();
      if(nowMinsForStart < earliestAllowedMins){
        const minsUntil = earliestAllowedMins - nowMinsForStart;
        const allowedFromH = String(Math.floor(earliestAllowedMins / 60)).padStart(2,'0');
        const allowedFromM = String(earliestAllowedMins % 60).padStart(2,'0');
        const allowedFromStr = allowedFromH + ':' + allowedFromM;
        const siteName = S.nearestLocation?.name || '';
        toast(T.siteOpensAt(siteName, allowedFromStr, minsUntil), 'error');
        await renderWorkerScreen(); return;
      }

      if(S.autoEndTime){
        const [eh,em]=S.autoEndTime.split(':').map(Number);
        const nowMins=nowD.getHours()*60+nowD.getMinutes();
        const endMins=eh*60+em;
        if(nowMins>=endMins){
          toast(lang==='ar'?` انتهت ورديات اليوم في ${S.autoEndTime}. إلى اللقاء غداً!`:` I turni di oggi sono terminati alle ${S.autoEndTime}. A domani!`,'error');
          await renderWorkerScreen();return;
        }
      }

      const locationName = S.nearestLocation?.name || '—';
      const id='s'+now+'_'+username.slice(0,6);

      // Billing snap: always bill from official start, never from early clock-in.
      // If worker is late, bill from actual clock-in time.
      let billingStartMs = now;
      const billingBase = new Date(now);
      billingBase.setHours(esh, esm, 0, 0);
      const billingBaseMs = billingBase.getTime();
      if(now < billingBaseMs){
        billingStartMs = billingBaseMs;
      }

      // Break minutes for this location
      const locBreakMins = parseFloat(S.nearestLocation?.break_minutes||0)||0;

      await dbSetShift(id,{
        worker:username,
        date:todayStr(),
        start_time:now,
        billing_start_time:billingStartMs,
        break_minutes:locBreakMins,
        end_time:null,
        work_hours:null,
        earnings:null,
        hourly_rate:parseFloat(S.user.hourly_rate)||0,
        location_name:locationName,
        location_id:S.nearestLocation?.id||null,
        status:'working'
      });

      S.shift={id,worker:username,date:todayStr(),start_time:now,billing_start_time:billingStartMs,break_minutes:locBreakMins,status:'working',location_name:locationName,location_id:S.nearestLocation?.id||null,hourly_rate:parseFloat(S.user.hourly_rate)||0};
      toast(` ${T.shiftStarted}`,'success');
      await renderWorkerScreen();

    }else if(action==='end'){
      window._confirmEnd=null;

      if(!activeShift){toast(' '+T.noActive,'warning');await renderWorkerScreen();return;}
      if(activeShift.worker!==username){toast(' Shift mismatch error.','error');return;}
      const startMs=Number(activeShift.start_time);
      if(!startMs||startMs<=0||startMs>now){toast(' Invalid shift start time.','error');return;}

      const wMs=Math.max(0,now-startMs);

      const billingStartMs2 = Number(activeShift.billing_start_time) || Number(activeShift.start_time);
      const r = _finalizeShift(billingStartMs2, now, S.autoEndTime, activeShift.break_minutes, activeShift.hourly_rate, now);
      // end_time records the real moment the worker clocked out (may be later
      // than the paid/capped hours if an auto-end applied) — work_hours/earnings
      // reflect the (possibly capped, possibly break-adjusted) billed amount.
      await dbSetShift(activeShift.id,{end_time:now,work_hours:r.netWorkHours,earnings:r.earnings,status:'completed'});
      S.shift=null;clearInterval(S.timerInt);
      toast(` ${T.endMsg?T.endMsg(fmtDur(r.netMs),r.earnings.toFixed(2)):'Done!'}`, 'success');
      await renderWorkerScreen();
    }
  }catch(err){
    toast('Error: '+err.message,'error');
    console.error('wAct error:',err);
    await renderWorkerScreen();
  }finally{
    _shiftLock=false;
  }
};

function wireManagerTab(tab){
  const panel=$('mpanel'); if(!panel) return;
  if(tab==='salary'){ const t=panel.querySelector('table'); if(t) enhanceTable(t); return; }
  if(tab==='locations'){ initLocationMap(); return; }
  if(tab==='live'||tab==='addworker'){
    if(panel.querySelectorAll('[data-search]').length) injectListSearch(panel);
  }
}

function injectListSearch(panel){
  if(panel.querySelector('.tbl-toolbar')) return;
  const L=mgrNav();
  const items=[...panel.querySelectorAll('[data-search]')];
  const total=items.length;
  const bar=document.createElement('div');
  bar.className='tbl-toolbar';
  bar.innerHTML=`<div class="tbl-search"><input type="text" placeholder="${L.search}" aria-label="search"></div><span class="tbl-count"></span>`;
  panel.insertBefore(bar, panel.firstChild);
  const input=bar.querySelector('input');
  const count=bar.querySelector('.tbl-count');
  const apply=()=>{
    const q=cleanName(input.value).toLowerCase();
    let shown=0;
    items.forEach(el=>{
      const hay=(el.getAttribute('data-search')||el.textContent||'').toLowerCase();
      const match=!q||hay.includes(q);
      el.style.display=match?'':'none';
      if(match) shown++;
    });
    count.textContent=L.showing(shown,total);
  };
  input.addEventListener('input',apply);
  apply();
}

function enhanceTable(table){
  if(table.dataset.enhanced) return;
  const tbody=table.tBodies[0]; if(!tbody) return;
  let rows=[...tbody.rows].filter(r=>!r.querySelector('td[colspan]'));
  if(rows.length<=1){ return; } // nothing meaningful to page/sort
  table.dataset.enhanced='1';
  const L=mgrNav();
  const wrap=table.closest('.table-wrap')||table;
  // Toolbar
  const bar=document.createElement('div');
  bar.className='tbl-toolbar';
  bar.innerHTML=`<div class="tbl-search"><input type="text" placeholder="${L.search}"></div>
    <span class="tbl-count"></span><span class="spacer" style="flex:1"></span>
    <select class="btn-dark" style="width:auto;padding:6px 8px;font-family:var(--font);font-size:11px" aria-label="rows per page">
      <option value="10">10 ${L.rows}</option><option value="25" selected>25 ${L.rows}</option><option value="50">50 ${L.rows}</option><option value="100000">${mgrNav().showing?'All':'All'}</option>
    </select>`;
  wrap.parentNode.insertBefore(bar, wrap);
  // Pager
  const pager=document.createElement('div');
  pager.className='pager';
  pager.innerHTML=`<button data-act="prev">‹ ${L.prev}</button><span class="pg-info"></span><button data-act="next">${L.next} ›</button>`;
  wrap.parentNode.insertBefore(pager, wrap.nextSibling);

  const input=bar.querySelector('input');
  const count=bar.querySelector('.tbl-count');
  const sizeSel=bar.querySelector('select');
  const info=pager.querySelector('.pg-info');
  const prevBtn=pager.querySelector('[data-act="prev"]');
  const nextBtn=pager.querySelector('[data-act="next"]');

  let query='', sortCol=-1, sortDir=1, page=0, pageSize=parseInt(sizeSel.value)||25;

  // Make headers sortable
  const ths=[...table.tHead.rows[0].cells];
  ths.forEach((th,idx)=>{
    th.classList.add('sortable');
    if(!th.querySelector('.arr')){ const a=document.createElement('span'); a.className='arr'; a.textContent=' ⇅'; th.appendChild(a); }
    th.addEventListener('click',()=>{
      if(sortCol===idx) sortDir*=-1; else { sortCol=idx; sortDir=1; }
      ths.forEach((o,i)=>{ o.classList.toggle('sorted',i===sortCol); const ar=o.querySelector('.arr'); if(ar) ar.textContent = i===sortCol ? (sortDir>0?' ↑':' ↓') : ' ⇅'; });
      page=0; render();
    });
  });

  // tag numeric columns for right-aligned tabular figures
  ths.forEach((th,idx)=>{
    const vals=rows.map(r=>(r.cells[idx]?(r.cells[idx].textContent||'').trim():''));
    const nonEmpty=vals.filter(v=>v!=='');
    const numeric=nonEmpty.length>0 && nonEmpty.every(v=>/^[-+]?[\u20AC$\u00A3]?\s?[\d.,\s]+\s?(%|h|min|\u20AC)?$/i.test(v));
    if(numeric){ th.classList.add('num'); rows.forEach(r=>{ if(r.cells[idx]) r.cells[idx].classList.add('num'); }); }
  });
  const cellVal=(row,col)=>{
    const c=row.cells[col]; if(!c) return '';
    return (c.textContent||'').trim();
  };
  const numVal=t=>{ const n=parseFloat(String(t).replace(/[^0-9.\-]/g,'')); return n; };

  function render(){
    const q=cleanName(query).toLowerCase();
    let filtered=rows.filter(r=>{
      const hay=(r.getAttribute('data-search')||r.textContent||'').toLowerCase();
      return !q||hay.includes(q);
    });
    if(sortCol>=0){
      filtered=filtered.slice().sort((a,a2)=>{
        const va=cellVal(a,sortCol), vb=cellVal(a2,sortCol);
        const na=numVal(va), nb=numVal(vb);
        let cmp;
        if(isFinite(na)&&isFinite(nb)&&va.replace(/[€h\s,.\-]/g,'')!=='' && vb.replace(/[€h\s,.\-]/g,'')!=='') cmp=na-nb;
        else cmp=cleanName(va).localeCompare(cleanName(vb),undefined,{sensitivity:'base',numeric:true});
        return cmp*sortDir;
      });
    }
    const totalRows=filtered.length;
    const pages=Math.max(1,Math.ceil(totalRows/pageSize));
    if(page>=pages) page=pages-1; if(page<0) page=0;
    rows.forEach(r=>r.style.display='none');
    const start=page*pageSize;
    const slice=filtered.slice(start,start+pageSize);
    slice.forEach(r=>{ r.style.display=''; tbody.appendChild(r); });
    count.textContent=L.showing(slice.length, totalRows);
    info.textContent=`${L.page} ${page+1} / ${pages}`;
    prevBtn.disabled=page<=0; nextBtn.disabled=page>=pages-1;
    pager.style.display = totalRows>pageSize ? '' : 'none';
  }
  input.addEventListener('input',e=>{ query=e.target.value; page=0; render(); });
  sizeSel.addEventListener('change',e=>{ pageSize=parseInt(e.target.value)||25; page=0; render(); });
  prevBtn.addEventListener('click',()=>{ page--; render(); });
  nextBtn.addEventListener('click',()=>{ page++; render(); });
  render();
}

async function buildDashboard(shared){
  const now=new Date();
  const [allUsers, shifts, locations, monthShifts] = shared
    ? [shared.allUsers, shared.shifts, shared.locations, shared.monthShifts]
    : await Promise.all([dbListUsersCached(), dbListShiftsToday(), dbListLocationsCached(), dbListShiftsMonth(now.getFullYear(), now.getMonth()+1)]);
  const workers=allUsers.filter(u=>u.role==='worker');
  const um={}; allUsers.forEach(u=>um[u.username]=u);
  const workingNow=shifts.filter(s=>s.status==='working');
  const L=mgrNav();

  // Hours by location (current cycle, completed)
  const completed=monthShifts.filter(s=>s.status==='completed');
  const byLoc={};
  completed.forEach(s=>{ const k=cleanName(s.location_name||'—'); byLoc[k]=(byLoc[k]||0)+(parseFloat(s.work_hours)||0); });
  const locRows=Object.entries(byLoc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxLoc=Math.max(1,...locRows.map(r=>r[1]));

  // Top earners (current cycle)
  const byWorker={};
  completed.forEach(s=>{ byWorker[s.worker]=(byWorker[s.worker]||0)+(parseFloat(s.earnings)||0); });
  const earnRows=Object.entries(byWorker).map(([u,v])=>[cleanName(um[u]?.label||um[u]?.username||u),v]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxEarn=Math.max(1,...earnRows.map(r=>r[1]));

  const cycSal=completed.reduce((a,s)=>a+(parseFloat(s.earnings)||0),0);
  const cycHrs=completed.reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);

  const workingList = workingNow.length
    ? `<div style="display:flex;flex-direction:column;gap:8px">${workingNow.sort((a,b)=>cleanName(um[a.worker]?.label||a.worker).localeCompare(cleanName(um[b.worker]?.label||b.worker))).map(s=>{

        </div>`;
      }).join('')}</div>`
    : `<div class="empty" style="padding:24px">${lang==='ar'?'لا أحد يعمل الآن':lang==='it'?'Nessuno al lavoro adesso':'Nobody working right now'}</div>`;

  return `
  <div class="panel-card" style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-left:4px solid var(--copper)">
    <div>
      <div style="font-family:var(--font);font-size:20px;font-weight:900;letter-spacing:1px;color:var(--text);text-transform:uppercase">${L.dashboard}</div>
      <div style="font-family:var(--font);font-size:11px;color:var(--muted);margin-top:3px"> ${lang==='ar'?'الدورة الحالية':lang==='it'?'Ciclo corrente':'Current cycle'}: <strong style="color:var(--brand-ink)">${cycleLabel(now)}</strong></div>
    </div>
    <button class="btn btn-green" style="width:auto;padding:10px 18px" onclick="doExport()">${T.expXlsx}</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
    <div class="panel-card">
      <div class="pc-title"> ${lang==='ar'?'يعملون الآن':lang==='it'?'Al lavoro ora':'Working now'} <span style="color:var(--muted);font-weight:400">(${workingNow.length})</span></div>
      ${workingList}
    </div>
    <div class="panel-card">
      <div class="pc-title"> ${lang==='ar'?'الساعات حسب الموقع':lang==='it'?'Ore per cantiere':'Hours by site'}</div>
      ${locRows.length?locRows.map(([n,v])=>`<div class="bar-row"><span class="bl">${esc(n)}</span><div class="bar-track"><div class="bar-fill" style="width:${(v/maxLoc*100).toFixed(1)}%"></div></div><span class="bv">${fmtNum(v,1)} h</span></div>`).join(''):`<div class="empty" style="padding:18px">—</div>`}
    </div>
    <div class="panel-card">
      <div class="pc-title"> ${lang==='ar'?'الأعلى دخلاً':lang==='it'?'Top guadagni':'Top earners'}</div>
      ${earnRows.length?earnRows.map(([n,v])=>`<div class="bar-row"><span class="bl">${esc(n)}</span><div class="bar-track"><div class="bar-fill" style="width:${(v/maxEarn*100).toFixed(1)}%;background:linear-gradient(90deg,#e8801c,#f5a44a)"></div></div><span class="bv">${fmtNum(v,0)} €</span></div>`).join(''):`<div class="empty" style="padding:18px">—</div>`}

  </div>`;

// shared summary card renderer — accepts pre-fetched data, no extra queries
function _renderSummaryCards(allUsers, shifts, locations, monthShifts) {
  const el=$('scards'); if(!el)return;
  const users=allUsers.filter(u=>u.role==='worker');
  const sal=monthShifts.filter(s=>s.status==='completed').reduce((a,s)=>a+(parseFloat(s.earnings)||0),0).toFixed(2);
  const working=shifts.filter(s=>s.status==='working').length;
  const absent=users.filter(w=>!shifts.find(s=>s.worker===w.username)).length;
  el.innerHTML=[
    ['','#e8801c',T.workers,users.length],
    ['','#e8801c',T.working,working],
    ['','#2b2b2b',T.absent,absent],
    ['','#cc6e12',T.locations,locations.length],
    ['','#e8801c',T.salDue,fmtMoney(sal)],

function inP(s,per){
  const ts=Number(s.start_time);
  const d=ts?new Date(ts):new Date(s.date);
  const n=new Date();
  if(per==='today')return s.date===todayStr();
  if(per==='week'){const w=new Date(n);w.setDate(n.getDate()-n.getDay());w.setHours(0,0,0,0);return d>=w;}
  if(per==='month')return inCycle(s.date || d);
  return true;
}

window.allowRestart=async(username, displayName)=>{
  if(!confirm(T.confirmAllow(displayName))) return;
  try{
    await dbSetUser(username,{can_restart:true});
    _liveCache=null;
    toast(T.canNowStart(displayName),'success');
    await mTab('live');
  }catch(e){toast('Error: '+e.message,'error');}
};

window.revokeRestart=async(username, displayName)=>{
  if(!confirm(T.confirmRevoke(displayName))) return;
  try{
    await dbSetUser(username,{can_restart:false});
    _liveCache=null;
    toast(T.restartRevoked(displayName),'warning');
    await mTab('live');
  }catch(e){toast('Error: '+e.message,'error');}
};

window.mgrEndShift=async(shiftId, workerName)=>{
  if(!confirm(T.confirmEndShift(workerName)))return;
  try{
    const allShifts=await dbListShiftsToday();
    const shift=allShifts.find(s=>s.id===shiftId&&s.status==='working');
    if(!shift){toast(T.shiftNotFound,'warning');return;}
    const now=Date.now();
    // Apply the exact same criteria as a normal worker clock-out: billing-snapped
    // start, the site's (or global) configured end-time cap, and the half-day break rule.
    const [locs, cfg] = await Promise.all([dbListLocationsCached(), dbGetConfig()]);
    const loc = shift.location_id ? locs.find(l=>l.id===shift.location_id) : null;
    const autoEndTimeStr = (loc && loc.end_time) || cfg.auto_end_time || null;
    const billingStartMs = Number(shift.billing_start_time) || Number(shift.start_time);
    const r = _finalizeShift(billingStartMs, now, autoEndTimeStr, shift.break_minutes, shift.hourly_rate, now);
    const workHours = r.netWorkHours, earnings = r.earnings, wMs = r.netMs;
    await dbSetShift(shiftId,{end_time:now,work_hours:workHours,earnings,status:'completed'});
    _liveCache=null;
    toast(T.shiftEndedFor(workerName,fmtDur(wMs)),'success');
    await mTab('live');
    loadSummary();
  }catch(e){toast('Error: '+e.message,'error');}
};
