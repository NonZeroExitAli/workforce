function _locLabels(){
  if(lang==='ar') return {search:'بحث عن موقع…',all:'الكل',open:'مفتوح',closed:'مغلق',coords:'الإحداثيات',status:'الحالة',start:'بدء تلقائي',end:'إنهاء تلقائي',brk:'استراحة',workers:'العمال المعيّنون',created:'تاريخ الإنشاء',offline:'الخريطة غير متاحة بدون إنترنت. المواقع مدرجة بالأسفل.',notReady:'الخريطة قيد التحميل…',showOnMap:'إظهار على الخريطة',openMaps:'فتح في الخرائط',mapBtn:'خريطة',editBtn:'تعديل'};
  if(lang==='it') return {search:'Cerca cantiere…',all:'Tutti',open:'Aperto',closed:'Chiuso',coords:'Coordinate',status:'Stato',start:'Avvio auto',end:'Fine auto',brk:'Pausa',workers:'Operai assegnati',created:'Creato il',offline:'Mappa non disponibile offline. I cantieri sono elencati qui sotto.',notReady:'Mappa in caricamento…',showOnMap:'Mostra sulla mappa',openMaps:'Apri in Maps',mapBtn:'Mappa',editBtn:'Modifica'};
  return {search:'Search location…',all:'All',open:'Open',closed:'Closed',coords:'Coordinates',status:'Status',start:'Auto-start',end:'Auto-end',brk:'Break',workers:'Assigned workers',created:'Created',offline:'Map unavailable offline — connect to the internet to view it. Locations are listed below.',notReady:'Map is still loading…',showOnMap:'Show on map',openMaps:'Open in Maps',mapBtn:'Map',editBtn:'Edit'};
}
function _loadCss(href){ return new Promise(res=>{ if(document.querySelector('link[data-href="'+href+'"]')) return res(); const l=document.createElement('link'); l.rel='stylesheet'; l.href=href; l.setAttribute('data-href',href); l.onload=()=>res(); l.onerror=()=>res(); document.head.appendChild(l); }); }
function _loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector('script[data-src="'+src+'"]')) return res(); const s=document.createElement('script'); s.src=src; s.setAttribute('data-src',src); s.onload=()=>res(); s.onerror=()=>rej(new Error('load fail '+src)); document.head.appendChild(s); }); }
function _ensureLeaflet(){
  if(window.L && window.L.markerClusterGroup) return Promise.resolve();
  if(_leafletReady) return _leafletReady;
  _leafletReady=Promise.race([
    (async()=>{ await Promise.all(_LEAFLET_CSS.map(_loadCss)); await _loadScript(_LEAFLET_JS[0]); await _loadScript(_LEAFLET_JS[1]); if(!(window.L && window.L.markerClusterGroup)) throw new Error('Leaflet unavailable'); })(),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),12000))
  ]).catch(e=>{ _leafletReady=null; throw e; });
  return _leafletReady;
}
function _locPin(status){ return L.divIcon({className:'loc-pin',html:'<div class="pin '+status+'"></div>',iconSize:[20,20],iconAnchor:[10,20],popupAnchor:[0,-18]}); }
function _locPopup(l, open, workers){
  const LL=_locLabels();
  const coords=parseFloat(l.lat).toFixed(6)+', '+parseFloat(l.lng).toFixed(6);
  const created=l.added_at?new Date(Number(l.added_at)).toLocaleDateString():'—';
  const rows=[];
  rows.push([' '+LL.coords, coords]);
  rows.push([LL.status, '<span class="loc-badge '+(open?'open':'closed')+'">'+(open?LL.open:LL.closed)+'</span>']);
  if(l.start_time) rows.push(['▶ '+LL.start, esc(l.start_time)]);
  if(l.end_time) rows.push(['⏹ '+LL.end, esc(l.end_time)]);
  if(parseInt(l.break_minutes||0)>0) rows.push([' '+LL.brk, parseInt(l.break_minutes)+' min']);
  rows.push([' '+LL.workers, workers.length?workers.map(esc).join(', '):'—']);
  rows.push([' '+LL.created, esc(created)]);
  const link=l.map_link?'<a href="'+esc(l.map_link)+'" target="_blank" class="loc-pop-link">↗ '+LL.openMaps+'</a>':'';
  return '<div class="loc-popup"><h4> '+disp(l.name||'—')+'</h4>'+rows.map(r=>'<div class="loc-pop-row"><span class="k">'+r[0]+'</span><span class="v">'+r[1]+'</span></div>').join('')+link+'</div>';
}
async function initLocationMap(){
  const el=document.getElementById('loc-map'); if(!el) return;
  const LL=_locLabels();
  let data=window.__locData; if(!data){ data={locs:await dbListLocations(),assignments:await dbListAssignments(),users:await dbListUsers()}; }
  const valid=data.locs.filter(l=>isFinite(parseFloat(l.lat))&&isFinite(parseFloat(l.lng)));
  el.innerHTML='<div class="loc-map-fallback"> '+LL.notReady+'</div>';
  try{ await _ensureLeaflet(); }
  catch(e){ el.innerHTML='<div class="loc-map-fallback"> '+LL.offline+'</div>'; return; }
  if(_locMap){ try{_locMap.remove();}catch(_){} _locMap=null; }
  el.innerHTML='';
  const center=valid.length?[parseFloat(valid[0].lat),parseFloat(valid[0].lng)]:[45.4642,9.19];
  _locMap=L.map(el,{scrollWheelZoom:true}).setView(center,11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(_locMap);
  const userByName={}; data.users.forEach(u=>userByName[u.username]=u);
  const workersByLoc={}; data.assignments.forEach(a=>{ (workersByLoc[a.loc_id]=workersByLoc[a.loc_id]||[]).push(cleanName(userByName[a.worker_username]?.label||userByName[a.worker_username]?.username||a.worker_username)); });
  _locMarkers=valid.map(l=>{
    const open=l.is_open!==false && l.is_open!=='false';
    const m=L.marker([parseFloat(l.lat),parseFloat(l.lng)],{icon:_locPin(open?'open':'closed')});
    m._loc=l; m._open=open; m._name=cleanName(l.name||'');
    m.bindPopup(_locPopup(l,open,workersByLoc[l.id]||[]),{maxWidth:300});
    return m;
  });
  _locFilter='all'; _locQuery='';
  setTimeout(()=>{ if(_locMap){ _locMap.invalidateSize(); _locRefreshMarkers(true); } },60);
}
function _locRefreshMarkers(fit){
  if(!_locMap) return;
  if(_locClusterLayer){ try{_locMap.removeLayer(_locClusterLayer);}catch(_){} _locClusterLayer=null; }
  const layer=(L.markerClusterGroup?L.markerClusterGroup({maxClusterRadius:50,spiderfyOnMaxZoom:true}):L.layerGroup());
  const q=cleanName(_locQuery).toLowerCase();
  const shown=_locMarkers.filter(m=>{
    if(_locFilter==='open' && !m._open) return false;
    if(_locFilter==='closed' && m._open) return false;
    if(q && m._name.toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
  shown.forEach(m=>layer.addLayer(m));
  _locClusterLayer=layer; _locMap.addLayer(layer);
  if(fit && shown.length){ try{ const g=L.featureGroup(shown); _locMap.fitBounds(g.getBounds().pad(0.2),{maxZoom:15}); }catch(_){} }
}
window.locMapSearch=()=>{ const i=document.getElementById('loc-map-search'); _locQuery=i?i.value:''; _locRefreshMarkers(true); };
window.locMapFilter=(f)=>{ _locFilter=f; document.querySelectorAll('.loc-chip').forEach(c=>c.classList.toggle('active',c.getAttribute('data-f')===f)); _locRefreshMarkers(true); };
window.flyToLoc=(id)=>{
  const LL=_locLabels();
  const m=_locMarkers.find(x=>x._loc.id===id);
  if(!m||!_locMap){ toast(LL.notReady,'warning'); return; }
  _locFilter='all'; _locQuery='';
  const s=document.getElementById('loc-map-search'); if(s) s.value='';
  document.querySelectorAll('.loc-chip').forEach(c=>c.classList.toggle('active',c.getAttribute('data-f')==='all'));
  _locRefreshMarkers(false);
  document.getElementById('loc-map')?.scrollIntoView({behavior:'smooth',block:'center'});
  _locMap.flyTo(m.getLatLng(),16,{duration:.8});
  setTimeout(()=>{ if(_locClusterLayer && _locClusterLayer.zoomToShowLayer){ _locClusterLayer.zoomToShowLayer(m,()=>m.openPopup()); } else { m.openPopup(); } },850);
};

window.onLocLinkChange=()=>{
  const url=val('loc-ml').trim(); const st=$('loc-ml-status'); if(!st)return;
  if(!url){st.textContent='';return;}
  const c=extractCoordsFromMapsLink(url);
  if(c){st.textContent=T.linkReady;st.style.color='#e8801c';}
  else if(/goo\.gl|maps\.app/.test(url)){st.innerHTML=T.shortUrl;st.style.color='#e8801c';}
  else{st.textContent=T.pasteGmap;st.style.color='var(--red)';}
};
window.extractLocCoords=()=>{
  const url=val('loc-ml').trim();
  const c=extractCoordsFromMapsLink(url);
  if(c){$('loc-lat').value=c.lat.toFixed(6);$('loc-lng').value=c.lng.toFixed(6);const st=$('loc-ml-status');if(st){st.textContent=`✓ ${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`;st.style.color='#e8801c';}toast(T.coordsExtracted,'success');}
  else toast(T.noCoordsInLink,'error');
};
window.useMyLocForSite=async()=>{
  try{const pos=await geoPos();$('loc-lat').value=pos.coords.latitude.toFixed(6);$('loc-lng').value=pos.coords.longitude.toFixed(6);toast(T.locCaptured,'success');}
  catch{toast(T.couldNotGetLoc,'error');}
};
window.addLocation=async()=>{
  const name=val('loc-name').trim();
  const lat=parseFloat($('loc-lat')?.value);
  const lng=parseFloat($('loc-lng')?.value);
  const ml=val('loc-ml').trim();
  const st=val('loc-start').trim();
  const et=val('loc-end').trim();
  const brk=parseInt(val('loc-break'))||0;
  if(!name){toast(T.enterSiteName,'error');return;}
  if(isNaN(lat)||isNaN(lng)){toast(T.enterValidCoords,'error');return;}
  const id='loc_'+Date.now();

async function buildAssign(){
  const [phones, locs, assignments, allUsers] = await Promise.all([
    dbListPhones(), dbListLocations(), dbListAssignments(), dbListUsersCached()
  ]);
  const workers = allUsers.filter(u=>u.role==='worker');
  const phoneMap = {};
  phones.forEach(p=>phoneMap[p.norm]=p);
  const workerEntries = workers.map(u=>{
    const norm = normPhone(u.phone||'');
    return phoneMap[norm] || {norm: u.username, phone: u.phone||u.username, label: u.label||u.username};
  });
  const seen = new Set();
  const uniqueWorkers = workerEntries.filter(w=>{ if(seen.has(w.norm))return false; seen.add(w.norm); return true; }).sort(byName);
  const assignedMap = {};
  assignments.forEach(a=>{
    if(!assignedMap[a.worker_username]) assignedMap[a.worker_username]=new Set();
    assignedMap[a.worker_username].add(a.loc_id);
  });
  const unassigned = uniqueWorkers.filter(p=>!assignedMap[p.norm]||assignedMap[p.norm].size===0);

  function workerChip(p, locId){
    const removeBtn = locId
      ? `<span class="chip-remove" title="${T.cancel}" onclick="removeAssignment('${esc(p.norm)}','${esc(locId)}')">&#x2715;</span>`
      : '';
    const otherLocs = locs.filter(l => l.id !== locId).slice().sort(byName);
    const quickAssign = otherLocs.length
      ? `<div style="margin-top:5px"><select style="width:100%;padding:3px 5px;font-size:10px;border-radius:3px;border:1px solid var(--border2);background:var(--bg);color:var(--muted);font-family:var(--font)" onchange="quickAssignWorker('${esc(p.norm)}',this.value,this)"><option value="">assign to...</option>${otherLocs.map(l=>`<option value="${esc(l.id)}">${disp(l.name)}</option>`).join('')}</select></div>`
      : '';
    return `<div class="assign-worker-chip" draggable="true" data-worker="${esc(p.norm)}" data-from="${esc(locId||'__unassigned__')}" style="flex-direction:column;align-items:stretch;gap:2px"><div style="display:flex;align-items:center;gap:8px"><div style="display:flex;flex-direction:column;flex:1;min-width:0"><span class="chip-name">${disp(p.label||p.phone)}</span><span class="chip-phone">${esc(p.phone)}</span></div>${removeBtn}</div>${quickAssign}</div>`;
  }

  const unassignedChips = unassigned.length
    ? unassigned.map(p=>workerChip(p,null)).join('')
    : `<div class="assign-empty-drop">${T.allAssigned}</div>`;

  const locCols = !locs.length
    ? `<div style="color:var(--muted);font-family:var(--font);font-size:11px;padding:20px">${T.noLocations}</div>`
    : locs.map(l=>{
        const isOpen = l.is_open !== false && l.is_open !== 'false';
        const assignedPhones = uniqueWorkers.filter(p=>assignedMap[p.norm]?.has(l.id));
        const chips = assignedPhones.length
          ? assignedPhones.map(p=>workerChip(p,l.id)).join('')
          : `<div class="assign-empty-drop">${T.dropHere}</div>`;
        return `<div class="assign-col ${isOpen?'':'loc-closed'}" data-locid="${esc(l.id)}">
          <div class="assign-col-head">
            <div>
              <div class="assign-col-title"> ${disp(l.name)}</div>
              <div style="font-family:var(--font);font-size:10px;color:var(--muted);margin-top:2px">${T.workerCount(assignedPhones.length)}</div>
            </div>
            <button class="loc-toggle ${isOpen?'open':'closed'}" onclick="toggleLocOpen('${esc(l.id)}',${!isOpen})">
              ${isOpen?T.siteOpen:T.siteClosed}
            </button>
          </div>
          <div class="assign-col-body" data-locid="${esc(l.id)}">${chips}</div>
        </div>`;
      }).join('');

  return `<div class="assign-info-bar">${T.assignInfoBar}</div>
  <div class="assign-board">
    <div class="assign-col unassigned" data-locid="__unassigned__">
      <div class="assign-col-head">
        <div>
          <div class="assign-col-title" style="color:var(--muted)">${T.unassigned}</div>
          <div style="font-family:var(--font);font-size:10px;color:var(--muted);margin-top:2px">${T.workerCount(unassigned.length)}</div>
        </div>
      </div>
      <div class="assign-col-body" data-locid="__unassigned__">${unassignedChips}</div>
    </div>
    ${locCols}
  </div>`;
}

function initAssignBoard(){
  let dragWorker=null, dragFrom=null, dragEl=null;
  document.querySelectorAll('.assign-worker-chip').forEach(chip=>{
    chip.addEventListener('dragstart',e=>{
      dragWorker=chip.dataset.worker;
      dragFrom=chip.dataset.from;
      dragEl=chip;
      setTimeout(()=>chip.classList.add('dragging'),0);
    });
    chip.addEventListener('dragend',()=>{
      chip.classList.remove('dragging');
      document.querySelectorAll('.assign-col-body').forEach(z=>z.classList.remove('drag-over'));
    });
  });
  document.querySelectorAll('.assign-col-body').forEach(zone=>{
    zone.addEventListener('dragover',e=>{
      e.preventDefault();
      document.querySelectorAll('.assign-col-body').forEach(z=>z.classList.remove('drag-over'));
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop',async e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const toLocId=zone.dataset.locid;
      if(!dragWorker||toLocId===dragFrom) return;
      if(toLocId==='__unassigned__'){
        if(dragFrom&&dragFrom!=='__unassigned__') await dbDelAssignment(dragWorker,dragFrom);
      } else {
        await dbSetAssignment(dragWorker,toLocId);
      }
      dragWorker=null;dragFrom=null;dragEl=null;
      const panel=$('mpanel');
      if(panel){ panel.innerHTML=await buildAssign(); initAssignBoard(); }
    });
  });
}

window.removeAssignment=async(worker_username, loc_id)=>{
  await dbDelAssignment(worker_username, loc_id);
  const panel=$('mpanel');
  if(panel){ panel.innerHTML=await buildAssign(); initAssignBoard(); }
};
window.toggleLocOpen=async(loc_id, is_open)=>{
  await dbSetLocationOpen(loc_id, is_open);
  toast(is_open?T.siteNowOpen:T.siteNowClosed, is_open?'success':'warning');
  const panel=$('mpanel');
  if(panel){ panel.innerHTML=await buildAssign(); initAssignBoard(); }
};

window.quickAssignWorker=async(workerNorm, locId, selectEl)=>{
  if(!locId) return;
  selectEl.disabled=true;
  try{
    await dbSetAssignment(workerNorm, locId);
    const panel=$('mpanel');
    if(panel){ panel.innerHTML=await buildAssign(); initAssignBoard(); }
  }catch(e){
    toast('Error: '+e.message,'error');
    selectEl.disabled=false;
    selectEl.value='';
  }
};

  // ── Header badges / toggle (edit only) ──

  const dis = isCreate;

  return `
  <div class="panel-card" style="border-left:4px solid var(--copper);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:14px">
      <button onclick="backFromProfile()" title="${T.backToList}" style="flex-shrink:0;width:40px;height:40px;border-radius:10px;background:var(--bg1);border:1px solid var(--border2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${lang==='ar'?'<path d="M5 12h14M13 5l7 7-7 7"/>':'<path d="M19 12H5M11 5l-7 7 7 7"/>'}</svg>
      </button>
      ${_avatarHtml(isCreate?'+':(u.label||u.username), 52)}
      <div>
        <div style="font-family:var(--font);font-size:22px;font-weight:900;letter-spacing:.3px;color:var(--text)">${isCreate?P.newWorker:disp(u.label||u.username)}</div>
        <div style="font-family:var(--font);font-size:12px;color:var(--muted);margin-top:3px">${isCreate?'':(esc(u.job_title||'')+(siteVal?(u.job_title?' · ':'')+siteVal:'')||T.profile)}</div>
      </div>
    </div>
    ${isCreate?'':`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${statusBadgeHtml}${toggleBtn}${editing?'':`<button class="btn-sm" style="display:inline-flex;align-items:center;gap:7px;background:var(--bg1);border:1px solid var(--border2);color:var(--text);padding:9px 16px;font-weight:800" onclick="openWorkerProfile('${esc(username)}',true)">${ic('tool',15)} ${P.editDetails}</button>`}<button class="btn-sm btn-red" style="padding:9px 16px;font-weight:800" onclick="deleteWorkerFromProfile('${esc(username)}')">${P.deleteWorker}</button></div>`}

      <div class="table-wrap"><table><thead><tr><th>${P.colDate}</th><th>${P.colSite}</th><th class="num">${P.colIn}</th><th class="num">${P.colOut}</th><th class="num">${P.colHours}</th><th class="num">${P.colEarn}</th><th>${P.colStatus}</th><th></th></tr></thead><tbody>${oreRows}</tbody></table></div></div>`}

window.profileTab=(key)=>{
  document.querySelectorAll('.pf-pane').forEach(p=>p.style.display='none');
  const pane=document.getElementById('pf-'+key); if(pane) pane.style.display='';
  document.querySelectorAll('.pf-tab').forEach(t=>{
    const on=t.dataset.pf===key;
    const inner=t.querySelector('.pf-tab-inner')||t;
    inner.style.background = on ? 'var(--copper)' : 'transparent';
    inner.style.color = on ? '#fff' : 'var(--muted)';
  });
};


// ── Profile action handlers ──
window.toggleWorkerStatus = async (username, current)=>{
  const next = current==='paused' ? 'confirmed' : 'paused';
  try{ await dbSetWorkerStatus(username, next); _liveCache=null; toast(T.statusChanged,'success'); await openWorkerProfile(username); }
  catch(e){ toast('Error: '+e.message,'error'); }
};
window.addCareerEvent = async (username)=>{
  const type=(val('career-type')||'').trim();
  const desc=(val('career-desc')||'').trim();
  const date=(val('career-date')||'').trim()||todayStr();
  if(!type){ toast(T.careerNeedType,'error'); return; }
  try{
    const id='car_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    await dbAddCareer(id, username, date, type, desc);
    toast(T.careerAdded,'success');
    await openWorkerProfile(username);
  }catch(e){ toast('Error: '+e.message,'error'); }
};
window.delCareerEvent = async (username,id)=>{
  if(!confirm(T.careerDelConfirm)) return;
  try{ await dbDelCareer(id); await openWorkerProfile(username); }
  catch(e){ toast('Error: '+e.message,'error'); }
};
window.uploadWorkerDoc = (username, docType, input)=>{
  const file = input.files && input.files[0]; if(!file) return;
  if(file.size > 5*1024*1024){ toast(T.docTooBig,'error'); input.value=''; return; }
  const reader=new FileReader();
  reader.onload=async ()=>{
    try{
      const id='doc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      await dbSetDocument(id, username, docType, reader.result, Date.now());
      toast(T.docUploaded,'success');
      await openWorkerProfile(username);
    }catch(e){ toast('Error: '+e.message,'error'); }
  };
  reader.onerror=()=>toast('Error reading file','error');
  reader.readAsDataURL(file);
};
window.deleteWorkerDoc = async (username, docType)=>{
  if(!confirm(T.careerDelConfirm)) return;
  try{ await dbDelDocument(username, docType); toast(T.docDeleted,'warning'); await openWorkerProfile(username); }
  catch(e){ toast('Error: '+e.message,'error'); }
};
window.profileAssignSite = async (norm, locId, username, sel)=>{
  if(!locId) return;
  try{ await dbSetAssignment(norm, locId); toast(T.workerAssigned,'success'); await openWorkerProfile(username); }
  catch(e){ toast('Error: '+e.message,'error'); if(sel) sel.value=''; }
};
window.profileRemoveSite = async (norm, locId, username)=>{
  try{ await dbDelAssignment(norm, locId); toast(T.workerRemoved,'warning'); await openWorkerProfile(username); }
  catch(e){ toast('Error: '+e.message,'error'); }
};

window.openSiteDetail = async (locId)=>{
  const panel=$('mpanel'); if(!panel) return;
  toggleSidebar(false);
  panel.innerHTML=_sklPanel();
  const titleEl=$('mgrPageTitle'); if(titleEl) titleEl.innerHTML=`${T.siteDetail}<small>${T.locations}</small>`;
  try{ panel.innerHTML = await buildSiteDetail(locId); if(window.profileTab) profileTab('sdov'); }
  catch(e){ panel.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; }
};

async function buildSiteDetail(locId){
  const [locs, assignments, allUsers, phones, allShifts] = await Promise.all([
    dbListLocationsCached(), dbListAssignmentsCached(), dbListUsersCached(), dbListPhonesCached(), dbListShiftsByLocation(locId)
  ]);
  const loc = locs.find(l=>l.id===locId);
  if(!loc){ return `<div class="empty">${T.noLocationsYet}</div>`; }
  const isOpen = loc.is_open !== false && loc.is_open !== 'false';

  // Worker directory bridging norm <-> username
  const workers = allUsers.filter(u=>u.role==='worker');
  const phoneMap={}; phones.forEach(p=>phoneMap[p.norm]=p);
  const byNorm={};
  workers.forEach(u=>{ byNorm[_workerNorm(u)] = u; });

  // Hours computations
  const completedHere = allShifts.filter(s=>s.location_id===locId && s.status==='completed');
  const totalByWorker={}, monthByWorker={};
  const monthKey=todayStr().slice(0,7);
  completedHere.forEach(s=>{
    totalByWorker[s.worker]=(totalByWorker[s.worker]||0)+(parseFloat(s.work_hours)||0);
    if((s.date||'').slice(0,7)===monthKey) monthByWorker[s.worker]=(monthByWorker[s.worker]||0)+(parseFloat(s.work_hours)||0);
  });

  // Top worker (most total hours)
  let topUser=null, topHours=0;
  Object.entries(totalByWorker).forEach(([u,h])=>{ if(h>topHours){ topHours=h; topUser=u; } });
  const _siteSpent = completedHere.reduce((a,s)=>a+(parseFloat(s.earnings)||0),0);
  const topName = topUser ? disp((allUsers.find(x=>x.username===topUser)?.label)||topUser) : null;
  const topWorkerHtml = topUser
    ? `<div style="display:flex;align-items:center;gap:12px"><div style="width:42px;height:42px;border-radius:50%;background:rgba(232,128,28,.12);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px">${esc(String(topName||'?').slice(0,1).toUpperCase())}</div><div><div style="font-family:var(--font);font-size:16px;font-weight:800;color:var(--text)">${topName}</div><div style="font-family:var(--font);font-size:12px;color:#f59a44;font-weight:700">${topHours.toFixed(2)} h ${lang==='ar'?'إجمالي':lang==='it'?'totali':'total'}</div></div></div>`
    : `<div class="empty" style="padding:14px">${T.noTopWorker}</div>`;

  // Assigned workers for this site
  const assignedNorms = assignments.filter(a=>a.loc_id===locId).map(a=>a.worker_username);
  const assignedList = assignedNorms.map(n=>{
    const u=byNorm[n];
    const username=u?u.username:null;
    const name=u?disp(u.label||u.username):disp(phoneMap[n]?.label||phoneMap[n]?.phone||n);
    const phone=u?(u.phone||''):(phoneMap[n]?.phone||'');
    const mh=username?(monthByWorker[username]||0):0;
    return {norm:n, username, name, phone, monthHours:mh};
  }).sort((a,b)=>a.name.localeCompare(b.name));

  const assignedRows = assignedList.length
    ? assignedList.map(w=>`<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border2);flex-wrap:wrap">
        <div style="flex:1;min-width:160px">
          <div style="font-family:var(--font);font-size:14px;font-weight:800;color:var(--text);${w.username?'cursor:pointer':''}" ${w.username?`onclick="openWorkerProfile('${esc(w.username)}')" title="${T.viewProfile}"`:''}>${w.name}</div>
          <div style="font-family:var(--font);font-size:11px;color:var(--muted);margin-top:2px">${esc(w.phone||'—')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;min-width:110px">

// ── Site detail action handlers ──
window.siteToggleOpen = async (locId, isOpen)=>{
  try{ await dbSetLocationOpen(locId, isOpen); toast(isOpen?T.siteNowOpen:T.siteNowClosed, isOpen?'success':'warning'); await openSiteDetail(locId); }
  catch(e){ toast('Error: '+e.message,'error'); }
};
window.siteSaveLeader = async (locId, username)=>{
  try{ await dbSetLocationLeader(locId, username||null); toast(T.leaderSaved,'success'); await openSiteDetail(locId); }
  catch(e){ toast('Error: '+e.message,'error'); }
};
window.siteAddWorker = async (norm, locId, sel)=>{
  if(!norm) return;
  try{ await dbSetAssignment(norm, locId); toast(T.workerAssigned,'success'); await openSiteDetail(locId); }
  catch(e){ toast('Error: '+e.message,'error'); if(sel) sel.value=''; }
};
window.siteRemoveWorker = async (norm, locId)=>{
  try{ await dbDelAssignment(norm, locId); toast(T.workerRemoved,'warning'); await openSiteDetail(locId); }
  catch(e){ toast('Error: '+e.message,'error'); }
};
window.siteSaveStartTime = async (locId)=>{
  const st=(val('sd-st')||'').trim()||null;
  try{ await sql('UPDATE wf_locations SET start_time=$2 WHERE id=$1',[locId, st]); toast(st?T.autoStartSet(st):T.autoStartCleared,'success'); await openSiteDetail(locId); }
  catch(e){ toast('Error: '+e.message,'error'); }
};
window.siteSaveEndTime = async (locId)=>{
  const et=(val('sd-et')||'').trim()||null;
  if(et&&!/^([0-9]{2}):(00|30)$/.test(et)){ toast('Invalid end time','error'); return; }
  try{ await sql('UPDATE wf_locations SET end_time=$2 WHERE id=$1',[locId, et]); toast(et?T.autoEndSetTo(et):T.autoEndCleared,'success'); await openSiteDetail(locId); }
  catch(e){ toast('Error: '+e.message,'error'); }
};
window.siteSaveBreak = async (locId)=>{
  const brk=parseInt(val('sd-brk'))||0;
  try{ await sql('UPDATE wf_locations SET break_minutes=$2 WHERE id=$1',[locId, brk]); toast((brk>0?(T.breakLbl||'Break')+': '+brk+' min':(T.breakNone||'No break')),'success'); await openSiteDetail(locId); }
  catch(e){ toast('Error: '+e.message,'error'); }
};
window.siteToggleFinished = async (locId, finished)=>{
  try{
    await dbSetLocationFinished(locId, finished);
    toast(finished?PL().siteFinished:PL().siteReactivated, finished?'warning':'success');
    if(S.mgrTab==='locations' && !document.getElementById('sd-tabbar')) mTab('locations');
    else await openSiteDetail(locId);
  }catch(e){ toast('Error: '+e.message,'error'); }
};

window.openWFModal = (heading, bodyHtml)=>{
  const h=$('wf-modal-heading'); if(h) h.textContent=heading;
  const b=$('wf-modal-body'); if(b) b.innerHTML=bodyHtml;
  const m=$('wfModal'); if(m) m.classList.add('show');
};
window.closeWFModal = ()=>{ const m=$('wfModal'); if(m) m.classList.remove('show'); };

// Days until an ISO (YYYY-MM-DD) date; null if empty/invalid. Negative = past.
function _daysUntil(iso){
  if(!iso) return null;
  const d=new Date(iso+'T00:00:00'); if(isNaN(d.getTime())) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.round((d.getTime()-today.getTime())/86400000);
}

function _initials(str){
  const s=(str||'').trim();
  if(!s) return '—';
  const parts=s.split(/\s+/).filter(Boolean);
  if(parts.length>=2) return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
  return s.slice(0,2).toUpperCase();
}

// Shared notification collector — used by the tab AND the sidebar badge.
function _notifyItems(users, vehicles, windowDays, properties){
  const P=PL(); const items=[];
  const push=(kind,refId,name,field,fieldKey,iso)=>{
    const d=_daysUntil(iso); if(d===null) return;
    if(d<=windowDays) items.push({kind,refId,subjName:name,fieldLabel:field,iso,dleft:d,key:kind+':'+refId+':'+fieldKey});
  };
  users.filter(u=>u.role==='worker').forEach(u=>{
    const nm=disp(u.label||u.username);
    push('worker', u.username, nm, P.docExpiry, 'doc', u.doc_expiry);
    push('worker', u.username, nm, P.permitExpiry, 'permit', u.permit_expiry);
    push('worker', u.username, nm, P.idoneitaExpiry, 'idoneita', u.idoneita_expiry);
    push('worker', u.username, nm, P.patenteExpiry, 'patente', u.patente_expiry);
    push('worker', u.username, nm, P.contractExpiry, 'contract', u.contract_expiry);
  });
  vehicles.forEach(v=>{
    const nm=esc(v.plate||v.model||'—');
    push('vehicle', v.id, nm, P.inspection, 'inspection', v.inspection_date);
    push('vehicle', v.id, nm, P.insuranceExpiry, 'insurance', v.insurance_expiry);
    push('vehicle', v.id, nm, P.roadTaxExpiry, 'roadtax', v.road_tax_expiry);
  });
  (properties||[]).forEach(p=>{
    const nm=disp(p.name||'—');
    push('property', p.id, nm, P.contractEnd, 'propcontract', p.contract_end);
    const due=_nextRentDue(p.rent_day);
    if(due) push('property', p.id, nm, P.rentDueLabel, 'rent:'+due, due);
  });
  items.forEach(i=>{ i.dismissed = _isDismissed(i.key); i.bellHidden = _bellHidden(i.key) || i.dismissed; });
  return items;
}

async function _renderBellPanel(){
  const p=document.getElementById('bellPanel'); if(!p || p.style.display==='none') return;
  const P=PL();
  try{
    const [users, vehicles, props]=await Promise.all([dbListUsersCached(), dbListVehiclesCached(), dbListPropertiesCached()]);
    const items=_notifyItems(users, vehicles, NOTIFY_WINDOW, props).filter(i=>!i.bellHidden).sort((a,b)=>a.dleft-b.dleft);
    const head=`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--bg1)">
      <span style="font-family:var(--font);font-size:13px;font-weight:800;color:var(--text)">${P.bellTitle}${items.length?` <span style="color:var(--red)">(${items.length})</span>`:''}</span>
      <span onclick="_closeBell();mTab('notifications')" style="font-family:var(--font);font-size:11px;font-weight:700;color:var(--brand-ink);cursor:pointer">${P.viewAll}</span>
    </div>`;
    if(!items.length){ p.innerHTML=head+`<div class="empty" style="padding:22px">${P.bellEmpty}</div>`; return; }
    p.innerHTML = head + items.map(it=>{
      const od=it.dleft<0, color=od?'var(--red)':'var(--orange)';
      const when=od?P.expired:(it.dleft===0?P.expiresToday:P.expiresIn(it.dleft));
      return `<div onclick="openNotifSource('${esc(it.kind)}','${esc(it.refId)}')" style="display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border2);align-items:center;cursor:pointer">
        ${_avatarHtml(it.subjName, 34)}
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--font);font-size:13px;font-weight:800;color:var(--text)">${it.subjName}</div>
          <div style="font-family:var(--font);font-size:11.5px;color:var(--muted);margin-top:2px">${it.fieldLabel} · <strong style="color:${color}">${when}</strong></div>
        </div>
        <button class="btn-sm" style="flex-shrink:0;padding:4px 10px;font-size:11px;background:var(--bg2);border:1px solid var(--border2);color:var(--muted)" onclick="dismissBell('${esc(it.key)}',event)">${P.ignore}</button>
      </div>`;
    }).join('');
  }catch(e){ p.innerHTML=`<div class="empty" style="padding:20px">Error</div>`; }
}
async function updateNotifyBadge(){

}

window.saveWorkerForm = async (username)=>{

  const d=_collectWorkerForm();
  const fields={
    label:d.label, phone:d.phone, hourly_rate:d.hourly_rate,
    dob:d.dob, email:d.email, tax_code:d.tax_code, residence_permit:d.residence_permit,
    doc_expiry:d.doc_expiry, permit_expiry:d.permit_expiry, iban:d.iban, address:d.address, start_date:d.start_date,
    job_title:d.job_title, contract_type:d.contract_type, contract_date:d.contract_date,
    contract_expiry:d.contract_expiry,
    idoneita_expiry:d.idoneita_expiry, patente_expiry:d.patente_expiry
  };
  try{
    if(!username){
      // CREATE
      if(!d.label || !d.phone){ toast(P.required,'error'); return; }
      const norm=normPhone(d.phone);
      if(!norm){ toast(P.invalidPhone,'error'); return; }
      const existing=await dbGetPhone(norm);
      if(existing){ toast(P.workerExists,'error'); return; }
      await dbSetPhone(norm,{phone:d.phone,label:d.label,rate:d.hourly_rate,used:false,added_at:Date.now()});
      const base=(d.label||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')||('w'+norm.slice(-6));
      const users=await dbListUsers();
      const newUser=users.find(x=>x.username===base)?base+'_'+norm.slice(-4):base;
      await dbSetUser(newUser,{ password:norm, role:'worker', worker_status:'confirmed', ...fields });
      toast(P.workerAdded,'success');
      _clearUsersCache(); _liveCache=null;
      await openWorkerProfile(newUser); updateNotifyBadge(); // switch to edit mode for the new worker
    }else{

window.onSlotPicked = async (username, slotKey, input, category, label)=>{
  const P=PL();
  const cat = category || 'document';
  try{
    const file = input && input.files && input.files[0];
    if(!file){ return; }
    console.log('[upload] file picked:', file.name, file.type||'(no mime)', file.size+' bytes', 'slot='+slotKey, 'cat='+cat);
    const type=(file.type||'').toLowerCase();
    const name=(file.name||'').toLowerCase();
    const isHeic = type.indexOf('heic')>=0 || type.indexOf('heif')>=0 || /\.(heic|heif)$/.test(name);
    const isPdf  = type==='application/pdf' || /\.pdf$/.test(name);
    const isImage= (type.startsWith('image/') || /\.(jpe?g|png|webp)$/.test(name)) && !isHeic;
    if(isHeic){ toast(P.heicUnsupported,'error'); input.value=''; return; }
    if(isPdf || !isImage){ toast(P.imagesOnly,'error'); input.value=''; return; }
    if(file.size > 8*1024*1024){ toast(P.tooBigPre,'error'); input.value=''; return; }

    if(isImage) toast(P.compressing,'info');
    console.log('[upload] preparing payload… isImage=', isImage, 'isPdf=', isPdf);
    // Build the stored payload. If image compression fails for any reason
    // (odd format, canvas limits on mobile), fall back to storing the file
    // as-is rather than failing silently.
    let dataUrl = null;
    if(isImage){
      try{ dataUrl = await _compressImage(file, 1600, 0.72); }
      catch(err){
        console.error('compress failed, storing original', err);
        try{ dataUrl = await _fileToDataURL(file); }
        catch(err2){ console.error(err2); toast(P.imgUnreadable,'error'); input.value=''; return; }
      }
    }else{
      try{ dataUrl = await _fileToDataURL(file); }
      catch(err){ console.error(err); toast(P.imgUnreadable,'error'); input.value=''; return; }
    }
    if(!dataUrl){ toast(P.imgUnreadable,'error'); input.value=''; return; }

    console.log('[upload] payload ready:', dataUrl.length, 'chars');
    // Only DB-backed files count against the Postgres budget.
    if(STORAGE_PROVIDER === 'db'){
      const used = await dbDocsStorageBytes();
      if(used + dataUrl.length > DOC_STORAGE_SOFT){ toast(P.storageFull,'error'); input.value=''; return; }
    }
    const stored = await storagePut(dataUrl, { name: file.name, owner: username });

    const slot = DOC_SLOTS.find(s=>s.k===slotKey);
    const title = label || (slot ? _slotLabel(slot) : slotKey);
    const newId = 'doc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    // Insert FIRST, then remove the previous file(s) — never lose the old one.
    await sql('INSERT INTO wf_documents(id,worker_username,doc_type,file_url,uploaded_at,title,category) VALUES($1,$2,$3,$4,$5,$6,$7)',
      [newId, username, slotKey, stored, Date.now(), title, cat]);
    if(cat==='payslip'){
      await sql("DELETE FROM wf_documents WHERE worker_username=$1 AND category='payslip' AND id<>$2", [username, newId]);
    }else{
      await sql('DELETE FROM wf_documents WHERE worker_username=$1 AND doc_type=$2 AND id<>$3', [username, slotKey, newId]);
    }
    console.log('[upload] saved OK:', newId);
    toast(P.docAdded,'success');
    if(cat==='property'){
      // owner key is 'prop_<id>' — go back to that property's page
      await openPropertyProfile(String(username).replace(/^prop_/,''), false);
      return;
    }
    await openWorkerProfile(username);
    profileTab(cat==='payslip'?'payslips':'docs');
  }catch(e){
    console.error('upload failed', e);
    toast('Error: '+(e && e.message ? e.message : e),'error');
  }finally{ if(input) input.value=''; }
};

window.onDocPicked = async (username, category, titleId, input)=>{  const P=PL();

// Opens a document by fetching its blob ONLY on click (keeps list loads light).
// Convert a data: URL to a Blob WITHOUT fetch().
// fetch() on a data: URL is blocked when the page is opened from file://,
// so we decode the base64 ourselves — this works on every origin.
function _dataUrlToBlob(dataUrl){
  const comma = dataUrl.indexOf(',');
  const header = dataUrl.slice(0, comma);
  const body = dataUrl.slice(comma+1);
  const mime = (header.match(/data:([^;]+)/) || [,'application/octet-stream'])[1];
  const isB64 = header.indexOf('base64') >= 0;
  const raw = isB64 ? atob(body) : decodeURIComponent(body);
  const bytes = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bytes[i] = raw.charCodeAt(i);
  return new Blob([bytes], {type:mime});
}

window.openDocFile = async (id, btn)=>{
  const orig = btn ? btn.textContent : '';
  try{
    if(btn){ btn.disabled=true; btn.style.opacity='.6'; btn.textContent='…'; }
    const d = await dbGetDocFile(id);
    if(!d || !d.file_url){ toast(lang==='ar'?'الملف غير موجود':'File non trovato','error'); return; }
    let url=null, revoke=false;
    try{ const r = await storageUrl(d.file_url); url=r.url; revoke=r.revoke; }
    catch(err){ console.error('could not resolve file', err); }
    if(!url){ toast(lang==='ar'?'تعذّر فتح الملف':'Impossibile aprire il file','error'); return; }
    // Past an await the user-gesture is gone (popup blockers), and file:// pages
    // refuse data: navigation — so always offer a download fallback.
    const isPdf = d.file_url.indexOf('application/pdf') >= 0;
    const w = window.open(url, '_blank', 'noopener');
    if(!w || w.closed || typeof w.closed==='undefined'){
      const a=document.createElement('a');
      a.href=url;
      a.download=((d.title||'documento').replace(/[^\w\s.-]/g,'_').trim()||'documento') + (isPdf?'.pdf':'.jpg');
      document.body.appendChild(a); a.click(); a.remove();
    }
    if(revoke) setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ console.error(e); toast('Error: '+e.message,'error'); }
  finally{ if(btn){ btn.disabled=false; btn.style.opacity=''; btn.textContent=orig; } }
};

function _propKindLabel(k,other){ const P=PL(); if(k==='warehouse') return P.warehouse; if(k==='other') return (other&&other.trim())?other:P.other; return P.apartment; }

async function buildProperties(){
  const P=PL();
  const [props, users]=await Promise.all([dbListPropertiesCached(), dbListUsersCached()]);
  const uByName={}; users.forEach(u=>uByName[u.username]=u);
  const soonest=(p)=>{
    let best=null;
    [p.contract_end, _nextRentDue(p.rent_day)].forEach(iso=>{ const d=_daysUntil(iso); if(d!==null && (best===null || d<best)) best=d; });
    return best;
  };
  const cards = !props.length
    ? `<div class="empty">${P.noProperties}</div>`
    : props.map(p=>{
      const resp = p.responsible_username && uByName[p.responsible_username]
        ? disp(uByName[p.responsible_username].label||uByName[p.responsible_username].username) : P.none;
      const dleft = soonest(p);
      const warn = (dleft!==null && dleft<=NOTIFY_WINDOW)
        ? `<span class="badge" style="background:${dleft<0?'var(--red-soft)':'var(--orange-soft)'};color:${dleft<0?'var(--red)':'var(--orange)'};border:1px solid ${dleft<0?'rgba(231,76,60,.35)':'rgba(212,134,10,.35)'};font-size:10px">${dleft<0?P.expired:(dleft===0?P.expiresToday:P.expiresIn(dleft))}</span>` : '';
      const kindColor = p.kind==='warehouse' ? '#6f6257' : (p.kind==='other' ? '#6b7280' : '#cc6e12');
      return `<div class="panel-card" style="border-left:4px solid var(--copper);cursor:pointer;display:flex;align-items:center;gap:14px;flex-wrap:wrap" onclick="openPropertyProfile('${esc(p.id)}')" title="${P.editDetails}">
        ${_avatarHtml(p.name, 48)}
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--font);font-size:17px;font-weight:900;color:var(--text)">${disp(p.name||'—')}</div>
          <div style="font-family:var(--font);font-size:12px;color:var(--muted);margin-top:2px">${esc(p.address||'—')}</div>
          <div style="font-family:var(--font);font-size:12px;color:var(--text);margin-top:4px">${P.responsible}: <strong>${resp}</strong></div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
          ${warn}
          <span class="badge" style="background:${kindColor}22;color:${kindColor};border:1px solid ${kindColor}55">${esc(_propKindLabel(p.kind, p.kind_other))}</span>
        </div>
      </div>`;
    }).join('');
  return `
  <div class="panel-card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div class="pc-title" style="margin:0">${P.properties} <span style="color:var(--muted);font-weight:400">(${props.length})</span></div>
    <button class="btn btn-gold" style="width:auto;padding:9px 16px" onclick="openPropertyProfile('')">+ ${P.addProperty}</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">${cards}</div>`;
}

async function buildPropertyProfile(id, edit){

    dbListPropertiesCached(),

  const editing = isCreate || !!edit;
  const workers = users.filter(u=>u.role==='worker').sort(byName);
  const uByName={}; users.forEach(u=>uByName[u.username]=u);
  const respName = p.responsible_username && uByName[p.responsible_username]
    ? disp(uByName[p.responsible_username].label||uByName[p.responsible_username].username) : '';

      <span class="badge" style="background:${kindColor}22;color:${kindColor};border:1px solid ${kindColor}55">${esc(_propKindLabel(p.kind, p.kind_other))}</span>

async function buildNotifications(){
  const P=PL();
  const [users, vehicles, props]=await Promise.all([dbListUsersCached(), dbListVehiclesCached(), dbListPropertiesCached()]);
  const all=_notifyItems(users, vehicles, NOTIFY_WINDOW, props);
  const active=all.filter(i=>!i.dismissed);
  const overdue=active.filter(i=>i.dleft<0).sort((a,b)=>a.dleft-b.dleft);
  const upcoming=active.filter(i=>i.dleft>=0).sort((a,b)=>a.dleft-b.dleft);
  const ignoredList=all.filter(i=>i.dismissed).sort((a,b)=>a.dleft-b.dleft);

  const rowHtml=(it)=>{
    const od=it.dleft<0;
    const color=it.dismissed?'var(--muted)':(od?'var(--red)':'var(--orange)');
    const bg=it.dismissed?'transparent':(od?'var(--red-soft)':'var(--orange-soft)');
    const when=od?P.expired:(it.dleft===0?P.expiresToday:P.expiresIn(it.dleft));
    const kindBadge=it.kind==='worker'?P.worker:(it.kind==='property'?P.property:P.vehicle);
    const btns = it.dismissed
      ? `<button class="btn-sm" style="background:var(--bg2);border:1px solid var(--border2);color:var(--text)" onclick="restoreNotif('${esc(it.key)}',event)">${P.restore}</button>`
      : `<button class="btn-sm" style="background:var(--bg2);border:1px solid var(--border2);color:var(--muted)" onclick="dismissNotif('${esc(it.key)}',event)">${P.ignore}</button>`;
    return `<div onclick="openNotifSource('${esc(it.kind)}','${esc(it.refId)}')" style="cursor:pointer" class="panel-card-wrap"><div class="panel-card" style="border-left:4px solid ${color};background:${bg};display:flex;align-items:center;gap:12px;flex-wrap:wrap;${it.dismissed?'opacity:.65;':''}">
      ${_avatarHtml(it.subjName, 42)}
      <div style="flex:1;min-width:0">
        <div style="font-family:var(--font);font-size:15px;font-weight:800;color:var(--text)">${it.subjName}
          <span class="badge" style="background:var(--bg2);border:1px solid var(--border2);color:var(--muted);font-size:10px;margin-${lang==='ar'?'right':'left'}:6px">${kindBadge}</span>
          ${it.dismissed?`<span class="badge" style="background:var(--bg2);border:1px solid var(--border2);color:var(--muted);font-size:10px;margin-${lang==='ar'?'right':'left'}:4px">${P.ignored}</span>`:''}
        </div>
        <div style="font-family:var(--font);font-size:12px;color:var(--muted);margin-top:3px">${it.fieldLabel}: <strong style="color:${color}">${esc(it.iso)}</strong> · ${when}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0">${btns}</div>
    </div></div>`;
  };
  const section=(title,arr,accent)=>!arr.length?'':`
    <div style="display:flex;align-items:center;gap:10px;margin:18px 0 10px">
      <span style="width:8px;height:8px;border-radius:50%;background:${accent}"></span>
      <span style="font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:${accent}">${title}</span>
      <span style="font-family:var(--font);font-size:12px;color:var(--muted)">(${arr.length})</span>
      <div style="flex:1;height:1px;background:var(--border2)"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">${arr.map(rowHtml).join('')}</div>`;

  const winInput=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <label class="lbl" style="margin:0">${P.notifWindow}</label>
    <input type="number" min="1" max="365" value="${NOTIFY_WINDOW}" style="width:90px;padding:7px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-family:var(--font);font-weight:700" onchange="setNotifyWindow(this.value)"/>
  </div>`;

  return `
  <div class="panel-card" style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">
    <div>
      <div class="pc-title" style="margin:0">${P.notifTitle} ${active.length?`<span style="color:var(--red);font-weight:700">(${active.length})</span>`:''}</div>
      <div style="font-family:var(--font);font-size:12px;color:var(--muted);margin-top:6px">${P.within(NOTIFY_WINDOW)}</div>
    </div>
    ${winInput}
  </div>
  ${(active.length||ignoredList.length)
    ? section(P.notifOverdue, overdue, 'var(--red)')
      + section(P.notifUpcoming+' · '+P.within(NOTIFY_WINDOW), upcoming, 'var(--orange)')
      + section(P.ignored, ignoredList, 'var(--muted)')
    : `<div class="empty" style="margin-top:14px">${P.notifNone}</div>`}`;
}

async function buildSalary(per='month'){
  const workers=(await dbListUsersCached()).filter(u=>u.role==='worker').sort(byName);
  const now2=new Date();
  // OPT-4: scope DB query to the narrowest range possible — only 'all' does full table scan
  let allS;
  if(per==='today'){
    allS = await dbListShiftsToday();
  } else if(per==='week' || per==='month'){
    // both week and month fit within the current month — fetch month, filter in JS
    allS = await dbListShiftsMonth(now2.getFullYear(), now2.getMonth()+1);
  } else {
    // 'all' — full scan, user explicitly asked for all-time data
    allS = await dbListShifts();
  }
  const locNames=[...new Set(allS.map(s=>s.location_name).filter(Boolean))].sort();
  return`<div style="margin-bottom:14px">
    <select class="btn-dark" style="padding:8px 12px;border-radius:3px;font-family:var(--font);font-size:11px;width:auto" id="sp" onchange="reSalary()">
      <option value="today" ${per==='today'?'selected':''}>${T.today}</option>
      <option value="week"  ${per==='week'?'selected':''}>${T.week}</option>
      <option value="month" ${per==='month'?'selected':''}>${T.month}</option>
      <option value="all"   ${per==='all'?'selected':''}>${T.all}</option>
    </select>
  </div>
  <div class="table-wrap"><table><thead><tr>
    <th>${T.workerCol}</th><th>${T.phoneCol}</th><th>${T.rateCol}</th>
    ${locNames.map(l=>`<th style="color:#f59a44"> ${disp(l)}</th>`).join('')}
    <th>${T.totalHrsCol}</th><th style="color:var(--brand-ink)">${T.totalSalaryCol}</th><th>${T.shiftsCol}</th>
  </tr></thead><tbody>
    ${!workers.length?`<tr><td colspan="${4+locNames.length}"><div class="empty">${T.noW}</div></td></tr>`:workers.map(w=>{
      const ws=allS.filter(s=>s.worker===w.username&&s.status==='completed'&&inP(s,per));
      const th=ws.reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);
      const workerRate=parseFloat(w.hourly_rate)||0;
      const total=th*workerRate;
      const locCells=locNames.map(ln=>{
        const lh=ws.filter(s=>s.location_name===ln).reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);
        return lh>0?`<td style="font-family:var(--font);color:#f59a44">${lh.toFixed(2)}h</td>`:`<td style="color:var(--muted)">—</td>`;
      }).join('');
      return`<tr data-search="${disp(w.label||w.username)} ${esc(w.phone||'')}">
        <td><strong>${disp(w.label||w.username)}</strong></td>
        <td style="color:var(--muted)">${esc(w.phone||'—')}</td>
        <td style="color:var(--brand-ink);font-weight:700">€${workerRate}/hr</td>
        ${locCells}
        <td style="font-weight:700">${th.toFixed(2)}h</td>
        <td style="color:var(--brand-ink);font-weight:700;font-size:14px">€${total.toFixed(2)}</td>
        <td>${ws.length}</td>
      </tr>`;
    }).join('')}
  </tbody></table></div>`;
}
window.reSalary=async()=>{const p=val('sp')||'month';const panel=$('mpanel');if(panel)panel.innerHTML=await buildSalary(p);};

async function buildSettings(){

async function ensureWorkerAccount(ph, norm, lb, rt) {
  const users = await dbListUsers();
  const existing = users.find(x => x.role === 'worker' && normPhone(x.phone || '') === norm);
  if (existing) return existing;
  const uname = (lb || '').toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '') || 'w' + norm.slice(-6);
  const finalName = users.find(x => x.username === uname) ? uname + '_' + norm.slice(-4) : uname;
  await dbSetUser(finalName, {
    password: norm, role: 'worker', phone: ph,
    hourly_rate: rt || 15,
    device_id: null,
    can_restart: false
  });
  return await dbGetUser(finalName);
}

window.handleDrop=e=>{
  e.preventDefault();
  const f=e.dataTransfer?.files[0]||e.target.files[0];
  if(!f)return;
  if(e.target.value!==undefined)e.target.value='';
  const isXlsx=f.name.match(/\.xlsx?$/i);
  if(isXlsx){
    if(typeof XLSX==='undefined'){
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=()=>readXlsx(f);
      s.onerror=()=>toast(' Failed to load Excel reader','error');
      document.head.appendChild(s);
    } else { readXlsx(f); }
  } else {
    const r=new FileReader();r.onload=ev=>procFile(ev.target.result);r.readAsText(f);
  }
};

function readXlsx(f){
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const lines=rows.map(row=>row.map(c=>String(c).trim()).join(','));
      procFile(lines.join('\n'));
    }catch(err){toast(' Could not read Excel file: '+err.message,'error');}
  };
  r.readAsArrayBuffer(f);
}

async function procFile(text){
  const defR=parseFloat(val('nr'))||15;
  const lines=text.split(/[\r\n]+/).map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0;
  for(const line of lines){
    if(/^(phone|number|name|label|rate|#)/i.test(line)){skipped++;continue;}
    const parts=line.split(/[\t,;|]+/).map(p=>p.trim()).filter(Boolean);
    if(!parts.length){skipped++;continue;}
    let phone='',label='',rate=defR;
    const isPhone=v=>/^\d{6,15}$/.test(v.replace(/[\s\-\+\(\)\.]/g,''));
    const isNum=v=>/^\d+(\.\d+)?$/.test(v);
    const col0=parts[0]||'',col1=parts[1]||'',col2=parts[2]||'';
    if(isPhone(col0)){
      phone=col0;
      if(col1&&!isNum(col1)){label=col1;if(col2&&isNum(col2))rate=parseFloat(col2);}
      else if(col1&&isNum(col1)){rate=parseFloat(col1);}
    } else {
      parts.forEach(p=>{const d=p.replace(/[\s\-\+\(\)\.]/g,'');if(/^\d{6,15}$/.test(d)&&!phone)phone=p;else if(isNum(p)&&phone)rate=parseFloat(p);else if(p&&!label&&!isNum(p))label=p;});
    }
    if(!phone){skipped++;continue;}
    const norm=normPhone(phone);if(!norm){skipped++;continue;}
    const ex=await dbGetPhone(norm);if(ex){skipped++;continue;}
    await dbSetPhone(norm,{phone:phone.trim(),label:label.trim(),rate,used:false,added_at:Date.now()});
    await ensureWorkerAccount(phone.trim(),norm,label.trim(),rate);
    added++;
  }
  toast(T.fileAdded(added,skipped),'success');mTab('addworker');loadSummary();
}

// Excel helpers — clean, professional spreadsheet structure:
// auto-fit column widths, header autofilter, consistent number formats.
const FMT_EUR = '"€"#,##0.00';
const FMT_HRS = '0.00';
function _xlsxAutoCols(aoa){
  const colCount = aoa.reduce((m,r)=>Math.max(m, r.length), 0);
  const cols = [];
  for(let c=0;c<colCount;c++){
    let w = 8;
    for(let r=0;r<aoa.length;r++){
      const v = aoa[r][c];
      const len = (v==null ? 0 : String(v).length);
      if(len > w) w = len;
    }
    cols.push({ wch: Math.min(Math.max(w + 2, 10), 44) }); // padded, clamped 10–44
  }
  return cols;
}
function _xlsxBuildSheet(XLSX, aoa, numberFormats){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = _xlsxAutoCols(aoa);
  if(ws['!ref']){
    const range = XLSX.utils.decode_range(ws['!ref']);
    // Filter dropdowns on the header row
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:range.s.c}, e:{r:0,c:range.e.c} }) };
    // Freeze the header row (ignored gracefully by writers that don't support it)
    ws['!freeze'] = { xSplit:0, ySplit:1, topLeftCell:'A2', activePane:'bottomLeft', state:'frozen' };
    // Consistent per-column number formats (currency / hours)
    if(numberFormats){
      for(let r=1;r<=range.e.r;r++){
        for(const c in numberFormats){
          const addr = XLSX.utils.encode_cell({ r, c: Number(c) });
          const cell = ws[addr];
          if(cell && typeof cell.v === 'number'){ cell.t = 'n'; cell.z = numberFormats[c]; }
        }
      }
    }
  }
  return ws;
}

window.closeMonth=async()=>{

  const monthShifts=shifts.filter(s=>{
    if(s.status!=='completed')return false;
    return inCycle(s.date || Number(s.start_time), now);
  });
  const totalHours=monthShifts.reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);
  const totalEarnings=monthShifts.reduce((a,s)=>a+(parseFloat(s.earnings)||0),0);

      <div><div style="font-family:var(--font);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">${T.salDue}</div><div style="font-family:var(--font);font-size:14px;font-weight:700;color:var(--brand-ink)">€${totalEarnings.toFixed(2)}</div></div>
    </div>`;
  }
  if(!monthShifts.length){toast(`No completed shifts found for ${monthName}`,'warning');return;}
  const fmtExcel=ts=>{if(!ts)return'—';const d=new Date(Number(ts));if(isNaN(d.getTime()))return'—';const pad=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
  const periodLabel=monthName;
  // SHEET 1 — Shifts log (chronological)
  const s1=[['Worker','Phone','Hourly Rate (€)','Site / Location','Date','Check-In','Check-Out','Work Hours','Earnings (€)','Status']];
  monthShifts.sort((a,b)=>Number(b.start_time)-Number(a.start_time)).forEach(s=>{

  });
  // SHEET 2 — Salary summary (one row per worker, A→Z)
  const locNames=[...new Set(monthShifts.map(s=>s.location_name).filter(Boolean))].sort((a,b)=>cleanName(a).localeCompare(cleanName(b),undefined,{sensitivity:'base'}));
  const s2=[['Worker','Phone','Hourly Rate (€)',...locNames.map(l=>`Hours @ ${cleanName(l)}`),'Total Hours','Total Salary (€)','Shifts','Period']];
  const workerKeysInMonth=[...new Set(monthShifts.map(s=>s.worker))]
    .sort((a,b)=>cleanName(um[a]?.label||um[a]?.username||a).localeCompare(cleanName(um[b]?.label||um[b]?.username||b),undefined,{sensitivity:'base'}));
  workerKeysInMonth.forEach(wUsername=>{

    const ws1=_xlsxBuildSheet(XLSX,s1,{2:FMT_EUR,7:FMT_HRS,8:FMT_EUR});

    sumFmts[4+locNames.length]=FMT_EUR;          // Total Salary
    const ws2=_xlsxBuildSheet(XLSX,s2,sumFmts);

  };
  script.onerror=()=>{
    const csv=s1.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=filename.replace('.xlsx','.csv');a.click();
    toast('Exported as CSV','warning');
  };
  document.head.appendChild(script);
};

  const makeShiftRow=s=>{
    const u=um[s.worker];
    return[cleanName(u?.label||s.worker),u?.phone||'',parseFloat(u?.hourly_rate||s.hourly_rate||0),cleanName(s.location_name||'—'),s.date,fmtExcel(s.start_time),fmtExcel(s.end_time),parseFloat((parseFloat(s.work_hours)||0).toFixed(2)),parseFloat((parseFloat(s.earnings)||0).toFixed(2)),cleanName(s.status)];
  };
  // Group shifts by pay cycle (20th → 19th), keyed on the cycle's start date
  const byCycle={};
  shifts.forEach(s=>{const key=cycleBounds(shiftDate(s)).startStr;if(!byCycle[key])byCycle[key]=[];byCycle[key].push(s);});
  const cycleKeys=Object.keys(byCycle).sort();
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload=()=>{
    const wb=XLSX.utils.book_new();
    // Per-cycle shift logs
    cycleKeys.forEach(key=>{
      const mShifts=byCycle[key].slice().sort((a,b)=>Number(b.start_time)-Number(a.start_time));
      const data=[SHIFT_HDR,...mShifts.map(makeShiftRow)];
      const ws=_xlsxBuildSheet(XLSX,data,SHIFT_FMT);
      XLSX.utils.book_append_sheet(wb,ws,cycLabelFromKey(key).slice(0,31));
    });
    // Per-cycle salary summaries (one row per worker, A→Z)
    cycleKeys.forEach(key=>{
      const mShifts=byCycle[key].filter(s=>s.status==='completed');
      if(!mShifts.length)return;
      const locNames=[...new Set(mShifts.map(s=>s.location_name).filter(Boolean))].sort((a,b)=>cleanName(a).localeCompare(cleanName(b),undefined,{sensitivity:'base'}));
      const hdr=['Worker','Phone','Hourly Rate (€)',...locNames.map(l=>`Hours @ ${cleanName(l)}`),'Total Hours','Total Salary (€)','Shifts'];
      const rows=[hdr];
      const workerKeysInMonth=[...new Set(mShifts.map(s=>s.worker))]
        .sort((a,b)=>cleanName(um[a]?.label||um[a]?.username||a).localeCompare(cleanName(um[b]?.label||um[b]?.username||b),undefined,{sensitivity:'base'}));
      workerKeysInMonth.forEach(wUsername=>{
        const ws2=mShifts.filter(s=>s.worker===wUsername);if(!ws2.length)return;
        const liveW=um[wUsername];
        const rateFromShift=parseFloat(ws2[0]?.hourly_rate)||0;
        const rate=parseFloat(liveW?.hourly_rate)||rateFromShift;
        const th=ws2.reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);
        const total=th*rate;
        const displayName=cleanName(liveW?.label||liveW?.username||wUsername);
        const phone=liveW?.phone||'';
        const locHrs=locNames.map(ln=>parseFloat(ws2.filter(s=>s.location_name===ln).reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0).toFixed(2)));
        rows.push([displayName,phone,rate,...locHrs,parseFloat(th.toFixed(2)),parseFloat(total.toFixed(2)),ws2.length]);
      });
      const sumFmts={2:FMT_EUR};
      locNames.forEach((_,i)=>{sumFmts[3+i]=FMT_HRS;});
      sumFmts[3+locNames.length]=FMT_HRS; sumFmts[4+locNames.length]=FMT_EUR;
      const ws=_xlsxBuildSheet(XLSX,rows,sumFmts);
      XLSX.utils.book_append_sheet(wb,ws,`Salary ${cycLabelFromKey(key)}`.slice(0,31));
    });
    // All-shifts master log
    const allData=[SHIFT_HDR,...shifts.slice().sort((a,b)=>Number(b.start_time)-Number(a.start_time)).map(makeShiftRow)];
    const wsAll=_xlsxBuildSheet(XLSX,allData,SHIFT_FMT);
    XLSX.utils.book_append_sheet(wb,wsAll,'All Shifts');
    XLSX.writeFile(wb,`workforce-${todayStr()}.xlsx`);
    toast(` Exported ${cycleKeys.length} cycle${cycleKeys.length===1?'':'s'} + All Shifts`,'success');
  };
  script.onerror=()=>{
    const allData=[SHIFT_HDR,...shifts.slice().sort((a,b)=>Number(b.start_time)-Number(a.start_time)).map(makeShiftRow)];
    const csv=allData.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`workforce-${todayStr()}.csv`;a.click();
    toast('Exported as CSV (XLSX unavailable)','warning');
  };
  document.head.appendChild(script);
};

// ════════════════════════════════════════════════════════
// ATTENDANCE EDIT (Admin)
// ════════════════════════════════════════════════════════
let _attendanceEditShiftId = null;
let _attendanceEditHourlyRate = 0;

window.openAttendanceEdit = async (shiftId, workerName) => {
  _attendanceEditShiftId = shiftId;
  const modal = $('attendanceModal');
  const errEl = $('att-err');
  errEl.style.display = 'none';
  const nameEl = $('att-worker-name');
  if(nameEl) nameEl.textContent = `Worker: ${workerName} · Shift ID: ${shiftId}`;
  try {
    const rows = await sql('SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts WHERE id=$1 LIMIT 1', [shiftId]);
    const shift = rows[0];
    if(!shift){ toast('Shift not found','error'); return; }
    _attendanceEditHourlyRate = parseFloat(shift.hourly_rate)||0;
    const toTimeStr = ts => {
      if(!ts) return '';
      const d = new Date(Number(ts));
      if(isNaN(d.getTime())) return '';
      return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    };
    $('att-start').value = toTimeStr(shift.start_time);
    $('att-end').value = shift.end_time ? toTimeStr(shift.end_time) : '';
  } catch(e) {
    toast('Error loading shift: '+e.message, 'error'); return;
  }
  if(modal){ modal.classList.add('show'); modal.style.display=''; }
};

window.closeAttendanceModal = () => {
  const modal = $('attendanceModal');
  if(modal){ modal.classList.remove('show'); }
  _attendanceEditShiftId = null;
};

window.saveAttendanceEdit = async () => {
  const errEl = $('att-err');
  errEl.style.display = 'none';
  const showErr = msg => { errEl.textContent = msg; errEl.style.display = 'block'; };
  if(!_attendanceEditShiftId){ showErr(T.attCheckinRequired); return; }
  const startStr = val('att-start').trim();
  const endStr = val('att-end').trim();
  if(!startStr){ showErr(T.attCheckinRequired); return; }
  try {
    const rows = await sql('SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts WHERE id=$1 LIMIT 1', [_attendanceEditShiftId]);
    const shift = rows[0];
    if(!shift){ showErr(lang==='ar'?'الوردية غير موجودة.':lang==='it'?'Turno non trovato.':'Shift not found.'); return; }
    const origDate = shift.date || todayStr();
    const [sy,sm,sd] = origDate.split('-').map(Number);
    const [sh,smin] = startStr.split(':').map(Number);
    const startDate = new Date(sy,sm-1,sd,sh,smin,0,0);
    const newStartMs = startDate.getTime();
    let newEndMs = null;
    let newWorkHours = null;
    let newEarnings = null;
    let newStatus = shift.status;
    if(endStr){
      const [eh,emin] = endStr.split(':').map(Number);
      const endDate = new Date(sy,sm-1,sd,eh,emin,0,0);
      newEndMs = endDate.getTime();
      if(newEndMs <= newStartMs){ showErr(T.attCheckoutAfter); return; }
      // Same criteria as a normal clock-out (billing-snapped start, half-day break
      // rule) via the shared helper. No auto-end cap here: the manager is typing
      // exact times deliberately, so we honor them as given.
      const billingStart = shift.billing_start_time ? Number(shift.billing_start_time) : newStartMs;
      const r = _finalizeShift(billingStart, newEndMs, null, shift.break_minutes, _attendanceEditHourlyRate, newEndMs);
      newWorkHours = r.netWorkHours;
      newEarnings = r.earnings;
      newStatus = 'completed';
    } else {
      // No end time given: if this was flagged needs_review, keep it flagged
      // (it's still unresolved) rather than silently marking it "working" again.
      newStatus = shift.status === 'needs_review' ? 'needs_review' : 'working';
    }
    await sql(
      `UPDATE wf_shifts SET start_time=$2, end_time=$3, work_hours=$4, earnings=$5, status=$6 WHERE id=$1`,
      [_attendanceEditShiftId, newStartMs, newEndMs, newWorkHours, newEarnings, newStatus]
    );
    _liveCache = null;
    toast(T.attUpdateSuccess, 'success');
    closeAttendanceModal();
    await mTab('live');
    loadSummary();
  } catch(e) {
    showErr((T.failedToSave||((x)=>'Error: '+x))(e.message));
  }
};
