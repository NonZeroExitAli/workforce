// ── Searchable dropdowns ─────────────────────────────────────────
// Any <select data-ss> becomes a button that opens a search box over its
// options. The real select stays in the page (hidden), so its value, its
// onchange handler and everything reading it keep working untouched.
const _ssNorm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

let _ssOpen = null;

function _ssClose() {
  if (!_ssOpen) return;
  _ssOpen.panel.remove();
  _ssOpen = null;
}

function _ssLabel(sel) {
  const o = sel.options[sel.selectedIndex];
  return o ? o.text : "";
}

function _ssOpenFor(sel, btn) {
  const wasMine = _ssOpen && _ssOpen.sel === sel;
  _ssClose();
  if (wasMine || sel.disabled) return;
  const panel = document.createElement("div");
  panel.className = "ss-panel";
  panel.innerHTML = `<input class="ss-input" type="search" autocomplete="off" placeholder="${NX().searchPh}"/><div class="ss-list" role="listbox"></div>`;
  document.body.appendChild(panel);
  const r = btn.getBoundingClientRect();
  const width = Math.min(Math.max(r.width, 240), window.innerWidth - 16);
  panel.style.width = width + "px";
  panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - width - 8)) + "px";
  const below = window.innerHeight - r.bottom;
  if (below < 260 && r.top > below) {
    panel.style.bottom = window.innerHeight - r.top + 4 + "px";
  } else {
    panel.style.top = r.bottom + 4 + "px";
  }
  const input = panel.querySelector(".ss-input"), list = panel.querySelector(".ss-list");
  const options = [ ...sel.options ].filter(o => o.value !== "");
  let shown = [], hi = 0;
  const paint = () => {
    list.innerHTML = shown.length ? shown.map((o, i) => `<button type="button" role="option" class="ss-opt ${i === hi ? "hi" : ""} ${o.value === sel.value ? "cur" : ""}" data-i="${i}">${esc(o.text)}</button>`).join("") : `<div class="ss-empty">${NX().noResults}</div>`;
    const cur = list.querySelector(".ss-opt.hi");
    if (cur) cur.scrollIntoView({
      block: "nearest"
    });
  };
  const filter = () => {
    const q = _ssNorm(input.value).trim();
    shown = q ? options.filter(o => _ssNorm(o.text).includes(q)) : options;
    hi = 0;
    paint();
  };
  const choose = o => {
    sel.value = o.value;
    btn.querySelector(".ss-text").textContent = _ssLabel(sel);
    _ssClose();
    sel.dispatchEvent(new Event("change", {
      bubbles: true
    }));
  };
  input.addEventListener("input", filter);
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (shown.length) hi = (hi + (e.key === "ArrowDown" ? 1 : shown.length - 1)) % shown.length;
      paint();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (shown[hi]) choose(shown[hi]);
    } else if (e.key === "Escape") {
      _ssClose();
      btn.focus();
    }
  });
  list.addEventListener("click", e => {
    const b = e.target.closest(".ss-opt");
    if (b) choose(shown[Number(b.dataset.i)]);
  });
  _ssOpen = {
    sel: sel,
    panel: panel,
    btn: btn
  };
  filter();
  input.focus();
}

function _ssEnhance(sel) {
  sel.setAttribute("data-ss-on", "");
  sel.style.display = "none";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "ss-btn";
  if (sel.style.maxWidth) btn.style.maxWidth = sel.style.maxWidth;
  if (sel.style.marginTop) btn.style.marginTop = sel.style.marginTop;
  btn.innerHTML = `<span class="ss-text"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`;
  btn.querySelector(".ss-text").textContent = _ssLabel(sel);
  btn.addEventListener("click", e => {
    e.stopPropagation();
    _ssOpenFor(sel, btn);
  });
  sel.insertAdjacentElement("afterend", btn);
}

new MutationObserver(() => {
  document.querySelectorAll("select[data-ss]:not([data-ss-on])").forEach(_ssEnhance);
  if (_ssOpen && !document.contains(_ssOpen.btn)) _ssClose();
}).observe(document.body, {
  childList: true,
  subtree: true
});

document.addEventListener("click", e => {
  if (_ssOpen && !_ssOpen.panel.contains(e.target)) _ssClose();
});

window.addEventListener("resize", _ssClose);

document.addEventListener("scroll", e => {
  if (_ssOpen && !_ssOpen.panel.contains(e.target)) _ssClose();
}, true);

// ── Excel register ───────────────────────────────────────────────
// Same layout as "Registro di cantiere": one column per worker with photo, name
// and yearly total, one row per day, a blank row between months, and the same
// colours. Always in Italian, like the original, whatever language the app is
// showing. Worked sites and exact times are on the second sheet.
const _REG_DAYS = [ "Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato" ];

const _REG_MONTHS = [ "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre" ];

const _REG_HOLIDAYS = new Set([ "01-01", "01-06", "04-25", "05-01", "06-02", "08-15", "11-01", "12-08", "12-25", "12-26" ]);

const _REG_COLOR = {
  name: "FFB4BBC3",
  total: "FFFFFF00",
  green: "FF92D050",
  workday: "FFFFF2CC",
  bar: "FFAEAAAA",
  red: "FFFF0000",
  title: "FFFF0000"
};

// Worth a comment on the day's cell, as in the paper register: in more than 10
// minutes after the site's start, or out more than 10 minutes before its end.
const _REG_NOTE_MINS = 10;

async function _loadExcelJs() {
  if (window.ExcelJS) return;
  try {
    await _loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js");
  } catch (e) {
    await _loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js");
  }
}

async function _registerPhotoBase64(u, url) {
  let dataUrl;
  try {
    dataUrl = await _fetchImageAsDataURL(url);
  } catch (e) {
    const res = await fetch("/api/storage", {
      method: "POST",
      headers: _authHeaders({
        "Content-Type": "application/json"
      }),
      body: JSON.stringify({
        action: "read-base64",
        key: u.photo_url.slice(4)
      })
    });
    const d = await res.json();
    if (!d.base64) throw new Error("no photo data");
    dataUrl = `data:${d.contentType || "image/jpeg"};base64,${d.base64}`;
  }
  const img = await new Promise((res, rej) => {
    const i = new Image;
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("photo decode failed"));
    i.src = dataUrl;
  });
  const W = 120, H = 138;
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const sc = Math.max(W / img.width, H / img.height);
  const dw = img.width * sc, dh = img.height * sc;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  return c.toDataURL("image/jpeg", .85).split(",")[1];
}

function _regHm(ms) {
  const d = new Date(Number(ms));
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function _regMins(hhmm) {
  const [h, m] = String(hhmm || "").split(":").map(Number);
  return isNaN(h) || isNaN(m) ? null : h * 60 + m;
}

function _regShiftNotes(s, loc) {
  const notes = [];
  if (s.status === "needs_review") notes.push("Turno da verificare");
  const start = _regMins(loc && loc.start_time || "07:00");
  const sd = new Date(Number(s.start_time));
  if (start !== null && Number(s.start_time) && sd.getHours() * 60 + sd.getMinutes() > start + _REG_NOTE_MINS) notes.push("Entrato alle ore " + _regHm(s.start_time));
  const end = _regMins(loc && loc.end_time);
  if (end !== null && end > 0 && Number(s.end_time)) {
    const ed = new Date(Number(s.end_time));
    if (ed.getHours() * 60 + ed.getMinutes() < end - _REG_NOTE_MINS) notes.push("Uscito alle ore " + _regHm(s.end_time));
  }
  return notes;
}

function _regAddDataSheet(wb, name, rows, fmts) {
  const ws = wb.addWorksheet(name.replace(/[*?:\\/\[\]]/g, " ").slice(0, 31), {
    views: [ {
      state: "frozen",
      ySplit: 1
    } ]
  });
  rows.forEach(r => ws.addRow(r));
  ws.getRow(1).font = {
    bold: true
  };
  ws.getRow(1).fill = {
    type: "pattern",
    pattern: "solid",
    fgColor: {
      argb: _REG_COLOR.name
    }
  };
  ws.columns.forEach((col, i) => {
    let w = 10;
    rows.forEach(r => {
      w = Math.max(w, String(r[i] == null ? "" : r[i]).length + 2);
    });
    col.width = Math.min(w, 44);
    if (fmts && fmts[i]) col.numFmt = fmts[i];
  });
  ws.autoFilter = {
    from: {
      row: 1,
      column: 1
    },
    to: {
      row: 1,
      column: rows[0].length
    }
  };
  return ws;
}

// Register cells show hours to the nearest half hour, like the paper register.
const _halfHour = h => Math.round(h * 2) / 2;

window.doExport = async () => {
  const N = NX();
  const year = parseInt(val("xl-year"), 10) || (new Date).getFullYear();
  toast(" " + T.loading, "info");
  try {
    await _loadExcelJs();
  } catch (e) {
    toast(N.excelLibFail, "error");
    return;
  }
  try {
    const [shifts, users, locs] = await Promise.all([ dbListShiftsRange(`${year}-01-01`, `${year}-12-31`), dbListUsersCached(), dbListLocationsCached() ]);
    if (!shifts.length) {
      toast(N.excelNoData(year), "warning");
      return;
    }
    const um = {}, locById = {};
    users.forEach(u => um[u.username] = u);
    locs.forEach(l => locById[l.id] = l);
    const withShifts = new Set(shifts.map(s => s.worker));
    // Same order as the paper register: by when each worker joined (start date,
    // else their first shift this year), then by name.
    const firstShift = {};
    shifts.forEach(s => {
      if (!firstShift[s.worker] || s.date < firstShift[s.worker]) firstShift[s.worker] = s.date;
    });
    const joined = u => /^\d{4}-\d{2}-\d{2}/.test(u.start_date || "") ? u.start_date.slice(0, 10) : firstShift[u.username] || "9999";
    const workers = users.filter(u => u.role === "worker" && (_isRosterWorker(u) || withShifts.has(u.username))).sort((a, b) => joined(a).localeCompare(joined(b)) || byName(a, b));
    // Per worker, per day: hours worked, and anything to flag on that cell.
    const cells = {};
    const cellFor = (worker, date) => {
      const k = worker + "|" + date;
      if (!cells[k]) cells[k] = {
        hours: 0,
        notes: [],
        review: false
      };
      return cells[k];
    };
    const workedDays = new Set;
    shifts.forEach(s => {
      if (!s.date) return;
      const c = cellFor(s.worker, s.date);
      if (s.status === "completed") c.hours += parseFloat(s.work_hours) || 0;
      if (s.status === "needs_review") c.review = true;
      if (s.status === "completed" || s.status === "needs_review") {
        workedDays.add(s.date);
        c.notes.push(..._regShiftNotes(s, locById[s.location_id]));
      }
    });
    const wb = new window.ExcelJS.Workbook;
    wb.creator = "New Idra";
    const FIRST_W = 7, HDR_END = 6;
    const lastW = FIRST_W + workers.length - 1, barR = lastW + 1;
    const ws = wb.addWorksheet(`Registro ${year}`, {
      views: [ {
        state: "frozen",
        xSplit: 6,
        ySplit: HDR_END,
        zoomScale: 85
      } ]
    });
    const widths = {
      1: 5.14,
      2: 2,
      3: 12.71,
      4: 9.71,
      5: 9.71,
      6: 2
    };
    Object.keys(widths).forEach(c => ws.getColumn(Number(c)).width = widths[c]);
    for (let c = FIRST_W; c <= lastW; c++) ws.getColumn(c).width = 20;
    ws.getColumn(barR).width = 2;
    const thin = {
      style: "thin"
    };
    const border = {
      top: thin,
      left: thin,
      bottom: thin,
      right: thin
    };
    const fill = argb => ({
      type: "pattern",
      pattern: "solid",
      fgColor: {
        argb: argb
      }
    });
    const center = {
      horizontal: "center",
      vertical: "middle",
      wrapText: true
    };
    const bold = (size, argb) => ({
      name: "Calibri",
      size: size || 11,
      bold: true,
      ...(argb ? {
        color: {
          argb: argb
        }
      } : {})
    });
    const bars = r => [ 2, 6, barR ].forEach(c => {
      const cell = ws.getCell(r, c);
      cell.fill = fill(_REG_COLOR.bar);
      cell.border = border;
    });
    const dateCell = (r, c, v) => {
      const cell = ws.getCell(r, c);
      if (v !== undefined) cell.value = v;
      cell.font = bold();
      cell.alignment = center;
      cell.border = border;
    };
    ws.getRow(2).height = 26.25;
    ws.getRow(3).height = 75;
    ws.getRow(4).height = 93;
    ws.mergeCells(2, FIRST_W, 2, lastW);
    const titleCell = ws.getCell(2, FIRST_W);
    titleCell.value = "NEW IDRA";
    titleCell.font = bold(20, _REG_COLOR.title);
    titleCell.alignment = center;
    titleCell.border = border;
    ws.mergeCells(4, 3, 4, 5);
    const yearCell = ws.getCell(4, 3);
    yearCell.value = year;
    yearCell.font = bold(20);
    yearCell.alignment = center;
    yearCell.border = border;
    [ 2, 3, 4, 5, 6 ].forEach(bars);
    [ 3, 4, 5 ].forEach(c => [ 5, 6 ].forEach(r => dateCell(r, c)));
    // The days run from the first month with a shift to the end of the year.
    const firstMonth = Math.min(...shifts.filter(s => s.date).map(s => Number(s.date.slice(5, 7)))) - 1;
    let r = HDR_END + 1;
    for (let m = firstMonth; m < 12; m++) {
      const days = new Date(year, m + 1, 0).getDate();
      for (let d = 1; d <= days; d++) {
        const date = new Date(year, m, d);
        const iso = `${year}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const weekday = date.getDay();
        const isOff = weekday === 0 || weekday === 6 || _REG_HOLIDAYS.has(iso.slice(5));
        const shaded = !isOff || workedDays.has(iso);
        dateCell(r, 3, _REG_DAYS[weekday]);
        dateCell(r, 4, d);
        dateCell(r, 5, _REG_MONTHS[m]);
        bars(r);
        workers.forEach((w, i) => {
          const cell = ws.getCell(r, FIRST_W + i);
          const c = cells[w.username + "|" + iso];
          cell.font = bold();
          cell.alignment = center;
          cell.border = border;
          if (shaded) cell.fill = fill(_REG_COLOR.workday);
          if (!c) return;
          if (c.hours > 0) cell.value = _halfHour(c.hours);
          if (c.review) cell.fill = fill(_REG_COLOR.red);
          if (c.notes.length) cell.note = c.notes.join("\n");
        });
        r++;
      }
      if (m < 11) {
        [ 3, 4, 5 ].forEach(c => dateCell(r, c));
        bars(r);
        workers.forEach((w, i) => {
          ws.getCell(r, FIRST_W + i).border = border;
        });
        r++;
      }
    }
    const lastR = r - 1;
    workers.forEach((w, i) => {
      const c = FIRST_W + i;
      const letter = ws.getColumn(c).letter;
      const photoCell = ws.getCell(3, c);
      photoCell.border = border;
      const nameCell = ws.getCell(4, c);
      nameCell.value = cleanName(w.label || w.username).toUpperCase();
      nameCell.font = bold(14);
      nameCell.alignment = center;
      nameCell.fill = fill(_REG_COLOR.name);
      nameCell.border = border;
      let total = 0;
      Object.keys(cells).forEach(k => {
        if (k.startsWith(w.username + "|")) total += _halfHour(cells[k].hours);
      });
      const totalCell = ws.getCell(5, c);
      totalCell.value = {
        formula: `SUM(${letter}${HDR_END}:${letter}${lastR})`,
        result: total
      };
      totalCell.font = bold();
      totalCell.alignment = center;
      totalCell.fill = fill(_REG_COLOR.total);
      totalCell.border = border;
      const greenCell = ws.getCell(6, c);
      greenCell.fill = fill(_REG_COLOR.green);
      greenCell.border = border;
    });
    // A photo that can't be fetched only leaves that one cell empty.
    const photoUrls = await _photoMapFor(workers);
    await Promise.all(workers.map(async (w, i) => {
      if (!photoUrls[w.username]) return;
      try {
        const base64 = await _registerPhotoBase64(w, photoUrls[w.username]);
        const id = wb.addImage({
          base64: base64,
          extension: "jpeg"
        });
        ws.addImage(id, {
          tl: {
            nativeCol: FIRST_W + i - 1,
            nativeColOff: 285750,
            nativeRow: 2,
            nativeRowOff: 38100
          },
          ext: {
            width: 80,
            height: 92
          },
          editAs: "oneCell"
        });
      } catch (e) {
        console.warn("[export] photo skipped for", w.username, e);
      }
    }));
    const STATUS = {
      completed: "Completato",
      working: "In corso",
      needs_review: "Da verificare"
    };
    const hmDate = ms => Number(ms) ? `${new Date(Number(ms)).toLocaleDateString("it-IT")} ${_regHm(ms)}` : "—";
    const round2 = v => Math.round((parseFloat(v) || 0) * 100) / 100;
    const sorted = shifts.slice().sort((a, b) => Number(b.start_time) - Number(a.start_time));
    _regAddDataSheet(wb, "Dettaglio turni", [ [ "Lavoratore", "Telefono", "Tariffa oraria (€)", "Cantiere", "Data", "Entrata", "Uscita", "Ore", "Importo (€)", "Stato" ], ...sorted.map(s => {
      const u = um[s.worker];
      return [ cleanName(u?.label || s.worker), u?.phone || "", round2(s.hourly_rate || u?.hourly_rate), cleanName(s.location_name || "—"), s.date, hmDate(s.start_time), hmDate(s.end_time), round2(s.work_hours), round2(s.earnings), STATUS[s.status] || cleanName(s.status) ];
    }) ], {
      2: "#,##0.00",
      7: "0.00",
      8: "#,##0.00"
    });
    for (let m = firstMonth; m < 12; m++) {
      const key = `${year}-${String(m + 1).padStart(2, "0")}`;
      const mShifts = shifts.filter(s => s.status === "completed" && (s.date || "").startsWith(key));
      if (!mShifts.length) continue;
      const sites = [ ...new Set(mShifts.map(s => cleanName(s.location_name || "—"))) ].sort((a, b) => a.localeCompare(b));
      const rows = [ [ "Lavoratore", "Telefono", "Tariffa oraria (€)", ...sites.map(l => `Ore ${l}`), "Ore totali", "Stipendio (€)", "Turni" ] ];
      const fmts = {
        2: "#,##0.00",
        [3 + sites.length]: "0.00",
        [4 + sites.length]: "#,##0.00"
      };
      sites.forEach((_, i) => fmts[3 + i] = "0.00");
      workers.filter(w => mShifts.some(s => s.worker === w.username)).forEach(w => {
        const mine = mShifts.filter(s => s.worker === w.username);
        const hours = mine.reduce((a, s) => a + (parseFloat(s.work_hours) || 0), 0);
        const pay = mine.reduce((a, s) => a + (parseFloat(s.earnings) || 0), 0);
        rows.push([ cleanName(w.label || w.username), w.phone || "", round2(w.hourly_rate), ...sites.map(l => round2(mine.filter(s => cleanName(s.location_name || "—") === l).reduce((a, s) => a + (parseFloat(s.work_hours) || 0), 0))), round2(hours), round2(pay), mine.length ]);
      });
      _regAddDataSheet(wb, `Stipendi ${_REG_MONTHS[m]}`, rows, fmts);
    }
    const buf = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([ buf ], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `Registro di cantiere NEW IDRA ${year}.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1e4);
    toast(N.excelDone, "success");
  } catch (e) {
    console.error("export failed", e);
    toast("Error: " + e.message, "error");
  }
};

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(e => console.warn("[sw] registration failed", e));
  });
}

init();
</script>
</body>
</html>
