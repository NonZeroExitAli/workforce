<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>New Idra — Plumbing Crew</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/NonZeroExitAli/us/main/image%20(1).png"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<meta name="theme-color" content="#e8801c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Newidra"/>

<style>
:root{
  
  --bg:#f4f3f1;
  --bg1:#ffffff;
  --bg2:#f7f4f0;
  --bg3:#efe7db;
  --border:#eae4dc;
  --border2:#d9cfc2;

  
  --copper:#e8801c;
  --copper2:#cc6e12;
  --copper3:#f59a44;

  
  --green:#157f3b;   --green-soft:rgba(21,127,59,.10);
  --red:#c0392b;     --red-soft:rgba(192,57,43,.10);
  --orange:#b7791f;  --orange-soft:rgba(183,121,31,.12);
  --steel:#46647f;   --steel2:#46647f; --steel-soft:rgba(70,100,127,.10);

  --text:#1b1a18;
  --muted:#6f6257;
  --dim:#f7f4f0;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  position:relative;
  transition:background .3s,color .3s;
}
body.rtl{direction:rtl}

body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    radial-gradient(circle at 20% 50%,rgba(232,128,28,.05) 0%,transparent 60%),
    radial-gradient(circle at 80% 20%,rgba(232,128,28,.04) 0%,transparent 50%);
  background-size:100% 100%,100% 100%;
  pointer-events:none;z-index:0;
}

body::after{
  content:'';
  position:fixed;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,#cc6e12,#f5a44a,transparent);
  z-index:999;
}

#grid{display:none}
#root{position:relative;z-index:1;min-height:100vh}

.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}

.brand-title{
  font-family:var(--font);
  font-size:clamp(52px,14vw,96px);
  font-weight:900;
  color:var(--text);
  letter-spacing:2px;
  line-height:.9;
  text-transform:uppercase;
  text-align:center;
}
.brand-title span{color:var(--copper2)}
.brand-sub{
  font-family:var(--font);
  font-size:10px;
  color:var(--muted);
  letter-spacing:4px;
  text-transform:uppercase;
  margin-top:10px;
  text-align:center;
}

.brand-icon{width:64px;height:64px;margin:0 auto 16px;position:relative;}
.brand-icon svg{width:100%;height:100%}

.auth-wrap{width:100%;max-width:420px}


/* No overflow:hidden here on purpose — with a large logo, this screen can
   end up taller than a short browser viewport, and clipping (rather than
   letting the page scroll) was hiding the top of the logo entirely. */
.auth-screen{position:relative}
.auth-bg-glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px circle at 12% 8%, rgba(232,128,28,.11), transparent 60%),
    radial-gradient(620px circle at 88% 92%, rgba(41,142,226,.09), transparent 60%);
}
.auth-lang-corner{position:fixed;top:16px;right:16px;z-index:2}
body.rtl .auth-lang-corner{right:auto;left:16px}
.auth-header{position:relative;z-index:1;margin-bottom:6px;text-align:center}
.auth-toggle{
  display:flex;background:var(--bg2);border:1px solid var(--border2);border-radius:999px;
  padding:4px;margin-bottom:16px;position:relative;z-index:1;gap:2px;
}
.auth-toggle-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 12px;border:none;background:transparent;border-radius:999px;
  font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:.3px;
  color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;
}
.auth-toggle-btn:hover:not(.active){color:var(--brand-ink)}
.auth-toggle-btn.active{background:var(--copper);color:#fff;box-shadow:0 3px 10px rgba(232,128,28,.3)}
.auth-toggle-btn svg{width:15px;height:15px;flex-shrink:0}
.auth-card{
  border-radius:16px!important;padding:28px 26px!important;border-top:1px solid var(--border2)!important;
  box-shadow:0 24px 60px rgba(20,15,10,.12),0 2px 10px rgba(20,15,10,.06);
  position:relative;z-index:1;
}
.auth-hint{font-family:var(--font);font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.5}
.auth-input-group{position:relative}
.auth-input-group svg{position:absolute;top:50%;transform:translateY(-50%);left:13px;width:15px;height:15px;color:var(--muted);pointer-events:none}
body.rtl .auth-input-group svg{left:auto;right:13px}
.auth-input-group input{padding-left:38px!important}
body.rtl .auth-input-group input{padding-left:12px!important;padding-right:38px!important}

.lang-bar{display:flex;gap:6px;margin-bottom:20px;justify-content:center;flex-wrap:wrap}
.lang-btn{
  padding:5px 14px;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--muted);
  font-size:11px;cursor:pointer;
  border-radius:2px;
  font-family:var(--font);
  letter-spacing:1px;
  transition:all .2s;
}
.lang-btn.active{background:var(--copper);color:#000;border-color:var(--brand-ink);font-weight:700}
.lang-btn:hover:not(.active){border-color:var(--brand-ink);color:var(--brand-ink)}

.tabs{display:flex;border:1px solid var(--border2);border-radius:4px 4px 0 0;overflow:hidden}
.tab{flex:1;padding:12px;background:var(--bg2);color:var(--muted);border:none;font-family:var(--font);font-size:13px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:all .2s;font-weight:700}
.tab.active{background:var(--copper);color:#000;font-weight:800}

.card-body{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-top:none;
  border-radius:0 0 4px 4px;
  padding:28px;
  position:relative;
  overflow:hidden;
}
.card-body::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--copper),transparent);
}

.card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;
  padding:28px;
  width:100%;max-width:500px;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--copper),transparent);
}

.fg{display:flex;flex-direction:column;gap:14px}

label.lbl{
  display:block;
  font-family:var(--font);
  font-size:9px;letter-spacing:3px;
  color:var(--muted);text-transform:uppercase;margin-bottom:6px;
}

input,select{
  width:100%;padding:11px 14px;
  background:var(--bg);
  border:1px solid var(--border2);
  border-radius:3px;
  color:var(--text);
  font-family:var(--font);
  font-size:13px;outline:none;
  transition:border-color .2s;
}
input:focus,select:focus{border-color:var(--brand-ink);box-shadow:0 0 0 2px rgba(232,128,28,.15)}
input:disabled{background:var(--bg2);border-color:var(--border);color:var(--muted);cursor:not-allowed}

.btn{
  width:100%;padding:13px;border:none;
  border-radius:3px;
  font-family:var(--font);
  font-size:15px;letter-spacing:2px;
  cursor:pointer;font-weight:800;
  text-transform:uppercase;
  transition:all .2s;
}
.btn-gold{
  background:linear-gradient(135deg,var(--copper),var(--copper2));
  color:#000;
  box-shadow:0 4px 16px rgba(232,128,28,.3);
}
.btn-gold:hover{background:linear-gradient(135deg,var(--copper2),var(--copper3));transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,128,28,.4)}
.btn-red{background:#2b2b2b;color:#fff}
.btn-red:hover{background:var(--red)}
.btn-green{background:linear-gradient(135deg,#e8801c,#f59a44);color:#000;box-shadow:0 4px 16px rgba(232,128,28,.2)}
.btn-blue{background:#cc6e12;color:#fff}
.btn-dark{background:var(--bg2);color:var(--muted);border:1px solid var(--border2)}
.btn-dark:hover{border-color:var(--brand-ink);color:var(--brand-ink)}
.btn-sm{padding:7px 14px;border:none;border-radius:3px;font-family:var(--font);font-size:12px;letter-spacing:1px;cursor:pointer;font-weight:700;text-transform:uppercase}

.err-box{color:#a8500a;font-family:var(--font);font-size:11px;padding:10px 14px;background:rgba(232,128,28,.08);border:1px solid rgba(232,128,28,.30);border-radius:3px;line-height:1.6;border-left:3px solid var(--copper)}
.info-box{color:var(--steel2);font-family:var(--font);font-size:11px;padding:10px 14px;background:rgba(232,128,28,.07);border:1px solid rgba(232,128,28,.2);border-radius:3px;line-height:1.7}
.warn-box{color:#ffb347;font-family:var(--font);font-size:11px;padding:10px 14px;background:rgba(210,120,0,.07);border:1px solid rgba(210,120,0,.2);border-radius:3px;line-height:1.7;border-left:3px solid var(--orange)}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;min-height:58px;
  background:var(--bg1);
  border-bottom:1px solid var(--border2);
  position:sticky;top:0;z-index:100;
  flex-wrap:wrap;gap:8px;
}
.topbar::after{
  content:'';
  position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,#cc6e12,#f5a44a,transparent);
  pointer-events:none;
}

.top-brand{
  font-family:var(--font);
  font-weight:900;font-size:22px;
  color:var(--text);letter-spacing:3px;
  text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.top-brand span{color:var(--copper2)}
.top-brand .pipe-dot{width:8px;height:8px;border-radius:50%;background:var(--copper);box-shadow:0 0 8px var(--copper);}

.ni-topbar-logo{display:flex;align-items:center;gap:10px;}
.ni-topbar-logo .ni-name{
  font-family:var(--font);
  font-size:18px;font-weight:900;
  letter-spacing:2px;
  background:linear-gradient(90deg,#5fa0e0,#ffffff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-transform:uppercase;
}
.ni-topbar-logo .ni-srls{
  font-family:var(--font);
  font-size:9px;letter-spacing:3px;color:var(--muted);
}

.top-right{display:flex;align-items:center;gap:8px;font-family:var(--font);font-size:11px;color:var(--muted);flex-wrap:wrap}

.top-right-utility{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top-right-stats{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.top-right .lang-bar{margin-bottom:0;justify-content:flex-start}
.top-right .lang-btn{padding:4px 10px;font-size:10px;min-width:32px;min-height:28px}
.role-pill{padding:3px 10px;border-radius:2px;font-size:9px;font-weight:700;font-family:var(--font);letter-spacing:2px;text-transform:uppercase}
.pill-mgr{background:var(--copper);color:#000}
.pill-wkr{background:rgba(232,128,28,.15);color:var(--green);border:1px solid rgba(232,128,28,.3)}
.logout-btn{
  padding:5px 12px;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--muted);
  font-family:var(--font);
  font-size:10px;cursor:pointer;
  border-radius:2px;
  letter-spacing:1px;
  transition:all .2s;
}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
.clock{font-family:var(--font);font-size:14px;color:var(--copper2);letter-spacing:2px}


.wk-menu-btn{
  width:36px;height:36px;flex-shrink:0;
  background:transparent;border:1px solid var(--border2);color:var(--muted);
  border-radius:4px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.wk-menu-btn:hover{border-color:var(--brand-ink);color:var(--brand-ink)}
.wk-drawer{
  position:fixed;inset:0;width:100%;height:100%;
  background:var(--bg0,var(--bg1));
  z-index:220;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
body.rtl .wk-drawer{transform:translateX(-100%)}
body.wk-drawer-open .wk-drawer{transform:translateX(0)}
.wk-drawer-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 18px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(232,128,28,.16),rgba(41,142,226,.08));
  border-bottom:1px solid var(--border2);
  position:relative;overflow:hidden;
}
.wk-drawer-head::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#cc6e12,#f5a44a,transparent);pointer-events:none}
.wk-drawer-title{font-family:var(--font);font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--text);font-weight:900}
.wk-drawer-title small{display:block;font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:600;margin-top:4px;text-transform:none}
.wk-drawer-close{width:34px;height:34px;flex-shrink:0;border-radius:8px;background:rgba(0,0,0,.06);border:1px solid var(--border2);color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.wk-drawer-close:hover{border-color:var(--red);color:var(--red);background:rgba(200,40,40,.08)}
.wk-drawer-body{flex:1 1 auto;overflow-y:auto;padding:14px 16px}
.wk-drawer-stats{display:flex;gap:8px;margin-bottom:14px}
.wk-drawer-stat{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:10px 8px;text-align:center}
.wk-drawer-stat .n{font-family:var(--font);font-size:19px;font-weight:900;color:var(--brand-ink);line-height:1}
.wk-drawer-stat .l{font-family:var(--font);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:5px;font-weight:700}
.wk-shift-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 12px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--border2);margin-bottom:7px;
  transition:border-color .15s;
}
.wk-shift-row:hover{border-color:var(--brand-ink)}
.wk-shift-left{min-width:0}
.wk-shift-date{font-family:var(--font);font-size:12px;font-weight:800;color:var(--text);letter-spacing:.3px}
.wk-shift-site{font-family:var(--font);font-size:10px;font-weight:700;color:#f59a44;margin-top:3px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-shift-times{font-family:var(--font);font-size:10.5px;color:var(--muted);margin-top:3px}
.wk-shift-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.wk-shift-dur{font-family:var(--font);font-size:13px;font-weight:900;color:var(--brand-ink)}
.wk-drawer-foot{padding:12px 16px;border-top:1px solid var(--border2);display:flex;flex-direction:column;gap:9px;flex-shrink:0}
.wk-drawer-foot .lang-bar{margin-bottom:0;justify-content:center}

.body{padding:24px;max-width:1200px;margin:0 auto}
.sec-title{
  font-family:var(--font);
  font-weight:900;font-size:32px;
  letter-spacing:4px;color:var(--text);
  text-transform:uppercase;margin-bottom:20px;
}
.sec-title span{color:var(--copper2)}

.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.info-card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;padding:16px;
  position:relative;overflow:hidden;
  transition:border-color .2s;
}
.info-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--border2)}
.info-card:hover{border-color:var(--brand-ink)}
.info-card:hover::before{background:var(--copper)}
.info-card .il{font-family:var(--font);font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.info-card .iv{font-family:var(--font);font-size:24px;font-weight:800;letter-spacing:1px}

.nav-tabs{
  display:flex;
  border-bottom:2px solid var(--border2);
  margin-bottom:24px;overflow-x:auto;
  gap:0;
}
.nav-tab{
  padding:12px 18px;
  background:none;border:none;
  border-bottom:3px solid transparent;
  color:var(--muted);
  font-family:var(--font);
  font-size:12px;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  white-space:nowrap;margin-bottom:-2px;
  transition:all .2s;font-weight:700;
}
.nav-tab:hover{color:var(--steel)}
.nav-tab.active{border-bottom-color:var(--brand-ink);color:var(--brand-ink)}


.worker-main{
  display:flex;flex-direction:column;
  min-height:calc(100vh - 58px);
  min-height:calc(100dvh - 58px);
  padding:16px 24px 24px;
  max-width:680px;margin:0 auto;width:100%;
  box-sizing:border-box;
}
.worker-main .stat-card{flex:1;display:flex;flex-direction:column;margin-bottom:0}
.worker-main .act-grid{margin-top:18px}

.stat-card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:6px;padding:28px;
  margin-bottom:20px;
  border-left:4px solid var(--border2);
  position:relative;overflow:hidden;
  transition:border-left-color .3s;
}
.stat-card::after{
  content:'';position:absolute;
  top:0;right:0;width:120px;height:120px;
  background:radial-gradient(circle,rgba(232,128,28,.04) 0%,transparent 70%);
  pointer-events:none;
}
.stat-card.working{border-left-color:var(--green)}
body.rtl .stat-card{border-left:none;border-right:4px solid var(--border2)}
body.rtl .stat-card.working{border-right-color:var(--green)}

.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--border2)}
.dot.working{background:var(--green);box-shadow:0 0 10px var(--green),0 0 20px rgba(232,128,28,.3);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 10px var(--green),0 0 20px rgba(232,128,28,.3)}50%{box-shadow:0 0 16px var(--green),0 0 32px rgba(232,128,28,.4)}}

.status-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.status-lbl{font-family:var(--font);font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}

.timer-big{
  font-family:var(--font);
  font-size:clamp(42px,10vw,72px);
  font-weight:400;
  color:var(--copper2);
  letter-spacing:4px;margin:12px 0;
  text-shadow:0 0 30px rgba(232,128,28,.3);
  position:relative;
}
.stat-card.working .timer-big{
  color:var(--green);
  text-shadow:0 0 30px rgba(232,128,28,.25);
}

.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.act-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:24px 10px;
  min-height:96px;
  border-radius:12px;
  font-family:var(--font);
  font-size:14px;letter-spacing:3px;
  cursor:pointer;font-weight:800;
  text-transform:uppercase;
  transition:transform .2s,box-shadow .2s,filter .2s;
  border:none;color:#fff;
}

.act-btn.start{ background:linear-gradient(135deg,#1fa855,var(--green)); box-shadow:0 6px 18px rgba(21,127,59,.4); }
.act-btn.end{ background:linear-gradient(135deg,#e0483a,var(--red)); box-shadow:0 6px 18px rgba(192,57,43,.4); }
.act-btn.end.pulse{ animation:pulse-end 2.2s infinite; }
.act-btn:disabled{opacity:.25;cursor:not-allowed}
.act-btn:not(:disabled):hover{transform:translateY(-3px);filter:brightness(1.1);box-shadow:0 10px 26px rgba(0,0,0,.3)}
.act-btn:not(:disabled):active{transform:translateY(0)}
.act-btn .ico{font-size:32px;line-height:1}
@keyframes pulse-end{
  0%,100%{ box-shadow:0 6px 18px rgba(192,57,43,.4); }
  50%{ box-shadow:0 6px 30px rgba(192,57,43,.65); }
}

.table-wrap{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;overflow:hidden;
  margin-bottom:20px;overflow-x:auto;
}
.table-head{
  padding:12px 18px;
  border-bottom:1px solid var(--border2);
  font-family:var(--font);
  font-size:12px;letter-spacing:3px;
  color:var(--brand-ink);text-transform:uppercase;font-weight:700;
}
table{width:100%;border-collapse:collapse;font-family:var(--font);font-size:13px;min-width:400px}
th{
  padding:10px 14px;text-align:left;
  font-family:var(--font);
  font-size:9px;letter-spacing:2px;
  color:var(--muted);text-transform:uppercase;
  border-bottom:1px solid var(--border2);
  background:var(--bg);
}
body.rtl th{text-align:right}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:rgba(232,128,28,.03)}

.badge{padding:3px 8px;border-radius:2px;font-size:9px;font-family:var(--font);font-weight:700;display:inline-block;letter-spacing:1px}
.bg{background:rgba(232,128,28,.1);color:var(--green);border:1px solid rgba(232,128,28,.25)}
.br{background:rgba(232,128,28,.1);color:var(--red);border:1px solid rgba(232,128,28,.25)}
.by{background:rgba(210,120,0,.1);color:var(--orange);border:1px solid rgba(210,120,0,.25)}
.bb{background:rgba(232,128,28,.1);color:var(--steel);border:1px solid rgba(232,128,28,.25)}
.bgr{background:rgba(58,96,128,.15);color:var(--muted);border:1px solid var(--border)}


.worker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:20px}
.wcard{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;padding:18px;
  border-left:3px solid var(--border2);
  transition:border-left-color .3s,transform .2s;
  overflow:hidden;min-width:0;
}
.wcard:hover{transform:translateY(-1px)}
.wcard.working{border-left-color:var(--green)}
.wcard.ended{border-left-color:var(--steel)}
body.rtl .wcard{border-left:none;border-right:3px solid var(--border2)}
body.rtl .wcard.working{border-right-color:var(--green)}
.wname{
  font-family:var(--font);
  font-weight:800;
  font-size:14px;
  letter-spacing:.3px;
  margin-bottom:2px;
  color:var(--text);
  text-transform:uppercase;
  overflow-wrap:break-word;
  word-break:break-word;
  line-height:1.2;
  max-width:100%;
}
.wphone{font-family:var(--font);font-size:10px;color:var(--muted);margin-bottom:10px}
.wbadges{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wsl{font-family:var(--font);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.wsv{font-family:var(--font);font-size:16px;font-weight:800;letter-spacing:1px}

.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sc{background:var(--bg1);border:1px solid var(--border2);border-radius:4px;padding:22px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--copper),transparent)}
.st{
  font-family:var(--font);
  font-size:11px;letter-spacing:3px;
  color:var(--brand-ink);text-transform:uppercase;
  margin-bottom:18px;padding-bottom:10px;
  border-bottom:1px solid var(--border2);
  font-weight:800;
}
.sf{margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--muted);font-family:var(--font);font-size:12px;line-height:2}

.phone-row{display:flex;align-items:flex-start;gap:10px;padding:14px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;margin-bottom:8px;transition:border-color .2s}
.phone-row:hover{border-color:var(--brand-ink)}
.phone-meta{display:flex;align-items:center;gap:7px;margin:6px 0;flex-wrap:wrap}
.pmbadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.drop-zone{
  border:2px dashed var(--border2);
  border-radius:4px;padding:28px;
  text-align:center;cursor:pointer;
  font-family:var(--font);
  font-size:11px;color:var(--muted);line-height:2;
  transition:all .2s;
}
.drop-zone:hover{border-color:var(--brand-ink);color:var(--brand-ink);background:rgba(232,128,28,.04)}
.rh{background:rgba(232,128,28,.05);border:1px solid rgba(232,128,28,.2);border-radius:4px;padding:14px}
.gh{background:rgba(232,128,28,.05);border:1px solid rgba(232,128,28,.2);border-radius:4px;padding:14px}
.hint{font-family:var(--font);font-size:10px;color:var(--muted);margin-top:5px}

.offline-banner{display:none;align-items:center;gap:10px;padding:10px 16px;border-radius:4px;font-family:var(--font);font-size:11px;margin-bottom:16px;flex-wrap:wrap;letter-spacing:.5px;font-weight:700}
.offline-banner.offline{background:rgba(210,120,0,.1);border:1px solid rgba(210,120,0,.3);color:var(--orange)}
.offline-banner.syncing{background:rgba(58,96,128,.1);border:1px solid var(--border2);color:var(--steel)}
.push-enable-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:4px;font-family:var(--font);font-size:11px;margin-bottom:16px;flex-wrap:wrap;background:rgba(232,128,28,.08);border:1px solid rgba(232,128,28,.3);color:var(--brand-ink)}
.push-enable-banner .peb-btn{flex-shrink:0;padding:8px 16px;border-radius:4px;border:none;background:var(--brand-ink);color:#fff;font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer}
.gps-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:4px;font-family:var(--font);font-size:11px;margin-bottom:16px;flex-wrap:wrap;letter-spacing:1px}
.gps-bar.ok{background:rgba(232,128,28,.07);border:1px solid rgba(232,128,28,.2);color:var(--green)}
.gps-bar.far{background:rgba(232,128,28,.07);border:1px solid rgba(232,128,28,.2);color:var(--red)}
.gps-bar.checking{background:rgba(210,120,0,.07);border:1px solid rgba(210,120,0,.2);color:var(--orange)}
.gps-bar.idle,.gps-bar.noset{background:rgba(58,96,128,.1);border:1px solid var(--border2);color:var(--muted)}
.gps-bar.error{background:rgba(232,128,28,.07);border:1px solid rgba(232,128,28,.2);color:var(--red)}


.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:var(--bg1);
  border:1px solid var(--border2);
  padding:12px 18px;border-radius:4px;
  font-family:var(--font);font-size:13px;
  color:var(--text);max-width:320px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  line-height:1.5;display:none;
  border-left:3px solid var(--copper);
}
body.rtl .toast{right:auto;left:24px}
.toast.show{display:block;animation:slideIn .25s ease}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.warning{border-left-color:var(--orange)}
.toast.info{border-left-color:var(--steel)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}


.doc-viewer-card{
  width:min(94vw,900px); height:min(92vh,900px);
  background:var(--bg1); border-radius:8px; border:1px solid var(--border2);
  display:flex; flex-direction:column; overflow:hidden;
}
.doc-viewer-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 16px; border-bottom:1px solid var(--border2);
  font-family:var(--font); font-weight:800; font-size:13px; letter-spacing:1px; color:var(--text);
  flex-shrink:0;
}
.doc-viewer-dl{
  color:var(--brand-ink); font-family:var(--font); font-size:11px; letter-spacing:1px;
  text-decoration:none; border:1px solid var(--border2); padding:6px 12px;
  border-radius:4px; white-space:nowrap; transition:border-color .15s;
}
.doc-viewer-dl:hover{ border-color:var(--brand-ink); }
.doc-viewer-close{ background:none; border:none; color:var(--muted); font-size:26px; cursor:pointer; line-height:1; }
.doc-viewer-close:hover{ color:var(--red); }
.doc-viewer-body{
  flex:1; min-height:0; overflow:auto;
  display:flex; align-items:center; justify-content:center;
  background:#1a1a1a; padding:10px;
}
.doc-viewer-body img{ max-width:100%; max-height:100%; object-fit:contain; }
.doc-viewer-body iframe{ width:100%; height:100%; border:none; background:#fff; }
@media(max-width:600px){
  .doc-viewer-card{ width:100vw; height:100vh; border-radius:0; }
}
.modal-title{
  font-family:var(--font);
  font-weight:900;font-size:22px;
  color:var(--copper2);letter-spacing:3px;
  margin-bottom:20px;text-transform:uppercase;
}
.modal-btns{display:flex;gap:10px;margin-top:8px}

@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--brand-ink);border-radius:50%;animation:spin .7s linear infinite}

.assign-board{display:flex;gap:14px;overflow-x:auto;overflow-y:auto;padding-bottom:14px;align-items:flex-start;max-height:calc(100vh - 200px)}
.assign-col{flex:0 0 220px;background:var(--bg1);border:1px solid var(--border2);border-radius:6px;min-height:5200px;display:flex;flex-direction:column;transition:border-color .2s}
.assign-col.unassigned{border-color:var(--border);flex:0 0 220px;min-height:5200px}
.assign-col-head{padding:12px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.assign-col-title{font-family:var(--font);font-size:15px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:1px}
.assign-col.unassigned .assign-col-title{color:var(--muted)}
.assign-col-body{padding:10px;flex:1;min-height:80px;transition:background .15s}
.assign-col-body.drag-over{background:rgba(232,128,28,.07);border-radius:0 0 6px 6px}
.assign-worker-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;margin-bottom:6px;cursor:grab;user-select:none;transition:border-color .15px,opacity .15s}
.assign-worker-chip:hover{border-color:var(--brand-ink)}
.assign-worker-chip.dragging{opacity:.3;cursor:grabbing}
.assign-worker-chip .chip-name{flex:1;font-family:var(--font);font-weight:800;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.assign-worker-chip .chip-phone{font-family:var(--font);font-size:10px;color:var(--muted)}
.assign-worker-chip .chip-remove{width:18px;height:18px;border-radius:50%;background:rgba(232,128,28,.12);border:1px solid rgba(232,128,28,.25);color:var(--red);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.assign-worker-chip .chip-remove:hover{background:rgba(232,128,28,.3)}
.loc-toggle{display:flex;align-items:center;gap:6px;font-family:var(--font);font-size:9px;cursor:pointer;padding:4px 8px;border-radius:2px;border:1px solid var(--border2);background:var(--bg);color:var(--muted);transition:all .2s;white-space:nowrap;letter-spacing:1px}
.loc-toggle.open{background:rgba(232,128,28,.1);border-color:rgba(232,128,28,.3);color:var(--green)}
.loc-toggle.closed{background:rgba(232,128,28,.1);border-color:rgba(232,128,28,.3);color:var(--red)}
.assign-col.loc-closed{border-color:rgba(232,128,28,.2);opacity:.7}
.assign-empty-drop{border:2px dashed var(--border);border-radius:4px;padding:20px 10px;text-align:center;font-family:var(--font);font-size:10px;color:var(--border2);pointer-events:none}
.assign-info-bar{background:rgba(232,128,28,.06);border:1px solid rgba(232,128,28,.15);border-radius:4px;padding:11px 16px;font-family:var(--font);font-size:11px;color:var(--steel);margin-bottom:16px;line-height:1.8}

.pipe-heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.pipe-heading::before,.pipe-heading::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--copper),transparent)}
.pipe-heading::before{background:linear-gradient(90deg,transparent,var(--copper))}

@media(max-width:600px){
  .act-grid{grid-template-columns:1fr 1fr;gap:10px}
  .info-grid{grid-template-columns:1fr 1fr}
  .topbar{padding:10px 14px}
  .worker-main{padding:12px 14px 16px}
  .timer-big{font-size:48px}
  .body{padding:14px}
  .stat-card{padding:18px 14px;margin-bottom:14px}
  .act-btn{padding:16px 6px;font-size:12px;letter-spacing:1.5px;min-height:80px}
  .act-btn .ico{font-size:26px}
  .act-grid{margin-top:16px}
  .top-right{flex-direction:column;align-items:stretch;gap:8px;width:100%}
  .top-right-utility{justify-content:space-between}
  .top-right-stats{width:100%}
  .top-right-stats .info-card{flex:1;min-width:0}
  .top-right .info-card{padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
  .top-right .info-card .iv{font-size:18px}
  .table-wrap{margin-bottom:14px}
  .table-wrap table{font-size:11px}
  .gps-bar{margin-bottom:10px;padding:8px 12px}
  .warn-box{margin-bottom:10px}
  .banner-spacer{margin-bottom:6px !important}
}
@media(max-width:380px){
  .act-btn{font-size:10.5px;letter-spacing:1px}
}


.dark-toggle{
  padding:5px 12px;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--muted);
  font-family:var(--font);
  font-size:13px;cursor:pointer;
  border-radius:2px;
  letter-spacing:1px;
  transition:all .2s;
  display:flex;align-items:center;gap:5px;
}
.dark-toggle:hover{border-color:var(--brand-ink);color:var(--brand-ink)}
.admin-switch{padding:8px 16px;background:var(--copper);border:1px solid var(--copper);color:#fff;font-family:var(--font);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;cursor:pointer;border-radius:6px;transition:all .15s;box-shadow:0 3px 10px rgba(232,128,28,.25)}
.admin-switch:hover{background:var(--copper2);border-color:var(--copper2);transform:translateY(-1px)}


:root{
  --r-card:12px; --r-ctl:9px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(27,26,24,.05);
  --sh-2:0 2px 8px rgba(27,26,24,.07), 0 1px 2px rgba(27,26,24,.04);
  --sh-pop:0 14px 40px rgba(27,26,24,.16);
  --focus:0 0 0 3px rgba(232,128,28,.32);
  --ease:.16s cubic-bezier(.2,0,.2,1);
}

table, .num, .kpi-val, .tabnum{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }


.btn{
  width:100%; padding:12px 18px; border:1px solid transparent;
  border-radius:var(--r-ctl);
  font-size:14px; font-weight:700; letter-spacing:0; text-transform:none;
  line-height:1.2; cursor:pointer;
  transition:background var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease);
}
.btn-gold{ background:var(--copper); color:#fff; box-shadow:var(--sh-1); }
.btn-gold:hover{ background:var(--copper2); transform:none; box-shadow:var(--sh-1); }
.btn-gold:active{ background:#b3540a; }
.btn-dark{ background:var(--bg1); color:var(--text); border-color:var(--border2); }
.btn-dark:hover{ background:var(--bg2); border-color:var(--muted); color:var(--text); }
.btn-red{ background:var(--red); color:#fff; }         
.btn-red:hover{ background:#a93226; }
.btn-green{ background:var(--green); color:#fff; box-shadow:var(--sh-1); }
.btn-green:hover{ background:#116632; }
.btn-blue{ background:var(--steel); color:#fff; }
.btn-sm{
  padding:8px 13px; border-radius:var(--r-ctl); border:1px solid transparent;
  font-size:12.5px; font-weight:700; letter-spacing:0; text-transform:none;
  line-height:1.2; cursor:pointer; transition:background var(--ease), border-color var(--ease), color var(--ease);
}
.btn-sm.btn-red{ background:var(--red-soft); color:var(--red); border-color:rgba(192,57,43,.28); }
.btn-sm.btn-red:hover{ background:var(--red); color:#fff; border-color:var(--red); }
.btn:disabled,.btn-sm:disabled{ opacity:.5; cursor:not-allowed; }


:where(button,a,input,select,textarea,[tabindex]):focus-visible{
  outline:none; box-shadow:var(--focus); border-radius:var(--r-ctl);
}


input,select,textarea{
  border-radius:var(--r-ctl); border:1px solid var(--border2);
  background:var(--bg1); color:var(--text);
  font-size:14px; padding:11px 12px; min-height:42px;
  transition:border-color var(--ease), box-shadow var(--ease);
}
input:focus,select:focus,textarea:focus{ border-color:var(--copper); box-shadow:var(--focus); }
input::placeholder{ color:#a99e92; }
.lbl{ font-size:11.5px; font-weight:600; letter-spacing:.2px; color:var(--muted); text-transform:none; margin-bottom:6px; display:block; }


.panel-card,.sc{
  background:var(--bg1); border:1px solid var(--border);
  border-radius:var(--r-card); box-shadow:var(--sh-1);
  padding:20px;
}
.pc-title,.st{
  font-size:11px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--muted); margin-bottom:14px;
}


.badge{
  padding:4px 10px; border-radius:var(--r-pill);
  font-size:11px; font-weight:700; letter-spacing:.2px; text-transform:none;
  display:inline-flex; align-items:center; gap:5px; line-height:1.4;
}


table{ font-size:13.5px; }
th{
  position:sticky; top:0; z-index:1; background:var(--bg2);
  font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
  color:var(--muted); padding:11px 14px; border-bottom:1px solid var(--border2);
}
td{ padding:12px 14px; border-bottom:1px solid var(--border); }
tbody tr{ transition:background var(--ease); }
tbody tr:hover{ background:var(--bg2); }
.table-wrap{ border:1px solid var(--border); border-radius:var(--r-card); overflow:auto; background:var(--bg1); }


.side-nav{ background:var(--bg1); border-right:1px solid var(--border); }
.side-nav-list .nav-tab{
  border-radius:var(--r-ctl); padding:11px 13px;
  font-size:13.5px; font-weight:600; letter-spacing:0; text-transform:none;
  color:var(--muted); min-height:44px;      
}
.side-nav-list .nav-tab:hover{ background:var(--bg2); color:var(--text); }
.side-nav-list .nav-tab.active{
  background:rgba(232,128,28,.10); color:var(--brand-ink); font-weight:700;
  box-shadow:inset 3px 0 0 var(--copper);
}
body.rtl .side-nav-list .nav-tab.active{ box-shadow:inset -3px 0 0 var(--copper); }
.side-section-label{ font-size:9.5px; letter-spacing:2px; color:#a3968a; padding:18px 20px 6px; }
.side-foot{ font-size:10px; letter-spacing:.3px; line-height:1.7; }


.info-box{ background:var(--steel-soft); border:1px solid rgba(70,100,127,.22); color:#2f4759; border-radius:var(--r-ctl); font-size:12.5px; padding:11px 14px; line-height:1.6; }
.warn-box{ background:var(--orange-soft); border:1px solid rgba(183,121,31,.28); color:#8a5a12; border-radius:var(--r-ctl); font-size:12.5px; padding:11px 14px; line-height:1.6; }
.err-box{ background:var(--red-soft); border:1px solid rgba(192,57,43,.28); color:#8e2b21; border-left:3px solid var(--red); border-radius:var(--r-ctl); font-size:12.5px; padding:11px 14px; line-height:1.6; }


.toast{ border-radius:var(--r-card); box-shadow:var(--sh-pop); border-left-width:4px; font-size:13.5px; }
.toast.success{ border-left-color:var(--green); }
.toast.error{ border-left-color:var(--red); }
.toast.warning{ border-left-color:var(--orange); }
.toast.info{ border-left-color:var(--steel); }


.kpi-grid{ gap:14px; }
.kpi-card{ border-radius:var(--r-card); box-shadow:var(--sh-1); border:1px solid var(--border); }
.quick-tile{
  border-radius:var(--r-card); border:1px solid var(--border); background:var(--bg1);
  box-shadow:var(--sh-1); transition:border-color var(--ease), box-shadow var(--ease);
  cursor:pointer; min-height:44px;
}
.quick-tile:hover{ border-color:var(--copper); box-shadow:var(--sh-2); }


.empty{ padding:44px 24px; font-size:13.5px; line-height:1.7; color:var(--muted); }


.modal-bg{ background:rgba(27,26,24,.55); backdrop-filter:blur(3px); }
.modal-bg .card{ border-radius:var(--r-card); box-shadow:var(--sh-pop); }


@media (max-width:768px){
  .btn,.btn-sm{ min-height:44px; }           
  .panel-card,.sc{ padding:16px; }
  table{ font-size:13px; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}



.tab{
  border-radius:var(--r-ctl) var(--r-ctl) 0 0;
  font-size:14px; font-weight:700; letter-spacing:0; text-transform:none;
  min-height:46px; transition:background var(--ease), color var(--ease);
}
.tab.active{ background:var(--bg1); color:var(--brand-ink); }
.role-pill{
  padding:4px 11px; border-radius:var(--r-pill);

<script>
const GPS_RADIUS = 500;

const SCHEMA_VERSION = "24";

const APP_VERSION = "2.3";

function _authHeaders(extra = {}) {
  const h = {
    ...extra
  };
  const token = typeof S !== "undefined" && S.authToken || localStorage.getItem("wf_mgr_token");
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}

async function sql(query, params = []) {
  const post = () => fetch("/api/sql", {
    method: "POST",
    headers: _authHeaders({
      "Content-Type": "application/json"
    }),
    body: JSON.stringify({
      query: query,
      params: params
    })
  });
  let res = await post();
  // A token left over from an expired manager session would otherwise fail
  // every query on this device, including a worker signing in on it.
  if (res.status === 401 && S.screen !== "manager" && (S.authToken || localStorage.getItem("wf_mgr_token"))) {
    S.authToken = null;
    localStorage.removeItem("wf_mgr_token");
    res = await post();
  }
  const data = await res.json().catch(() => null);
  if (!data || !data.ok) throw new Error(data?.error || `SQL failed (${res.status})`);
  return data.rows || [];
}

// Best-effort activity trail for sensitive manager actions. Since most
// mutations in this app go straight from the client to /api/sql rather than
// through dedicated server endpoints, this call is made from the client too
// — it's a visibility/accountability record, not a tamper-proof one (a
// determined attacker bypassing the UI entirely could avoid it). A fully
// tamper-proof log would need every mutation to move behind its own
// server-owned endpoint, which is a bigger change tracked separately.
async function _clientAudit(action, target, details) {
  try {
    await sql("INSERT INTO wf_audit_log(actor_username,action,target,details,created_at) VALUES($1,$2,$3,$4,$5)", [ S.user && S.user.username || null, action, target || null, details ? JSON.stringify(details) : null, Date.now() ]);
  } catch (e) {
    console.warn("[audit] log failed", e);
  }
}

// Defensive, self-healing guard (same pattern as _ensureReviewDismissedCol
// for wf_shifts) — guarantees the onboarding/on_loan columns exist even if
// a browser/session missed the versioned migration in initDB() for any
// reason, since that only re-attempts on a schema-version bump, not on
// every load.
let _onboardingColsEnsured = false;
async function _ensureOnboardingCols() {
  if (_onboardingColsEnsured) return;
  try {
    await sql("ALTER TABLE wf_users ADD COLUMN IF NOT EXISTS onboarding BOOLEAN DEFAULT false");
    await sql("ALTER TABLE wf_users ADD COLUMN IF NOT EXISTS on_loan BOOLEAN DEFAULT false");
    await sql("ALTER TABLE wf_users ADD COLUMN IF NOT EXISTS on_loan_details TEXT");
    _onboardingColsEnsured = true;
  } catch (e) {
    console.warn("[migration] could not ensure onboarding/on_loan columns:", e.message);
  }
}

const USER_COLS = "username,role,phone,hourly_rate,device_id,label,can_restart,can_restart_date,gps_bypass,worker_status,dob,email,tax_code,residence_permit,doc_expiry,iban,address,start_date,job_title,contract_type,contract_date,contract_expiry,permit_expiry,idoneita_expiry,patente_expiry,courses,photo_url,onboarding,on_loan,on_loan_details,archived,archived_at";

// Signing in used to download every worker's full record onto the phone just
// to find this one.
async function dbFindWorkerByNorm(norm) {
  const r = await sql(`SELECT ${USER_COLS} FROM wf_users WHERE role='worker' AND ltrim(regexp_replace(COALESCE(phone,''),'\\D','','g'),'0')=$1 ORDER BY COALESCE(archived,false) ASC LIMIT 1`, [ norm ]);
  return r[0] || null;
}

async function dbGetUser(u) {
  await _ensureOnboardingCols();
  const r = await sql(`SELECT ${USER_COLS} FROM wf_users WHERE username=$1 LIMIT 1`, [ u ]);
  return r[0] || null;
}

async function dbSetUser(u, d) {
  _clearUsersCache();
  await _ensureOnboardingCols();
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(",");
  const placeholders = keys.map((_, i) => `$${i + 2}`).join(",");
  const setCols = keys.map((k, i) => `${k}=$${i + 2}`).join(",");
  await sql(`INSERT INTO wf_users(username,${cols}) VALUES($1,${placeholders})\n     ON CONFLICT(username) DO UPDATE SET ${setCols}`, [ u, ...vals ]);
}

async function dbListUsers() {
  await _ensureOnboardingCols();
  return sql(`SELECT ${USER_COLS} FROM wf_users`);
}

let _usersCache = null;

function _clearUsersCache() {
  _usersCache = null;
}

async function dbListUsersCached() {
  if (_usersCache) return _usersCache;
  _usersCache = await dbListUsers();
  return _usersCache;
}

let _locsCache = null, _assignCache = null, _vehCache = null;

function _clearLocsCache() {
  _locsCache = null;
}

function _clearAssignCache() {
  _assignCache = null;
}

function _clearVehCache() {
  _vehCache = null;
}

function _clearAllCaches() {
  _usersCache = null;
  _locsCache = null;
  _assignCache = null;
  _vehCache = null;
}

async function dbListLocationsCached() {
  if (_locsCache) return _locsCache;
  _locsCache = await dbListLocations();
  return _locsCache;
}

async function dbListAssignmentsCached() {
  if (_assignCache) return _assignCache;
  _assignCache = await dbListAssignments();
  return _assignCache;
}

async function dbListVehiclesCached() {
  if (_vehCache) return _vehCache;
  _vehCache = await dbListVehicles();
  return _vehCache;
}

async function dbDelUser(username) {
  _clearUsersCache();
  await sql("DELETE FROM wf_users WHERE username=$1", [ username ]);
}

async function dbPurgeWorker(username, norm) {
  await _clientAudit("worker_deleted", username, {});
  const jobs = [ sql("DELETE FROM wf_documents WHERE worker_username=$1", [ username ]), sql("DELETE FROM wf_career    WHERE worker_username=$1", [ username ]), sql("DELETE FROM wf_shifts    WHERE worker=$1", [ username ]), sql("DELETE FROM wf_assignments WHERE worker_username=$1", [ username ]), sql("UPDATE wf_vehicles   SET assigned_user=NULL        WHERE assigned_user=$1", [ username ]), sql("UPDATE wf_locations  SET leader_username=NULL      WHERE leader_username=$1", [ username ]), sql("UPDATE wf_properties SET responsible_username=NULL WHERE responsible_username=$1", [ username ]), sql("DELETE FROM wf_users  WHERE username=$1", [ username ]) ];
  if (norm) {
    jobs.push(sql("DELETE FROM wf_assignments WHERE worker_username=$1", [ norm ]));
    jobs.push(sql("DELETE FROM wf_phones WHERE norm=$1", [ norm ]));
  }
  await Promise.all(jobs);
  _clearAllCaches();
  _clearPhonesCache();
  _clearPropsCache();
}

async function dbGetPhone(norm) {
  const r = await sql("SELECT norm,phone,label,rate,used,added_at FROM wf_phones WHERE norm=$1 LIMIT 1", [ norm ]);
  return r[0] || null;
}

async function dbSetPhone(norm, d) {
  _clearPhonesCache();
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(",");
  const placeholders = keys.map((_, i) => `$${i + 2}`).join(",");
  const setCols = keys.map((k, i) => `${k}=$${i + 2}`).join(",");
  await sql(`INSERT INTO wf_phones(norm,${cols}) VALUES($1,${placeholders})\n     ON CONFLICT(norm) DO UPDATE SET ${setCols}`, [ norm, ...vals ]);
}

async function dbListPhones() {
  return sql("SELECT norm,phone,label,rate,used,added_at FROM wf_phones ORDER BY added_at DESC");
}

let _phonesCache = null;

function _clearPhonesCache() {
  _phonesCache = null;
}

async function dbListPhonesCached() {
  if (_phonesCache) return _phonesCache;
  _phonesCache = await dbListPhones();
  return _phonesCache;
}

async function dbDelPhone(norm) {
  _clearPhonesCache();
  await sql("DELETE FROM wf_phones WHERE norm=$1", [ norm ]);
}

async function dbGetConfig() {
  const r = await sql("SELECT id,std_hours,ot_rate,auto_end_time,assign_mode FROM wf_config WHERE id=1 LIMIT 1");
  return r[0] || {
    std_hours: 8,
    ot_rate: 1.5,
    auto_end_time: null,
    assign_mode: "manual"
  };
}

let _cfgCache = null;

async function dbGetConfigCached() {
  if (!_cfgCache) _cfgCache = await dbGetConfig();
  return _cfgCache;
}

async function dbSetConfig(d) {
  _cfgCache = null;
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(",");
  const placeholders = keys.map((_, i) => `$${i + 1}`).join(",");
  const setCols = keys.map((k, i) => `${k}=$${i + 1}`).join(",");
  await sql(`INSERT INTO wf_config(id,${cols}) VALUES(1,${placeholders})\n     ON CONFLICT(id) DO UPDATE SET ${setCols}`, [ ...vals ]);
}

async function dbListShifts() {
  return sql("SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts ORDER BY start_time DESC");
}

async function dbListShiftsMonth(year, month) {
  const today = new Date;
  const sameMonth = today.getFullYear() === year && today.getMonth() + 1 === month;
  const refDay = sameMonth ? Math.min(today.getDate(), 28) : 28;
  const ref = new Date(year, month - 1, refDay);
  const {startStr: startStr, endStr: endStr} = cycleBounds(ref);
  return sql("SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts WHERE date >= $1 AND date <= $2 ORDER BY start_time DESC", [ startStr, endStr ]);
}

async function dbListShiftsToday() {
  return sql("SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts WHERE date=$1 ORDER BY start_time DESC", [ todayStr() ]);
}

async function dbListShiftsRange(from, to) {
  return sql("SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts WHERE date >= $1 AND date <= $2 ORDER BY start_time DESC", [ from, to ]);

let _reviewColEnsured = false;
// Defensive, self-healing guard: the versioned schema migration in initDB()
// SHOULD have already added this column on first load after this feature
// shipped, but if that migration hit a snag on some browser/session (a
// transient network blip, a page closed mid-migration, etc.), these two
// functions would otherwise throw "column does not exist" forever, since
// initDB() only re-attempts migrations when the schema version itself
// changes, not on every load. Re-issuing this exact ADD COLUMN IF NOT
// EXISTS here is free once it's actually there (single no-op check on
// Postgres' side) and guarantees this feature can't get permanently stuck
// regardless of what caused the original migration to miss it.
async function _ensureReviewDismissedCol() {
  if (_reviewColEnsured) return;
  try {
    await sql("ALTER TABLE wf_shifts ADD COLUMN IF NOT EXISTS review_dismissed BOOLEAN DEFAULT false");
    _reviewColEnsured = true;
  } catch (e) {
    console.warn("[migration] could not ensure review_dismissed column:", e.message);
  }
}

async function dbSetAssignment(worker_username, loc_id) {
  _clearAssignCache();
  const rows = await sql(`INSERT INTO wf_assignments(worker_username, loc_id) VALUES($1,$2)\n     ON CONFLICT(worker_username, loc_id) DO NOTHING RETURNING worker_username`, [ worker_username, loc_id ]);
  // RETURNING only comes back on a genuine new insert (ON CONFLICT DO
  // NOTHING skips it silently otherwise) — so this only fires the first
  // time this exact worker+location pairing is created, not on every
  // re-save of an assignment that already existed.
  if (rows.length) {
    _notifyWorkerAssigned(worker_username, loc_id).catch(() => {});
    // A worker's first real site assignment is what graduates them out of
    // the "Upcoming Workers" onboarding pool into the normal Employees
    // list. Every assignment path in the app (drag-and-drop, quick-assign,
    // profile assign, site-add-worker) already flows through this one
    // function, so hooking it here — instead of each individual call
    // site — can't miss a future assignment path either.
    _clearOnboardingFlagIfNeeded(worker_username).catch(() => {});
  }
}

async function _clearOnboardingFlagIfNeeded(worker_username) {
  try {
    const users = await dbListUsersCached();
    const target = users.find(u => _workerNorm(u) === worker_username || u.username === worker_username);
    if (target && target.onboarding) {
      await dbSetUser(target.username, {
        onboarding: false
      });
      _clearUsersCache();
    }
  } catch (e) {
    console.warn("[onboarding] could not clear onboarding flag", e);
  }
}

async function _notifyWorkerAssigned(worker_username, loc_id) {
  try {
    const [locs, users] = await Promise.all([ dbListLocationsCached(), dbListUsersCached() ]);
    const loc = locs.find(l => l.id === loc_id);
    const locName = loc ? disp(loc.name) : "—";
    // wf_assignments.worker_username is actually _workerNorm(u) — the
    // worker's normalized PHONE NUMBER when they have one, falling back to
    // their account username only if they don't (see _workerNorm and every
    // call site of dbSetAssignment, which all pass a phone, not a
    // username). Push subscriptions, on the other hand, are always saved
    // under the real wf_users.username (see enablePushNotificationsWorker).
    // Sending straight to worker_username silently looked up zero
    // subscriptions for almost every worker, since their phone number and
    // their account username are essentially never the same string —
    // resolving back to the real username here is what actually connects
    // "who got assigned" to "whose device gets the push".
    const target = users.find(u => _workerNorm(u) === worker_username || u.username === worker_username);
    const realUsername = target ? target.username : worker_username;
    const body = `Sei stato assegnato a ${locName} / تم تعيينك في ${locName}`;
    const res = await fetch("/api/notify-worker", {
      method: "POST",
      headers: _authHeaders({
        "Content-Type": "application/json"
      }),
      body: JSON.stringify({
        username: realUsername,
        title: "Newidra — Nuova assegnazione / تعيين جديد",
        body: body,
        url: "/?source=push"
      })
    });
    const data = await res.json().catch(() => null);
    // A 200 response only means the server accepted the request, not that
    // a device actually received anything — sendPushToUser returns
    // {sent: 0} with no error when the worker has zero registered
    // subscriptions (never enabled notifications on any device), which
    // previously looked identical to a real delivery from here. Surfacing
    // it makes that case visible instead of silently assuming it worked.
    if (!data || !data.ok || !data.sent) {
      console.warn("[push] assignment notify not delivered", { assignedAs: worker_username, resolvedUsername: realUsername, locId: loc_id, response: data });
    }
  } catch (e) {
    console.warn("[push] assignment notify failed", e);
  }
}

const DOC_STORAGE_LIMIT = 500 * 1024 * 1024;

const DOC_STORAGE_SOFT = 450 * 1024 * 1024;

const STORAGE_PROVIDER = "obj";

// Public VAPID key for Web Push — safe to embed client-side (only the
// server-held private key can actually sign/send notifications with it).
const VAPID_PUBLIC_KEY = "BAKNS8WZ4qKMf21hHAnFSYMHjhfccOApPt26bYUaezaiQf5Ku388mXMQOjN1D-ZEtXb7UvcY0UCLh2vENPOyPLs";

// Lets a tapped push notification land directly on a specific manager tab
// (e.g. "/?source=push&view=notifications") instead of always opening to
// the dashboard. Read once at load; consumed the first time the manager
// screen renders so it doesn't stick around and hijack normal navigation.
let _pendingView = new URLSearchParams(location.search).get("view");

function _urlB64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const out = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) out[i] = rawData.charCodeAt(i);
  return out;
}

async function storagePut(blobOrDataUrl, meta) {
  if (STORAGE_PROVIDER === "obj") {
    const blob = typeof blobOrDataUrl === "string" ? _dataUrlToBlob(blobOrDataUrl) : blobOrDataUrl;
    const r = await fetch("/api/storage", {
      method: "POST",
      headers: _authHeaders({
        "Content-Type": "application/json"
      }),
      body: JSON.stringify({
        action: "upload-url",
        contentType: blob.type || "image/jpeg",
        owner: meta && meta.owner || "misc"
      })
    });
    if (!r.ok) throw new Error("Upload not authorised (" + r.status + ")");
    const {key: key, url: url} = await r.json();
    if (!key || !url) throw new Error("Upload not authorised");
    const put = await fetch(url, {
      method: "PUT",
      headers: {
        "Content-Type": blob.type || "image/jpeg"
      },
      body: blob
    });
    if (!put.ok) throw new Error("Upload failed (" + put.status + ")");
    const fin = await fetch("/api/storage", {
      method: "POST",
      headers: _authHeaders({
        "Content-Type": "application/json"
      }),
      body: JSON.stringify({
        action: "finalize",
        key: key
      })
    });
    const finData = await fin.json().catch(() => null);
    if (!fin.ok || !finData || !finData.ok) {
      throw new Error(finData && finData.error || "Upload rejected");
    }
    return "obj:" + key;
  }
  return typeof blobOrDataUrl === "string" ? blobOrDataUrl : await _fileToDataURL(blobOrDataUrl);
}

// R2 presigns each GET URL for 300s server-side (see storage.js). Every
// re-render of a roster row, profile photo, or document viewer was calling
// this fresh — same worker's same photo could get re-signed a dozen times
// in a single manager session. Cached in-memory per ref, well under the
// real 300s expiry, so a burst of re-renders (e.g. re-rendering a whole
// worker list) reuses one signed URL instead of round-tripping /api/storage
// again for every row.
const _storageUrlCache = new Map(); // ref -> { url, expiresAt }
const STORAGE_URL_CACHE_MS = 4 * 60 * 1000; // 4 min, under R2's 5 min presign TTL

async function storageUrl(ref) {
  if (typeof ref === "string" && ref.indexOf("obj:") === 0) {
    const cached = _storageUrlCache.get(ref);
    if (cached && cached.expiresAt > Date.now()) {
      return {
        url: cached.url,
        revoke: false
      };
    }
    const res = await fetch("/api/storage?key=" + encodeURIComponent(ref.slice(4)), {
      headers: _authHeaders()
    });
    if (!res.ok) throw new Error("Could not fetch file (" + res.status + ")");
    const j = await res.json();
    if (!j || !j.url) throw new Error("No URL returned");
    _storageUrlCache.set(ref, {
      url: j.url,
      expiresAt: Date.now() + STORAGE_URL_CACHE_MS
    });
    return {
      url: j.url,
      revoke: false
    };
  }
  return {
    url: URL.createObjectURL(_dataUrlToBlob(ref)),
    revoke: true
  };
}

  const r = await sql("SELECT COALESCE(SUM(length(file_url)),0) AS bytes FROM wf_documents WHERE file_url NOT LIKE 'obj:%'");
  return Number(r[0] && r[0].bytes || 0);

function _fmtMB(bytes) {
  return (bytes / 1048576).toFixed(bytes < 10485760 ? 1 : 0);
}

function _fileToDataURL(file) {
  return new Promise((res, rej) => {
    let settled = false;
    const t = setTimeout(() => {
      if (!settled) {
        settled = true;
        rej(new Error("file read timed out"));
      }
    }, 2e4);
    const r = new FileReader;
    r.onload = () => {
      if (settled) return;
      settled = true;
      clearTimeout(t);
      const v = r.result;
      if (typeof v !== "string" || v.indexOf("data:") !== 0) return rej(new Error("unreadable file"));
      res(v);
    };
    r.onerror = () => {
      if (settled) return;
      settled = true;
      clearTimeout(t);
      rej(new Error("file read failed"));
    };
    r.onabort = () => {
      if (settled) return;
      settled = true;
      clearTimeout(t);
      rej(new Error("file read aborted"));
    };
    try {
      r.readAsDataURL(file);
    } catch (e) {
      if (!settled) {
        settled = true;
        clearTimeout(t);
        rej(e);
      }
    }
  });
}

function _compressImage(file, maxDim, quality) {
  return new Promise((res, rej) => {
    let settled = false, objUrl = null;
    const done = v => {
      if (settled) return;
      settled = true;
      if (objUrl) URL.revokeObjectURL(objUrl);
      res(v);
    };
    const failed = e => {
      if (settled) return;
      settled = true;
      if (objUrl) URL.revokeObjectURL(objUrl);
      rej(e instanceof Error ? e : new Error(String(e)));
    };
    const t = setTimeout(() => failed(new Error("image decode timed out")), 15e3);
    const finish = v => {
      clearTimeout(t);
      done(v);
    };
    const bail = e => {
      clearTimeout(t);
      failed(e);
    };
    try {
      objUrl = URL.createObjectURL(file);
      if (!objUrl) return bail(new Error("cannot create object url"));
      const img = new Image;
      img.onload = () => {
        try {
          const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
          if (!iw || !ih) return bail(new Error("image has no dimensions"));
          let w = iw, h = ih;
          if (w > maxDim || h > maxDim) {
            const sc = Math.min(maxDim / w, maxDim / h);
            w = Math.max(1, Math.round(w * sc));
            h = Math.max(1, Math.round(h * sc));
          }
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          const ctx = c.getContext("2d");
          if (!ctx) return bail(new Error("no canvas context"));
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          let out;
          try {
            out = c.toDataURL("image/jpeg", quality);
          } catch (e) {
            return bail(e);
          }
          if (!out || out.length < 32) return bail(new Error("encode produced empty output"));
          finish(out);
        } catch (e) {
          bail(e);
        }
      };
      img.onerror = () => bail(new Error("image decode failed"));
      img.src = objUrl;
    } catch (e) {
      bail(e);
    }
  });
}

function _storageMeterHtml(bytes) {
  const P = PL();
  const pct = Math.min(100, Math.round(bytes / DOC_STORAGE_LIMIT * 100));
  const color = pct >= 90 ? "var(--red)" : pct >= 70 ? "var(--orange)" : "var(--green)";
  return `<div style="margin-bottom:14px">\n    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">\n      <span style="font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase">${P.docStorage}</span>\n      <span style="font-family:var(--font);font-size:12px;font-weight:800;color:${color}">${_fmtMB(bytes)} MB <span style="color:var(--muted);font-weight:400">${P.ofLimit}</span></span>\n    </div>\n    <div style="height:8px;border-radius:5px;background:var(--bg2);overflow:hidden"><div style="height:100%;width:${pct}%;background:${color};transition:width .3s ease"></div></div>\n  </div>`;
}

function _nextRentDue(day) {
  const d = parseInt(day, 10);
  if (!(d >= 1 && d <= 31)) return null;
  const now = new Date;
  now.setHours(0, 0, 0, 0);
  const mk = (y, m) => {
    const last = new Date(y, m + 1, 0).getDate();
    return new Date(y, m, Math.min(d, last));
  };
  let due = mk(now.getFullYear(), now.getMonth());
  if (due < now) due = mk(now.getFullYear(), now.getMonth() + 1);
  const p = n => String(n).padStart(2, "0");
  return `${due.getFullYear()}-${p(due.getMonth() + 1)}-${p(due.getDate())}`;
}

  const stmts = block.split(";").map(s => s.trim()).filter(Boolean);
  let failures = 0;
  for (const stmt of stmts) {
    try {
      await sql(stmt);
    } catch (e) {
      failures++;
      console.warn("[migration] statement failed (continuing):", stmt.slice(0, 90), "—", e.message);
    }
  }
  return failures;
}

const CYCLE_START_DAY = 1;

function cycleBounds(ref = new Date) {
  const y = ref.getFullYear(), m = ref.getMonth(), day = ref.getDate();
  let sy = y, sm = m;
  if (day < CYCLE_START_DAY) {
    sm = m - 1;
    if (sm < 0) {
      sm = 11;
      sy = y - 1;
    }
  }
  const start = new Date(sy, sm, CYCLE_START_DAY);
  const end = new Date(sy, sm + 1, CYCLE_START_DAY - 1);
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return {
    start: start,
    end: end,
    startStr: fmt(start),
    endStr: fmt(end),
    startYear: sy,
    startMonth: sm
  };
}

function inCycle(dateLike, ref = new Date) {
  const {startStr: startStr, endStr: endStr} = cycleBounds(ref);
  let ds;
  if (typeof dateLike === "string" && /^\d{4}-\d{2}-\d{2}/.test(dateLike)) {
    ds = dateLike.slice(0, 10);
  } else {
    const d = dateLike instanceof Date ? dateLike : new Date(Number(dateLike));
    if (isNaN(d.getTime())) return false;
    ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  return ds >= startStr && ds <= endStr;
}

function cycleLabel(ref = new Date) {
  const {start: start} = cycleBounds(ref);
  return start.toLocaleString(lang === "ar" ? "ar-EG" : "it-IT", {
    month: "long",
    year: "numeric"
  });
}

function extractCoordsFromMapsLink(url) {
  if (!url) return null;
  const u = url.trim();
  if (/goo\.gl|maps\.app\.goo\.gl/.test(u)) return null;
  if (!u.includes("google") && !u.includes("maps.google")) return null;
  const COORD = "(-?\\d{1,3}\\.\\d{4,})";
  const patterns = [ new RegExp(`[?&]q=${COORD},${COORD}`), new RegExp(`[?&]ll=${COORD},${COORD}`), new RegExp(`/@${COORD},${COORD}`), new RegExp(`/place/${COORD},${COORD}`), new RegExp(`[?&]daddr=${COORD},${COORD}`), new RegExp(`[?&]destination=${COORD},${COORD}`), new RegExp(`[?&]center=${COORD},${COORD}`), new RegExp(`[?&]saddr=${COORD},${COORD}`), new RegExp(`!3d${COORD}!4d${COORD}`), new RegExp(`${COORD}\\+${COORD}`) ];
  for (const p of patterns) {
    const m = u.match(p);
    if (m) {
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) return {
        lat: lat,
        lng: lng
      };
    }
  }
  return null;
}

function haversine(la1, lo1, la2, lo2) {
  const R = 6371e3, dL = (la2 - la1) * Math.PI / 180, dO = (lo2 - lo1) * Math.PI / 180;
  const a = Math.sin(dL / 2) ** 2 + Math.cos(la1 * Math.PI / 180) * Math.cos(la2 * Math.PI / 180) * Math.sin(dO / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

const geoPos = (timeout = 12e3) => new Promise((res, rej) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(res, rej, {
  enableHighAccuracy: true,
  timeout: timeout,
  maximumAge: 0
}) : rej(new Error("gps_unavailable")));

// A cold, high-accuracy GPS fix can genuinely take longer than any
// reasonable timeout — especially near/inside a building, which is common
// right at a job site. When the strict high-accuracy request times out or
// comes back unavailable (codes 3 and 2), fall back once to a coarser
// network/cell-based fix instead of failing outright. That fix is less
// precise but usually near-instant, and still well inside GPS_RADIUS's
// 500m tolerance for confirming a worker is at their assigned site.
// Permission denial (code 1) is not retried — a fallback request would be
// denied the same way.
async function geoPosWithFallback(timeout = 15e3) {
  try {
    return await geoPos(timeout);
  } catch (e) {
    if (e && (e.code === 2 || e.code === 3)) {
      return new Promise((res, rej) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(res, rej, {
        enableHighAccuracy: false,
        timeout: 10e3,
        maximumAge: 6e4
      }) : rej(new Error("gps_unavailable")));
    }
    throw e;
  }
}

const IDLE_MS = 6e4;

let _sleepTimer = null, _inactiveTimer = null;

function _resetInactiveTimer() {
  clearTimeout(_inactiveTimer);
  if (!S.user || document.hidden || S._suspendIdle) return;
  _inactiveTimer = setTimeout(() => {
    if (S.user) doLogout();
  }, IDLE_MS);
}

[ "click", "touchstart", "keydown", "scroll", "mousemove" ].forEach(ev => document.addEventListener(ev, _resetInactiveTimer, {
  passive: true
}));

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearTimeout(_inactiveTimer);
    _sleepTimer = setTimeout(() => {
      if (S.user && !S._suspendIdle) doLogout();
    }, IDLE_MS);
  } else {
    clearTimeout(_sleepTimer);
    _sleepTimer = null;
    _resetInactiveTimer();
  }
});

function niLogoSVG(size = 220) {
  // Measured against the actual source artwork: the icon+wordmark run to
  // ~76% of the file's height, the rest is blank padding at the bottom.
  // 80% keeps a small safety margin above that so the wordmark is never at
  // risk of being clipped, while still trimming the bulk of the dead space.
  const cropH = Math.round(size * 0.8);
  return `<div style="overflow:hidden;max-height:${cropH}px;line-height:0"><img src="/logo-vertical.png" height="${size}" style="object-fit:contain;display:block;margin:0 auto;" alt="New Idra" onerror="this.style.display='none'"/></div>`;
}

function niTopbarLogo() {
  // Unlike the vertical logo, this file's icon+wordmark sit in the
  // vertical middle of the canvas with padding on every side, not
  // anchored to the top — so a simple top-cropped max-height doesn't work
  // here. object-fit:cover inside a box shaped like the visible band
  // (rather than the full, much taller canvas) scales to fill the width
  // and crops the excess evenly off the top and bottom instead.
  return `<div class="ni-topbar-logo" style="width:100%;aspect-ratio:3.6;overflow:hidden;">\n    <img src="/logo-horizontal.png" style="width:100%;height:100%;object-fit:cover;object-position:center center;display:block;" alt="New Idra" onerror="this.style.display='none'"/>\n  </div>`;
}

function buildTimeOptions(selected = "") {
  const opts = [ `<option value="">— ${T.noAutoEnd || "No auto-end (manual)"} —</option>` ];
  for (let h = 7; h <= 23; h++) {
    for (const m of [ 0, 30 ]) {
      if (h === 23 && m === 30) continue;
      const v = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
      const label = (h > 12 ? h - 12 : h) + ":" + (m === 0 ? "00" : "30") + " " + (h >= 12 ? "PM" : "AM");
      opts.push(`<option value="${v}"${selected === v ? " selected" : ""}>${label} (${v})</option>`);
    }
  }
  // Midnight — the latest possible end time, stored as "00:00" but meant
  // as the end of the working day (right after 11:30 PM), not its start.
  // Every place that reads an auto-end time treats this specific value as
  // "midnight tonight" rather than "midnight this morning" — see
  // _finalizeShift, the shift-start cutoff checks, and
  // reconcileStaleShifts.
  opts.push(`<option value="00:00"${selected === "00:00" ? " selected" : ""}>12:00 AM (00:00)</option>`);
  return opts.join("");
}

function buildStartTimeOptions(selected = "") {
  const opts = [ `<option value="">— ${T.noAutoStart || "No auto-start (manual)"} —</option>` ];
  for (let h = 5; h <= 12; h++) {
    for (const m of [ 0, 15, 30, 45 ]) {
      if (h === 12 && m > 0) continue;
      const v = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
      const ampm = h >= 12 ? "PM" : "AM";
      const hd = h > 12 ? h - 12 : h;
      const label = hd + ":" + String(m).padStart(2, "0") + " " + ampm;
      opts.push(`<option value="${v}"${selected === v ? " selected" : ""}>${label} (${v})</option>`);
    }
  }
  return opts.join("");
}

function buildBreakOptions(selected = "") {
  const sel = parseInt(selected) || 0;
  const opts = [ `<option value="0"${sel === 0 ? " selected" : ""}>— ${T.breakNone || "No break"} —</option>` ];
  for (const m of [ 15, 20, 30, 45, 60, 90 ]) {
    opts.push(`<option value="${m}"${sel === m ? " selected" : ""}>${T.breakMin ? T.breakMin(m) : m + " min"}</option>`);
  }
  return opts.join("");
}

// Fire-and-forget alert to every manager the moment a worker gets stuck at
// login for a real, actionable reason (GPS, device mismatch, not
// assigned, site closed). Push-only — deliberately does NOT write
// anything the in-app Notifications tab would ever list, since this is
// only useful in the moment it happens, not as something to review later.
async function _notifyManagerLoginIssue(name, phone, issue, urgent) {
  try {
    await fetch("/api/notify-login-issue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, phone, issue, urgent: !!urgent })
    });
  } catch (e) {
    console.warn("[push] login-issue notify failed", e);
  }
}

// A worker signed in without GPS (bypass, or location failed three times) who
// starts a shift with no site: every such start is pushed to the managers as urgent.
function _noSiteStartAlert(startMs) {
  if (S.nearestLocation || !S.user || !S.noGps) return null;
  const hm = _regHm(startMs);
  return {
    name: S.user.label || S.user.username,
    phone: S.user.phone || "",
    issue: `Ha iniziato un turno alle ${hm} SENZA GPS e senza cantiere: verifica dove si trova / بدأ وردية الساعة ${hm} بدون GPS وبدون موقع: تحقق من مكانه`
  };
}

// After this many failed location checks in a day, the worker is let in under
// the GPS-bypass rules instead of being locked out. Counted per worker, per
// device, per day; a successful check resets it.
const GPS_MAX_TRIES = 3;
const _gpsTryKey = username => `wf_gps_tries_${username}_${todayStr()}`;

function _gpsTries(username) {
  try {
    return parseInt(localStorage.getItem(_gpsTryKey(username)), 10) || 0;
  } catch (e) {
    return 0;
  }
}

function _setGpsTries(username, n) {
  try {
    if (n) localStorage.setItem(_gpsTryKey(username), String(n)); else localStorage.removeItem(_gpsTryKey(username));
  } catch (e) {}
}

// Signs a worker in without a position. Free mode: they pick the site at
// Start. Manual mode: no site, but the break of their assigned site applies.
async function _enterWithoutGps(workerUser, norm, locations, freeMode) {
  S.gps = "ok";
  S.gpsDist = null;
  S.nearestLocation = null;
  S.noGps = true;
  S.sitePickRequired = freeMode;
  if (!freeMode) {
    const mine = await sql("SELECT loc_id FROM wf_assignments WHERE worker_username = ANY($1)", [ [ norm, workerUser.username ] ]);
    const site = locations.filter(l => _isAssignableLoc(l) && mine.some(a => a.loc_id === l.id)).sort(byName)[0];
    S.bypassBreakMins = parseFloat(site?.break_minutes || 0) || 0;
  }
  S.user = workerUser;
  _resetInactiveTimer();
  renderWorkerScreen();
  _autoSyncPush(true).catch(() => {});
}

window.doPhoneLogin = async () => {
  if (!rateLimit("phone_login", 1500)) return;
  const ph = val("wph").trim();
  const errEl = $("wph-err");
  errEl.style.display = "none";
  const showErr = msg => {
    errEl.textContent = msg;
    errEl.style.display = "block";
  };
  const btn = $("wph-btn");
  if (btn) {
    btn.disabled = true;
    btn.textContent = T.loading || "Checking…";
  }
  try {
    if (!ph) {
      showErr(T.badPhone);
      return;
    }
    const norm = normPhone(ph);
    if (!norm) {
      showErr(T.badPhoneNum);
      return;
    }
    await _dbReady;
    const [match, foundWorker, cfg] = await Promise.all([ dbGetPhone(norm), dbFindWorkerByNorm(norm), dbGetConfig() ]);
    if (!match) {
      showErr(T.phoneNoAuth);
      return;
    }
    const freeMode = cfg.assign_mode === "free";
    let workerUser = foundWorker;
    if (_isArchived(workerUser)) {
      showErr(NX().archivedLogin);
      return;
    }
    if (!workerUser) {
      const uname = (match.label || "").toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "") || "w" + norm.slice(-6);
      const finalName = await dbGetUser(uname) ? uname + "_" + norm.slice(-4) : uname;
      await dbSetUser(finalName, {
        password: norm,
        role: "worker",
        phone: ph,
        hourly_rate: match.rate || 15,
        device_id: DEVICE_ID,
        can_restart: false
      });
      await dbSetPhone(norm, {
        used: true
      });
      workerUser = await dbGetUser(finalName);
    }
    if (!workerUser.device_id) {
      await dbSetUser(workerUser.username, {
        device_id: DEVICE_ID
      });
      workerUser.device_id = DEVICE_ID;
    } else if (workerUser.device_id !== DEVICE_ID) {
      showErr(T.deviceBlocked);
      _notifyManagerLoginIssue(workerUser.label || workerUser.username, workerUser.phone || ph, "Ha provato ad accedere da un telefono diverso da quello registrato / حاول الدخول من جهاز مختلف عن الجهاز المسجل");
      return;
    }
    const locations = await dbListLocations();
    _wsCache = {
      cfg: cfg,
      allLocs: locations
    };
    S.bypassBreakMins = 0;
    S.noGps = false;
    if (workerUser.gps_bypass === true || workerUser.gps_bypass === "true") {
      await _enterWithoutGps(workerUser, norm, locations, freeMode);
      return;
    }
    const wkName = workerUser.label || workerUser.username, wkPhone = workerUser.phone || ph;
    // Location missing or refused: ask again, and on the third failure today
    // let them in under the bypass rules with an urgent alert to the managers.
    const gpsFailed = async (msg, pushIssue) => {
      const tries = _gpsTries(workerUser.username) + 1;
      _setGpsTries(workerUser.username, tries);
      if (tries >= GPS_MAX_TRIES) {
        _notifyManagerLoginIssue(wkName, wkPhone, `Entrato SENZA GPS dopo ${tries} tentativi falliti (${pushIssue}) / دخل بدون GPS بعد ${tries} محاولات فاشلة`, true);
        await _enterWithoutGps(workerUser, norm, locations, freeMode);
        return;
      }
      showErr(msg + " " + NX().gpsTry(tries));
      _notifyManagerLoginIssue(wkName, wkPhone, pushIssue);
    };
    if (locations.length > 0) {
      if (!navigator.geolocation) {
        await gpsFailed(T.gpsRequired, "Il telefono non supporta la localizzazione (GPS) / الهاتف لا يدعم تحديد الموقع");
        return;
      }
      if (btn) btn.textContent = " " + (T.gpsCheck || "Getting location…");
      try {
        const pos = await geoPosWithFallback(15e3);
        const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
        const locsWithDist = locations.map(l => ({
          ...l,
          dist: Math.round(haversine(uLat, uLng, parseFloat(l.lat), parseFloat(l.lng)))
        }));
        const myAssignments = freeMode ? [] : await sql("SELECT worker_username,loc_id FROM wf_assignments WHERE worker_username = ANY($1)", [ [ norm, workerUser.username ] ]);
        if (!freeMode && myAssignments.length === 0) {
          showErr(lang === "ar" ? " لم يتم تعيينك في أي موقع. تواصل مع المدير." : " Non sei assegnato ad alcun cantiere. Contatta il tuo manager.");
          _notifyManagerLoginIssue(workerUser.label || workerUser.username, workerUser.phone || ph, "Sta provando ad accedere ma non è assegnato a nessun cantiere / يحاول الدخول لكنه غير معيّن لأي موقع");
          return;
        }
        // Free mode: any site not finished, and an open one wins over a closed
        // one if two are in range. The shift records whichever is chosen here.
        const candidateLocs = freeMode ? locsWithDist.filter(l => l.finished !== true && l.finished !== "true") : locsWithDist.filter(l => myAssignments.some(a => a.loc_id === l.id));
        const inRange = candidateLocs.filter(l => l.dist <= GPS_RADIUS).sort((a, b) => a.dist - b.dist);
        const nearbyCandidate = (freeMode && inRange.find(_isAssignableLoc)) || inRange[0];
        if (!nearbyCandidate && freeMode) {
          showErr(NX().farFromAll);
          _notifyManagerLoginIssue(workerUser.label || workerUser.username, workerUser.phone || ph, NX().farFromAllPush);
          return;
        }
        if (!nearbyCandidate) {
          showErr(lang === "ar" ? " أنت بعيد عن موقع عملك. يرجى التوجه إلى موقعك المعيّن لتسجيل الدخول." : " Sei lontano dal tuo cantiere. Recati nella tua sede assegnata per accedere.");
          _notifyManagerLoginIssue(workerUser.label || workerUser.username, workerUser.phone || ph, "Troppo lontano dal cantiere assegnato per accedere / بعيد جدًا عن موقع عمله المعيّن");
          return;
        }
        const isOpen = nearbyCandidate.is_open !== false && nearbyCandidate.is_open !== "false";
        if (!isOpen) {
          showErr(lang === "ar" ? ` ${nearbyCandidate.name} مغلق حالياً. تواصل مع المدير.` : ` ${nearbyCandidate.name} è attualmente chiuso. Contatta il tuo manager.`);
