window.siteSaveStartTime = async locId => {
  const st = (val("sd-st") || "").trim() || null;
  try {
    await sql("UPDATE wf_locations SET start_time=$2 WHERE id=$1", [ locId, st ]);
    _clearLocsCache();
    toast(st ? T.autoStartSet(st) : T.autoStartCleared, "success");
    await openSiteDetail(locId);
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

window.siteSaveEndTime = async locId => {
  const et = (val("sd-et") || "").trim() || null;
  if (et && !/^([0-9]{2}):(00|30)$/.test(et)) {
    toast("Invalid end time", "error");
    return;
  }
  try {
    await sql("UPDATE wf_locations SET end_time=$2 WHERE id=$1", [ locId, et ]);
    _clearLocsCache();
    toast(et ? T.autoEndSetTo(et) : T.autoEndCleared, "success");
    await openSiteDetail(locId);
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

window.siteSaveBreak = async locId => {
  const brk = parseInt(val("sd-brk")) || 0;
  try {
    await sql("UPDATE wf_locations SET break_minutes=$2 WHERE id=$1", [ locId, brk ]);
    _clearLocsCache();
    toast(brk > 0 ? (T.breakLbl || "Break") + ": " + brk + " min" : T.breakNone || "No break", "success");
    await openSiteDetail(locId);
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

window.onSiteLinkChange = () => {
  const url = val("sd-ml").trim();
  const st = $("sd-ml-status");
  if (!st) return;
  if (!url) {
    st.textContent = "";
    return;
  }
  const c = extractCoordsFromMapsLink(url);
  if (c) {
    st.textContent = T.linkReady;
    st.style.color = "#e8801c";
  } else if (/goo\.gl|maps\.app/.test(url)) {
    st.innerHTML = T.shortUrl;
    st.style.color = "#e8801c";
  } else {
    st.textContent = T.pasteGmap;
    st.style.color = "var(--red)";
  }
};

window.extractSiteCoords = () => {
  const url = val("sd-ml").trim();
  const c = extractCoordsFromMapsLink(url);
  if (c) {
    $("sd-lat").value = c.lat.toFixed(6);
    $("sd-lng").value = c.lng.toFixed(6);
    const st = $("sd-ml-status");
    if (st) {
      st.textContent = `✓ ${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`;
      st.style.color = "#e8801c";
    }
    toast(T.coordsExtracted, "success");
  } else toast(T.noCoordsInLink, "error");
};

window.useMyLocForSiteDetail = async () => {
  try {
    const pos = await geoPos();
    $("sd-lat").value = pos.coords.latitude.toFixed(6);
    $("sd-lng").value = pos.coords.longitude.toFixed(6);
    toast(T.locCaptured, "success");
  } catch {
    toast(T.couldNotGetLoc, "error");
  }
};

window.siteSaveCoords = async locId => {
  const lat = parseFloat($("sd-lat")?.value);
  const lng = parseFloat($("sd-lng")?.value);
  const ml = val("sd-ml").trim();
  if (isNaN(lat) || isNaN(lng)) {
    toast(T.enterValidCoords, "error");
    return;
  }
  try {
    await dbSetLocation(locId, {
      lat: lat,
      lng: lng,
      map_link: ml || null
    });
    toast(PL().detailsSaved, "success");
    await openSiteDetail(locId);
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

window.siteToggleFinished = async (locId, finished) => {
  try {
    await dbSetLocationFinished(locId, finished);
    toast(finished ? PL().siteFinished : PL().siteReactivated, finished ? "warning" : "success");
    if (S.mgrTab === "locations" && !document.getElementById("sd-tabbar")) mTab("locations"); else await openSiteDetail(locId);
  } catch (e) {
    toast("Error: " + e.message, "error");
  }

window.openWFModal = (heading, bodyHtml) => {
  const h = $("wf-modal-heading");
  if (h) h.textContent = heading;
  const b = $("wf-modal-body");
  if (b) b.innerHTML = bodyHtml;
  const m = $("wfModal");
  if (m) m.classList.add("show");
};

window.closeWFModal = () => {
  const m = $("wfModal");
  if (m) m.classList.remove("show", "locked");
  if (S._suspendIdle) {
    S._suspendIdle = false;
    _resetInactiveTimer();
  }
};

function _daysUntil(iso) {
  if (!iso) return null;
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return null;
  const today = new Date;
  today.setHours(0, 0, 0, 0);
  return Math.round((d.getTime() - today.getTime()) / 864e5);
}

function _bellHidden(key) {
  return _readKeys("wf_bell_hidden").indexOf(key) >= 0;
}

  return _readKeys("wf_notif_dismissed").indexOf(key) >= 0;
}

window.dismissBell = (key, ev) => {
  if (ev) ev.stopPropagation();
  const a = _readKeys("wf_bell_hidden");
  if (a.indexOf(key) < 0) {
    a.push(key);
    _writeKeys("wf_bell_hidden", a);
  }
  updateNotifyBadge();
  _renderBellPanel();
};

window.dismissNotif = (key, ev) => {
  if (ev) ev.stopPropagation();
  const a = _readKeys("wf_notif_dismissed");
  if (a.indexOf(key) < 0) {
    a.push(key);
    _writeKeys("wf_notif_dismissed", a);
  }
  updateNotifyBadge();
  if (S.mgrTab === "notifications") mTab("notifications");
  _renderBellPanel();
};

window.restoreNotif = (key, ev) => {
  if (ev) ev.stopPropagation();
  _writeKeys("wf_notif_dismissed", _readKeys("wf_notif_dismissed").filter(x => x !== key));
  _writeKeys("wf_bell_hidden", _readKeys("wf_bell_hidden").filter(x => x !== key));
  updateNotifyBadge();
  if (S.mgrTab === "notifications") mTab("notifications");
  _renderBellPanel();
};

let NOTIFY_WINDOW = (() => {
  const v = parseInt(localStorage.getItem("wf_notify_window"));
  return v >= 1 && v <= 365 ? v : 10;
})();

window.setNotifyWindow = v => {
  let n = parseInt(v);
  if (!(n >= 1)) n = 10;
  n = Math.max(1, Math.min(365, n));
  NOTIFY_WINDOW = n;
  localStorage.setItem("wf_notify_window", String(n));
  // Also persisted server-side (wf_config.notify_window) — this is a
  // per-browser display setting, but the push-notification cron job runs
  // with no browser at all, so it needs its own copy of this number.
  dbSetConfig({
    notify_window: n
  }).catch(() => {});
  mTab("notifications");

function _initials(str) {

  return s.slice(0, 2).toUpperCase();
}

function _notifyItems(users, vehicles, windowDays, properties) {
  const P = PL();
  const items = [];
  const push = (kind, refId, name, field, fieldKey, iso) => {
    const d = _daysUntil(iso);
    if (d === null) return;
    if (d <= windowDays) items.push({
      kind: kind,
      refId: refId,
      subjName: name,
      fieldLabel: field,
      iso: iso,
      dleft: d,
      key: kind + ":" + refId + ":" + fieldKey
    });
  };
  users.filter(u => u.role === "worker" && !_isArchived(u)).forEach(u => {
    const nm = disp(u.label || u.username);
    push("worker", u.username, nm, P.docExpiry, "doc", u.doc_expiry);
    push("worker", u.username, nm, P.permitExpiry, "permit", u.permit_expiry);
    push("worker", u.username, nm, P.idoneitaExpiry, "idoneita", u.idoneita_expiry);
    push("worker", u.username, nm, P.patenteExpiry, "patente", u.patente_expiry);
    push("worker", u.username, nm, P.contractExpiry, "contract", u.contract_expiry);
  });
  vehicles.forEach(v => {
    const nm = esc(v.plate || v.model || "—");
    push("vehicle", v.id, nm, P.inspection, "inspection", v.inspection_date);
    push("vehicle", v.id, nm, P.insuranceExpiry, "insurance", v.insurance_expiry);
    push("vehicle", v.id, nm, P.roadTaxExpiry, "roadtax", v.road_tax_expiry);
  });
  (properties || []).forEach(p => {
    const nm = disp(p.name || "—");
    push("property", p.id, nm, P.contractEnd, "propcontract", p.contract_end);
    const due = _nextRentDue(p.rent_day);
    if (due) push("property", p.id, nm, P.rentDueLabel, "rent:" + due, due);
  });
  items.forEach(i => {
    i.dismissed = _isDismissed(i.key);
    i.bellHidden = _bellHidden(i.key) || i.dismissed;
  });
  return items;
}

async function _renderBellPanel() {
  const p = document.getElementById("bellPanel");
  if (!p || p.style.display === "none") return;
  const P = PL();
  try {
    const [users, vehicles, props] = await Promise.all([ dbListUsersCached(), dbListVehiclesCached(), dbListPropertiesCached() ]);
    const items = _notifyItems(users, vehicles, NOTIFY_WINDOW, props).filter(i => !i.bellHidden).sort((a, b) => a.dleft - b.dleft);
    const head = `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--bg1)">\n      <span style="font-family:var(--font);font-size:13px;font-weight:800;color:var(--text)">${P.bellTitle}${items.length ? ` <span style="color:var(--red)">(${items.length})</span>` : ""}</span>\n      <span onclick="_closeBell();mTab('notifications')" style="font-family:var(--font);font-size:11px;font-weight:700;color:var(--brand-ink);cursor:pointer">${P.viewAll}</span>\n    </div>`;
    if (!items.length) {
      p.innerHTML = head + `<div class="empty" style="padding:22px">${P.bellEmpty}</div>`;
      return;
    }
    p.innerHTML = head + items.map(it => {
      const od = it.dleft < 0, color = od ? "var(--red)" : "var(--orange)";
      const when = od ? P.expired : it.dleft === 0 ? P.expiresToday : P.expiresIn(it.dleft);
      return `<div onclick="openNotifSource('${esc(it.kind)}','${esc(it.refId)}')" style="display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border2);align-items:center;cursor:pointer">\n        ${_avatarHtml(it.subjName, 34)}\n        <div style="flex:1;min-width:0">\n          <div style="font-family:var(--font);font-size:13px;font-weight:800;color:var(--text)">${it.subjName}</div>\n          <div style="font-family:var(--font);font-size:11.5px;color:var(--muted);margin-top:2px">${it.fieldLabel} · <strong style="color:${color}">${when}</strong></div>\n        </div>\n        <button class="btn-sm" style="flex-shrink:0;padding:4px 10px;font-size:11px;background:var(--bg2);border:1px solid var(--border2);color:var(--muted)" onclick="dismissBell('${esc(it.key)}',event)">${P.ignore}</button>\n      </div>`;
    }).join("");
  } catch (e) {
    p.innerHTML = `<div class="empty" style="padding:20px">Error</div>`;
  }
}

window.saveWorkerForm = async username => {
  const P = PL();
  const d = _collectWorkerForm();
  const fields = {
    label: d.label,
    phone: d.phone,
    hourly_rate: d.hourly_rate,
    dob: d.dob,
    email: d.email,
    tax_code: d.tax_code,
    residence_permit: d.residence_permit,
    doc_expiry: d.doc_expiry,
    permit_expiry: d.permit_expiry,
    iban: d.iban,
    address: d.address,
    start_date: d.start_date,
    job_title: d.job_title,
    contract_type: d.contract_type,
    contract_date: d.contract_date,
    contract_expiry: d.contract_expiry,
    idoneita_expiry: d.idoneita_expiry,
    patente_expiry: d.patente_expiry,
    on_loan: d.on_loan,
    on_loan_details: d.on_loan_details
  };
  try {
    if (!username) {
      if (!d.label || !d.phone) {
        toast(P.required, "error");
        return;
      }
      const norm = normPhone(d.phone);
      if (!norm) {
        toast(P.invalidPhone, "error");
        return;
      }
      const existing = await dbGetPhone(norm);
      if (existing) {
        toast(P.workerExists, "error");
        return;
      }
      await dbSetPhone(norm, {
        phone: d.phone,
        label: d.label,
        rate: d.hourly_rate,
        used: false,
        added_at: Date.now()
      });
      const base = (d.label || "").toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "") || "w" + norm.slice(-6);
      const users = await dbListUsers();
      const newUser = users.find(x => x.username === base) ? base + "_" + norm.slice(-4) : base;
      // Only true when this create-form was reached via the "+ Nuovo
      // lavoratore (in arrivo)" button (window.openOnboardWorker), not the
      // normal "+ Add worker" flow — keeps this worker out of the regular
      // Employees list until they're actually assigned to a site.
      const onboarding = !!S._newWorkerOnboarding;
      S._newWorkerOnboarding = false;
      await dbSetUser(newUser, {
        password: norm,
        role: "worker",
        worker_status: "confirmed",
        onboarding: onboarding,
        ...fields
      });
      // A photo picked in the create form (before the account existed) is
      // staged in memory — upload it now that the account is real, before
      // navigating to the profile so it shows up on first render.
      if (window._pendingCreatePhoto) {
        try {
          await _uploadWorkerPhotoFile(newUser, window._pendingCreatePhoto);
        } catch (e) {
          console.warn("photo upload during worker creation failed", e);
        }
        window._pendingCreatePhoto = null;
      }
      toast(P.workerAdded, "success");
      _clearUsersCache();
      _liveCache = null;
      await openWorkerProfile(newUser);
      updateNotifyBadge();
    } else {
      if (!d.label) {
        toast(P.required, "error");
        return;
      }
      await dbSetUser(username, fields);
      const norm = normPhone(d.phone);
      if (norm) {
        await dbSetPhone(norm, {
          phone: d.phone,
          label: d.label,
          rate: d.hourly_rate
        });
      }
      toast(P.detailsSaved, "success");
      _clearUsersCache();
      _liveCache = null;
      await openWorkerProfile(username);
      updateNotifyBadge();
    }
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

window.onSlotPicked = async (username, slotKey, input, category, label) => {
  const P = PL();
  const cat = category || "document";
  try {
    const file = input && input.files && input.files[0];
    if (!file) {
      return;
    }
    console.log("[upload] file picked:", file.name, file.type || "(no mime)", file.size + " bytes", "slot=" + slotKey, "cat=" + cat);
    const type = (file.type || "").toLowerCase();
    const name = (file.name || "").toLowerCase();
    const isHeic = type.indexOf("heic") >= 0 || type.indexOf("heif") >= 0 || /\.(heic|heif)$/.test(name);
    const isPdf = type === "application/pdf" || /\.pdf$/.test(name);
    const isImage = (type.startsWith("image/") || /\.(jpe?g|png|webp)$/.test(name)) && !isHeic;
    if (isHeic) {
      toast(P.heicUnsupported, "error");
      input.value = "";
      return;
    }
    if (!isImage && !isPdf) {
      toast(P.badType, "error");
      input.value = "";
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      toast(P.tooBigPre, "error");
      input.value = "";
      return;
    }
    if (isImage) toast(P.compressing, "info");
    console.log("[upload] preparing payload… isImage=", isImage, "isPdf=", isPdf);
    let dataUrl = null;
    if (isImage) {
      try {
        dataUrl = await _compressImage(file, 1600, .72);
      } catch (err) {
        console.error("compress failed, storing original", err);
        try {
          dataUrl = await _fileToDataURL(file);
        } catch (err2) {
          console.error(err2);
          toast(P.imgUnreadable, "error");
          input.value = "";
          return;
        }
      }
    } else {
      try {
        dataUrl = await _fileToDataURL(file);
      } catch (err) {
        console.error(err);
        toast(P.imgUnreadable, "error");
        input.value = "";
        return;
      }
    }
    if (!dataUrl) {
      toast(P.imgUnreadable, "error");
      input.value = "";
      return;
    }
    console.log("[upload] payload ready:", dataUrl.length, "chars");
    if (STORAGE_PROVIDER === "db") {
      const used = await dbDocsStorageBytes();
      if (used + dataUrl.length > DOC_STORAGE_SOFT) {
        toast(P.storageFull, "error");
        input.value = "";
        return;
      }
    }
    const stored = await storagePut(dataUrl, {
      name: file.name,
      owner: username
    });
    const slot = DOC_SLOTS.find(s => s.k === slotKey);

// Core upload logic shared by two call sites: the normal "change photo"
// button on an already-saved worker's profile (onWorkerPhotoPicked below),
// and the new-worker creation form (stageNewWorkerPhoto + saveWorkerForm),
// where a photo can now be picked before the account even exists yet — it's
// held in memory and uploaded right after the account is created. Returns
// true on success, false on a handled validation failure (toast already
// shown), and throws on an unexpected error so callers can decide how to
// report it.
// Checks a picked photo and shrinks it to a small JPEG. Returns null, having
// told the user why, if it can't be used.
async function _photoToJpeg(file) {
  const P = PL();
  const type = (file.type || "").toLowerCase();
  const name = (file.name || "").toLowerCase();
  const isHeic = type.indexOf("heic") >= 0 || type.indexOf("heif") >= 0 || /\.(heic|heif)$/.test(name);
  const isImage = (type.startsWith("image/") || /\.(jpe?g|png|webp)$/.test(name)) && !isHeic;
  if (isHeic) {
    toast(P.heicUnsupported, "error");
    return null;
  }
  if (!isImage) {
    toast(P.badType, "error");
    return null;
  }
  if (file.size > 12 * 1024 * 1024) {
    toast(P.tooBigPre, "error");
    return null;
  }
  toast(P.compressing, "info");
  try {
    return await _compressImage(file, 640, .85);
  } catch (err) {
    console.error("photo compress failed", err);
    toast(P.imgUnreadable, "error");
    return null;
  }
}

async function _uploadWorkerPhotoFile(username, file) {
  const dataUrl = await _photoToJpeg(file);
  if (!dataUrl) return false;
  const oldRef = (await dbGetUser(username))?.photo_url || null;
  const stored = await storagePut(dataUrl, {
    name: file.name,
    owner: username
  });
  await dbSetUser(username, {
    photo_url: stored
  });
  await _clientAudit("worker_photo_changed", username, {});
  if (oldRef && oldRef.indexOf("obj:") === 0 && oldRef !== stored) {
    fetch("/api/storage?key=" + encodeURIComponent(oldRef.slice(4)), {
      method: "DELETE",
      headers: _authHeaders()
    }).catch(() => {});
  }
  return true;
}

function _dataUrlToBlob(dataUrl) {
  const comma = dataUrl.indexOf(",");
  const header = dataUrl.slice(0, comma);
  const body = dataUrl.slice(comma + 1);
  const mime = (header.match(/data:([^;]+)/) || [ , "application/octet-stream" ])[1];
  const isB64 = header.indexOf("base64") >= 0;
  const raw = isB64 ? atob(body) : decodeURIComponent(body);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return new Blob([ bytes ], {
    type: mime
  });
}

window.openDocFile = async (id, btn) => {
  const orig = btn ? btn.textContent : "";
  try {
    if (btn) {
      btn.disabled = true;
      btn.style.opacity = ".6";
      btn.textContent = "…";
    }
    const d = await dbGetDocFile(id);
    if (!d || !d.file_url) {
      toast(lang === "ar" ? "الملف غير موجود" : "File non trovato", "error");
      return;
    }
    let url = null, revoke = false;
    try {
      const r = await storageUrl(d.file_url);
      url = r.url;
      revoke = r.revoke;
    } catch (err) {
      console.error("could not resolve file", err);
    }
    if (!url) {
      toast(lang === "ar" ? "تعذّر فتح الملف" : "Impossibile aprire il file", "error");
      return;
    }
    const isPdf = d.file_url.indexOf("application/pdf") >= 0 || /\.pdf$/i.test(d.file_url);
    if (isPdf && !revoke) {
      try {
        const resp = await fetch(url);
        if (resp.ok) {
          url = URL.createObjectURL(await resp.blob());
          revoke = true;
        }
      } catch (err) {
        console.error("pdf blob fetch failed, falling back to direct url", err);
      }
    }
    openDocViewer(url, d.title || "documento", isPdf, revoke);
  } catch (e) {
    console.error(e);
    toast("Error: " + e.message, "error");
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = "";
      btn.textContent = orig;
    }
  }
};

window.openPropertyProfile = async (id, edit) => {
  const panel = $("mpanel");
  if (!panel) return;
  toggleSidebar(false);

async function buildPropertyProfile(id, edit) {
  const P = PL();

  const editing = isCreate || !!edit;
  const workers = users.filter(u => u.role === "worker" && (!_isArchived(u) || u.username === p.responsible_username)).sort(byName);
  const uByName = {};
  users.forEach(u => uByName[u.username] = u);
  const respName = p.responsible_username && uByName[p.responsible_username] ? disp(uByName[p.responsible_username].label || uByName[p.responsible_username].username) : "";

  if (editing) {
    const row = (id2, label, value, type = "text", extra = "") => `<div class="sf"><label class="lbl">${label}</label><input id="${id2}" type="${type}" value="${esc(value == null ? "" : value)}" ${extra}/></div>`;
    const kindOpt = (v, l) => `<option value="${v}" ${(p.kind || "apartment") === v ? "selected" : ""}>${l}</option>`;

    return header + `\n    <div class="panel-card">\n      <div class="pc-title">${isCreate ? P.newProperty : P.editProperty}</div>\n      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">\n        ${row("p-name", P.propName, p.name)}\n        <div class="sf"><label class="lbl">${P.propKind}</label><select id="p-kind" onchange="document.getElementById('p-kind-other-wrap').style.display=this.value==='other'?'':'none'">${kindOpt("apartment", P.apartment)}${kindOpt("warehouse", P.warehouse)}${kindOpt("other", P.other)}</select></div>\n        <div class="sf" id="p-kind-other-wrap" style="${(p.kind || "apartment") === "other" ? "" : "display:none"}"><label class="lbl">${P.otherKindLabel}</label><input id="p-kind-other" type="text" value="${esc(p.kind_other || "")}"/></div>\n        <div class="sf"><label class="lbl">${P.responsible}</label><select data-ss id="p-resp">${respOpts}</select></div>\n        ${row("p-rentday", P.rentDay, p.rent_day, "number", 'min="1" max="31"')}\n        ${row("p-rentamt", P.rentAmount, p.rent_amount, "number", 'min="0" step="0.01"')}\n        ${row("p-cstart", P.contractStart, p.contract_start, "date")}\n        ${row("p-cend", P.contractEnd, p.contract_end, "date")}\n      </div>\n      <div class="sf" style="margin-top:6px"><label class="lbl">${P.propAddress}</label><input id="p-address" type="text" value="${esc(p.address || "")}"/></div>\n      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">\n        <button class="btn btn-gold" style="width:auto;padding:11px 22px" onclick="saveProperty('${esc(id || "")}')">${P.save}</button>\n        <button class="btn btn-dark" style="width:auto;padding:11px 22px" onclick="${isCreate ? "mTab('properties')" : `openPropertyProfile('${esc(id)}',false)`}">${P.cancel}</button>\n      </div>\n    </div>`;

}

window.saveProperty = async id => {
  const P = PL();
  const name = (val("p-name") || "").trim();
  if (!name) {
    toast(P.propNameNeeded, "error");
    return;
  }
  let rentDay = parseInt(val("p-rentday"), 10);
  if (!(rentDay >= 1 && rentDay <= 31)) rentDay = null;
  const d = {
    kind: val("p-kind") || "apartment",
    kind_other: val("p-kind") === "other" ? (val("p-kind-other") || "").trim() || null : null,
    name: name,
    address: (val("p-address") || "").trim(),
    rent_day: rentDay,
    rent_amount: parseFloat(val("p-rentamt")) || 0,
    contract_start: val("p-cstart") || "" || null,
    contract_end: val("p-cend") || "" || null,
    responsible_username: val("p-resp") || "" || null
  };
  try {
    const newId = id || "prop_" + Date.now();
    await dbSetProperty(newId, d);
    _clearPropsCache();
    toast(P.propSaved, "success");
    updateNotifyBadge();
    await openPropertyProfile(newId, false);
  } catch (e) {
    toast("Error: " + e.message, "error");
  }
};

async function buildNotifications() {
  const P = PL();
  const [users, vehicles, props, needsReview] = await Promise.all([ dbListUsersCached(), dbListVehiclesCached(), dbListPropertiesCached(), dbListNeedsReview() ]);
  const all = _notifyItems(users, vehicles, NOTIFY_WINDOW, props);
  const active = all.filter(i => !i.dismissed);
  const overdue = active.filter(i => i.dleft < 0).sort((a, b) => a.dleft - b.dleft);
  const upcoming = active.filter(i => i.dleft >= 0).sort((a, b) => a.dleft - b.dleft);
  const ignoredList = all.filter(i => i.dismissed).sort((a, b) => a.dleft - b.dleft);

    const w = userMapNR[s.worker];
    const wName = disp(w?.label || w?.username || s.worker);
    return `<div onclick="openNeedsReviewShift('${esc(s.id)}','${esc(s.worker)}')" style="cursor:pointer" class="panel-card-wrap"><div class="panel-card" style="border-left:4px solid var(--orange);background:var(--orange-soft);display:flex;align-items:center;gap:12px;flex-wrap:wrap">\n      ${_avatarHtml(wName, 42)}\n      <div style="flex:1;min-width:0">\n        <div style="font-family:var(--font);font-size:15px;font-weight:800;color:var(--text)">${wName}</div>\n        <div style="font-family:var(--font);font-size:12px;color:var(--muted);margin-top:3px">${esc(s.date || "—")} · ${disp(s.location_name || "—")} · ${lang === "ar" ? "بدأت" : lang === "it" ? "Iniziato" : "Started"} ${fmtTime(s.start_time)}</div>\n      </div>\n      <span class="badge by">⚠ ${lang === "ar" ? "تحتاج مراجعة" : lang === "it" ? "DA VERIFICARE" : "NEEDS REVIEW"}</span>\n    </div></div>`;
  }).join("")}</div>`;
  const rowHtml = it => {

    const when = od ? P.expired : it.dleft === 0 ? P.expiresToday : P.expiresIn(it.dleft);
    const kindBadge = it.kind === "worker" ? P.worker : it.kind === "property" ? P.property : P.vehicle;
    const btns = it.dismissed ? `<button class="btn-sm" style="background:var(--bg2);border:1px solid var(--border2);color:var(--text)" onclick="restoreNotif('${esc(it.key)}',event)">${P.restore}</button>` : `<button class="btn-sm" style="background:var(--bg2);border:1px solid var(--border2);color:var(--muted)" onclick="dismissNotif('${esc(it.key)}',event)">${P.ignore}</button>`;
    return `<div onclick="openNotifSource('${esc(it.kind)}','${esc(it.refId)}')" style="cursor:pointer" class="panel-card-wrap"><div class="panel-card" style="border-left:4px solid ${color};background:${bg};display:flex;align-items:center;gap:12px;flex-wrap:wrap;${it.dismissed ? "opacity:.65;" : ""}">\n      ${_avatarHtml(it.subjName, 42)}\n      <div style="flex:1;min-width:0">\n        <div style="font-family:var(--font);font-size:15px;font-weight:800;color:var(--text)">${it.subjName}\n          <span class="badge" style="background:var(--bg2);border:1px solid var(--border2);color:var(--muted);font-size:10px;margin-${lang === "ar" ? "right" : "left"}:6px">${kindBadge}</span>\n          ${it.dismissed ? `<span class="badge" style="background:var(--bg2);border:1px solid var(--border2);color:var(--muted);font-size:10px;margin-${lang === "ar" ? "right" : "left"}:4px">${P.ignored}</span>` : ""}\n        </div>\n        <div style="font-family:var(--font);font-size:12px;color:var(--muted);margin-top:3px">${it.fieldLabel}: <strong style="color:${color}">${esc(it.iso)}</strong> · ${when}</div>\n      </div>\n      <div style="display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0">${btns}</div>\n    </div></div>`;
  };
  const section = (title, arr, accent) => !arr.length ? "" : `\n    <div style="display:flex;align-items:center;gap:10px;margin:18px 0 10px">\n      <span style="width:8px;height:8px;border-radius:50%;background:${accent}"></span>\n      <span style="font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:${accent}">${title}</span>\n      <span style="font-family:var(--font);font-size:12px;color:var(--muted)">(${arr.length})</span>\n      <div style="flex:1;height:1px;background:var(--border2)"></div>\n    </div>\n    <div style="display:flex;flex-direction:column;gap:12px">${arr.map(rowHtml).join("")}</div>`;

}

async function buildSalary(per = "month") {
  const allWorkers = (await dbListUsersCached()).filter(u => u.role === "worker").sort(byName);
  const now2 = new Date;
  let allS;
  if (per === "today") {
    allS = await dbListShiftsToday();
  } else if (per === "week" || per === "month") {
    allS = await dbListShiftsMonth(now2.getFullYear(), now2.getMonth() + 1);
  } else {
    allS = await dbListShifts();
  }
  // Anyone archived during the period still has to be paid for it.
  const workers = allWorkers.filter(w => !_isArchived(w) || allS.some(s => s.worker === w.username));
  const locNames = [ ...new Set(allS.map(s => s.location_name).filter(Boolean)) ].sort();
  return `<div style="margin-bottom:14px">\n    <select class="btn-dark" style="padding:8px 12px;border-radius:3px;font-family:var(--font);font-size:11px;width:auto" id="sp" onchange="reSalary()">\n      <option value="today" ${per === "today" ? "selected" : ""}>${T.today}</option>\n      <option value="week"  ${per === "week" ? "selected" : ""}>${T.week}</option>\n      <option value="month" ${per === "month" ? "selected" : ""}>${T.month}</option>\n      <option value="all"   ${per === "all" ? "selected" : ""}>${T.all}</option>\n    </select>\n  </div>\n  <div class="table-wrap"><table><thead><tr>\n    <th>${T.workerCol}</th><th>${T.phoneCol}</th><th>${T.rateCol}</th>\n    ${locNames.map(l => `<th style="color:#f59a44"> ${disp(l)}</th>`).join("")}\n    <th>${T.totalHrsCol}</th><th style="color:var(--brand-ink)">${T.totalSalaryCol}</th><th>${T.shiftsCol}</th>\n  </tr></thead><tbody>\n    ${!workers.length ? `<tr><td colspan="${4 + locNames.length}"><div class="empty">${T.noW}</div></td></tr>` : workers.map(w => {
    const ws = allS.filter(s => s.worker === w.username && s.status === "completed" && inP(s, per));
    const th = ws.reduce((a, s) => a + (parseFloat(s.work_hours) || 0), 0);
    const workerRate = parseFloat(w.hourly_rate) || 0;
    const total = ws.reduce((a, s) => a + (parseFloat(s.earnings) || 0), 0);

async function _getPushSubscription() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  try {
    // .ready never settles if the service worker can't register (private
    // browsing, for one), and that used to hang the whole worker screen.
    const reg = await Promise.race([ navigator.serviceWorker.ready, new Promise(res => setTimeout(() => res(null), 3e3)) ]);
    return reg ? await reg.pushManager.getSubscription() : null;
  } catch (e) {
    return null;
  }
}

// Called right after every successful login (both roles). Two jobs:
//
//   1. First time EVER on this device: silently trigger the same flow the
//      "Enable Notifications" button uses, which is what actually shows
//      the browser/OS's native permission popup. This is the one-time
//      prompt the person signs in and immediately gets, no button hunt
//      required.
//   2. Every login after that: if the browser already granted permission
//      (from step 1, on a previous visit), re-run the same subscribe call
//      silently in the background. Browser permission and the SERVER's
//      subscription record are two different things — permission, once
//      granted, is remembered by the browser forever, but the server-side
//      row can go stale (redeploys, a cleared subscription, etc.). Redoing
//      this quietly on every login keeps the two in sync without ever
//      asking the person to press "Enable" again on a device that already
//      said yes once. If permission was denied, this does nothing, every
//      time — never re-nags.
async function _autoSyncPush(isWorker) {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
    if (typeof Notification === "undefined") return;
    if (Notification.permission === "denied") return;
    if (isWorker) await window.enablePushNotificationsWorker(true);
    else await window.enablePushNotifications(true);
  } catch (e) {
    console.warn("[push] auto-sync on login failed", e);
  }
}

// `silent` is used by the auto-sync-on-login flow (see _autoSyncPush) so it
// can run in the background without popping a toast or jumping the screen
// to Settings every time — the visible button still calls this the normal
// (non-silent) way and gets the full feedback.
window.enablePushNotifications = async (silent) => {
  const msg = (m) => { if (!silent) toast(m, "error"); };
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    msg(lang === "ar" ? "الإشعارات غير مدعومة على هذا الجهاز." : lang === "it" ? "Le notifiche non sono supportate su questo dispositivo." : "Push notifications aren't supported on this device.");
    return;
  }
  try {
    // Once the browser has already decided (granted or denied), asking
    // again via requestPermission() doesn't show a popup a second time —
    // it just resolves instantly with the same answer. So calling this
    // silently on every login is safe: it only ever shows the native
    // permission popup the very first time, on this device, ever.
    const perm = await Notification.requestPermission();
    if (perm !== "granted") {
      msg(lang === "ar" ? "تم رفض إذن الإشعارات." : lang === "it" ? "Permesso notifiche negato." : "Notification permission denied.");
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const {sub: sub, isNew: isNew} = await _ensurePushSub(reg);
    if (silent && !isNew && _pushSyncedRecently(sub)) return;
    const res = await fetch("/api/push-subscribe", {
      method: "POST",
      headers: _authHeaders({
        "Content-Type": "application/json"
      }),
      body: JSON.stringify({
        subscription: sub.toJSON ? sub.toJSON() : sub
      })
    });
    const data = await res.json().catch(() => null);
    if (!data || !data.ok) throw new Error(data && data.error || "Failed");
    _markPushSynced(sub);
    if (!silent) {
      toast(lang === "ar" ? "تم تفعيل الإشعارات على هذا الجهاز" : lang === "it" ? "Notifiche attivate su questo dispositivo" : "Notifications enabled on this device", "success");
      await mTab("settings");
    }
  } catch (e) {
    console.error("push subscribe failed", e);
    msg(lang === "ar" ? "تعذر تفعيل الإشعارات." : lang === "it" ? "Impossibile attivare le notifiche." : "Could not enable notifications.");
  }
};

// Worker-facing versions of the two functions above — same browser APIs,
// but they save the subscription through the no-session worker endpoint
// (see push-subscribe-worker.js) and re-render the worker drawer instead
// of the manager Settings tab.
window.enablePushNotificationsWorker = async (silent) => {
  const msg = m => { if (!silent) toast(m, "error"); };
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    msg(lang === "ar" ? "الإشعارات غير مدعومة على هذا الجهاز." : lang === "it" ? "Le notifiche non sono supportate su questo dispositivo." : "Push notifications aren't supported on this device.");
    return;
  }
  try {
    // Same as the manager version — safe to call on every login, since the
    // native popup only ever appears once per device; after that this just
    // resolves with whatever the user already answered.
    const perm = await Notification.requestPermission();
    if (perm !== "granted") {
      msg(lang === "ar" ? "تم رفض إذن الإشعارات." : lang === "it" ? "Permesso notifiche negato." : "Notification permission denied.");
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const {sub: sub, isNew: isNew} = await _ensurePushSub(reg);
    if (silent && !isNew && _pushSyncedRecently(sub)) return;
    const res = await fetch("/api/push-subscribe", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: S.user.username,
        deviceId: DEVICE_ID,
        subscription: sub.toJSON ? sub.toJSON() : sub
      })
    });
    const data = await res.json().catch(() => null);
    if (!data || !data.ok) throw new Error(data && data.error || "Failed");
    _markPushSynced(sub);
    // Re-render either way, silent or not — the drawer's button reflects
    // whatever _getPushSubscription() finds at render time, and that
    // render only happens once right after login (opening/closing the
    // drawer itself doesn't re-check). Without this, a silent auto-sync
    // would genuinely enable notifications in the background but the
    // button would still say "Enable" until some unrelated re-render
    // happened to run later — exactly the "still shows enable, why do I
    // have to press it again" symptom. Toast and force-opening the drawer
    // stay gated behind !silent so a background sync on login doesn't pop
    // the drawer open or show a toast every single time. Only when something
    // changed, or every login would load the worker screen twice.
    if ((isNew || !silent) && S.screen === "worker") await renderWorkerScreen();
    if (!silent) {
      toast(lang === "ar" ? "تم تفعيل الإشعارات" : lang === "it" ? "Notifiche attivate" : "Notifications enabled", "success");
      toggleWorkerDrawer(true);
    }
  } catch (e) {
    console.error("worker push subscribe failed", e);
    msg(lang === "ar" ? "تعذر تفعيل الإشعارات." : lang === "it" ? "Impossibile attivare le notifiche." : "Could not enable notifications.");
  }
};

window.handleDrop = e => {
  e.preventDefault();
  const f = e.dataTransfer?.files[0] || e.target.files[0];
  if (!f) return;
  if (e.target.value !== undefined) e.target.value = "";
  const isXlsx = f.name.match(/\.xlsx?$/i);
  if (isXlsx) {
    if (typeof XLSX === "undefined") {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = () => readXlsx(f);
      s.onerror = () => toast(" Failed to load Excel reader", "error");
      document.head.appendChild(s);
    } else {
      readXlsx(f);
    }
  } else {
    const r = new FileReader;
    r.onload = ev => procFile(ev.target.result);
    r.readAsText(f);
  }
};

function readXlsx(f) {
  const r = new FileReader;
  r.onload = ev => {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), {
        type: "array"
      });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {
        header: 1,
        defval: ""
      });
      const lines = rows.map(row => row.map(c => String(c).trim()).join(","));
      procFile(lines.join("\n"));
    } catch (err) {
      toast(" Could not read Excel file: " + err.message, "error");
    }
  };
  r.readAsArrayBuffer(f);
}

async function procFile(text) {
  const defR = parseFloat(val("nr")) || 15;
  const lines = text.split(/[\r\n]+/).map(l => l.trim()).filter(Boolean);
  let added = 0, skipped = 0;
  for (const line of lines) {
    if (/^(phone|number|name|label|rate|#)/i.test(line)) {
      skipped++;
      continue;
    }
    const parts = line.split(/[\t,;|]+/).map(p => p.trim()).filter(Boolean);
    if (!parts.length) {
      skipped++;
      continue;
    }
    let phone = "", label = "", rate = defR;
    const isPhone = v => /^\d{6,15}$/.test(v.replace(/[\s\-\+\(\)\.]/g, ""));
    const isNum = v => /^\d+(\.\d+)?$/.test(v);
    const col0 = parts[0] || "", col1 = parts[1] || "", col2 = parts[2] || "";
    if (isPhone(col0)) {
      phone = col0;
      if (col1 && !isNum(col1)) {
        label = col1;
        if (col2 && isNum(col2)) rate = parseFloat(col2);
      } else if (col1 && isNum(col1)) {
        rate = parseFloat(col1);
      }
    } else {
      parts.forEach(p => {
        const d = p.replace(/[\s\-\+\(\)\.]/g, "");
        if (/^\d{6,15}$/.test(d) && !phone) phone = p; else if (isNum(p) && phone) rate = parseFloat(p); else if (p && !label && !isNum(p)) label = p;
      });
    }
    if (!phone) {
      skipped++;
      continue;
    }
    const norm = normPhone(phone);
    if (!norm) {
      skipped++;
      continue;
    }
    const ex = await dbGetPhone(norm);
    if (ex) {
      skipped++;
      continue;
    }
    await dbSetPhone(norm, {
      phone: phone.trim(),

const FMT_EUR = '"€"#,##0.00';

const FMT_HRS = "0.00";

function _xlsxAutoCols(aoa) {
  const colCount = aoa.reduce((m, r) => Math.max(m, r.length), 0);
  const cols = [];
  for (let c = 0; c < colCount; c++) {
    let w = 8;
    for (let r = 0; r < aoa.length; r++) {
      const v = aoa[r][c];
      const len = v == null ? 0 : String(v).length;
      if (len > w) w = len;
    }
    cols.push({
      wch: Math.min(Math.max(w + 2, 10), 44)
    });
  }
  return cols;
}

function _xlsxBuildSheet(XLSX, aoa, numberFormats) {
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = _xlsxAutoCols(aoa);
  if (ws["!ref"]) {
    const range = XLSX.utils.decode_range(ws["!ref"]);
    ws["!autofilter"] = {
      ref: XLSX.utils.encode_range({
        s: {
          r: 0,
          c: range.s.c
        },
        e: {
          r: 0,
          c: range.e.c
        }
      })
    };
    ws["!freeze"] = {
      xSplit: 0,
      ySplit: 1,
      topLeftCell: "A2",
      activePane: "bottomLeft",
      state: "frozen"
    };
    if (numberFormats) {
      for (let r = 1; r <= range.e.r; r++) {
        for (const c in numberFormats) {
          const addr = XLSX.utils.encode_cell({
            r: r,
            c: Number(c)
          });
          const cell = ws[addr];
          if (cell && typeof cell.v === "number") {
            cell.t = "n";
            cell.z = numberFormats[c];
          }
        }
      }
    }
  }
  return ws;
}

window.closeMonth = async () => {

  });

  const totalEarnings = monthShifts.reduce((a, s) => a + (parseFloat(s.earnings) || 0), 0);

  }
  if (!monthShifts.length) {
    toast(`No completed shifts found for ${monthName}`, "warning");
    return;
  }
  const fmtExcel = ts => {
    if (!ts) return "—";
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return "—";
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const periodLabel = monthName;
  const s1 = [ [ "Worker", "Phone", "Hourly Rate (€)", "Site / Location", "Date", "Check-In", "Check-Out", "Work Hours", "Earnings (€)", "Status" ] ];
  monthShifts.sort((a, b) => Number(b.start_time) - Number(a.start_time)).forEach(s => {
    const u = um[s.worker];
    s1.push([ cleanName(u?.label || s.worker), u?.phone || "", parseFloat(u?.hourly_rate || s.hourly_rate || 0), cleanName(s.location_name || "—"), s.date, fmtExcel(s.start_time), fmtExcel(s.end_time), parseFloat((parseFloat(s.work_hours) || 0).toFixed(2)), parseFloat((parseFloat(s.earnings) || 0).toFixed(2)), cleanName(s.status) ]);
  });
  const locNames = [ ...new Set(monthShifts.map(s => s.location_name).filter(Boolean)) ].sort((a, b) => cleanName(a).localeCompare(cleanName(b), undefined, {
    sensitivity: "base"
  }));
  const s2 = [ [ "Worker", "Phone", "Hourly Rate (€)", ...locNames.map(l => `Hours @ ${cleanName(l)}`), "Total Hours", "Total Salary (€)", "Shifts", "Period" ] ];
  const workerKeysInMonth = [ ...new Set(monthShifts.map(s => s.worker)) ].sort((a, b) => cleanName(um[a]?.label || um[a]?.username || a).localeCompare(cleanName(um[b]?.label || um[b]?.username || b), undefined, {
    sensitivity: "base"
  }));
  workerKeysInMonth.forEach(wUsername => {

    s2.push([ displayName, phone, rate, ...locHrs, parseFloat(th.toFixed(2)), parseFloat(total.toFixed(2)), ws.length, periodLabel ]);
  });
  const filename = `workforce-${fileTag}.xlsx`;
  const script = document.createElement("script");
  script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  script.onload = () => {
    const wb = XLSX.utils.book_new();
    const ws1 = _xlsxBuildSheet(XLSX, s1, {
      2: FMT_EUR,
      7: FMT_HRS,
      8: FMT_EUR
    });
    const sumFmts = {
      2: FMT_EUR
    };
    locNames.forEach((_, i) => {
      sumFmts[3 + i] = FMT_HRS;
    });
    sumFmts[3 + locNames.length] = FMT_HRS;
    sumFmts[4 + locNames.length] = FMT_EUR;
    const ws2 = _xlsxBuildSheet(XLSX, s2, sumFmts);
    XLSX.utils.book_append_sheet(wb, ws1, "Shifts");
    XLSX.utils.book_append_sheet(wb, ws2, "Salary Summary");
    XLSX.writeFile(wb, filename);
    toast(` ${monthName} exported as ${filename}`, "success");
  };
  script.onerror = () => {
    const csv = s1.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = filename.replace(".xlsx", ".csv");
    a.click();
    toast("Exported as CSV", "warning");
  };
  document.head.appendChild(script);
};

// ── Monthly Hours PDF ────────────────────────────────────────────
// A separate, simpler export from doExport()/closeMonth() above: a
// printable attendance-style grid for one CALENDAR month (day 1 through
// the last day of that month), one column per worker, one row per day,
// each cell the hours that worker logged that day. Deliberately independent
// of the pay-cycle (20th→19th) grouping the Excel exports use, since a
// calendar-month grid is what was asked for here — the Excel exports are
// untouched by any of this.
let _pdfLibsPromise = null;
function _loadPdfLibs() {
  if (window.jspdf && window.jspdf.jsPDF && typeof window.jspdf.jsPDF.API.autoTable === "function") return Promise.resolve();
  if (_pdfLibsPromise) return _pdfLibsPromise;
  _pdfLibsPromise = new Promise((resolve, reject) => {
    const s1 = document.createElement("script");
    s1.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s1.onload = () => {
      const s2 = document.createElement("script");
      s2.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js";
      s2.onload = () => resolve();
      s2.onerror = () => reject(new Error("autotable load failed"));
      document.head.appendChild(s2);
    };
    s1.onerror = () => reject(new Error("jspdf load failed"));
    document.head.appendChild(s1);
  });
  return _pdfLibsPromise;
}

async function _fetchImageAsDataURL(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("image fetch failed: " + res.status);
  const blob = await res.blob();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("image read failed"));
    reader.readAsDataURL(blob);
  });
}

window.exportMonthlyHoursPdf = async () => {
  const monthInput = document.getElementById("pdf-month");
  const now0 = new Date;
  const monthVal = (monthInput && monthInput.value) || `${now0.getFullYear()}-${String(now0.getMonth() + 1).padStart(2, "0")}`;
  const [year, monthNum] = monthVal.split("-").map(Number);
  if (!year || !monthNum) {
    toast("Invalid month", "error");
    return;
  }
  const daysInMonth = new Date(year, monthNum, 0).getDate();
  const monthLocale = lang === "ar" ? "ar-EG" : lang === "it" ? "it-IT" : "en-GB";
  const monthLabel = new Date(year, monthNum - 1, 1).toLocaleDateString(monthLocale, {
    month: "long",
    year: "numeric"
  });

  toast(" " + T.loading, "info");

  const shifts = await dbListShifts();
  const users = await dbListUsers();
  const um = {};
  users.filter(u => u.role === "worker").forEach(u => um[u.username] = u);

  const monthShifts = shifts.filter(s => {
    if (s.status !== "completed" || !s.date) return false;
    const [y, m] = s.date.slice(0, 10).split("-").map(Number);
    return y === year && m === monthNum;
  });

  if (!monthShifts.length) {
    toast(lang === "ar" ? "لا توجد ورديات مكتملة لهذا الشهر" : lang === "it" ? "Nessun turno completato per questo mese" : `No completed shifts found for ${monthLabel}`, "warning");
    return;
  }

  const workerKeys = [ ...new Set(monthShifts.map(s => s.worker)) ].sort((a, b) => cleanName(um[a]?.label || a).localeCompare(cleanName(um[b]?.label || b), undefined, {
    sensitivity: "base"
  }));

  const hoursByDay = {};
  for (let d = 1; d <= daysInMonth; d++) hoursByDay[d] = {};
  monthShifts.forEach(s => {
    const day = Number(s.date.slice(8, 10));
    if (!day || day < 1 || day > daysInMonth) return;
    hoursByDay[day][s.worker] = (hoursByDay[day][s.worker] || 0) + (parseFloat(s.work_hours) || 0);
  });

  const totals = {};
  workerKeys.forEach(k => totals[k] = 0);
  for (let d = 1; d <= daysInMonth; d++) workerKeys.forEach(k => {
    totals[k] += hoursByDay[d][k] || 0;
  });

  try {
    await _loadPdfLibs();
  } catch (e) {
    toast("Could not load PDF library — check your connection", "error");
    return;
  }
  const logoDataUrl = await _fetchImageAsDataURL("/logo-horizontal.png").catch(() => null);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({
    orientation: "landscape",
    unit: "pt",
    format: "a4"
  });

  // 5 workers per page — each page shows the FULL month (every day 1→last,
  // plus a Total row) for that group of 5, at a comfortable, non-shrinking
  // font. More workers just means more pages, not smaller text.
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 40;
  const dayColW = 30;
  const WORKERS_PER_PAGE = 5;
  const chunks = [];
  for (let i = 0; i < workerKeys.length; i += WORKERS_PER_PAGE) chunks.push(workerKeys.slice(i, i + WORKERS_PER_PAGE));

  chunks.forEach((chunkKeys, idx) => {
    const usableW = pageW - marginX * 2 - dayColW;
    const workerColW = usableW / chunkKeys.length;
    const columnStyles = {
      0: {
        fontStyle: "bold",
        fillColor: [ 245, 245, 245 ],
        cellWidth: dayColW
      }
    };
    chunkKeys.forEach((_, i) => {
      columnStyles[i + 1] = {
        cellWidth: workerColW
      };
    });

    const head = [ [ T.pdfDay || "Day", ...chunkKeys.map(k => cleanName(um[k]?.label || k)) ] ];
    const body = [];
    for (let d = 1; d <= daysInMonth; d++) {
      body.push([ String(d), ...chunkKeys.map(k => {
        const h = hoursByDay[d][k];
        return h ? fmtNum(h, 1) : "—";
      }) ]);
    }
    body.push([ T.total || "TOTAL", ...chunkKeys.map(k => fmtNum(totals[k], 1)) ]);

    if (idx > 0) doc.addPage();

    doc.autoTable({
      head,
      body,
      startY: 70,
      tableWidth: usableW + dayColW,
      styles: {
        font: "helvetica",
        fontSize: 9,
        halign: "center",
        cellPadding: 3,
        overflow: "linebreak"
      },
      headStyles: {
        fillColor: [ 232, 128, 28 ],
        textColor: 255,
        fontStyle: "bold",
        fontSize: 9
      },
      columnStyles,
      didParseCell: data => {
        // Bold the TOTAL row so it stands out from the daily rows above it.
        if (data.row.index === body.length - 1) data.cell.styles.fontStyle = "bold";
      },
      didDrawPage: () => {
        if (logoDataUrl) {
          try {
            doc.addImage(logoDataUrl, "PNG", marginX, 18, 120, 33);
          } catch (e) {}
        }
        doc.setFontSize(13);
        doc.setTextColor(40, 40, 40);
        doc.text(monthLabel, pageW - marginX, 32, {
          align: "right"
        });
        if (chunks.length > 1) {
          doc.setFontSize(9);
          doc.setTextColor(120, 120, 120);
          doc.text(`Page ${doc.internal.getNumberOfPages()} / ${chunks.length}`, pageW - marginX, 46, {
            align: "right"
          });
        }
      },
      margin: {
        top: 70,
        left: marginX,
        right: marginX
      }
    });
  });

  const fname = `hours-${monthVal}.pdf`;
  doc.save(fname);
  toast(` ${monthLabel} exported as ${fname}`, "success");
};

  }
  try {
    const rows = await sql("SELECT id,worker,date,start_time,end_time,work_hours,earnings,hourly_rate,location_name,location_id,status,billing_start_time,break_minutes FROM wf_shifts WHERE id=$1 LIMIT 1", [ _attendanceEditShiftId ]);
    const shift = rows[0];
    if (!shift) {
      showErr(lang === "ar" ? "الوردية غير موجودة." : lang === "it" ? "Turno non trovato." : "Shift not found.");
      return;
    }
    const origDate = shift.date || todayStr();
    const [sy, sm, sd] = origDate.split("-").map(Number);
    const [sh, smin] = startStr.split(":").map(Number);
    const startDate = new Date(sy, sm - 1, sd, sh, smin, 0, 0);
    // Pay starts at the corrected check-in, under the usual rule: arriving before
    // the site's start time still pays from the start time. Saving with check-in
    // untouched keeps the shift's own values, so correcting only the check-out
    // can't move anything else.
    const startUnchanged = fmtTime(shift.start_time) === startStr;
    const newStartMs = startUnchanged ? Number(shift.start_time) : startDate.getTime();
    // Pay can never start before check-in, which also repairs a shift corrected
    // back when editing check-in didn't reach the pay.
    let newBillingStart = Math.max(Number(shift.billing_start_time) || newStartMs, newStartMs);
    if (!startUnchanged) {
      const siteLoc = shift.location_id ? (await dbListLocationsCached()).find(l => l.id === shift.location_id) : null;
      const [oh, om] = (siteLoc && siteLoc.start_time || "07:00").split(":").map(Number);
      newBillingStart = Math.max(newStartMs, new Date(sy, sm - 1, sd, oh, om, 0, 0).getTime());
    }
    let newEndMs = null;
    let newWorkHours = null;
    let newEarnings = null;
    let newStatus = shift.status;
    if (endStr) {
      const [eh, emin] = endStr.split(":").map(Number);
      const endDate = new Date(sy, sm - 1, sd, eh, emin, 0, 0);
      newEndMs = endDate.getTime();
      if (newEndMs <= newStartMs) {
        showErr(T.attCheckoutAfter);
        return;
      }
      const r = _finalizeShift(newBillingStart, newEndMs, null, shift.break_minutes, _attendanceEditHourlyRate, newEndMs);
      newWorkHours = r.netWorkHours;
      newEarnings = r.earnings;
      newStatus = "completed";
    } else {
      newStatus = shift.status === "needs_review" ? "needs_review" : "working";
    }
    await sql(`UPDATE wf_shifts SET start_time=$2, end_time=$3, work_hours=$4, earnings=$5, status=$6, billing_start_time=$7 WHERE id=$1`, [ _attendanceEditShiftId, newStartMs, newEndMs, newWorkHours, newEarnings, newStatus, newBillingStart ]);
    await _clientAudit("shift_manually_edited", shift.worker, { shiftId: _attendanceEditShiftId, date: origDate });
    _liveCache = null;
    toast(T.attUpdateSuccess, "success");
    closeAttendanceModal();
    await mTab("live");
    loadSummary();
  } catch (e) {
    showErr((T.failedToSave || (x => "Error: " + x))(e.message));
  }
};

// ── Worker roster rules ──────────────────────────────────────────
function _isArchived(u) {
  return !!u && (u.archived === true || u.archived === "true");
}

// Everyone expected on site today: no archived workers, and none still
// waiting for their first day.
function _isRosterWorker(u) {
  return u.role === "worker" && !_isArchived(u) && !u.onboarding;
}

// On-loan and paused workers aren't expected on site, so they don't count as
// absent. Costs no query: it uses data the dashboard has already loaded.
function _absentWorkers(allUsers, todayShifts) {
  const seen = new Set(todayShifts.map(s => s.worker));
  return allUsers.filter(u => _isRosterWorker(u) && !u.on_loan && u.worker_status !== "paused" && !seen.has(u.username)).sort(byName);
}

// ── Photos ───────────────────────────────────────────────────────
// Signs a whole roster of photos in one request instead of one per photo.
async function _photoMapFor(users) {
  const map = {};
  const need = [];
  await Promise.all(users.filter(u => u.photo_url).map(async u => {
    const ref = u.photo_url;
    const cached = _storageUrlCache.get(ref);
    if (cached && cached.expiresAt > Date.now()) {
      map[u.username] = cached.url;
    } else if (ref.indexOf("obj:") === 0) {
      need.push(u);
    } else {
      try {
        map[u.username] = (await storageUrl(ref)).url;
      } catch (e) {}
    }
  }));
  if (!need.length) return map;
  try {
    const res = await fetch("/api/storage", {
      method: "POST",
      headers: _authHeaders({
        "Content-Type": "application/json"
      }),
      body: JSON.stringify({
        action: "sign-many",
        keys: need.map(u => u.photo_url.slice(4))
      })
    });
    const data = await res.json().catch(() => null);
    const urls = data && data.urls || {};
    need.forEach(u => {
      const url = urls[u.photo_url.slice(4)];
      if (!url) return;
      map[u.username] = url;
      _storageUrlCache.set(u.photo_url, {
        url: url,
        expiresAt: Date.now() + STORAGE_URL_CACHE_MS
      });
    });
  } catch (e) {
    console.warn("[photos] bulk signing failed", e);
  }
  return map;
}

function _photoOrAvatar(url, name, size) {

}

async function _workerPhotoApi(action, extra) {
  const res = await fetch("/api/storage", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: action,
      username: S.user.username,
      deviceId: DEVICE_ID,
      ...extra
    })
  });
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || !data.ok) throw new Error(data && data.error || "Storage error");
  return data;
}

async function _refreshWorkerPhoto() {
  const u = S.user;
  if (!u || !u.photo_url || !navigator.onLine) return;
  if (S._wkPhoto && S._wkPhoto.expiresAt > Date.now()) return;
  try {
    const data = await _workerPhotoApi("worker-photo-read");
    if (!data.url || S.user !== u && S.user?.username !== u.username) return;
    S._wkPhoto = {
      url: data.url,
      expiresAt: Date.now() + STORAGE_URL_CACHE_MS
    };
    const el = $("wk-photo");
    if (el) el.innerHTML = _photoOrAvatar(data.url, u.label || u.username, 34);
  } catch (e) {
    console.warn("[photo] could not load own photo", e);
  }
}

window.openWorkerPhotoPrompt = () => {
  const N = NX();
  const hasPhoto = !!(S.user && S.user.photo_url);
  // With no photo yet this can't be dismissed, only left by signing out. A
  // worker whose camera won't work signs out, and gets in once the manager has
  // added a photo to their profile.
  const required = !hasPhoto;
  // Taking a photo sends the app to the background, and the idle timer would
  // sign the worker out mid-upload.
  S._suspendIdle = true;
  clearTimeout(_inactiveTimer);
  clearTimeout(_sleepTimer);
  openWFModal(hasPhoto ? N.photoChange : N.photoTitle, `
    <div class="info-box" style="margin-bottom:16px">${N.photoAsk}</div>

      <button class="btn btn-gold" onclick="document.getElementById('wk-cam').click()">${N.photoTake}</button>
      <button class="btn btn-dark" onclick="document.getElementById('wk-gal').click()">${N.photoGallery}</button>
      <button class="btn btn-dark" onclick="${required ? "doLogout()" : "closeWFModal()"}">${required ? T.logout : T.cancel}</button>
    </div>
    <input id="wk-cam" type="file" accept="image/*" capture="user" style="display:none" onchange="onWorkerSelfPhoto(this)"/>
    <input id="wk-gal" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="onWorkerSelfPhoto(this)"/>`);
  $("wfModal").classList.toggle("locked", required);
};

window.onWorkerSelfPhoto = async input => {
  const N = NX();
  const file = input && input.files && input.files[0];
  if (!file) return;
  const status = $("wk-photo-status"), actions = $("wk-photo-actions");
  const busy = on => {
    if (status) {
      status.textContent = N.photoUploading;
      status.style.display = on ? "" : "none";
    }
    if (actions) actions.style.display = on ? "none" : "flex";
  };
  try {
    const dataUrl = await _photoToJpeg(file);
    if (!dataUrl) return;
    busy(true);
    const {key: key, url: url} = await _workerPhotoApi("worker-upload-url");
    const put = await fetch(url, {
      method: "PUT",
      headers: {
        "Content-Type": "image/jpeg"
      },
      body: _dataUrlToBlob(dataUrl)
    });
    if (!put.ok) throw new Error("Upload failed (" + put.status + ")");
    const fin = await _workerPhotoApi("worker-finalize", {
      key: key
    });
    S.user.photo_url = fin.ref;
    S._wkPhoto = {
      url: fin.url,
      expiresAt: Date.now() + STORAGE_URL_CACHE_MS
    };
    const el = $("wk-photo");
    if (el) el.innerHTML = _photoOrAvatar(fin.url, S.user.label || S.user.username, 34);
    closeWFModal();
    toast(N.photoDone, "success");
  } catch (e) {
    console.error("worker photo upload failed", e);
    busy(false);
    toast(N.photoFailed, "error");
  } finally {
    if (input) input.value = "";
  }
};

// A subscription made under an older VAPID key can never receive pushes signed
// with the current one, and the browser keeps returning it, so that device
// would stay silent for good. Replace it.
async function _ensurePushSub(reg) {
  let sub = await reg.pushManager.getSubscription();
  const curKey = sub && sub.options && sub.options.applicationServerKey;
  if (curKey) {
    const a = new Uint8Array(curKey), b = _urlB64ToUint8Array(VAPID_PUBLIC_KEY);
    if (a.length !== b.length || a.some((x, i) => x !== b[i])) {
      await sub.unsubscribe().catch(() => {});
      sub = null;
    }
  }
  const isNew = !sub;
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: _urlB64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }
  return {
    sub: sub,
    isNew: isNew
  };
}

// Re-saving an unchanged subscription on every login costs database queries
// for nothing. Once a day per person per device keeps the server row fresh.
function _pushSyncKey(sub) {
  return (S.user && S.user.username || "") + "|" + sub.endpoint;
}

function _pushSyncedRecently(sub) {
  try {
    const r = JSON.parse(localStorage.getItem("wf_push_sync") || "null");
    return !!r && r.k === _pushSyncKey(sub) && Date.now() - r.at < 864e5;
  } catch (e) {
    return false;
  }
}

function _markPushSynced(sub) {
  localStorage.setItem("wf_push_sync", JSON.stringify({
    k: _pushSyncKey(sub),
    at: Date.now()
  }));
}
