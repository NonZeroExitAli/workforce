<body>
<div id="grid"></div>

<div id="root"><div class="center"><div class="spin" style="width:40px;height:40px;border-width:4px"></div></div></div>

<div class="toast" id="toast"></div>

<!-- Edit Worker Modal -->
<div class="modal-bg" id="editModal">
  <div class="card" style="max-width:500px;max-height:90vh;overflow-y:auto">
    <div class="modal-title">EDIT WORKER</div>
    <div class="sf"><label class="lbl">Username</label><input id="em-name" disabled/></div>
    <div class="sf"><label class="lbl">Phone</label><input id="em-phone" disabled/></div>
    <div class="sf rh">
      <label class="lbl" style="color:#f0c040">&#128176; Hourly Rate ($)</label>
      <input type="number" id="em-rate" min="1" step="0.5"/>
    </div>
    <div class="sf"><label class="lbl">Shift Start</label><input type="time" id="em-shift"/></div>
    <div class="sf gh">
      <label class="lbl" style="color:#2ecc71">&#128205; Worker GPS Location</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        <div><label class="lbl" style="color:#aaa">Latitude</label><input type="number" id="em-lat" step="0.000001" placeholder="e.g. 24.688000"/></div>
        <div><label class="lbl" style="color:#aaa">Longitude</label><input type="number" id="em-lng" step="0.000001" placeholder="e.g. 46.722000"/></div>
      </div>
      <div class="sf">
        <label class="lbl">📍 Google Maps Link</label>
        <div style="display:flex;gap:8px;align-items:flex-start">
          <input id="em-maplink" placeholder="https://maps.google.com/maps?q=24.688,46.722" style="flex:1"/>
          <button class="btn btn-dark" style="width:auto;padding:8px 14px;font-size:11px;flex-shrink:0;border-color:#2ecc7155;color:#2ecc71" onclick="getEditCoords()">📌 Get Coords</button>
        </div>
        <div class="hint" style="margin-top:4px">Paste a Google Maps link and click Get Coords to fill lat/lng automatically</div>
      </div>
      <button class="btn btn-dark" style="width:auto;padding:7px 14px;font-size:11px;margin-top:4px" onclick="pickLocForWorker()">&#128205; Use My Current Location</button>
      <div class="hint" style="margin-top:6px">Worker must be within 1000m and location must be enabled to log in</div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-dark" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" style="flex:1" onclick="saveWorkerEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Change Password Modal (Manager) -->
<div class="modal-bg" id="pwdModal">
  <div class="card" style="max-width:400px">
    <div class="modal-title">&#128274; Change Password</div>
    <div class="sf"><label class="lbl">Current Password</label><input type="password" id="pw-current"/></div>
    <div class="sf"><label class="lbl">New Password (min 6 chars)</label><input type="password" id="pw-new"/></div>
    <div class="sf"><label class="lbl">Confirm New Password</label><input type="password" id="pw-confirm"/></div>

      <button class="btn btn-gold" onclick="doChangePwd()">Save New Password</button>
      <button class="btn btn-dark" onclick="doSetDefaultPwd()" style="background:rgba(231,76,60,.1);border-color:rgba(231,76,60,.3);color:#e74c3c">&#128257; Set Default (mohamed123321)</button>
      <button class="btn btn-dark" onclick="closePwdModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  DB credentials are stored securely as Netlify environment
//  variables and accessed via /.netlify/functions/sql
//  Nothing sensitive is stored here.
// ═══════════════════════════════════════════════════════════

const GPS_RADIUS       = 1000;  // metres
const MGR_DEFAULT_PASS = 'mohamed123321';
const DB_READY = true;

// ── Neon Serverless API (CORS-safe, works in any browser) ──
// Uses the official Neon REST API:  POST /v2/projects/{project}/branches/{branch}/query
// Docs: https://api-docs.neon.tech/reference/executesqlquery
async function sql(query, params = []) {
  const res = await fetch("/.netlify/functions/sql", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, params })
  });

  const data = await res.json().catch(() => null);
  if (!data || !data.ok) {
    throw new Error(data?.error || `SQL failed (${res.status})`);
  }
  return data.rows || [];
}

// ── DB helpers ──
async function dbGetUser(u) {
  const r = await sql('SELECT * FROM wf_users WHERE username=$1 LIMIT 1', [u]);
  return r[0] || null;
}
async function dbSetUser(u, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_users(username,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(username) DO UPDATE SET ${setCols}`,
    [u, ...vals]
  );
}
async function dbListUsers() { return sql('SELECT * FROM wf_users'); }

async function dbGetPhone(norm) {
  const r = await sql('SELECT * FROM wf_phones WHERE norm=$1 LIMIT 1', [norm]);
  return r[0] || null;
}
async function dbSetPhone(norm, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_phones(norm,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(norm) DO UPDATE SET ${setCols}`,
    [norm, ...vals]
  );
}
async function dbListPhones() { return sql('SELECT * FROM wf_phones ORDER BY added_at DESC'); }
async function dbDelPhone(norm) { await sql('DELETE FROM wf_phones WHERE norm=$1', [norm]); }

async function dbGetConfig() {
  const r = await sql('SELECT * FROM wf_config WHERE id=1 LIMIT 1');
  return r[0] || { shift_start:'09:00', grace:10, std_hours:8, ot_rate:1.5, late_deduct:0 };
}
async function dbSetConfig(d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+1}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+1}`).join(',');
  await sql(
    `INSERT INTO wf_config(id,${cols}) VALUES(1,${placeholders})
     ON CONFLICT(id) DO UPDATE SET ${setCols}`,
    [...vals]
  );
}

async function dbListShifts() { return sql('SELECT * FROM wf_shifts ORDER BY start_time DESC'); }
async function dbSetShift(id, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_shifts(id,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(id) DO UPDATE SET ${setCols}`,
    [id, ...vals]
  );
}
async function dbDelAllShifts() { await sql('DELETE FROM wf_shifts'); }

async function dbListAlerts() { return sql('SELECT * FROM wf_alerts ORDER BY ts DESC'); }
async function dbSetAlert(id, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_alerts(id,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(id) DO UPDATE SET ${setCols}`,
    [id, ...vals]
  );
}

// ── Create tables + seed default manager ──
async function initDB() {

// ── Extract coordinates from Google Maps URL ──
// Handles all known Google Maps URL formats including short links
function extractCoordsFromMapsLink(url) {
  if (!url) return null;
  const u = url.trim();
  // Short URL — cannot extract coords without resolving redirect
  if (/goo\.gl|maps\.app\.goo\.gl/.test(u)) return null; // needs server-side resolve
  if (!u.includes('google') && !u.includes('maps.google')) return null;
  const COORD = '(-?\\d{1,3}\\.\\d{4,})'; // require ≥4 decimal places for accuracy
  const patterns = [
    new RegExp(`[?&]q=${COORD},${COORD}`),         // ?q=lat,lng
    new RegExp(`[?&]ll=${COORD},${COORD}`),         // ?ll=lat,lng
    new RegExp(`/@${COORD},${COORD}`),              // /@lat,lng,zoom
    new RegExp(`/place/${COORD},${COORD}`),         // /place/lat,lng
    new RegExp(`[?&]daddr=${COORD},${COORD}`),      // daddr=lat,lng
    new RegExp(`[?&]destination=${COORD},${COORD}`),
    new RegExp(`[?&]center=${COORD},${COORD}`),
    new RegExp(`[?&]saddr=${COORD},${COORD}`),
    new RegExp(`!3d${COORD}!4d${COORD}`),           // /data=!3d{lat}!4d{lng}
    new RegExp(`${COORD}\\+${COORD}`),            // lat+lng URL-encoded
  ];
  for (const p of patterns) {
    const m = u.match(p);
    if (m) {
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) return { lat, lng };
    }
  }
  return null;
}
// Async version — tries instant parse first, then warns about short URLs
async function extractCoordsAsync(url) {
  if (!url) return null;
  const instant = extractCoordsFromMapsLink(url);
  if (instant) return instant;
  if (/goo\.gl|maps\.app\.goo\.gl/.test(url)) {
    return { _shortUrl: true }; // signal to caller
  }
  return null;
}

function haversine(la1,lo1,la2,lo2) {
  const R=6371000,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

  navigator.geolocation

    : rej(new Error('gps_unavailable'))
);

// ════════════════════════ LOGIN — GPS + Device Lock ════════════════════════
window.doLogin=async()=>{
  if(!rateLimit('login',1500)) return;
  const u=val('lu').trim().toLowerCase(), p=val('lp');
  const errEl=$('lerr');
  errEl.style.display='none';

  const showErr=msg=>{errEl.textContent=msg;errEl.style.display='block';};
  const btn=document.querySelector('#lf .btn-gold');
  if(btn){btn.disabled=true;btn.textContent='Checking…';}

  try {
    const user=await dbGetUser(u);
    if(!user||user.password!==p){showErr(T.badLogin);return;}

    if(user.role==='worker'){
      // ── Hard device lock ──
      if(!user.device_id){
        await dbSetUser(u,{device_id:DEVICE_ID});
        user.device_id=DEVICE_ID;
      } else if(user.device_id!==DEVICE_ID){
        // Log blocked attempt
        await dbSetAlert('blk_'+Date.now()+'_'+u,{type:'device_blocked',worker:u,phone:user.phone||'',blocked_device:DEVICE_ID,ts:Date.now(),resolved:false});
        showErr(T.deviceBlocked); return;
      }

      // ── GPS fence on login ──
      if (user.worker_lat && user.worker_lng) {
        if (!navigator.geolocation) { showErr(T.gpsRequired); return; }
        if (btn) btn.textContent = '📍 Requesting location…';
        try {
          const pos = await geoPos(15000);
          const userLat = pos.coords.latitude;
          const userLng = pos.coords.longitude;
          const workLat = parseFloat(user.worker_lat);
          const workLng = parseFloat(user.worker_lng);
          const dist    = Math.round(haversine(userLat, userLng, workLat, workLng));
          S.gpsDist = dist;
          if (dist > GPS_RADIUS) {
            const over = dist - GPS_RADIUS;
            showErr(`${T.gpsFarLogin}\n📏 You are ${dist}m away (${over}m outside the ${GPS_RADIUS}m zone).`);
            return;
          }
          S.gps = 'ok';
        } catch(gpsErr) {
          // Distinguish permission denied vs timeout vs unavailable
          const code = gpsErr.code; // 1=PERMISSION_DENIED 2=UNAVAILABLE 3=TIMEOUT
          if (code === 1) showErr('📍 Location permission denied. Please allow location access and try again.');
          else if (code === 3) showErr('📍 Location timed out. Move to an area with better signal and retry.');
          else showErr(T.gpsLoginErr);
          return;
        }
      }
    }

    S.user=user;
    if(user.role==='manager') renderManagerScreen();
    else renderWorkerScreen();
  } finally {
    if(btn){btn.disabled=false;btn.textContent=T.signIn+' →';}
  }
};

// ════════════════════════ REGISTER ════════════════════════
window.doRegister=async()=>{
  if(!rateLimit('register',2000)) return;
  const u=val('ru').trim().toLowerCase(), ph=val('rph').trim();
  const err=msg=>{$('rerr').textContent=msg;$('rerr').style.display='block';};
  $('rerr').style.display='none';
  if(!u){err(T.namePassReq);return;}
  if(!/^[a-z0-9_\-\.]{2,30}$/.test(u)){err('Username: 2-30 lowercase letters/numbers only.');return;}
  if(!ph){err(T.phoneNoAuth);return;}
  const norm=normPhone(ph);
  if(norm.length<6){err(T.badPhoneNum);return;}
  const autoPass=norm; // password = phone digits (no leading zeros)
  const match=await dbGetPhone(norm);
  if(!match){err(T.phoneNoAuth);return;}
  const users=await dbListUsers();
  const linked=users.filter(x=>x.role==='worker'&&normPhone(x.phone||'')===norm);
  if(linked.length>=1){err(T.maxAcc);return;} // 1 account per phone
  if(users.find(x=>x.username===u)){err(T.userTaken);return;}
  await dbSetUser(u,{
    password:autoPass,role:'worker',phone:ph,
    hourly_rate:match.rate||15,shift_start:match.shift_start||'09:00',
    device_id:DEVICE_ID,map_link:match.map_link||'',
    worker_lat:match.worker_lat||null,worker_lng:match.worker_lng||null
  });
  await dbSetPhone(norm,{used:true});
  toast(T.accCreated,'success');
  S.authTab='login'; render();
  setTimeout(()=>{if($('lu'))$('lu').value=u;},50);
};

// ════════════════════════ SHIFT ACTIONS (start / end only) ════════════════════════
window.wAct=async action=>{
  if(!rateLimit('shift',800)) return;
  const now=Date.now();
  const cfg=await dbGetConfig();

  // Re-fetch from DB — no client manipulation
  const allShifts=await dbListShifts();
  const active=allShifts.find(x=>x.worker===S.user.username&&x.date===todayStr()&&x.status!=='completed');

  if(action==='start'){
    if(active){toast(T.already,'warning');return;}
    // Also block if already completed today (one shift per day)
    const doneToday=allShifts.find(x=>x.worker===S.user.username&&x.date===todayStr()&&x.status==='completed');
    if(doneToday){toast(T.already,'warning');return;}

    // GPS fence check at start
    const u=S.user;
    if(u.worker_lat&&u.worker_lng){
      try {
        const pos=await geoPos();
        const dist=haversine(pos.coords.latitude,pos.coords.longitude,u.worker_lat,u.worker_lng);
        S.gpsDist=Math.round(dist);
        if(dist>GPS_RADIUS){toast(`${T.gpsFar} (${S.gpsDist}m away)`,'error');return;}
        S.gps='ok';
      } catch {toast(T.gpsErr,'error');return;}
    }

    const [sh,sm]=(u.shift_start||cfg.shift_start||'09:00').split(':').map(Number);
    const exp=new Date();exp.setHours(sh,sm,0,0);
    const lateMs=now-exp.getTime();
    const isLate=lateMs>(cfg.grace||10)*60000;
    const lateMins=isLate?Math.floor(lateMs/60000):0;

    const id='s'+now;
    await dbSetShift(id,{worker:u.username,date:todayStr(),start_time:now,end_time:null,work_hours:null,earnings:null,hourly_rate:u.hourly_rate||0,is_late:isLate,late_mins:lateMins,status:'working'});
    S.shift={id,worker:u.username,date:todayStr(),start_time:now,status:'working',hourly_rate:u.hourly_rate||0,is_late:isLate,late_mins:lateMins};
    await renderWorkerScreen();
    startTimer();
    isLate?toast(T.lateMsg(lateMins),'warning'):toast(T.shiftStarted,'success');

  } else if(action==='end'){
    if(!active){toast(T.noEnd,'warning');return;}
    const endTime=now;
    const wMs=Math.max(0,endTime-active.start_time);
    const workHours=wMs/3600000;
    const earnings=workHours*(active.hourly_rate||0);
    await dbSetShift(active.id,{end_time:endTime,work_hours:workHours,earnings,status:'completed'});
    clearInterval(S.timerInt);S.shift=null;
    toast(T.endMsg(fmtDur(wMs),earnings.toFixed(2)),'success');
    await renderWorkerScreen();
  }
};

async function loadSummary(){
  const users=(await dbListUsers()).filter(u=>u.role==='worker');

  const phones=await dbListPhones();

  el.innerHTML=[

  ].map(([l,v,c])=>`<div class="info-card"><div class="il">${l}</div><div class="iv" style="color:${c}">${v}</div></div>`).join('');

function inP(s,per){
  const ts=Number(s.start_time);
  const d=ts?new Date(ts):new Date(s.date);
  const n=new Date();
  if(per==='today')return s.date===todayStr();
  if(per==='week'){const w=new Date(n);w.setDate(n.getDate()-n.getDay());w.setHours(0,0,0,0);return d>=w;}
  if(per==='month')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
  return true;
}

window.onNewMapLinkChange=()=>{
  const status=$('nml-status');
  if(!status) return;
  const url=val('nml').trim();
  if(!url){status.textContent='';return;}
  if(/goo\.gl|maps\.app\.goo\.gl/.test(url)){
    status.innerHTML='&#9888;&#65039; Short URL detected — click <strong>Get Coords</strong> to attempt extraction or open the link and copy the full URL';
    status.style.color='#f0c040';
  } else {
    const c=extractCoordsFromMapsLink(url);
    if(c){
      status.textContent='✓ Coordinates ready — press Get Coords to apply';
      status.style.color='#2ecc71';
    } else if(url.includes('google')){
      status.textContent='⚠ Could not auto-read this link format — try opening it and copying the full URL from the address bar';
      status.style.color='#e67e22';
    } else {
      status.textContent='⚠ Paste a Google Maps link (maps.google.com or google.com/maps)';
      status.style.color='#e74c3c';
    }
  }
};
window.getNewCoords=()=>{
  const url=val('nml').trim();
  const status=$('nml-status');
  if(!url){if(status)status.textContent='Paste a Google Maps link first';return;}
  const coords=extractCoordsFromMapsLink(url);
  if(coords){
    $('nlat').value=coords.lat.toFixed(6);
    $('nlng').value=coords.lng.toFixed(6);
    updateNewCoordPreview(coords.lat,coords.lng);
    if(status){status.textContent=`✓ Extracted: ${coords.lat.toFixed(6)}, ${coords.lng.toFixed(6)}`;status.style.color='#2ecc71';}
    toast('✓ Coordinates extracted from link','success');
  } else if(/goo\.gl|maps\.app\.goo\.gl/.test(url)){
    if(status){status.innerHTML='Short URLs cannot be resolved in the browser.<br>Open the link → copy the full URL from address bar → paste here.';status.style.color='#e74c3c';}
    toast('Short URL — open it first and copy the full address','warning');
  } else {
    if(status){status.textContent='No coordinates found in this link. Try a different Google Maps URL.';status.style.color='#e74c3c';}
    toast('No coordinates found in link','error');
  }
};
function updateNewCoordPreview(lat,lng){
  const el=$('ncoord-preview');
  if(!el) return;
  if(lat&&lng&&!isNaN(lat)&&!isNaN(lng)){
    el.textContent=`📌 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    el.style.display='block';
  } else {
    el.style.display='none';
  }
}
// watch manual lat/lng input
function watchNewCoords(){
  const lat=$('nlat'),lng=$('nlng');
  if(lat)lat.addEventListener('input',()=>updateNewCoordPreview(parseFloat(lat.value),parseFloat(lng?.value)));
  if(lng)lng.addEventListener('input',()=>updateNewCoordPreview(parseFloat($('nlat')?.value),parseFloat(lng.value)));
}

async function procFile(text){
  const defR=parseFloat(val('nr'))||15,defSh=val('nsh')||'09:00';
  const lines=text.split(/[\r\n]+/).map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0;
  for(const line of lines){
    if(/^(phone|number|name|label|rate|#)/i.test(line)){skipped++;continue;}
    const parts=line.split(/[\t,;|]+/).map(p=>p.trim()).filter(Boolean);
    let phone='',label='',rate=defR;
    parts.forEach(p=>{const d=p.replace(/[\s\-\+\(\)\.]/g,'');if(/^\d{6,15}$/.test(d)&&!phone)phone=p;else if(/^\d+(\.\d+)?$/.test(p)&&phone)rate=parseFloat(p);else if(p&&!label)label=p;});
    if(!phone){const r=line.replace(/[\s\-\+\(\)\.]/g,'');if(/^\d{6,15}$/.test(r))phone=line.trim();}
    if(!phone){skipped++;continue;}
    const norm=normPhone(phone);const ex=await dbGetPhone(norm);if(ex){skipped++;continue;}
    await dbSetPhone(norm,{phone:phone.trim(),label:label.trim(),rate,shift_start:defSh,map_link:'',worker_lat:null,worker_lng:null,used:false,added_at:Date.now()});
    added++;
  }
  toast(T.fileAdded(added,skipped),'success');mTab('addworker');loadSummary();
}

  const shifts=await dbListShifts();const users=await dbListUsers();
  const cfg=await dbGetConfig();
  const um={};users.filter(u=>u.role==='worker').forEach(u=>um[u.username]=u);
  const workers=users.filter(u=>u.role==='worker');

  const s1=[['Worker','Phone','Rate ($/hr)','Date','Start Time','End Time','Work Hours','Earnings ($)','Late?','Late Mins','Status']];
  shifts.sort((a,b)=>Number(b.start_time)-Number(a.start_time)).forEach(s=>{
    const u=um[s.worker];
    const tsStart=Number(s.start_time)||0;
    const tsEnd=Number(s.end_time)||0;
    const fmtExcel=ts=>{
      if(!ts)return'—';
      const d=new Date(ts);
      if(isNaN(d.getTime()))return'—';
      const pad=n=>String(n).padStart(2,'0');
      return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    s1.push([
      s.worker,
      u?.phone||'',
      parseFloat(u?.hourly_rate||s.hourly_rate||0),
      s.date,
      fmtExcel(tsStart),
      fmtExcel(tsEnd),
      parseFloat((parseFloat(s.work_hours)||0).toFixed(4)),
      parseFloat((parseFloat(s.earnings)||0).toFixed(2)),
      (s.is_late==true||s.is_late==='true'||s.is_late===1)?'Yes':'No',
      parseInt(s.late_mins)||0,
      s.status
    ]);
  });

  const now=new Date();
  const monthLabel=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const s2=[['Worker','Phone','Rate ($/hr)','Period Start','Period End','Total Hours','Regular Hrs','OT Hours','Regular Pay ($)','OT Pay ($)','Deductions ($)','Total Salary ($)','Shifts','Late Count','Month']];
  workers.forEach(w=>{
    // Cast all numeric fields from DB strings to numbers
    const ws=shifts.filter(s=>s.worker===w.username&&s.status==='completed').filter(s=>{
      const ts=Number(s.start_time);
      if(!ts)return false;
      const d=new Date(ts);
      return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    });
    const th=ws.reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);
    const lc=ws.filter(s=>s.is_late==true||s.is_late==='true'||s.is_late===1).length;
    const stdH=parseFloat(cfg.std_hours)||8;
    const otRate=parseFloat(cfg.ot_rate)||1.5;
    const lateDeduct=parseFloat(cfg.late_deduct)||0;
    const workerRate=parseFloat(w.hourly_rate)||0;
    const rh=Math.min(th,ws.length*stdH);
    const oh=Math.max(0,th-rh);
    const rp=rh*workerRate;
    const op=oh*workerRate*otRate;
    const dd=lc*lateDeduct;
    // Period start = earliest shift, period end = latest shift end
    const startTimes=ws.map(s=>Number(s.start_time)).filter(Boolean).sort((a,b)=>a-b);
    const endTimes=ws.map(s=>Number(s.end_time)).filter(Boolean).sort((a,b)=>b-a);
    const fmtExcel=ts=>{
      if(!ts)return'—';
      const d=new Date(ts);
      if(isNaN(d.getTime()))return'—';
      const pad=n=>String(n).padStart(2,'0');
      return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    const periodStart=startTimes.length?fmtExcel(startTimes[0]):'—';
    const periodEnd=endTimes.length?fmtExcel(endTimes[0]):'—';
    s2.push([
      w.username,
      w.phone||'',
      workerRate,
      periodStart,
      periodEnd,
      parseFloat(th.toFixed(4)),
      parseFloat(rh.toFixed(4)),
      parseFloat(oh.toFixed(4)),
      parseFloat(rp.toFixed(2)),
      parseFloat(op.toFixed(2)),
      parseFloat(dd.toFixed(2)),
      parseFloat(Math.max(0,rp+op-dd).toFixed(2)),
      ws.length,
      lc,
      monthLabel
    ]);
  });

  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload=()=>{
    const wb=XLSX.utils.book_new();
    const ws1=XLSX.utils.aoa_to_sheet(s1),ws2=XLSX.utils.aoa_to_sheet(s2);
    ws1['!cols']=[14,14,10,10,18,18,12,12,7,9,10].map(w=>({wch:w}));
    ws2['!cols']=[14,14,10,18,18,12,12,10,13,10,12,14,7,9,12].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws1,'Shifts');
    XLSX.utils.book_append_sheet(wb,ws2,'Monthly Salary');
    XLSX.writeFile(wb,`workforce_${todayStr()}.xlsx`);
    toast('✓ Excel exported (2 sheets)','success');
  };
  script.onerror=()=>{
    const csv=s1.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`workforce_${todayStr()}.csv`;a.click();
    toast('Exported as CSV','warning');
  };
  document.head.appendChild(script);
};

// ── Boot ──
init();
</script>
</body>
</html>
