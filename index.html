<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FlowForce — Plumbing Crew</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230d1b2a'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23b87333' stroke-width='3'/%3E%3Crect x='28' y='10' width='8' height='44' rx='4' fill='%23b87333'/%3E%3Crect x='10' y='28' width='44' height='8' rx='4' fill='%23b87333'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23e8a020'/%3E%3C/svg%3E"/>

<style>
:root{
  --bg:#060f18;
  --bg1:#0a1628;
  --bg2:#0e1e35;
  --bg3:#122444;
  --border:#1a3050;
  --border2:#1e3a60;
  --copper:#b87333;
  --copper2:#d4894a;
  --copper3:#e8a020;
  --steel:#7fa8c8;
  --steel2:#a8c8e0;
  --green:#00d084;
  --red:#ff4444;
  --orange:#ff8c00;
  --text:#d8eaf8;
  --muted:#3a6080;
  --dim:#0a1628;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  min-height:100vh;
  position:relative;
}
body.rtl{direction:rtl}

body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px),
    radial-gradient(circle at 20% 50%,rgba(184,115,51,.04) 0%,transparent 60%),
    radial-gradient(circle at 80% 20%,rgba(0,208,132,.03) 0%,transparent 50%);
  background-size:60px 60px,60px 60px,100% 100%,100% 100%;
  pointer-events:none;z-index:0;
}

body::after{
  content:'';
  position:fixed;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--copper),var(--copper2),var(--copper),transparent);
  z-index:999;
}

#grid{display:none}
#root{position:relative;z-index:1;min-height:100vh}

.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}

.brand-title{
  font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;
  font-size:clamp(52px,14vw,96px);
  font-weight:900;
  color:var(--text);
  letter-spacing:2px;
  line-height:.9;
  text-transform:uppercase;
  text-align:center;
}
.brand-title span{color:var(--copper2)}
.brand-sub{
  font-family:'Consolas','Courier New',monospace;
  font-size:10px;
  color:var(--muted);
  letter-spacing:4px;
  text-transform:uppercase;
  margin-top:10px;
  text-align:center;
}

.brand-icon{width:64px;height:64px;margin:0 auto 16px;position:relative;}
.brand-icon svg{width:100%;height:100%}

.auth-wrap{width:100%;max-width:480px}
.lang-bar{display:flex;gap:6px;margin-bottom:20px;justify-content:center;flex-wrap:wrap}
.lang-btn{
  padding:5px 14px;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--muted);
  font-size:11px;cursor:pointer;
  border-radius:2px;
  font-family:'Consolas','Courier New',monospace;
  letter-spacing:1px;
  transition:all .2s;
}
.lang-btn.active{background:var(--copper);color:#000;border-color:var(--copper);font-weight:700}
.lang-btn:hover:not(.active){border-color:var(--copper);color:var(--copper)}

.tabs{display:flex;border:1px solid var(--border2);border-radius:4px 4px 0 0;overflow:hidden}
.tab{flex:1;padding:12px;background:var(--bg2);color:var(--muted);border:none;font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;font-size:13px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:all .2s;font-weight:700}
.tab.active{background:var(--copper);color:#000;font-weight:800}

.card-body{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-top:none;
  border-radius:0 0 4px 4px;
  padding:28px;
  position:relative;
  overflow:hidden;
}
.card-body::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--copper),transparent);
}

.card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;
  padding:28px;
  width:100%;max-width:500px;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--copper),transparent);
}

.fg{display:flex;flex-direction:column;gap:14px}

label.lbl{
  display:block;
  font-family:'Consolas','Courier New',monospace;
  font-size:9px;letter-spacing:3px;
  color:var(--muted);text-transform:uppercase;margin-bottom:6px;
}

input,select{
  width:100%;padding:11px 14px;
  background:var(--bg);
  border:1px solid var(--border2);
  border-radius:3px;
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  font-size:13px;outline:none;
  transition:border-color .2s;
}
input:focus,select:focus{border-color:var(--copper);box-shadow:0 0 0 2px rgba(184,115,51,.15)}
input:disabled{background:var(--bg2);border-color:var(--border);color:var(--muted);cursor:not-allowed}

.btn{
  width:100%;padding:13px;border:none;
  border-radius:3px;
  font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;
  font-size:15px;letter-spacing:2px;
  cursor:pointer;font-weight:800;
  text-transform:uppercase;
  transition:all .2s;
}
.btn-gold{
  background:linear-gradient(135deg,var(--copper),var(--copper2));
  color:#000;
  box-shadow:0 4px 16px rgba(184,115,51,.3);
}
.btn-gold:hover{background:linear-gradient(135deg,var(--copper2),var(--copper3));transform:translateY(-1px);box-shadow:0 6px 20px rgba(184,115,51,.4)}
.btn-red{background:#c0392b;color:#fff}
.btn-red:hover{background:#e74c3c}
.btn-green{background:linear-gradient(135deg,#00a86b,#00d084);color:#000;box-shadow:0 4px 16px rgba(0,208,132,.2)}
.btn-blue{background:#1a6fa0;color:#fff}
.btn-dark{background:var(--bg2);color:var(--muted);border:1px solid var(--border2)}
.btn-dark:hover{border-color:var(--copper);color:var(--copper)}
.btn-sm{padding:7px 14px;border:none;border-radius:3px;font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;font-weight:700;text-transform:uppercase}

.err-box{color:#ff6b6b;font-family:'Consolas','Courier New',monospace;font-size:11px;padding:10px 14px;background:rgba(255,68,68,.07);border:1px solid rgba(255,68,68,.25);border-radius:3px;line-height:1.6;border-left:3px solid var(--red)}
.info-box{color:var(--steel2);font-family:'Consolas','Courier New',monospace;font-size:11px;padding:10px 14px;background:rgba(127,168,200,.07);border:1px solid rgba(127,168,200,.2);border-radius:3px;line-height:1.7}
.warn-box{color:#ffb347;font-family:'Consolas','Courier New',monospace;font-size:11px;padding:10px 14px;background:rgba(255,140,0,.07);border:1px solid rgba(255,140,0,.2);border-radius:3px;line-height:1.7;border-left:3px solid var(--orange)}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;min-height:58px;
  background:var(--bg1);
  border-bottom:1px solid var(--border2);
  position:sticky;top:0;z-index:100;
  flex-wrap:wrap;gap:8px;
}
.topbar::after{
  content:'';
  position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--copper),transparent);
  pointer-events:none;
}

.top-brand{
  font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;
  font-weight:900;font-size:22px;
  color:var(--text);letter-spacing:3px;
  text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.top-brand span{color:var(--copper2)}
.top-brand .pipe-dot{width:8px;height:8px;border-radius:50%;background:var(--copper);box-shadow:0 0 8px var(--copper);}

.top-right{display:flex;align-items:center;gap:8px;font-family:'Consolas','Courier New',monospace;font-size:11px;color:var(--muted);flex-wrap:wrap}
.role-pill{padding:3px 10px;border-radius:2px;font-size:9px;font-weight:700;font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}
.pill-mgr{background:var(--copper);color:#000}
.pill-wkr{background:rgba(0,208,132,.15);color:var(--green);border:1px solid rgba(0,208,132,.3)}
.logout-btn{
  padding:5px 12px;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--muted);
  font-family:'Consolas','Courier New',monospace;
  font-size:10px;cursor:pointer;
  border-radius:2px;
  letter-spacing:1px;
  transition:all .2s;
}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
.clock{font-family:'Consolas','Courier New',monospace;font-size:14px;color:var(--copper2);letter-spacing:2px}

.body{padding:24px;max-width:1200px;margin:0 auto}
.sec-title{
  font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;
  font-weight:900;font-size:32px;
  letter-spacing:4px;color:var(--text);
  text-transform:uppercase;margin-bottom:20px;
}
.sec-title span{color:var(--copper2)}

.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.info-card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;padding:16px;
  position:relative;overflow:hidden;
  transition:border-color .2s;
}
.info-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--border2)}
.info-card:hover{border-color:var(--copper)}
.info-card:hover::before{background:var(--copper)}
.info-card .il{font-family:'Consolas','Courier New',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.info-card .iv{font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;font-size:24px;font-weight:800;letter-spacing:1px}

.nav-tabs{
  display:flex;
  border-bottom:2px solid var(--border2);
  margin-bottom:24px;overflow-x:auto;
  gap:0;
}
.nav-tab{
  padding:12px 18px;
  background:none;border:none;
  border-bottom:3px solid transparent;
  color:var(--muted);
  font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;
  font-size:12px;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  white-space:nowrap;margin-bottom:-2px;
  transition:all .2s;font-weight:700;
}
.nav-tab:hover{color:var(--steel)}
.nav-tab.active{border-bottom-color:var(--copper);color:var(--copper)}

.stat-card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:6px;padding:28px;
  margin-bottom:20px;
  border-left:4px solid var(--border2);
  position:relative;overflow:hidden;
  transition:border-left-color .3s;
}
.stat-card::after{
  content:'';position:absolute;
  top:0;right:0;width:120px;height:120px;
  background:radial-gradient(circle,rgba(184,115,51,.04) 0%,transparent 70%);
  pointer-events:none;
}
.stat-card.working{border-left-color:var(--green)}
body.rtl .stat-card{border-left:none;border-right:4px solid var(--border2)}
body.rtl .stat-card.working{border-right-color:var(--green)}

.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--border2)}
.dot.working{background:var(--green);box-shadow:0 0 10px var(--green),0 0 20px rgba(0,208,132,.3);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 10px var(--green),0 0 20px rgba(0,208,132,.3)}50%{box-shadow:0 0 16px var(--green),0 0 32px rgba(0,208,132,.4)}}

.status-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.status-lbl{font-family:'Consolas','Courier New',monospace;font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}

.timer-big{
  font-family:'Consolas','Courier New',monospace;
  font-size:clamp(42px,10vw,72px);
  font-weight:400;
  color:var(--copper2);
  letter-spacing:4px;margin:12px 0;
  text-shadow:0 0 30px rgba(184,115,51,.3);
  position:relative;
}
.stat-card.working .timer-big{
  color:var(--green);
  text-shadow:0 0 30px rgba(0,208,132,.25);
}

.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.act-btn{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:26px 10px;
  border-radius:4px;
  background:var(--bg);
  font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;
  font-size:13px;letter-spacing:3px;
  cursor:pointer;font-weight:800;
  text-transform:uppercase;
  transition:all .25s;border:2px solid;
}
.act-btn:disabled{opacity:.25;cursor:not-allowed}
.act-btn:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.15)}
.act-btn .ico{font-size:32px;line-height:1}

.table-wrap{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;overflow:hidden;
  margin-bottom:20px;overflow-x:auto;
}
.table-head{
  padding:12px 18px;
  border-bottom:1px solid var(--border2);
  font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;
  font-size:12px;letter-spacing:3px;
  color:var(--copper);text-transform:uppercase;font-weight:700;
}
table{width:100%;border-collapse:collapse;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:13px;min-width:400px}
th{
  padding:10px 14px;text-align:left;
  font-family:'Consolas','Courier New',monospace;
  font-size:9px;letter-spacing:2px;
  color:var(--muted);text-transform:uppercase;
  border-bottom:1px solid var(--border2);
  background:var(--bg);
}
body.rtl th{text-align:right}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:rgba(184,115,51,.03)}

.badge{padding:3px 8px;border-radius:2px;font-size:9px;font-family:'Consolas','Courier New',monospace;font-weight:700;display:inline-block;letter-spacing:1px}
.bg{background:rgba(0,208,132,.1);color:var(--green);border:1px solid rgba(0,208,132,.25)}
.br{background:rgba(255,68,68,.1);color:var(--red);border:1px solid rgba(255,68,68,.25)}
.by{background:rgba(255,140,0,.1);color:var(--orange);border:1px solid rgba(255,140,0,.25)}
.bb{background:rgba(127,168,200,.1);color:var(--steel);border:1px solid rgba(127,168,200,.25)}
.bgr{background:rgba(58,96,128,.15);color:var(--muted);border:1px solid var(--border)}

.worker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:20px}
.wcard{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:4px;padding:18px;
  border-left:3px solid var(--border2);
  transition:border-left-color .3s,transform .2s;
}
.wcard:hover{transform:translateY(-1px)}
.wcard.working{border-left-color:var(--green)}
.wcard.ended{border-left-color:var(--steel)}
body.rtl .wcard{border-left:none;border-right:3px solid var(--border2)}
body.rtl .wcard.working{border-right-color:var(--green)}
.wname{font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;font-weight:800;font-size:18px;letter-spacing:1px;margin-bottom:2px;color:var(--text);text-transform:uppercase}
.wphone{font-family:'Consolas','Courier New',monospace;font-size:10px;color:var(--muted);margin-bottom:10px}
.wbadges{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wsl{font-family:'Consolas','Courier New',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.wsv{font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;font-size:16px;font-weight:800;letter-spacing:1px}

.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sc{background:var(--bg1);border:1px solid var(--border2);border-radius:4px;padding:22px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--copper),transparent)}
.st{
  font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;
  font-size:11px;letter-spacing:3px;
  color:var(--copper);text-transform:uppercase;
  margin-bottom:18px;padding-bottom:10px;
  border-bottom:1px solid var(--border2);
  font-weight:800;
}
.sf{margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--muted);font-family:'Consolas','Courier New',monospace;font-size:12px;line-height:2}

.phone-row{display:flex;align-items:flex-start;gap:10px;padding:14px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;margin-bottom:8px;transition:border-color .2s}
.phone-row:hover{border-color:var(--copper)}
.phone-meta{display:flex;align-items:center;gap:7px;margin:6px 0;flex-wrap:wrap}
.pmbadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.drop-zone{
  border:2px dashed var(--border2);
  border-radius:4px;padding:28px;
  text-align:center;cursor:pointer;
  font-family:'Consolas','Courier New',monospace;
  font-size:11px;color:var(--muted);line-height:2;
  transition:all .2s;
}
.drop-zone:hover{border-color:var(--copper);color:var(--copper);background:rgba(184,115,51,.04)}
.rh{background:rgba(184,115,51,.05);border:1px solid rgba(184,115,51,.2);border-radius:4px;padding:14px}
.gh{background:rgba(0,208,132,.05);border:1px solid rgba(0,208,132,.2);border-radius:4px;padding:14px}
.hint{font-family:'Consolas','Courier New',monospace;font-size:10px;color:var(--muted);margin-top:5px}

.gps-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:4px;font-family:'Consolas','Courier New',monospace;font-size:11px;margin-bottom:16px;flex-wrap:wrap;letter-spacing:1px}
.gps-bar.ok{background:rgba(0,208,132,.07);border:1px solid rgba(0,208,132,.2);color:var(--green)}
.gps-bar.far{background:rgba(255,68,68,.07);border:1px solid rgba(255,68,68,.2);color:var(--red)}
.gps-bar.checking{background:rgba(255,140,0,.07);border:1px solid rgba(255,140,0,.2);color:var(--orange)}
.gps-bar.idle,.gps-bar.noset{background:rgba(58,96,128,.1);border:1px solid var(--border2);color:var(--muted)}
.gps-bar.error{background:rgba(255,68,68,.07);border:1px solid rgba(255,68,68,.2);color:var(--red)}

.alert-row{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;margin-bottom:8px;border-left:3px solid var(--orange)}
.alert-row.resolved{border-left-color:var(--green);opacity:.5}
body.rtl .alert-row{border-left:none;border-right:3px solid var(--orange)}

.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:var(--bg1);
  border:1px solid var(--border2);
  padding:12px 18px;border-radius:4px;
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:13px;
  color:var(--text);max-width:320px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  line-height:1.5;display:none;
  border-left:3px solid var(--copper);
}
body.rtl .toast{right:auto;left:24px}
.toast.show{display:block;animation:slideIn .25s ease}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.warning{border-left-color:var(--orange)}
.toast.info{border-left-color:var(--steel)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal-title{
  font-family:'Arial Narrow','Impact','Franklin Gothic Medium',Arial,sans-serif;
  font-weight:900;font-size:22px;
  color:var(--copper2);letter-spacing:3px;
  margin-bottom:20px;text-transform:uppercase;
}
.modal-btns{display:flex;gap:10px;margin-top:8px}

@keyframes spin{to{transform:rotate(360deg)}}

async function sql(query, params = []) {
  const res = await fetch("/api/sql", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, params })
  });
  const data = await res.json().catch(() => null);
  if (!data || !data.ok) throw new Error(data?.error || `SQL failed (${res.status})`);
  return data.rows || [];
}

async function dbGetUser(u) {

async function dbSetUser(u, d) {
  const keys = Object.keys(d), vals = Object.values(d);
  const cols = keys.join(',');
  const placeholders = keys.map((_,i) => `$${i+2}`).join(',');
  const setCols = keys.map((k,i) => `${k}=$${i+2}`).join(',');
  await sql(
    `INSERT INTO wf_users(username,${cols}) VALUES($1,${placeholders})
     ON CONFLICT(username) DO UPDATE SET ${setCols}`,
    [u, ...vals]
  );
}

// ── Create tables + seed default manager ──
async function initDB() {
  await sql(`
    CREATE TABLE IF NOT EXISTS wf_users(
      username TEXT PRIMARY KEY, password TEXT, role TEXT,
      phone TEXT, hourly_rate NUMERIC, device_id TEXT, label TEXT
    );
    CREATE TABLE IF NOT EXISTS wf_phones(
      norm TEXT PRIMARY KEY, phone TEXT, label TEXT,
      rate NUMERIC, used BOOLEAN DEFAULT false, added_at BIGINT
    );
    CREATE TABLE IF NOT EXISTS wf_shifts(
      id TEXT PRIMARY KEY, worker TEXT, date TEXT,
      start_time BIGINT, end_time BIGINT, work_hours NUMERIC,
      earnings NUMERIC, hourly_rate NUMERIC,
      location_name TEXT, location_id TEXT, status TEXT
    );
    CREATE TABLE IF NOT EXISTS wf_config(
      id INTEGER PRIMARY KEY DEFAULT 1,
      std_hours NUMERIC DEFAULT 8, ot_rate NUMERIC DEFAULT 1.5,
      auto_end_time TEXT DEFAULT NULL
    );
    CREATE TABLE IF NOT EXISTS wf_locations(
      id TEXT PRIMARY KEY, name TEXT, lat NUMERIC, lng NUMERIC,
      map_link TEXT, added_at BIGINT,
      is_open BOOLEAN DEFAULT true, end_time TEXT DEFAULT NULL
    );
    CREATE TABLE IF NOT EXISTS wf_alerts(
      id TEXT PRIMARY KEY, type TEXT, worker TEXT,
      phone TEXT, blocked_device TEXT, ts BIGINT, resolved BOOLEAN DEFAULT false
    );
    CREATE TABLE IF NOT EXISTS wf_assignments(
      worker_username TEXT NOT NULL, loc_id TEXT NOT NULL,
      PRIMARY KEY(worker_username, loc_id)
    );
  `);
  // ── Migrations (fire-and-forget) ──
  Promise.allSettled([
    sql("ALTER TABLE wf_config ADD COLUMN IF NOT EXISTS auto_end_time TEXT DEFAULT NULL"),
    sql("ALTER TABLE wf_shifts ADD COLUMN IF NOT EXISTS location_name TEXT"),
    sql("ALTER TABLE wf_shifts ADD COLUMN IF NOT EXISTS hourly_rate NUMERIC DEFAULT 0"),
    sql("ALTER TABLE wf_shifts ADD COLUMN IF NOT EXISTS location_id TEXT"),
    sql("ALTER TABLE wf_locations ADD COLUMN IF NOT EXISTS is_open BOOLEAN DEFAULT true"),
    sql("ALTER TABLE wf_locations ADD COLUMN IF NOT EXISTS end_time TEXT DEFAULT NULL"),
    sql("ALTER TABLE wf_users ADD COLUMN IF NOT EXISTS label TEXT"),
    // ── NEW: can_restart flag for multi-shift per day ──
    sql("ALTER TABLE wf_users ADD COLUMN IF NOT EXISTS can_restart BOOLEAN DEFAULT false"),
  ]);
  // ── Manager account ──
  await sql(
    `INSERT INTO wf_users(username,password,role) VALUES('mohamed',$1,'manager')
     ON CONFLICT(username) DO NOTHING`,
    [MGR_DEFAULT_PASS]
  );
  // ── Assignment migration (background) ──
  (async()=>{
    try {
      const oldAssigns = await sql('SELECT * FROM wf_assignments');
      for(const a of oldAssigns){
        const key = a.worker_username;
        if(!/^\d+$/.test(key)){
          const urows = await sql('SELECT phone FROM wf_users WHERE username=$1 LIMIT 1',[key]);
          if(urows[0]?.phone){
            const newNorm = urows[0].phone.replace(/\D/g,'').replace(/^0+/,'');
            if(newNorm && newNorm !== key){
              await sql('INSERT INTO wf_assignments(worker_username,loc_id) VALUES($1,$2) ON CONFLICT DO NOTHING',[newNorm,a.loc_id]);
              await sql('DELETE FROM wf_assignments WHERE worker_username=$1 AND loc_id=$2',[key,a.loc_id]);
            }
          }
        }
      }
    } catch(e){}
  })();
}

function extractCoordsFromMapsLink(url) {
  if (!url) return null;
  const u = url.trim();
  if (/goo\.gl|maps\.app\.goo\.gl/.test(u)) return null;
  if (!u.includes('google') && !u.includes('maps.google')) return null;
  const COORD = '(-?\\d{1,3}\\.\\d{4,})';
  const patterns = [
    new RegExp(`[?&]q=${COORD},${COORD}`),
    new RegExp(`[?&]ll=${COORD},${COORD}`),
    new RegExp(`/@${COORD},${COORD}`),
    new RegExp(`/place/${COORD},${COORD}`),
    new RegExp(`[?&]daddr=${COORD},${COORD}`),
    new RegExp(`[?&]destination=${COORD},${COORD}`),
    new RegExp(`[?&]center=${COORD},${COORD}`),
    new RegExp(`[?&]saddr=${COORD},${COORD}`),
    new RegExp(`!3d${COORD}!4d${COORD}`),
    new RegExp(`${COORD}\\+${COORD}`),
  ];
  for (const p of patterns) {
    const m = u.match(p);
    if (m) {
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) return { lat, lng };
    }
  }
  return null;
}
async function extractCoordsAsync(url) {
  if (!url) return null;
  const instant = extractCoordsFromMapsLink(url);
  if (instant) return instant;
  if (/goo\.gl|maps\.app\.goo\.gl/.test(url)) return { _shortUrl: true };
  return null;
}

function haversine(la1,lo1,la2,lo2) {
  const R=6371000,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ════════ SLEEP DETECTION & AUTO-LOGOUT ════════
const IDLE_MS = 60000;
let _sleepTimer=null, _inactiveTimer=null;

function _resetInactiveTimer() {
  clearTimeout(_inactiveTimer);
  if (!S.user || document.hidden) return;
  _inactiveTimer = setTimeout(() => { if (S.user) doLogout(); }, IDLE_MS);
}

['click','touchstart','keydown','scroll','mousemove'].forEach(ev =>
  document.addEventListener(ev, _resetInactiveTimer, {passive:true})
);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(_inactiveTimer);
    _sleepTimer = setTimeout(() => { if (S.user) doLogout(); }, IDLE_MS);
  } else {
    clearTimeout(_sleepTimer); _sleepTimer=null;
    _resetInactiveTimer();
    if (S.user && S.screen==='manager') loadSummary();
  }
});

  </div>`;
}

function buildTimeOptions(selected=''){
  const opts=['<option value="">— No auto-end (manual) —</option>'];
  for(let h=7;h<=23;h++){
    for(const m of [0,30]){
      if(h===23&&m===30)continue;
      const v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      const label=(h>12?h-12:h)+':'+(m===0?'00':'30')+' '+(h>=12?'PM':'AM');
      opts.push(`<option value="${v}"${selected===v?' selected':''}>${label} (${v})</option>`);
    }
  }
  return opts.join('');
}

// ════════ PHONE-DIRECT WORKER LOGIN ════════
window.doPhoneLogin=async()=>{
  if(!rateLimit('phone_login',1500))return;
  const ph=val('wph').trim();
  const errEl=$('wph-err'); errEl.style.display='none';
  const showErr=msg=>{errEl.textContent=msg;errEl.style.display='block';};
  const btn=$('wph-btn');
  if(btn){btn.disabled=true;btn.textContent='Checking…';}
  try {
    if(!ph){showErr(T.badPhone);return;}
    const norm=normPhone(ph);
    if(!norm){showErr(T.badPhoneNum);return;}
    const [match,users]=await Promise.all([dbGetPhone(norm),dbListUsers()]);
    if(!match){showErr(T.phoneNoAuth);return;}
    let workerUser=users.find(x=>x.role==='worker'&&normPhone(x.phone||'')===norm);
    if(!workerUser){
      const uname=(match.label||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')||'w'+norm.slice(-6);
      const finalName=users.find(x=>x.username===uname)?uname+'_'+norm.slice(-4):uname;
      await dbSetUser(finalName,{
        password:norm,role:'worker',phone:ph,
        hourly_rate:match.rate||15,
        device_id:DEVICE_ID,
        can_restart:false
      });
      await dbSetPhone(norm,{used:true});
      workerUser=await dbGetUser(finalName);
    }

    if(!workerUser.device_id){
      await dbSetUser(workerUser.username,{device_id:DEVICE_ID});
      workerUser.device_id=DEVICE_ID;
    } else if(workerUser.device_id!==DEVICE_ID){
      await dbSetAlert('blk_'+Date.now()+'_'+workerUser.username,{type:'device_blocked',worker:workerUser.username,phone:ph,blocked_device:DEVICE_ID,ts:Date.now(),resolved:false});
      showErr(T.deviceBlocked);return;
    }

    const locations=await dbListLocations();
    if(locations.length>0){
      if(!navigator.geolocation){showErr(T.gpsRequired);return;}
      if(btn)btn.textContent='📍 Getting location…';
      try {
        const pos=await geoPos(15000);
        const uLat=pos.coords.latitude, uLng=pos.coords.longitude;
        const locsWithDist=locations.map(l=>({
          ...l,
          dist:Math.round(haversine(uLat,uLng,parseFloat(l.lat),parseFloat(l.lng)))
        }));
        const allAssignments=await dbListAssignments();
        const myAssignments=allAssignments.filter(a=>a.worker_username===norm);
        const anyAssignmentsExist=allAssignments.length>0;
        if(anyAssignmentsExist && myAssignments.length===0){
          showErr('⛔ You are not assigned to any site. Contact your manager.');return;
        }
        const candidateLocs = myAssignments.length>0
          ? locsWithDist.filter(l=>myAssignments.some(a=>a.loc_id===l.id))
          : locsWithDist;
        const nearbyCandidate = candidateLocs
          .filter(l=>l.dist<=GPS_RADIUS)
          .sort((a,b)=>a.dist-b.dist)[0];
        if(!nearbyCandidate){
          const closestAssigned = candidateLocs.sort((a,b)=>a.dist-b.dist)[0];
          if(closestAssigned){
            showErr(`⛔ You are ${closestAssigned.dist}m from your nearest site (${closestAssigned.name}). Must be within ${GPS_RADIUS}m.`);
          } else {
            showErr(`⛔ You are not near any assigned site. Must be within ${GPS_RADIUS}m.`);
          }
          return;
        }
        const isOpen = nearbyCandidate.is_open !== false && nearbyCandidate.is_open !== 'false';
        if(!isOpen){
          showErr(`⛔ ${nearbyCandidate.name} is currently closed. Contact your manager.`);return;
        }
        S.gps='ok';
        S.gpsDist=nearbyCandidate.dist;
        S.nearestLocation=nearbyCandidate;
      } catch(gpsErr){
        const code=gpsErr.code;
        if(code===1)showErr('📍 Location permission denied. Please allow location access.');
        else if(code===3)showErr('📍 Location timed out. Try again.');
        else showErr(T.gpsLoginErr);
        return;
      }

function startTimer(){
  clearInterval(S.timerInt);
  if(!S.shift) return;
  const startMs=Number(S.shift.start_time);
  if(!startMs) return;
  S.timerInt=setInterval(()=>{
    const now=Date.now();
    const wMs=Math.max(0,now-startMs);
    const e=$('tbig');if(e)e.textContent=fmtMs(wMs);
    const wt=$('wt');if(wt)wt.textContent=fmtDur(wMs);
  },1000);
}

// ════════ SHIFT ACTIONS ════════
let _shiftLock=false;

window.wAct=async action=>{
  if(_shiftLock){toast('Please wait…','warning');return;}
  if(!rateLimit('shift_'+action,1200))return;
  if(!S.user){toast('Not logged in','error');return;}

  _shiftLock=true;
  const btn=$(action==='start'?'bst':'ben');
  if(btn){btn.style.opacity='0.5';btn.textContent='…';}

  try{
    const now=Date.now();
    const username=S.user.username;

    const allShifts=await dbListShifts();
    const todayShifts=allShifts.filter(x=>x.worker===username&&x.date===todayStr());
    const activeShift=todayShifts.find(x=>x.status==='working');
    const completedToday=todayShifts.find(x=>x.status==='completed');

    if(action==='start'){
      // Guard: already working
      if(activeShift){toast('⚠ Shift already in progress!','warning');await renderWorkerScreen();return;}

      // ── PATCHED: already completed today — check can_restart flag ──
      if(completedToday){
        // Re-fetch fresh user data to check can_restart flag
        const freshUser = await dbGetUser(username);
        if(!freshUser?.can_restart){
          toast('⚠ Shift completed. Ask your manager to allow a new shift.','warning');
          await renderWorkerScreen();return;
        }
        // Clear the flag immediately — single use only
        await dbSetUser(username,{can_restart:false});
        S.user.can_restart=false;
      }

      // Guard: cannot start before 07:00
      const nowD=new Date(now);
      if(nowD.getHours()<7){
        const minsUntil=(7*60)-(nowD.getHours()*60+nowD.getMinutes());
        toast(`⛔ Shifts start at 07:00. ${minsUntil} minute${minsUntil===1?'':'s'} remaining.`,'error');
        await renderWorkerScreen();return;
      }

      // Guard: cannot start after auto-end time
      if(S.autoEndTime){
        const [eh,em]=S.autoEndTime.split(':').map(Number);
        const nowMins=nowD.getHours()*60+nowD.getMinutes();
        const endMins=eh*60+em;
        if(nowMins>=endMins){
          toast(`⛔ Shifts for today have ended at ${S.autoEndTime}. See you tomorrow!`,'error');
          await renderWorkerScreen();return;
        }
      }

      const locationName = S.nearestLocation?.name || '—';
      const id='s'+now+'_'+username.slice(0,6);
      await dbSetShift(id,{
        worker:username,
        date:todayStr(),
        start_time:now,
        end_time:null,
        work_hours:null,
        earnings:null,
        hourly_rate:parseFloat(S.user.hourly_rate)||0,
        location_name:locationName,
        location_id:S.nearestLocation?.id||null,
        status:'working'
      });

      const verify=await dbListShifts();
      const written=verify.find(x=>x.id===id);
      if(!written){toast('⛔ Shift failed to save. Try again.','error');return;}

      S.shift=written;
      toast(`✅ Shift started at ${locationName}`,'success');
      await renderWorkerScreen();

    }else if(action==='end'){
      if(!activeShift){toast('⚠ No active shift to end.','warning');await renderWorkerScreen();return;}
      if(activeShift.worker!==username){toast('⛔ Shift mismatch error.','error');return;}
      const startMs=Number(activeShift.start_time);
      if(!startMs||startMs<=0||startMs>now){toast('⛔ Invalid shift start time.','error');return;}

      const wMs=Math.max(0,now-startMs);
      if(wMs<60000){
        toast(`⚠ Shift is only ${Math.round(wMs/1000)}s old. End anyway? Tap again to confirm.`,'warning');
        _shiftLock=false;
        let confirmed=false;
        const confirmEnd=async()=>{
          if(confirmed)return;confirmed=true;
          const wMs2=Math.max(0,Date.now()-startMs);
          const workHours=wMs2/3600000;
          const earnings=workHours*(parseFloat(activeShift.hourly_rate)||0);
          await dbSetShift(activeShift.id,{end_time:Date.now(),work_hours:workHours,earnings,status:'completed'});
          S.shift=null;clearInterval(S.timerInt);
          toast(`✅ Done! ${fmtDur(wMs2)} worked.`,'success');
          await renderWorkerScreen();
        };
        window._confirmEnd=confirmEnd;
        setTimeout(()=>{window._confirmEnd=null;},5000);
        const endBtn=$('ben');
        if(endBtn){
          endBtn.textContent='⚠ Tap again to confirm';
          endBtn.style.borderColor='#f39c12';endBtn.style.color='#f39c12';
          endBtn.onclick=()=>{if(window._confirmEnd)window._confirmEnd();window._confirmEnd=null;endBtn.onclick=()=>wAct('end');};
        }
        return;
      }

      const workHours=wMs/3600000;
      const earnings=workHours*(parseFloat(activeShift.hourly_rate)||0);
      await dbSetShift(activeShift.id,{end_time:now,work_hours:workHours,earnings,status:'completed'});
      S.shift=null;clearInterval(S.timerInt);
      toast(`✅ Done! ${fmtDur(wMs)} worked.`,'success');
      await renderWorkerScreen();
    }
  }catch(err){
    toast('Error: '+err.message,'error');
    console.error('wAct error:',err);
    await renderWorkerScreen();
  }finally{
    _shiftLock=false;
  }
};

let _summaryCache=null, _summaryCacheTs=0;
async function loadSummary(force=false){
  const now=Date.now();
  if(!force && _summaryCache && now-_summaryCacheTs < 30000){
    const el=$('scards');if(el)el.innerHTML=_summaryCache;return;
  }
  const [allUsers,shifts,locations,allAlerts]=await Promise.all([dbListUsers(),dbListShifts(),dbListLocations(),dbListAlerts()]);
  const users=allUsers.filter(u=>u.role==='worker');
  const ts=shifts.filter(s=>s.date===todayStr());
  const alerts=allAlerts.filter(a=>!a.resolved).length;
  const sal=shifts.filter(s=>inP(s,'month')).reduce((a,s)=>a+(parseFloat(s.earnings)||0),0).toFixed(2);
  const el=$('scards');if(!el)return;
  _summaryCache=[
    [T.workers,users.length,'#f0c040'],
    [T.working,ts.filter(s=>s.status==='working').length,'#2ecc71'],
    ['📍 Sites',locations.length,'#3498db'],
    [T.salDue,'€'+sal,'#f0c040'],
    [T.alerts,alerts,alerts>0?'#e74c3c':'#555']
  ].map(([l,v,c])=>`<div class="info-card"><div class="il">${l}</div><div class="iv" style="color:${c}">${v}</div></div>`).join('');
  _summaryCacheTs=now;
  el.innerHTML=_summaryCache;
}

function inP(s,per){
  const ts=Number(s.start_time);
  const d=ts?new Date(ts):new Date(s.date);
  const n=new Date();
  if(per==='today')return s.date===todayStr();
  if(per==='week'){const w=new Date(n);w.setDate(n.getDate()-n.getDay());w.setHours(0,0,0,0);return d>=w;}
  if(per==='month')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
  return true;
}

async function buildAssign(){
  const [phones, locs, assignments] = await Promise.all([
    dbListPhones(), dbListLocations(), dbListAssignments()
  ]);
  const assignedMap = {};
  assignments.forEach(a=>{
    if(!assignedMap[a.worker_username]) assignedMap[a.worker_username]=new Set();
    assignedMap[a.worker_username].add(a.loc_id);
  });
  const unassigned = phones.filter(p=>!assignedMap[p.norm]||assignedMap[p.norm].size===0);

  function workerChip(p, locId){
    const removeBtn = locId
      ? `<span class="chip-remove" title="Remove" onclick="removeAssignment('${esc(p.norm)}','${esc(locId)}')">✕</span>`
      : '';
    return `<div class="assign-worker-chip" draggable="true"
      data-worker="${esc(p.norm)}"
      data-from="${esc(locId||'__unassigned__')}">
      <div style="display:flex;flex-direction:column;flex:1;min-width:0">
        <span class="chip-name">${esc(p.label||p.phone)}</span>
        <span class="chip-phone">${esc(p.phone)}</span>
      </div>
      ${removeBtn}
    </div>`;
  }

  const unassignedChips = unassigned.length
    ? unassigned.map(p=>workerChip(p,null)).join('')
    : `<div class="assign-empty-drop">All workers assigned</div>`;

  const locCols = !locs.length
    ? `<div style="color:#444;font-family:monospace;font-size:11px;padding:20px">No locations yet.</div>`
    : locs.map(l=>{
        const isOpen = l.is_open !== false && l.is_open !== 'false';
        const assignedPhones = phones.filter(p=>assignedMap[p.norm]?.has(l.id));
        const chips = assignedPhones.length
          ? assignedPhones.map(p=>workerChip(p,l.id)).join('')
          : `<div class="assign-empty-drop">Drop workers here</div>`;
        return `<div class="assign-col ${isOpen?'':'loc-closed'}" data-locid="${esc(l.id)}">
          <div class="assign-col-head">
            <div>
              <div class="assign-col-title">📍 ${esc(l.name)}</div>
              <div style="font-family:monospace;font-size:10px;color:#555;margin-top:2px">${assignedPhones.length} worker${assignedPhones.length===1?'':'s'}</div>
            </div>
            <button class="loc-toggle ${isOpen?'open':'closed'}" onclick="toggleLocOpen('${esc(l.id)}',${!isOpen})">
              ${isOpen?'🟢 OPEN':'🔴 CLOSED'}
            </button>
          </div>
          <div class="assign-col-body" data-locid="${esc(l.id)}">${chips}</div>
        </div>`;
      }).join('');

  return `<div class="assign-info-bar">
    🗂 <strong>Drag workers</strong> from the pool into location columns to assign them. Workers can be in <strong>multiple locations</strong>.
    Toggle <strong>OPEN/CLOSED</strong> on each site — workers assigned to a <em>closed</em> site cannot sign in.
  </div>
  <div class="assign-board">
    <div class="assign-col unassigned" data-locid="__unassigned__">
      <div class="assign-col-head">
        <div>
          <div class="assign-col-title" style="color:#888">👷 Unassigned</div>
          <div style="font-family:monospace;font-size:10px;color:#444;margin-top:2px">${unassigned.length} worker${unassigned.length===1?'':'s'}</div>
        </div>
      </div>
      <div class="assign-col-body" data-locid="__unassigned__">${unassignedChips}</div>
    </div>
    ${locCols}
  </div>`;
}

function initAssignBoard(){
  let dragWorker=null, dragFrom=null, dragEl=null;
  document.querySelectorAll('.assign-worker-chip').forEach(chip=>{
    chip.addEventListener('dragstart',e=>{
      dragWorker=chip.dataset.worker;
      dragFrom=chip.dataset.from;
      dragEl=chip;
      setTimeout(()=>chip.classList.add('dragging'),0);
    });
    chip.addEventListener('dragend',()=>{
      chip.classList.remove('dragging');
      document.querySelectorAll('.assign-col-body').forEach(z=>z.classList.remove('drag-over'));
    });
  });
  document.querySelectorAll('.assign-col-body').forEach(zone=>{
    zone.addEventListener('dragover',e=>{
      e.preventDefault();
      document.querySelectorAll('.assign-col-body').forEach(z=>z.classList.remove('drag-over'));
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop',async e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const toLocId=zone.dataset.locid;
      if(!dragWorker||toLocId===dragFrom) return;
      if(toLocId==='__unassigned__'){
        if(dragFrom&&dragFrom!=='__unassigned__') await dbDelAssignment(dragWorker,dragFrom);
      } else {
        await dbSetAssignment(dragWorker,toLocId);
      }
      dragWorker=null;dragFrom=null;dragEl=null;
      const panel=$('mpanel');
      if(panel){ panel.innerHTML=await buildAssign(); initAssignBoard(); }
    });
  });
}

window.removeAssignment=async(worker_username, loc_id)=>{
  await dbDelAssignment(worker_username, loc_id);

};

// ── Phone / worker management ──
async function ensureWorkerAccount(ph, norm, lb, rt) {
  const users = await dbListUsers();
  const existing = users.find(x => x.role === 'worker' && normPhone(x.phone || '') === norm);
  if (existing) return existing;
  const uname = (lb || '').toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '') || 'w' + norm.slice(-6);
  const finalName = users.find(x => x.username === uname) ? uname + '_' + norm.slice(-4) : uname;
  await dbSetUser(finalName, {
    password: norm, role: 'worker', phone: ph,
    hourly_rate: rt || 15,
    device_id: null,
    can_restart: false
  });
  return await dbGetUser(finalName);
}

window.addPhone=async()=>{
  const ph=val('np').trim(),lb=val('nl').trim(),rt=parseFloat(val('nr'));
  if(!ph){toast(T.badPhone,'error');return;}

  if(!rt||rt<=0){toast(T.badRate,'error');return;}
  const ex=await dbGetPhone(norm);if(ex){toast(T.dupPhone,'warning');return;}
  await dbSetPhone(norm,{phone:ph,label:lb,rate:rt,used:false,added_at:Date.now()});
  await ensureWorkerAccount(ph, norm, lb, rt);

};
window.delPhone=async norm=>{
  await dbDelAllAssignmentsForWorker(norm);

window.handleDrop=e=>{e.preventDefault();const f=e.dataTransfer?.files[0]||e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>procFile(ev.target.result);r.readAsText(f);if(e.target.value!==undefined)e.target.value='';};
async function procFile(text){
  const defR=parseFloat(val('nr'))||15;
  const lines=text.split(/[\r\n]+/).map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0;
  for(const line of lines){
    if(/^(phone|number|name|label|rate|#)/i.test(line)){skipped++;continue;}
    const parts=line.split(/[\t,;|]+/).map(p=>p.trim()).filter(Boolean);
    let phone='',label='',rate=defR;
    parts.forEach(p=>{const d=p.replace(/[\s\-\+\(\)\.]/g,'');if(/^\d{6,15}$/.test(d)&&!phone)phone=p;else if(/^\d+(\.\d+)?$/.test(p)&&phone)rate=parseFloat(p);else if(p&&!label)label=p;});
    if(!phone){const r=line.replace(/[\s\-\+\(\)\.]/g,'');if(/^\d{6,15}$/.test(r))phone=line.trim();}
    if(!phone){skipped++;continue;}
    const norm=normPhone(phone);const ex=await dbGetPhone(norm);if(ex){skipped++;continue;}
    await dbSetPhone(norm,{phone:phone.trim(),label:label.trim(),rate,used:false,added_at:Date.now()});
    await ensureWorkerAccount(phone.trim(), norm, label.trim(), rate);
    added++;
  }
  toast(T.fileAdded(added,skipped),'success');mTab('addworker');loadSummary();
}

// ── Close Month ──
window.closeMonth=async()=>{
  const now=new Date();
  const monthName=now.toLocaleString('default',{month:'long',year:'numeric'});
  const shifts=await dbListShifts();
  const users=await dbListUsers();
  const workers=users.filter(u=>u.role==='worker');
  const um={};workers.forEach(u=>um[u.username]=u);
  const monthShifts=shifts.filter(s=>{
    if(s.status!=='completed')return false;
    const d=new Date(Number(s.start_time));
    return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  });
  const totalHours=monthShifts.reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);
  const totalEarnings=monthShifts.reduce((a,s)=>a+(parseFloat(s.earnings)||0),0);
  const activeWorkers=new Set(monthShifts.map(s=>s.worker)).size;
  const sumEl=document.getElementById('close-month-summary');
  if(sumEl){
    sumEl.style.display='block';
    sumEl.innerHTML=`<div style="background:#141414;border:1px solid #2a2a2a;border-radius:4px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
      <div><div style="font-family:monospace;font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Month</div><div style="font-family:monospace;font-size:14px;font-weight:700;color:#f0c040">${monthName}</div></div>
      <div><div style="font-family:monospace;font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Shifts</div><div style="font-family:monospace;font-size:14px;font-weight:700;color:#f0f0f0">${monthShifts.length}</div></div>
      <div><div style="font-family:monospace;font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Workers</div><div style="font-family:monospace;font-size:14px;font-weight:700;color:#3498db">${activeWorkers}</div></div>
      <div><div style="font-family:monospace;font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Total Hours</div><div style="font-family:monospace;font-size:14px;font-weight:700;color:#2ecc71">${totalHours.toFixed(1)}h</div></div>
      <div><div style="font-family:monospace;font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Total Salary</div><div style="font-family:monospace;font-size:14px;font-weight:700;color:#f0c040">€${totalEarnings.toFixed(2)}</div></div>
    </div>`;
  }
  if(!monthShifts.length){toast(`No completed shifts found for ${monthName}`,'warning');return;}
  const fmtExcel=ts=>{if(!ts)return'—';const d=new Date(Number(ts));if(isNaN(d.getTime()))return'—';const pad=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
  const monthLabel=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const s1=[['Worker','Phone','Rate (€/hr)','Site / Location','Date','Start Time','End Time','Work Hours','Earnings (€)','Status']];
  monthShifts.sort((a,b)=>Number(b.start_time)-Number(a.start_time)).forEach(s=>{
    const u=um[s.worker];
    s1.push([u?.label||s.worker,u?.phone||'',parseFloat(u?.hourly_rate||s.hourly_rate||0),s.location_name||'—',s.date,fmtExcel(s.start_time),fmtExcel(s.end_time),parseFloat((parseFloat(s.work_hours)||0).toFixed(4)),parseFloat((parseFloat(s.earnings)||0).toFixed(2)),s.status]);
  });
  const locNames=[...new Set(monthShifts.map(s=>s.location_name).filter(Boolean))].sort();
  const s2=[['Worker','Phone','Rate (€/hr)',...locNames.map(l=>`Hrs @ ${l}`),'Total Hours','Total Salary (€)','Shifts','Month']];
  workers.forEach(w=>{
    const ws=monthShifts.filter(s=>s.worker===w.username);
    if(!ws.length)return;
    const th=ws.reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);
    const total=th*(parseFloat(w.hourly_rate)||0);
    const locHrs=locNames.map(ln=>parseFloat(ws.filter(s=>s.location_name===ln).reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0).toFixed(4)));
    s2.push([w.label||w.username,w.phone||'',parseFloat(w.hourly_rate)||0,...locHrs,parseFloat(th.toFixed(4)),parseFloat(total.toFixed(2)),ws.length,monthLabel]);
  });
  const filename=`workforce_${monthLabel}.xlsx`;
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload=()=>{
    const wb=XLSX.utils.book_new();
    const ws1=XLSX.utils.aoa_to_sheet(s1),ws2=XLSX.utils.aoa_to_sheet(s2);
    ws1['!cols']=[14,14,10,16,10,18,18,12,12,10].map(w=>({wch:w}));
    ws2['!cols']=[14,14,10,...locNames.map(()=>14),12,14,8,10].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws1,'Shifts');
    XLSX.utils.book_append_sheet(wb,ws2,'Salary Summary');
    XLSX.writeFile(wb,filename);
    toast(`✅ ${monthName} exported as ${filename}`,'success');
  };
  script.onerror=()=>{
    const csv=s1.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=filename.replace('.xlsx','.csv');a.click();
    toast('Exported as CSV','warning');
  };
  document.head.appendChild(script);
};

// ── Export (Excel) ──
window.doExport=async()=>{
  toast('⏳ Preparing export…','info');
  const shifts=await dbListShifts();
  const users=await dbListUsers();
  const um={};users.filter(u=>u.role==='worker').forEach(u=>um[u.username]=u);
  const workers=users.filter(u=>u.role==='worker');
  const fmtExcel=ts=>{if(!ts)return'—';const d=new Date(Number(ts));if(isNaN(d.getTime()))return'—';const pad=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
  const SHIFT_COLS=[14,14,10,16,10,18,18,12,12,10];
  const SHIFT_HDR=['Worker','Phone','Rate (€/hr)','Site / Location','Date','Start Time','End Time','Work Hours','Earnings (€)','Status'];
  const makeShiftRow=s=>{
    const u=um[s.worker];
    return[u?.label||s.worker,u?.phone||'',parseFloat(u?.hourly_rate||s.hourly_rate||0),s.location_name||'—',s.date,fmtExcel(s.start_time),fmtExcel(s.end_time),parseFloat((parseFloat(s.work_hours)||0).toFixed(4)),parseFloat((parseFloat(s.earnings)||0).toFixed(2)),s.status];
  };
  const byMonth={};
  shifts.forEach(s=>{const key=(s.date||'').slice(0,7)||'Unknown';if(!byMonth[key])byMonth[key]=[];byMonth[key].push(s);});
  const monthKeys=Object.keys(byMonth).sort();
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload=()=>{
    const wb=XLSX.utils.book_new();
    monthKeys.forEach(key=>{
      const mShifts=byMonth[key].sort((a,b)=>Number(b.start_time)-Number(a.start_time));
      const data=[SHIFT_HDR,...mShifts.map(makeShiftRow)];
      const ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=SHIFT_COLS.map(w=>({wch:w}));
      const [yr,mo]=key.split('-');
      const sn=mo&&yr?new Date(Number(yr),Number(mo)-1,1).toLocaleString('default',{month:'short',year:'numeric'}):key;
      XLSX.utils.book_append_sheet(wb,ws,sn.slice(0,31));
    });
    monthKeys.forEach(key=>{
      const mShifts=byMonth[key].filter(s=>s.status==='completed');
      if(!mShifts.length)return;
      const locNames=[...new Set(mShifts.map(s=>s.location_name).filter(Boolean))].sort();
      const hdr=['Worker','Phone','Rate (€/hr)',...locNames.map(l=>`Hrs @ ${l}`),'Total Hours','Total Salary (€)','Shifts'];
      const rows=[hdr];
      workers.forEach(w=>{
        const ws2=mShifts.filter(s=>s.worker===w.username);if(!ws2.length)return;
        const th=ws2.reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0);
        const total=th*(parseFloat(w.hourly_rate)||0);
        const locHrs=locNames.map(ln=>parseFloat(ws2.filter(s=>s.location_name===ln).reduce((a,s)=>a+(parseFloat(s.work_hours)||0),0).toFixed(4)));
        rows.push([w.label||w.username,w.phone||'',parseFloat(w.hourly_rate)||0,...locHrs,parseFloat(th.toFixed(4)),parseFloat(total.toFixed(2)),ws2.length]);
      });
      const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[14,14,10,...locNames.map(()=>14),12,14,8].map(w=>({wch:w}));
      const [yr,mo]=key.split('-');
      const label=mo&&yr?new Date(Number(yr),Number(mo)-1,1).toLocaleString('default',{month:'short',year:'numeric'}):key;
      XLSX.utils.book_append_sheet(wb,ws,`Salary ${label}`.slice(0,31));
    });
    const allData=[SHIFT_HDR,...shifts.sort((a,b)=>Number(b.start_time)-Number(a.start_time)).map(makeShiftRow)];
    const wsAll=XLSX.utils.aoa_to_sheet(allData);wsAll['!cols']=SHIFT_COLS.map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,wsAll,'All Shifts');
    XLSX.writeFile(wb,`workforce_${todayStr()}.xlsx`);
    toast(`✅ Exported ${monthKeys.length} month${monthKeys.length===1?'':'s'} + All Shifts`,'success');
  };
  script.onerror=()=>{
    const allData=[SHIFT_HDR,...shifts.sort((a,b)=>Number(b.start_time)-Number(a.start_time)).map(makeShiftRow)];
    const csv=allData.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`workforce_${todayStr()}.csv`;a.click();
    toast('Exported as CSV (XLSX unavailable)','warning');
  };
  document.head.appendChild(script);
};
